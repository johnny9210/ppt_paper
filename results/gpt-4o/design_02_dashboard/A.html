<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1d1f27;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .dashboard {
        width: 1280px;
        height: 720px;
        background-color: #0a0e17;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        padding: 20px;
        box-sizing: border-box;
    }
    .title {
        text-align: center;
        font-size: 28px;
        margin-bottom: 40px;
    }
    .metrics {
        display: flex;
        justify-content: space-around;
        margin-bottom: 40px;
    }
    .metric {
        background-color: rgba(30, 40, 60, 0.8);
        border-radius: 10px;
        text-align: center;
        padding: 20px;
        width: 25%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .emoji {
        font-size: 40px;
        margin-bottom: 10px;
    }
    .metric-title {
        font-size: 20px;
        margin-bottom: 10px;
    }
    .metric-value {
        font-size: 28px;
        margin-bottom: 10px;
    }
    .metric-change {
        font-size: 14px;
        color: #7bd981;
    }
    .chart {
        background-color: rgba(30, 40, 60, 0.8);
        border-radius: 10px;
        padding: 20px;
        height: 300px;
    }
    .chart-title {
        font-size: 20px;
        margin-bottom: 20px;
        text-align: center;
    }
</style>
<div class="dashboard">
    <div class="title">Q4 2025 비즈니스 성과 대시보드</div>
    <div class="metrics">
        <div class="metric">
            <div class="emoji">💰</div>
            <div class="metric-title">매출</div>
            <div class="metric-value">₩128억</div>
            <div class="metric-change">+23% YoY</div>
        </div>
        <div class="metric">
            <div class="emoji">👥</div>
            <div class="metric-title">활성 사용자</div>
            <div class="metric-value">2.4M</div>
            <div class="metric-change">+15% MoM</div>
        </div>
        <div class="metric">
            <div class="emoji">⭐</div>
            <div class="metric-title">고객 만족도</div>
            <div class="metric-value">4.7/5.0</div>
            <div class="metric-change">+0.3</div>
        </div>
    </div>
    <div class="chart">
        <div class="chart-title">월별 매출 추이</div>
        <!-- 차트 디자인 및 레이아웃 요소들을 추가하세요 -->
    </div>
</div></div>
</body></html>

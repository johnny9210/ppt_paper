<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="width: 1280px; height: 720px; background: linear-gradient(135deg, #0F172A, #1E293B); position: relative; background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
    <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 32px; color: #FFFFFF; text-align: center;">
        Q4 2025 비즈니스 성과 대시보드
    </div>
    <div style="display: flex; justify-content: space-around; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 90%; z-index: 2;">
        <div style="backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 280px; padding: 20px; text-align: center; position: relative;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1EA7FD; margin: 0 auto 10px;">
                <i class="fas fa-dollar-sign" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="color: #ffffff; font-size: 24px;">매출</div>
            <div style="color: #ffffff; font-size: 36px;">₩128억</div>
            <div style="color: #ffffff; font-size: 18px;">+23% YoY</div>
        </div>
        <div style="backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 280px; padding: 20px; text-align: center; position: relative;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1EA7FD; margin: 0 auto 10px;">
                <i class="fas fa-users" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="color: #ffffff; font-size: 24px;">활성 사용자</div>
            <div style="color: #ffffff; font-size: 36px;">2.4M</div>
            <div style="color: #ffffff; font-size: 18px;">+15% MoM</div>
        </div>
        <div style="backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 280px; padding: 20px; text-align: center; position: relative;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1EA7FD; margin: 0 auto 10px;">
                <i class="fas fa-star" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="color: #ffffff; font-size: 24px;">고객 만족도</div>
            <div style="color: #ffffff; font-size: 36px;">4.7/5.0</div>
            <div style="color: #ffffff; font-size: 18px;">+0.3</div>
        </div>
    </div>
    <div style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; text-align: center; z-index: 1;">
        <div style="color: #ffffff; font-size: 24px; margin-bottom: 10px;">월별 매출 추이</div>
        <div style="height: 120px; padding: 10px; position: relative; background: rgba(255,255,255,0.1); border-radius: 10px;">
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #1EA7FD;"></div>
        </div>
    </div>
</div></div>
</body></html>

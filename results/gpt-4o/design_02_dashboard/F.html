<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_02_dashboard" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_02_dashboard-bg">
  <div class="glow-effect-one"></div>
  <div class="glow-effect-two"></div>
  <div class="decorative-circle"></div>
</div>

<style>
  .design_02_dashboard-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0F172A 0%, #3B82F6 100%);
    overflow: hidden;
  }

  .glow-effect-one,
  .glow-effect-two {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, rgba(15, 23, 42, 0) 50%);
    opacity: 0.2;
  }

  .glow-effect-one {
    width: 60%;
    height: 60%;
    top: 20%;
    left: 30%;
  }

  .glow-effect-two {
    width: 80%;
    height: 80%;
    bottom: -10%;
    right: -10%;
  }

  .decorative-circle {
    position: absolute;
    width: 20%;
    height: 20%;
    top: 40%;
    left: 10%;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_02_dashboard-cards">
  <style>
    .design_02_dashboard-cards {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .card {
      position: absolute;
      width: 28%;
      height: 75%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.3);
      left: 5%;
      top: 15%;
    }
  </style>

  <div class="card"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_02_dashboard-content">
  <div class="dashboard-title">
    Q4 2025 비즈니스 성과 대시보드
  </div>
  <div class="card_1-content">
    <div class="metric-title">
      <span class="emoji">💰</span> 매출
    </div>
    <div class="metric-value">
      ₩128억
    </div>
    <div class="metric-change">
      +23% YoY
    </div>
  </div>
</div>

<style>
  .design_02_dashboard-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .design_02_dashboard-content > div {
    position: absolute;
  }

  .dashboard-title {
    left: 5%;
    top: 3%;
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0,0,0,0.28);
    color: #f8fbff;
    z-index: 20;
  }

  .card_1-content {
    left: 8%;
    top: 18%;
    width: 22%;
    height: 69%;
    overflow: hidden;
    z-index: 21;
  }

  .metric-title {
    top: 30%;
    font-size: 1rem;
    font-weight: 700;
    color: #e2e8f0;
  }

  .metric-value {
    top: 45%;
    font-size: 1.2rem;
    font-weight: 700;
    color: #3B82F6;
  }

  .metric-change {
    top: 60%;
    font-size: 0.8rem;
    color: rgba(148,163,184,0.9);
    line-height: 1.55;
  }

  .emoji {
    margin-right: 0.5rem;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_02_dashboard-icons {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
  }
  .design_02_dashboard-icons .icon-badge {
    position: absolute;
    top: 2%;
    left: 35%;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
  }
  .design_02_dashboard-icons .icon-badge i {
    font-size: 1.2rem;
    color: #60A5FA;
  }
  .design_02_dashboard-icons .accent-line {
    position: absolute;
    top: 15%;
    left: 35%;
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0));
  }
  .design_02_dashboard-icons .divider {
    position: absolute;
    top: 25%;
    left: 10%;
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
  }
  .design_02_dashboard-icons .glow-node {
    position: absolute;
    top: 35%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
  }
  .design_02_dashboard-icons .decorative-bar {
    position: absolute;
    top: 45%;
    left: 10%;
    width: 80%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
  }
</style>

<div class="design_02_dashboard-icons">
  <div class="icon-badge">
    <i class="fas fa-shield-halved"></i>
  </div>
  <div class="accent-line"></div>
  <div class="divider"></div>
  <div class="glow-node"></div>
  <div class="decorative-bar"></div>
</div></div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #00008b, #004d00);
    height: 720px;
    overflow: hidden;
  }
  .dashboard {
    width: 1000px;
    text-align: center;
    color: white;
  }
  .title {
    font-size: 36px;
    margin-bottom: 20px;
  }
  .cards {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    padding: 20px;
    width: 30%;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    z-index: 2;
  }
  .card .emoji {
    font-size: 48px;
  }
  .card h3 {
    font-size: 24px;
    margin-top: 10px;
  }
  .card p {
    font-size: 18px;
    margin: 5px 0;
  }
  .chart {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    z-index: 1;
  }
  .chart h3 {
    margin-bottom: 10px;
  }
</style>

<div class="dashboard">
  <div class="title">Q4 2025 비즈니스 성과 대시보드</div>
  <div class="cards">
    <div class="card">
      <div class="emoji">💰</div>
      <h3>매출</h3>
      <p>₩128억</p>
      <p>+23% YoY</p>
    </div>
    <div class="card">
      <div class="emoji">👥</div>
      <h3>활성 사용자</h3>
      <p>2.4M</p>
      <p>+15% MoM</p>
    </div>
    <div class="card">
      <div class="emoji">⭐</div>
      <h3>고객 만족도</h3>
      <p>4.7/5.0</p>
      <p>+0.3</p>
    </div>
  </div>
  <div class="chart">
    <h3>월별 매출 추이</h3>
    <!-- Placeholder for chart representation -->
    <div style="height: 200px;"></div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #0d0c1a, #1e1b2e);
    overflow: hidden;
  }
  .container {
    width: 1280px;
    height: 720px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
    padding: 40px;
    box-sizing: border-box;
  }
  .card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    position: relative;
    z-index: 1;
  }
  .icon {
    font-size: 40px;
    margin-bottom: 10px;
    color: #ff79c6;
  }
  .feature-title {
    font-size: 18px;
    font-weight: bold;
    color: white;
    margin-bottom: 10px;
  }
  .description {
    font-size: 14px;
    color: #bfbfbf;
    text-align: center;
    margin-bottom: 10px;
  }
  .tag {
    background: linear-gradient(145deg, #ff79c6, #bd83f1);
    padding: 5px 10px;
    border-radius: 5px;
    color: white;
    font-size: 12px;
    position: absolute;
    right: 15px;
    bottom: 15px;
  }
</style>

<div class="container">
  <div class="card">
    <div class="icon">💬</div>
    <div class="feature-title">AI 채팅</div>
    <div class="description">멀티턴 대화형 AI 어시스턴트</div>
    <div class="tag">Core</div>
  </div>
  <div class="card">
    <div class="icon">🔄</div>
    <div class="feature-title">워크플로우</div>
    <div class="description">노코드 업무 자동화 빌더</div>
    <div class="tag">Automation</div>
  </div>
  <div class="card">
    <div class="icon">📄</div>
    <div class="feature-title">문서 처리</div>
    <div class="description">PDF/엑셀 자동 분석 및 요약</div>
    <div class="tag">RAG</div>
  </div>
  <div class="card">
    <div class="icon">📊</div>
    <div class="feature-title">데이터 분석</div>
    <div class="description">자연어 SQL 변환 및 시각화</div>
    <div class="tag">Analytics</div>
  </div>
  <div class="card">
    <div class="icon">🎨</div>
    <div class="feature-title">PPT 생성</div>
    <div class="description">AI 기반 프레젠테이션 자동 생성</div>
    <div class="tag">Creative</div>
  </div>
  <div class="card">
    <div class="icon">🔗</div>
    <div class="feature-title">API 연동</div>
    <div class="description">외부 시스템 MCP 연결</div>
    <div class="tag">Integration</div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_07_feature_grid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_07_feature_grid-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(135deg, rgba(15, 23, 42, 1) 0%, rgba(15, 23, 42, 0.9) 100%),
      radial-gradient(circle at 20% 30%, rgba(96, 165, 250, 0.15) 0%, rgba(15, 23, 42, 0) 50%),
      radial-gradient(circle at 80% 70%, rgba(96, 165, 250, 0.15) 0%, rgba(15, 23, 42, 0) 50%);
    overflow: hidden;
  }

  .glow-left, .glow-right {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
  }

  .glow-left {
    width: 300px;
    height: 300px;
    left: -100px;
    top: -50px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, rgba(15, 23, 42, 0) 70%);
  }

  .glow-right {
    width: 300px;
    height: 300px;
    right: -100px;
    bottom: -50px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, rgba(15, 23, 42, 0) 70%);
  }

  .decorative-circle {
    position: absolute;
    width: 150px;
    height: 150px;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 50%;
    opacity: 0.2;
  }

  .decorative-circle-1 {
    left: 10%;
    top: 20%;
  }

  .decorative-circle-2 {
    right: 10%;
    bottom: 20%;
  }
</style>

<div class="design_07_feature_grid-bg">
  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="decorative-circle decorative-circle-1"></div>
  <div class="decorative-circle decorative-circle-2"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_07_feature_grid-cards {
    width: 28%;
    height: 75%;
    position: absolute;
    inset: 15% 67% 10% 5%;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }
</style>

<div class="design_07_feature_grid-cards"></div></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
  .design_07_feature_grid-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .design_07_feature_grid-title {
    position: absolute;
    left: 5%;
    top: 10%;
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0,0,0,0.28);
    color: #f8fbff;
  }
  .card_1 {
    position: absolute;
    left: 5%;
    top: 15%;
    width: 28%;
    height: 75%;
    padding: 3%;
    overflow: hidden;
  }
  .card_1-title {
    position: absolute;
    top: 30%;
    font-size: 0.95rem;
    font-weight: 700;
    color: #e2e8f0;
  }
  .card_1-description {
    position: absolute;
    top: 50%;
    font-size: 0.8rem;
    color: rgba(148,163,184,0.9);
    line-height: 1.55;
    overflow: hidden;
  }
  .card_1-tag {
    position: absolute;
    bottom: 5%;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 12px;
    background: rgba(59,130,246,0.15);
    color: #60A5FA;
    letter-spacing: 0.08em;
  }
</style>

<div class="design_07_feature_grid-content">
  <div class="design_07_feature_grid-title">플랫폼 핵심 기능</div>
  <div class="card_1">
    <div class="card_1-title">💬 AI 채팅</div>
    <div class="card_1-description">멀티턴 대화형 AI 어시스턴트</div>
    <div class="card_1-tag">Core</div>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_07_feature_grid-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }
  .design_07_feature_grid-icons .icon-badge {
    position: absolute;
    left: 19.09%; /* Calculated based on card content_area */
    top: 10%;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
  }
  .design_07_feature_grid-icons .icon-badge i {
    font-size: 1.2rem;
    color: #60A5FA;
  }
  .design_07_feature_grid-icons .accent-line {
    position: absolute;
    left: 19.09%; /* Aligns with icon-badge */
    top: 16%;
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0));
  }
  .design_07_feature_grid-icons .divider {
    position: absolute;
    left: 10%;
    top: 50%;
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
  }
  .design_07_feature_grid-icons .glow-node {
    position: absolute;
    left: 50%;
    top: 75%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
  }
  .design_07_feature_grid-icons .decorative-bar {
    position: absolute;
    left: 10%;
    top: 90%;
    width: 80%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
  }
</style>

<div class="design_07_feature_grid-icons">
  <div class="icon-badge">
    <i class="fas fa-shield-halved"></i>
  </div>
  <div class="accent-line"></div>
  <div class="divider"></div>
  <div class="glow-node"></div>
  <div class="decorative-bar"></div>
</div></div>
</div></div>
</body></html>

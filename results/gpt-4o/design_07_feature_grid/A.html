<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    background-color: #0B0E39;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .header {
    color: #ffffff;
    font-size: 32px;
    margin-bottom: 20px;
  }

  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .feature-card {
    background: linear-gradient(to right, #1E1E1E, #292C44);
    border-radius: 10px;
    box-shadow: 0 0 10px #35395A;
    padding: 20px;
    text-align: center;
    color: #ffffff;
    width: 320px;
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .emoji {
    font-size: 24px;
  }

  .feature-title {
    font-size: 18px;
    font-weight: bold;
  }

  .feature-description {
    font-size: 14px;
    color: #AAAAAA;
  }
  
  .feature-tag {
    background-color: #FF69B4;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    color: #fff;
  }
</style>

<div class="container">
  <div class="header">플랫폼 핵심 기능</div>
  <div class="features">
    <div class="feature-card">
      <div class="emoji">💬</div>
      <div class="feature-title">AI 채팅</div>
      <div class="feature-description">멀티턴 대화형 AI 어시스턴트</div>
      <div class="feature-tag">Core</div>
    </div>
    <div class="feature-card">
      <div class="emoji">🔄</div>
      <div class="feature-title">워크플로우</div>
      <div class="feature-description">노코드 업무 자동화 빌더</div>
      <div class="feature-tag">Automation</div>
    </div>
    <div class="feature-card">
      <div class="emoji">📄</div>
      <div class="feature-title">문서 처리</div>
      <div class="feature-description">PDF/엑셀 자동 분석 및 요약</div>
      <div class="feature-tag">RAG</div>
    </div>
    <div class="feature-card">
      <div class="emoji">📊</div>
      <div class="feature-title">데이터 분석</div>
      <div class="feature-description">자연어 SQL 변환 및 시각화</div>
      <div class="feature-tag">Analytics</div>
    </div>
    <div class="feature-card">
      <div class="emoji">🎨</div>
      <div class="feature-title">PPT 생성</div>
      <div class="feature-description">AI 기반 프레젠테이션 자동 생성</div>
      <div class="feature-tag">Creative</div>
    </div>
    <div class="feature-card">
      <div class="emoji">🔗</div>
      <div class="feature-title">API 연동</div>
      <div class="feature-description">외부 시스템 MCP 연결</div>
      <div class="feature-tag">Integration</div>
    </div>
  </div>
</div></div>
</body></html>

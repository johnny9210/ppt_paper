<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_07_feature_grid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_07_feature_grid-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle, #0d0d2b, #131336);
  }

  .design_07_feature_grid-bg .circle-shape {
    position: absolute;
    background-color: #682ed0;
    border-radius: 50%;
    opacity: 0.5;
  }

  .design_07_feature_grid-bg .circle-shape:nth-child(1) {
    left: 5%;
    top: 5%;
    width: 10%;
    height: 10%;
  }
  
  .design_07_feature_grid-bg .circle-shape:nth-child(2) {
    left: 90%;
    top: 90%;
    width: 10%;
    height: 10%;
    transform: translate(-100%, -100%);
  }
</style>

<div class="design_07_feature_grid-bg">
  <div class="circle-shape"></div>
  <div class="circle-shape"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_07_feature_grid-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 10;
  }

  .design_07_feature_grid-cards .card {
    position: absolute;
    border-radius: 10px;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(20, 20, 45, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.25);
  }

  .design_07_feature_grid-cards .card1 {
    left: 8%;
    top: 30%;
    width: 25%;
    height: 20%;
  }

  .design_07_feature_grid-cards .card2 {
    left: 38%;
    top: 30%;
    width: 25%;
    height: 20%;
  }

  .design_07_feature_grid-cards .card3 {
    left: 68%;
    top: 30%;
    width: 25%;
    height: 20%;
  }

  .design_07_feature_grid-cards .card4 {
    left: 8%;
    top: 60%;
    width: 25%;
    height: 20%;
  }

  .design_07_feature_grid-cards .card5 {
    left: 38%;
    top: 60%;
    width: 25%;
    height: 20%;
  }

  .design_07_feature_grid-cards .card6 {
    left: 68%;
    top: 60%;
    width: 25%;
    height: 20%;
  }
</style>

<div class="design_07_feature_grid-cards">
  <div class="card card1"></div>
  <div class="card card2"></div>
  <div class="card card3"></div>
  <div class="card card4"></div>
  <div class="card card5"></div>
  <div class="card card6"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
  .design_07_feature_grid-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    color: #F1F5F9;
    font-family: Arial, sans-serif;
  }
  .design_07_feature_grid-content .title {
    left: 10%;
    top: 2%;
    width: 80%;
    height: 5%;
    font-size: 1.5rem;
    font-weight: 700;
    position: absolute;
    z-index: 22;
  }
  .design_07_feature_grid-content .feature {
    font-size: 1rem;
    line-height: 1.6;
    position: absolute;
    z-index: 22;
  }
  .design_07_feature_grid-content .feature .emoji {
    display: inline-block;
    margin-right: 8px;
  }
  .design_07_feature_grid-content .feature .tag {
    background-color: #3B82F6;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.75rem;
    margin-top: 4px;
    display: inline-block;
  }
  
  /* Specific positions for each feature */
  .feature-1 { left: 10%; top: 40%; width: 20%; }
  .feature-2 { left: 40%; top: 40%; width: 20%; }
  .feature-3 { left: 70%; top: 40%; width: 20%; }
  .feature-4 { left: 10%; top: 70%; width: 20%; }
  .feature-5 { left: 40%; top: 70%; width: 20%; }
  .feature-6 { left: 70%; top: 70%; width: 20%; }
</style>

<div class="design_07_feature_grid-content">
  <div class="title">플랫폼 핵심 기능</div>
  
  <div class="feature feature-1">
    <span class="emoji">💬</span>
    <strong>AI 채팅</strong><br>
    멀티턴 대화형 AI 어시스턴트<br>
    <span class="tag">Core</span>
  </div>
  
  <div class="feature feature-2">
    <span class="emoji">🔄</span>
    <strong>워크플로우</strong><br>
    노코드 업무 자동화 빌더<br>
    <span class="tag">Automation</span>
  </div>
  
  <div class="feature feature-3">
    <span class="emoji">📄</span>
    <strong>문서 처리</strong><br>
    PDF/엑셀 자동 분석 및 요약<br>
    <span class="tag">RAG</span>
  </div>
  
  <div class="feature feature-4">
    <span class="emoji">📊</span>
    <strong>데이터 분석</strong><br>
    자연어 SQL 변환 및 시각화<br>
    <span class="tag">Analytics</span>
  </div>
  
  <div class="feature feature-5">
    <span class="emoji">🎨</span>
    <strong>PPT 생성</strong><br>
    AI 기반 프레젠테이션 자동 생성<br>
    <span class="tag">Creative</span>
  </div>
  
  <div class="feature feature-6">
    <span class="emoji">🔗</span>
    <strong>API 연동</strong><br>
    외부 시스템 MCP 연결<br>
    <span class="tag">Integration</span>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_07_feature_grid-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_07_feature_grid-icons .icon {
    position: absolute;
    width: 40px;

    border-radius: 50%;

    display: flex;

    color: #ffffff;
  }

  .design_07_feature_grid-icons .icon:nth-child(1) {
    left: 10%;
    top: 35%;
  }

  .design_07_feature_grid-icons .icon:nth-child(2) {
    left: 40%;
    top: 35%;
  }

  .design_07_feature_grid-icons .icon:nth-child(3) {
    left: 70%;
    top: 35%;
  }

  .design_07_feature_grid-icons .icon:nth-child(4) {
    left: 10%;
    top: 65%;
  }

  .design_07_feature_grid-icons .icon:nth-child(5) {

  <div class="icon"><i class="fas fa-microphone"></i></div>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0F172A, #1E293B);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(192,132,252,0.15), transparent 70%);
    filter: blur(60px);
    top: -150px;
    right: -150px;
  }

  .feature-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .feature-card {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    box-shadow: 0 0 20px rgba(192, 132, 252, 0.3), 0 0 60px rgba(192, 132, 252, 0.1);
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #C084FC;
    position: absolute;
    top: 10px;
    left: 10px;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #A78BFA;
  }

  .feature-title {
    color: #fff;
    font-weight: bold;
    margin-top: 70px;
    font-size: 18px;
  }

  .feature-description {
    color: #ddd;
    font-size: 14px;
    margin-top: 10px;
  }
</style>

<div class="glow"></div>

<div class="feature-container">
  <div class="feature-card">
    <div class="icon-badge">💬</div>
    <div class="feature-title">AI 채팅</div>
    <div class="feature-description">멀티턴 대화형 AI 어시스턴트</div>
    <div class="bottom-bar"></div>
  </div>
  <div class="feature-card">
    <div class="icon-badge">🔄</div>
    <div class="feature-title">워크플로우</div>
    <div class="feature-description">노코드 업무 자동화 빌더</div>
    <div class="bottom-bar"></div>
  </div>
  <div class="feature-card">
    <div class="icon-badge">📄</div>
    <div class="feature-title">문서 처리</div>
    <div class="feature-description">PDF/엑셀 자동 분석 및 요약</div>
    <div class="bottom-bar"></div>
  </div>
  <div class="feature-card">
    <div class="icon-badge">📊</div>
    <div class="feature-title">데이터 분석</div>
    <div class="feature-description">자연어 SQL 변환 및 시각화</div>
    <div class="bottom-bar"></div>
  </div>
  <div class="feature-card">
    <div class="icon-badge">🎨</div>
    <div class="feature-title">PPT 생성</div>
    <div class="feature-description">AI 기반 프레젠테이션 자동 생성</div>
    <div class="bottom-bar"></div>
  </div>
  <div class="feature-card">
    <div class="icon-badge">🔗</div>
    <div class="feature-title">API 연동</div>
    <div class="feature-description">외부 시스템 MCP 연결</div>
    <div class="bottom-bar"></div>
  </div>
</div></div>
</body></html>

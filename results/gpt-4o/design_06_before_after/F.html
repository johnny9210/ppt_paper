<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_06_before_after" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_06_before_after-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(15,23,42,1) 60%), 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 20%, rgba(15,23,42,0) 60%);
    overflow: hidden;
  }

  .design_06_before_after-bg::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(15,23,42,0) 60%);
    opacity: 0.2;
    transform: translate(-50%, -50%);
  }

  .decoration-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(59,130,246,0.08);
  }
  
  .circle-1 {
    width: 200px;
    height: 200px;
    top: 40%;
    left: 30%;
  }

  .circle-2 {
    width: 150px;
    height: 150px;
    bottom: 35%;
    right: 25%;
  }

  .circle-3 {
    width: 100px;
    height: 100px;
    top: 20%;
    right: 40%;
  }

  .border-circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .border-1 {
    width: 120px;
    height: 120px;
    top: 65%;
    left: 20%;
  }

  .border-2 {
    width: 80px;
    height: 80px;
    bottom: 20%;
    right: 35%;
  }

</style>

<div class="design_06_before_after-bg">
  <div class="decoration-circle circle-1"></div>
  <div class="decoration-circle circle-2"></div>
  <div class="decoration-circle circle-3"></div>
  <div class="border-circle border-1"></div>
  <div class="border-circle border-2"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_06_before_after-cards">
    <div class="card card-left"></div>
</div>

<style>
    .design_06_before_after-cards {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
    }

    .card {
        position: absolute;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-image: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(96, 165, 250, 0.2)) 1;
        border-radius: 16px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    .card-left {
        width: 28%;
        height: 75%;
        top: 15%;
        left: 5%;
    }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_06_before_after-content">
  <div class="title">AI 도입 전후 업무 효율성 비교</div>

  <div class="card" style="z-index: 20; left: 5%; top: 15%; width: 28%; height: 75%; padding: 3%;">
    <div class="before-label" style="position: absolute; left: 8%; top: 0%;">
      <span class="tag">도입 전</span>
    </div>
    <div class="item" style="position: absolute; left: 8%; top: 30%; width: 22%; height: 69%;">
      <div class="emoji-title" style="top: 0%;">📝 수작업 보고서 작성</div>
      <div class="description" style="top: 30%;">주 8시간 소요</div>
    </div>
    <div class="item" style="position: absolute; left: 8%; top: 50%; width: 22%; height: 69%;">
      <div class="emoji-title" style="top: 0%;">🔍 수동 데이터 검색</div>
      <div class="description" style="top: 30%;">건당 30분</div>
    </div>
    <div class="item" style="position: absolute; left: 8%; top: 70%; width: 22%; height: 69%;">
      <div class="emoji-title" style="top: 0%;">📞 전화/이메일 응대</div>
      <div class="description" style="top: 30%;">평균 응답 4시간</div>
    </div>
  </div>
</div>

<style>
  .design_06_before_after-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  
  .title {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    color: #f8fbff;
    position: absolute;
    left: 5%;
    top: 5%;
  }
  
  .tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 12px;
    background: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    letter-spacing: 0.08em;
  }
  
  .emoji-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #e2e8f0;
    overflow: hidden;
  }
  
  .description {
    font-size: 0.8rem;
    color: rgba(148, 163, 184, 0.9);
    line-height: 1.55;
    overflow: hidden;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><div class="design_06_before_after-icons">
  <div class="icon-badge" style="left: 8%; top: 18%;">
    <div class="icon-wrapper">
      <i class="fas fa-shield-halved"></i>
    </div>
  </div>
  <div class="accent-line" style="left: 20%; top: 30%;"></div>
  <div class="divider" style="left: 15%; top: 50%;"></div>
  <div class="glow-node" style="left: 10%; top: 70%;"></div>
  <div class="decorative-bar" style="left: 15%; top: 80%; width: 70%;"></div>
</div>

<style>
  .design_06_before_after-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_06_before_after-icons > div {
    position: absolute;
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
  }

  .icon-wrapper i {
    font-size: 1.2rem;
    color: #60A5FA;
  }

  .accent-line {
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0));
  }

  .divider {
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
  }

  .glow-node {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
  }

  .decorative-bar {
    height: 4px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
    border-radius: 2px;
  }
</style></div>
</div></div>
</body></html>

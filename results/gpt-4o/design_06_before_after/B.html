<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  
  .container {
    position: relative;
    width: 1280px;
    height: 720px;
    background: linear-gradient(to right, #ff6d6d, #6dffff);
    display: flex;
    justify-content: space-around;
    align-items: center;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 300px;
    height: 600px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    z-index: 2;
  }

  .card h2 {
    text-align: center;
    color: #ffffff;
    margin: 20px 0;
  }

  .item {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  }

  .item:last-child {
    border-bottom: none;
  }

  .item h3 {
    color: #ffffff;
    margin: 5px 0;
  }

  .item p {
    color: #cccccc;
    margin: 5px 0;
  }

  .arrow {
    position: absolute;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
    z-index: 1;
    animation: moveArrow 2s infinite alternate;
  }

  @keyframes moveArrow {
    from {
      transform: translateX(-40px);
    }
    to {
      transform: translateX(40px);
    }
  }

  .arrow:before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    background: linear-gradient(to right, #ff6d6d, #6dffff);
    transform: translate(-50%, -50%) rotate(45deg);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
</style>

<div class="container">
  <div class="card">
    <h2>도입 전</h2>
    <div class="item">
      <span>📝</span>
      <h3>수작업 보고서 작성</h3>
      <p>주 8시간 소요</p>
    </div>
    <div class="item">
      <span>🔍</span>
      <h3>수동 데이터 검색</h3>
      <p>건당 30분</p>
    </div>
    <div class="item">
      <span>📞</span>
      <h3>전화/이메일 응대</h3>
      <p>평균 응답 4시간</p>
    </div>
  </div>
  
  <div class="arrow"></div>
  
  <div class="card">
    <h2>도입 후</h2>
    <div class="item">
      <span>🤖</span>
      <h3>자동 보고서 생성</h3>
      <p>주 30분으로 단축</p>
    </div>
    <div class="item">
      <span>⚡</span>
      <h3>RAG 기반 즉시 검색</h3>
      <p>건당 5초</p>
    </div>
    <div class="item">
      <span>💬</span>
      <h3>AI 챗봇 자동 응대</h3>
      <p>평균 응답 10초</p>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #1C1C3C, #2C2C5C);
            color: #FFD700;
        }
        .container {
            width: 80%;
            height: 80%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .main {
            flex: 1;
            padding: 20px;
            text-align: center;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background-color: rgba(28, 28, 60, 0.8);
            box-shadow: 0 0 25px #FFD700;
        }
        .main h1 {
            font-size: 3em;
            margin: 0;
        }
        .main p {
            font-size: 1.5em;
            margin: 10px 0 0;
        }
        .stat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: flex-start;
            padding: 20px;
        }
        .stat {
            width: 100%;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 10px;
            background-color: rgba(44, 44, 92, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: start;
        }
        .emoji {
            font-size: 2em;
            margin-right: 15px;
        }
        .stat-value {
            font-size: 1.5em;
            margin-right: 10px;
        }
        .stat-label {
            font-size: 1em;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
            <h1>300%</h1>
            <p>생산성 향상</p>
        </div>
        <div class="stat-container">
            <div class="stat">
                <div class="emoji">🏢</div>
                <div class="stat-value">150+</div>
                <div class="stat-label">도입 기업</div>
            </div>
            <div class="stat">
                <div class="emoji">👤</div>
                <div class="stat-value">50K+</div>
                <div class="stat-label">월간 활성 사용자</div>
            </div>
            <div class="stat">
                <div class="emoji">📄</div>
                <div class="stat-value">2M+</div>
                <div class="stat-label">처리 문서 수</div>
            </div>
            <div class="stat">
                <div class="emoji">⏱️</div>
                <div class="stat-value">99.9%</div>
                <div class="stat-label">서비스 가동률</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=720">
<title>Impact Slide</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<style>
  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #1E293B, #0F172A);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .overlay {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,223,121,0.15), transparent 70%);
    filter: blur(60px);
    top: 35%;
    left: 20%;
  }
  .dot-pattern {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: 1;
  }
  .header {
    position: absolute;
    top: 5%;
    left: 8%;
    color: #FFD700;
    font-size: 36px;
    font-weight: bold;
  }
  .hero-slide {
    position: absolute;
    top: 20%;
    left: 8%;
    color: #FFD700;
    font-size: 72px;
    font-weight: bold;
  }
  .subtitle {
    position: absolute;
    top: 35%;
    left: 8%;
    color: #ffffff;
    font-size: 30px;
  }
  .stat-card {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    width: 320px;
    height: 80px;
    color: #ffffff;
    padding: 16px;
    display: flex;
    align-items: center;
    margin: 10px 0;
  }
  .stat-container {
    position: absolute;
    top: 20%;
    right: 8%;
    z-index: 2;
  }
  .stat-card i, .stat-card span {
    margin-right: 15px;
    font-size: 30px;
  }
  .stat-text {
    display: flex;
    flex-direction: column;
  }
  .stat-value {
    font-weight: bold;
    font-size: 24px;
  }
  .stat-label {
    font-size: 18px;
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="dot-pattern"></div>
  <div class="header">HERO IMPACT SLIDE</div>
  <div class="hero-slide">300%</div>
  <div class="subtitle">생산성 향상</div>

  <div class="stat-container">
    <div class="stat-card">
      <span>🏢</span>
      <div class="stat-text">
        <div class="stat-value">150+</div>
        <div class="stat-label">도입 기업</div>
      </div>
    </div>
    <div class="stat-card">
      <span>👤</span>
      <div class="stat-text">
        <div class="stat-value">50K+</div>
        <div class="stat-label">월간 활성 사용자</div>
      </div>
    </div>
    <div class="stat-card">
      <span>📄</span>
      <div class="stat-text">
        <div class="stat-value">2M+</div>
        <div class="stat-label">처리 문서 수</div>
      </div>
    </div>
    <div class="stat-card">
      <span>⏱️</span>
      <div class="stat-text">
        <div class="stat-value">99.9%</div>
        <div class="stat-label">서비스 가동률</div>
      </div>
    </div>
  </div>
</body>
</html></div>
</body></html>

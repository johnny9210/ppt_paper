<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_10_stats_hero" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_10_stats_hero-bg"></div>

<style>
  .design_10_stats_hero-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #0E0E3A, #113DA8);
    overflow: hidden;
  }

  .design_10_stats_hero-bg::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
    opacity: 0.3;
    transform: translate(-50%, -50%);
  }
  
  .design_10_stats_hero-bg::after {
    content: '';
    position: absolute;
    left: 20%;
    top: 10%;
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_10_stats_hero-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .design_10_stats_hero-card {
    position: absolute;
    width: 28%;
    height: 10%;
    left: 59%;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.3);
  }

  .card-1 { top: 19%; }
  .card-2 { top: 33%; }
  .card-3 { top: 47%; }
  .card-4 { top: 61%; }
</style>

<div class="design_10_stats_hero-cards">
  <div class="design_10_stats_hero-card card-1"></div>
  <div class="design_10_stats_hero-card card-2"></div>
  <div class="design_10_stats_hero-card card-3"></div>
  <div class="design_10_stats_hero-card card-4"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_10_stats_hero-content">
  <div class="title">2025년 성과 하이라이트</div>
  <div class="card" style="left: 62%; top: 22%;">
    <div class="emoji">🏢</div>
    <div class="value">150+</div>
    <div class="label">도입 기업</div>
  </div>
  <div class="card" style="left: 62%; top: 36%;">
    <div class="emoji">👤</div>
    <div class="value">50K+</div>
    <div class="label">월간 활성 사용자</div>
  </div>
  <div class="card" style="left: 62%; top: 50%;">
    <div class="emoji">📄</div>
    <div class="value">2M+</div>
    <div class="label">처리 문서 수</div>
  </div>
  <div class="card" style="left: 62%; top: 64%;">
    <div class="emoji">⏱️</div>
    <div class="value">99.9%</div>
    <div class="label">서비스 가동률</div>
  </div>
</div>

<style>
  .design_10_stats_hero-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .title {
    position: absolute;
    left: 10%;
    top: 20%;
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    color: #f8fbff;
  }
  .card {
    position: absolute;
    width: 22%;
    height: 4%;
    overflow: hidden;
    text-align: left;
  }
  .emoji {
    font-size: 1.2rem;
    top: 30%;
    font-weight: 700;
    color: #3B82F6;
  }
  .value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #e2e8f0;
    top: 30%;
  }
  .label {
    font-size: 0.8rem;
    color: rgba(148, 163, 184, 0.9);
    line-height: 1.55;
    top: 55%;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_10_stats_hero-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }
  
  .icon-badge {
    position: absolute;
    top: 22%;
    left: 62%;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
    z-index: 31;
  }

  .icon-badge i {
    font-size: 1.2rem;
    color: #60A5FA;
  }

  .accent-line {
    position: absolute;
    top: 27%;
    left: 62%;
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0));
    z-index: 32;
  }

  .divider {
    position: absolute;
    top: 30%;
    left: 62%;
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    z-index: 33;
  }

  .glow-node {
    position: absolute;
    top: 35%;
    left: 62%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
    z-index: 34;
  }

  .decorative-bar {
    position: absolute;
    top: 40%;
    left: 62%;
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
    border-radius: 2px;
    z-index: 35;
  }
</style>

<div class="design_10_stats_hero-icons">
  <div class="icon-badge">
    <i class="fas fa-shield-halved"></i>
  </div>
  <div class="accent-line"></div>
  <div class="divider"></div>
  <div class="glow-node"></div>
  <div class="decorative-bar"></div>
</div></div>
</div></div>
</body></html>

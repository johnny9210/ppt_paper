<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_10_stats_hero" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_10_stats_hero-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #000044, #001166);
    overflow: hidden;
    z-index: 0;
  }

  .decor-triangle {
    width: 0;
    height: 0;
    border-left: 1vw solid transparent;
    border-right: 1vw solid transparent;
    border-bottom: 2vw solid #bbbbbb;
    position: absolute;
  }

  .decor-circle {
    width: 1.5vw;
    height: 1.5vw;
    background-color: #bbbbbb;
    border-radius: 50%;
    position: absolute;
  }

  .triangle-1 {
    left: 10%;
    top: 15%;
  }

  .circle-1 {
    left: 85%;
    top: 10%;
  }
</style>

<div class="design_10_stats_hero-bg">
  <div class="decor-triangle triangle-1"></div>
  <div class="decor-circle circle-1"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_10_stats_hero-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 10;
  }

  .card {
    position: absolute;
    width: 25%;
    height: 15%;
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .card1 {
    left: 70%;
    top: 15%;
  }

  .card2 {
    left: 70%;
    top: 35%;
  }

  .card3 {
    left: 70%;
    top: 55%;
  }

  .card4 {
    left: 70%;
    top: 75%;
  }
</style>

<div class="design_10_stats_hero-cards">
  <div class="card card1"></div>
  <div class="card card2"></div>
  <div class="card card3"></div>
  <div class="card card4"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
.design_10_stats_hero-content {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  font-family: sans-serif;
}

.design_10_stats_hero-content > div {
  position: absolute;
  color: #F1F5F9;
}

.hero-title {
  left: 10%;
  top: 15%;
  width: 50%;
  height: 10%;
  font-size: 3rem;
  font-weight: 700;
  color: #FFD700;
}

.hero-stat {
  left: 10%;
  top: 30%;
  width: 50%;
  height: 5%;
  font-size: 1.5rem;
  line-height: 1.6;
  color: #F1F5F9;
}

.stat-label {
  font-size: 0.75rem;
  padding: 4px 12px;
  border-radius: 12px;
  background-color: rgba(96, 165, 250, 0.8);
  line-height: 1.6;
}

.stat-section:nth-child(3) { left: 72%; top: 16%; }
.stat-section:nth-child(4) { left: 72%; top: 36%; }
.stat-section:nth-child(5) { left: 72%; top: 56%; }
.stat-section:nth-child(6) { left: 72%; top: 76%; }
</style>

<div class="design_10_stats_hero-content">
  <div class="hero-title">2025년 성과 하이라이트</div>
  <div class="hero-stat">
    <span class="stat-label">300% 생산성 향상</span>
  </div>
  <div class="stat-section">
    <span>🏢</span>
    <span class="stat-label">150+ 도입 기업</span>
  </div>
  <div class="stat-section">
    <span>👤</span>
    <span class="stat-label">50K+ 월간 활성 사용자</span>
  </div>
  <div class="stat-section">
    <span>📄</span>
    <span class="stat-label">2M+ 처리 문서 수</span>
  </div>
  <div class="stat-section">
    <span>⏱️</span>
    <span class="stat-label">99.9% 서비스 가동률</span>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_10_stats_hero-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }
  .icon-badge {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #60A5FA;
  }
  .icon-badge-1 {
    left: 72%;
    top: 16%;
    width: 50px;
    height: 50px;
  }
  .icon-badge-2 {
    left: 72%;
    top: 36%;
    width: 50px;
    height: 50px;
  }
  .icon-badge-3 {
    left: 72%;
    top: 56%;
    width: 50px;
    height: 50px;
  }
  .icon-badge-4 {
    left: 72%;
    top: 76%;
    width: 50px;
    height: 50px;
  }
  i {
    color: white;
    font-size: 24px;
  }
</style>

<div class="design_10_stats_hero-icons">
  <div class="icon-badge icon-badge-1">
    <i class="fas fa-shield-alt"></i>
  </div>
  <div class="icon-badge icon-badge-2">
    <i class="fas fa-globe"></i>
  </div>
  <div class="icon-badge icon-badge-3">
    <i class="fas fa-chart-line"></i>
  </div>
  <div class="icon-badge icon-badge-4">
    <i class="fas fa-handshake"></i>
  </div>
</div></div>
</div></div>
</body></html>

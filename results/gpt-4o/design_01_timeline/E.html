<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_01_timeline" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
.design_01_timeline-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle, #0d052b, #1a093d, #420f6b);
}
</style>

<div class="design_01_timeline-bg"></div></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_01_timeline-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .design_01_timeline-card {
    position: absolute;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .card-1 {
    left: 10%;
    top: 50%;
    width: 15%;
    height: 25%;
    z-index: 10;
  }

  .card-2 {
    left: 30%;
    top: 50%;
    width: 15%;
    height: 25%;
    z-index: 11;
  }

  .card-3 {
    left: 50%;
    top: 50%;
    width: 15%;
    height: 25%;
    z-index: 12;
  }

  .card-4 {
    left: 70%;
    top: 50%;
    width: 15%;
    height: 25%;
    z-index: 13;
  }
</style>

<div class="design_01_timeline-cards">
  <div class="design_01_timeline-card card-1"></div>
  <div class="design_01_timeline-card card-2"></div>
  <div class="design_01_timeline-card card-3"></div>
  <div class="design_01_timeline-card card-4"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
  .design_01_timeline-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
    color: #F1F5F9;
  }
  .design_01_timeline-content .title {
    position: absolute;
    left: 10%;
    top: 10%;
    font-weight: 800;
    font-size: 2rem;
    color: #3B82F6;
    white-space: nowrap;
  }
  .design_01_timeline-content .description {
    position: absolute;
    left: 10%;
    top: 15%;
    font-size: 1.125rem;
    line-height: 1.6;
    white-space: nowrap;
  }
  .design_01_timeline-content .item {
    position: absolute;
    width: 15%;
    text-align: center;
    color: #F1F5F9;
  }
  .design_01_timeline-content .item .emoji {
    display: block;
    font-size: 2rem;
  }
  .design_01_timeline-content .item .step-title {
    font-weight: 700;
    margin-top: 0.5rem;
  }
  .design_01_timeline-content .item .step-description {
    font-size: 0.875rem;
    line-height: 1.6;
    margin-top: 0.25rem;
  }
  .design_01_timeline-content .item-1 { left: 10%; top: 55%; }
  .design_01_timeline-content .item-2 { left: 30%; top: 55%; }
  .design_01_timeline-content .item-3 { left: 50%; top: 55%; }
  .design_01_timeline-content .item-4 { left: 70%; top: 55%; }
</style>

<div class="design_01_timeline-content">
  <div class="title">디지털 전환 로드맵 2025</div>
  <div class="description">4단계 전환 마일스톤과 핵심 목표</div>
  
  <div class="item item-1">
    <span class="emoji">📊</span>
    <div class="step-title">현황 진단</div>
    <div class="step-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
  </div>

  <div class="item item-2">
    <span class="emoji">🏗️</span>
    <div class="step-title">기반 구축</div>
    <div class="step-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
  </div>

  <div class="item item-3">
    <span class="emoji">🔄</span>
    <div class="step-title">프로세스 혁신</div>
    <div class="step-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
  </div>

  <div class="item item-4">
    <span class="emoji">🚀</span>
    <div class="step-title">스케일업</div>
    <div class="step-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_01_timeline-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }
  .design_01_timeline-icons .icon {
    position: absolute;
    width: 40px;
    height: 40px;
    background-color: #40c7eb;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
  }
  .design_01_timeline-icons .icon:nth-child(1) {
    left: 10%;
    top: 30%;
  }
  .design_01_timeline-icons .icon:nth-child(2) {
    left: 30%;
    top: 30%;
  }
  .design_01_timeline-icons .icon:nth-child(3) {
    left: 50%;
    top: 30%;
  }
  .design_01_timeline-icons .icon:nth-child(4) {
    left: 70%;
    top: 30%;
  }
  .design_01_timeline-icons .accent-line {
    position: absolute;
    left: 10%;
    top: 30%;
    width: 75%;
    height: 2px;
    background-color: #40c7eb;
    border-radius: 2px;
  }
</style>

<div class="design_01_timeline-icons">
  <div class="accent-line"></div>
  <div class="icon"><i class="fas fa-dot-circle"></i></div>
  <div class="icon"><i class="fas fa-dot-circle"></i></div>
  <div class="icon"><i class="fas fa-dot-circle"></i></div>
  <div class="icon"><i class="fas fa-dot-circle"></i></div>
</div></div>
</div></div>
</body></html>

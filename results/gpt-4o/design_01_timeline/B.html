<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(90deg, #002233, #330033);
    width: 1280px;
    height: 720px;
    color: white;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 0;
  }

  .line {
    position: absolute;
    top: 40%;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #00bfff, #ff00ff);
    z-index: 1;
    box-shadow: 0 0 10px #00bfff, 0 0 10px #ff00ff;
  }

  .card {
    width: 250px;
    height: 300px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    margin: 0 20px;
    padding: 20px;
    z-index: 2;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  .icon {
    font-size: 30px;
    margin-bottom: 20px;
    z-index: 3;
  }

  .card-title {
    font-weight: bold;
    margin-bottom: 10px;
  }

  .card-description {
    font-size: 14px;
  }

  h1, h3 {
    position: absolute;
    top: 10%;
    z-index: 4;
    text-align: center;
    width: 100%;
    margin: 0;
  }

  h1 {
    font-size: 36px;
  }

  h3 {
    top: 15%;
    font-size: 24px;
  }
</style>

<div class="container">
  <h1>디지털 전환 로드맵 2025</h1>
  <h3>4단계 전환 마일스톤과 핵심 목표</h3>
  <div class="line"></div>
  <div class="card">
    <div class="icon">📊</div>
    <div class="card-title">현황 진단</div>
    <div class="card-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
  </div>
  <div class="card">
    <div class="icon">🏗️</div>
    <div class="card-title">기반 구축</div>
    <div class="card-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
  </div>
  <div class="card">
    <div class="icon">🔄</div>
    <div class="card-title">프로세스 혁신</div>
    <div class="card-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
  </div>
  <div class="card">
    <div class="icon">🚀</div>
    <div class="card-title">스케일업</div>
    <div class="card-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body, html {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #1a1a2e;
    font-family: Arial, sans-serif;
    color: #ffffff;
  }

  .slide {
    width: 1280px;
    height: 720px;
    background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
  }

  .title {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .description {
    font-size: 18px;
    margin-bottom: 30px;
  }

  .milestones {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }

  .milestone {
    flex: 1;
    max-width: 240px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 20px;
    margin: 0 10px;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    text-align: center;
  }

  .emoji {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .milestone-title {
    font-size: 20px;
    margin-bottom: 10px;
  }

  .milestone-description {
    font-size: 16px;
    color: #dcdde1;
  }

  .line {
    position: absolute;
    top: 160px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: linear-gradient(to right, #00f2fe, #4facfe, #00f2fe);
  }
</style>

<div class="slide">
  <div class="title">디지털 전환 로드맵 2025</div>
  <div class="description">4단계 전환 마일스톤과 핵심 목표</div>

  <div class="line"></div>

  <div class="milestones">
    <div class="milestone">
      <div class="emoji">📊</div>
      <div class="milestone-title">현황 진단</div>
      <div class="milestone-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
    </div>
    <div class="milestone">
      <div class="emoji">🏗️</div>
      <div class="milestone-title">기반 구축</div>
      <div class="milestone-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
    </div>
    <div class="milestone">
      <div class="emoji">🔄</div>
      <div class="milestone-title">프로세스 혁신</div>
      <div class="milestone-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
    </div>
    <div class="milestone">
      <div class="emoji">🚀</div>
      <div class="milestone-title">스케일업</div>
      <div class="milestone-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_03_comparison_split" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_03_comparison_split-bg"></div>

<style>
    .design_03_comparison_split-bg {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(to right, #000428, #3d5475);
    }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_03_comparison_split-cards">
    <div id="card_1"></div>
    <div id="card_2"></div>
    <div id="card_3"></div>
    <div id="card_4"></div>
    <div id="card_5"></div>
    <div id="card_6"></div>
    <div id="card_7"></div>
    <div id="card_8"></div>
</div>

<style>
    .design_03_comparison_split-cards {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        z-index: 10;
    }
    .design_03_comparison_split-cards > div {
        position: absolute;
        border-radius: 10px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
    }
    #card_1, #card_2, #card_3, #card_4 {
        background-color: rgba(0, 255, 255, 0.2);
        left: 5%;
        width: 40%;
    }
    #card_5, #card_6, #card_7, #card_8 {
        background-color: rgba(255, 0, 255, 0.2);
        left: 55%;
        width: 40%;
    }
    #card_1 { top: 20%; height: 15%; }
    #card_2 { top: 40%; height: 15%; }
    #card_3 { top: 60%; height: 15%; }
    #card_4 { top: 80%; height: 15%; }
    #card_5 { top: 20%; height: 15%; }
    #card_6 { top: 40%; height: 15%; }
    #card_7 { top: 60%; height: 15%; }
    #card_8 { top: 80%; height: 15%; }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
.design_03_comparison_split-content {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  z-index: 20;
}

.design_03_comparison_split-content .title {
  position: absolute;
  left: 20%;
  top: 5%;
  width: 60%;
  height: 10%;
  font-size: 2.5rem;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
}

.design_03_comparison_split-content .section {
  position: absolute;
  text-align: center;
}

.design_03_comparison_split-content .section.left {
  left: 5%;
  width: 40%;
}

.design_03_comparison_split-content .section.right {
  left: 55%;
  width: 40%;
}

.design_03_comparison_split-content .section .label {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  background-color: rgba(255, 255, 255, 0.1);
  color: #f1f5f9;
}

.design_03_comparison_split-content .section .items {
  margin-top: 5%;
  line-height: 1.6;
  color: #f1f5f9;
}
</style>

<div class="design_03_comparison_split-content">
  <div class="title">온프레미스 vs 클라우드 네이티브</div>
  <div class="section left" style="top: 20%;">
    <div class="label">온프레미스</div>
    <div class="items" style="top: 40%;">
      <div>초기 투자비용 높음</div>
      <div>확장에 수주~수개월 소요</div>
      <div>보안 직접 관리 필요</div>
      <div>유지보수 인력 상시 필요</div>
    </div>
  </div>
  <div class="section right" style="top: 20%;">
    <div class="label">클라우드 네이티브</div>
    <div class="items" style="top: 40%;">
      <div>사용량 기반 과금</div>
      <div>분 단위 자동 스케일링</div>
      <div>관리형 보안 서비스</div>
      <div>인프라 자동화로 인력 절감</div>
    </div>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_03_comparison_split-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_03_comparison_split-icons .icon, .design_03_comparison_split-icons .divider {
    position: absolute;
  }

  .design_03_comparison_split-icons .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
  }

  /* Icons left side */
  .icon_1 {
    left: 0%;
    top: 23%;
    background-color: #00ffff;
  }
  
  .icon_2 {
    left: 0%;
    top: 43%;
    background-color: #00ffff;
  }
  
  .icon_3 {
    left: 0%;
    top: 63%;
    background-color: #00ffff;
  }

  .icon_4 {
    left: 0%;
    top: 83%;
    background-color: #00ffff;
  }

  /* Icons right side */
  .icon_5 {
    left: 50%;
    top: 23%;
    background-color: #ff00ff;
  }

  .icon_6 {
    left: 50%;
    top: 43%;
    background-color: #ff00ff;
  }

  .icon_7 {
    left: 50%;
    top: 63%;
    background-color: #ff00ff;
  }

  .icon_8 {
    left: 50%;
    top: 83%;
    background-color: #ff00ff;
  }

  .divider {
    left: 50%;
    top: 0%;
    width: 1px;
    height: 100%;
    background-color: #ffffff;
  }
</style>

<div class="design_03_comparison_split-icons">
  <div class="icon icon_1"><i class="fas fa-cog"></i></div>
  <div class="icon icon_2"><i class="fas fa-cloud-upload-alt"></i></div>
  <div class="icon icon_3"><i class="fas fa-shield-alt"></i></div>
  <div class="icon icon_4"><i class="fas fa-search"></i></div>
  <div class="icon icon_5"><i class="fas fa-bolt"></i></div>
  <div class="icon icon_6"><i class="fas fa-server"></i></div>
  <div class="icon icon_7"><i class="fas fa-lock"></i></div>
  <div class="icon icon_8"><i class="fas fa-bullseye"></i></div>
  <div class="divider"></div>
</div></div>
</div></div>
</body></html>

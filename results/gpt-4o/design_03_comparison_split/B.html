<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="comparison">
    <div class="section left">
        <div class="header">온프레미스</div>
        <div class="item"><i class="fas fa-cogs"></i> 초기 투자비용 높음</div>
        <div class="item"><i class="fas fa-cloud-upload-alt"></i> 확장에 수주~수개월 소요</div>
        <div class="item"><i class="fas fa-shield-alt"></i> 보안 직접 관리 필요</div>
        <div class="item"><i class="fas fa-search"></i> 유지보수 인력 상시 필요</div>
    </div>
    <div class="vs">VS</div>
    <div class="section right">
        <div class="header">클라우드 네이티브</div>
        <div class="item"><i class="fas fa-bolt"></i> 사용량 기반 과금</div>
        <div class="item"><i class="fas fa-server"></i> 분 단위 자동 스케일링</div>
        <div class="item"><i class="fas fa-lock"></i> 관리형 보안 서비스</div>
        <div class="item"><i class="fas fa-bullseye"></i> 인프라 자동화로 인력 절감</div>
    </div>
</div>

<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, blue, purple);
        font-family: Arial, sans-serif;
        color: #fff;
    }
    .comparison {
        display: flex;
        align-items: center;
        width: 1280px;
        height: 720px;
        position: relative;
    }
    .section {
        background: rgba(255, 255, 255, 0.1);
        margin: 20px;
        padding: 20px;
        border-radius: 15px;
        width: 350px;
        height: 600px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(5px);
    }
    .header {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
    }
    .item {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        font-size: 18px;
    }
    .item i {
        margin-right: 10px;
        font-size: 24px;
    }
    .vs {
        font-size: 48px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        position: absolute;
        top: calc(50% - 24px);
        left: calc(50% - 24px);
        z-index: 1;
    }
    .left {
        background-color: rgba(0, 0, 255, 0.1);
        z-index: 2;
    }
    .right {
        background-color: rgba(128, 0, 128, 0.1);
        z-index: 2;
    }
    .comparison:before {
        content: '';
        position: absolute;
        width: 3px;
        height: 100%;
        background: #fff;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        z-index: 0;
    }
</style></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position: relative; width: 1280px; height: 720px; background: linear-gradient(0deg, #0F172A, #6B21A8); background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
    <div style="position: absolute; width: 100%; top: 50px; color: #fff; text-align: center; font-size: 32px;">
        온프레미스 vs 클라우드 네이티브
    </div>
    <div style="position: absolute; left: 50px; top: 150px; z-index: 2;">
        <div style="color: #0EA5E9; font-size: 24px; margin-bottom: 20px;">온프레미스</div>
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #0EA5E9;">
                <i class="fas fa-tools" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(14,165,233, 0.3), 0 0 60px rgba(14,165,233, 0.1);">
                초기 투자비용 높음
            </div>
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #0EA5E9;">
                <i class="fas fa-cloud-upload-alt" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(14,165,233, 0.3), 0 0 60px rgba(14,165,233, 0.1);">
                확장에 수주~수개월 소요
            </div>
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #0EA5E9;">
                <i class="fas fa-shield-alt" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(14,165,233, 0.3), 0 0 60px rgba(14,165,233, 0.1);">
                보안 직접 관리 필요
            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #0EA5E9;">
                <i class="fas fa-user-cog" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(14,165,233, 0.3), 0 0 60px rgba(14,165,233, 0.1);">
                유지보수 인력 상시 필요
            </div>
        </div>
    </div>
    <div style="position: absolute; right: 50px; top: 150px; z-index: 2;">
        <div style="color: #F472B6; font-size: 24px; margin-bottom: 20px;">클라우드 네이티브</div>

            </div>
        </div>

            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F472B6;">
                <i class="fas fa-lock" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(244,114,182, 0.3), 0 0 60px rgba(244,114,182, 0.1);">
                관리형 보안 서비스
            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #F472B6;">
                <i class="fas fa-tasks" style="color: #fff; font-size: 20px;"></i>
            </div>
            <div style="margin-left: 20px; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; color: #fff; box-shadow: 0 0 20px rgba(244,114,182, 0.3), 0 0 60px rgba(244,114,182, 0.1);">

            </div>
        </div>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,0,255,0.15), transparent 70%); filter: blur(60px); z-index: 1;"></div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 64px; z-index: 3;">
        VS
    </div>
</div></div>

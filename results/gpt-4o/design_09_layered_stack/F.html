<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_09_layered_stack" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_09_layered_stack-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom right, rgba(59, 130, 246, 0.2), #0F172A),
                linear-gradient(to top left, rgba(96, 165, 250, 0.1), transparent);
  }
  .design_09_layered_stack-bg::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent);
    opacity: 0.3;
  }
  .design_09_layered_stack-bg::after {
    content: '';
    position: absolute;
    top: 30%;
    left: 40%;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(96, 165, 250, 0.08);
    opacity: 0.3;
  }
</style>
<div class="design_09_layered_stack-bg"></div></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_09_layered_stack-cards"></div>

<style>
  .design_09_layered_stack-cards {
    width: 28%;
    height: 75%;
    position: absolute;
    inset: 15% 72% 0 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 
                0 4px 24px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_09_layered_stack-content">
  <div class="title">시스템 아키텍처 스택</div>
  <div class="content">
    <div class="layer layer-1">
      <div class="emoji">🎨</div>
      <div class="layer-title">프레젠테이션 계층</div>
      <div class="description">React + Ant Design UI</div>
    </div>
    <div class="layer layer-2">
      <div class="emoji">⚡</div>
      <div class="layer-title">API 계층</div>
      <div class="description">Express Gateway + Moleculer</div>
    </div>
    <div class="layer layer-3">
      <div class="emoji">🧠</div>
      <div class="layer-title">서비스 계층</div>
      <div class="description">FastAPI + LangGraph AI 에이전트</div>
    </div>
    <div class="layer layer-4">
      <div class="emoji">💾</div>
      <div class="layer-title">인프라 계층</div>
      <div class="description">MongoDB + OpenSearch + Redis + MinIO</div>
    </div>
  </div>
</div>

<style>
  .design_09_layered_stack-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
    color: #F1F5F9;
  }

  .title {
    position: absolute;
    top: 5%;
    left: 5%;
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    color: #f8fbff;
  }

  .content {
    position: absolute;
    left: 8%;
    top: 18%;
    width: 22%;
    height: 69%;
    padding: 3%;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    width: 100%;
    overflow: hidden;
  }

  .layer-1 {
    top: 0%;
    z-index: 21;
  }

  .layer-2 {
    top: 25%;
    z-index: 22;
  }

  .layer-3 {
    top: 50%;
    z-index: 23;
  }

  .layer-4 {
    top: 75%;
    z-index: 24;
  }

  .emoji {
    font-size: 1.5rem;
    line-height: 1;
  }

  .layer-title {
    font-size: 1rem;
    font-weight: 700;
    color: #e2e8f0;
    margin-top: 10%;
  }

  .description {
    font-size: 0.8rem;
    color: rgba(148, 163, 184, 0.9);
    line-height: 1.55;
    margin-top: 5%;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_09_layered_stack-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_09_layered_stack-icons .icon-badge {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
    z-index: 31;
  }
  
  .design_09_layered_stack-icons .icon-badge i {
    font-size: 1.2rem;
    color: #60A5FA;
  }

  .design_09_layered_stack-icons .accent-line {
    position: absolute;
    top: 15%;
    left: 30%;
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0));
    z-index: 32;
  }

  .design_09_layered_stack-icons .divider {
    position: absolute;
    top: 30%;
    left: 10%;
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    z-index: 33;
  }

  .design_09_layered_stack-icons .glow-node {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
    z-index: 34;
  }

  .design_09_layered_stack-icons .decorative-bar {
    position: absolute;
    bottom: 10%;
    left: 10%;
    width: 80%;
    height: 4px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
    border-radius: 2px;
    z-index: 35;
  }
</style>

<div class="design_09_layered_stack-icons">
  <div class="icon-badge">
    <i class="fas fa-shield-halved"></i>
  </div>
  <div class="accent-line"></div>
  <div class="divider"></div>
  <div class="glow-node"></div>
  <div class="decorative-bar"></div>
</div></div>
</div></div>
</body></html>

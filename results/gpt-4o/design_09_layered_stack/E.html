<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_09_layered_stack" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_09_layered_stack-bg"></div>

<style>
  .design_09_layered_stack-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to bottom, #000000, #2D2D2D);
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_09_layered_stack-cards">
  <div class="card" id="card1"></div>
  <div class="card" id="card2"></div>
  <div class="card" id="card3"></div>
</div>

<style>
  .design_09_layered_stack-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 10;
  }
  
  .design_09_layered_stack-cards .card {
    position: absolute;
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.06);
  }

  #card1 {
    left: 15%;
    top: 20%;
    width: 70%;
    height: 15%;
  }

  #card2 {
    left: 17%;
    top: 40%;
    width: 66%;
    height: 15%;
  }

  #card3 {
    left: 19%;
    top: 60%;
    width: 62%;
    height: 15%;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_09_layered_stack-content">
  <div class="text-area" style="left: 10%; top: 5%; font-size: 1.5rem; font-weight: 800; color: #F1F5F9;">시스템 아키텍처 스택</div>
  
  <div class="level1" style="left: 17%; top: 22%; color: #F1F5F9;">
    <div class="emoji" style="font-size: 1rem;">🎨</div>
    <div class="title" style="font-size: 1.25rem; font-weight: 700;">프레젠테이션 계층</div>
    <div class="description" style="font-size: 0.875rem; line-height: 1.6;">React + Ant Design UI</div>
  </div>

  <div class="level2" style="left: 19%; top: 42%; color: #F1F5F9;">
    <div class="emoji" style="font-size: 1rem;">⚡</div>
    <div class="title" style="font-size: 1.25rem; font-weight: 700;">API 계층</div>
    <div class="description" style="font-size: 0.875rem; line-height: 1.6;">Express Gateway + Moleculer</div>
  </div>

  <div class="level3" style="left: 21%; top: 62%; color: #F1F5F9;">
    <div class="emoji" style="font-size: 1rem;">🧠</div>
    <div class="title" style="font-size: 1.25rem; font-weight: 700;">서비스 계층</div>
    <div class="description" style="font-size: 0.875rem; line-height: 1.6;">FastAPI + LangGraph AI 에이전트</div>
  </div>

  <div class="level4" style="left: 23%; top: 82%; color: #F1F5F9;">
    <div class="emoji" style="font-size: 1rem;">💾</div>
    <div class="title" style="font-size: 1.25rem; font-weight: 700;">인프라 계층</div>
    <div class="description" style="font-size: 0.75rem; line-height: 1.6;">MongoDB + OpenSearch + Redis + MinIO</div>
  </div>
</div>

<style>
  .design_09_layered_stack-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .design_09_layered_stack-content .text-area {
    position: absolute;
    z-index: 21;
  }
  .design_09_layered_stack-content .level1,
  .design_09_layered_stack-content .level2,
  .design_09_layered_stack-content .level3,
  .design_09_layered_stack-content .level4 {
    position: absolute;
    z-index: 22;
  }
  .design_09_layered_stack-content .emoji {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    background-color: rgba(96, 165, 250, 0.15);
    margin-bottom: 4px;
    font-size: 0.75rem;
  }
  .design_09_layered_stack-content .title {
    margin-bottom: 4px;
  }
  .design_09_layered_stack-content .description {
    font-size: 0.875rem;
    line-height: 1.6;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_09_layered_stack-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_09_layered_stack-icons .accent_line {
    position: absolute;
    border-radius: 2px;
  }

  .design_09_layered_stack-icons .accent_line:nth-child(1) {
    left: 80%;
    top: 20%;
    width: 2%;
    height: 60%;
    background-color: #FFCC00;
  }

  .design_09_layered_stack-icons .accent_line:nth-child(2) {
    left: 82%;
    top: 20%;
    width: 2%;
    height: 60%;
    background-color: #FF66CC;
  }

  .design_09_layered_stack-icons .accent_line:nth-child(3) {
    left: 84%;
    top: 20%;
    width: 2%;
    height: 60%;
    background-color: #66FF66;
  }
</style>

<div class="design_09_layered_stack-icons">
  <div class="accent_line"></div>
  <div class="accent_line"></div>
  <div class="accent_line"></div>
</div></div>
</div></div>
</body></html>

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_08_roadmap" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">

<style>
  .design_08_roadmap-bg {
    width: 100%; 
    height: 100%;
    position: absolute; 
    inset: 0;
    background: linear-gradient(180deg, #1a1a2e, #0F172A), 
                radial-gradient(circle at 70% 25%, rgba(59, 130, 246, 0.15) 0%, rgba(15, 23, 42, 0) 50%);
    background-blend-mode: overlay;
  }

  .design_08_roadmap-bg::after {
    content: '';
    position: absolute;
    width: 100vh; 
    height: 100vh;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(15, 23, 42, 0));
    opacity: 0.3;
  }

  .decor-circle {
    position: absolute;
    width: 15%;
    height: 15%;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.08);
  }

  .decor-circle:nth-child(1) {
    top: 20%;
    left: 10%;
  }

  .decor-circle:nth-child(2) {
    top: 60%;
    left: 30%;
  }

  .decor-circle:nth-child(3) {
    top: 40%;
    left: 60%;
  }

  .decor-circle:nth-child(4) {
    top: 75%;
    left: 80%;
  }
</style>

    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_08_roadmap-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
    position: absolute;
  }

  .accent-line {
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3B82F6, rgba(255, 255, 255, 0.0));
    position: absolute;
  }

  .divider {
    width: 80%;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    position: absolute;
  }

  .glow-node {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
    position: absolute;
  }

  .decor-bar {
    height: 4px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA);
    border-radius: 2px;
    position: absolute;
  }

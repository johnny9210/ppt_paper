<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0F172A, #1E293B);
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .container {
    position: relative;
  }

  .timeline {
    position: absolute;
    top: 200px;
    left: 100px;
    background: linear-gradient(90deg, #00F0FF, #C715F4);
    width: 1080px;
    height: 10px;
    z-index: 1;
    border-radius: 5px;
  }

  .card {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    width: 200px;
    height: 150px;
    position: absolute;
    top: 50px;
    color: #FFFFFF;
    padding: 20px;
    z-index: 2;
  }
  
  .card .emoji {
    font-size: 24px;
  }

  .card1 { left: 60px; }
  .card2 { left: 300px; }
  .card3 { left: 540px; }
  .card4 { left: 780px; }
  .card5 { left: 1020px; }

  .icon-circle {
    position: absolute;
    top: 180px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #00F0FF;
    color: #ffffff;
    font-size: 20px;
    z-index: 3;
  }

  .icon2 { left: 340px; background: #FF5863; }
  .icon3 { left: 580px; background: #C715F4; }
  .icon4 { left: 820px; background: #D9FF79; }
  .icon5 { left: 1060px; background: #0BF3F5; }

  .card1 .icon-circle { left: 90px; }
</style>

<div class="container">
  <div class="timeline"></div>
  
  <div class="card card1">
    <div class="emoji">🎯</div>
    <h4>Q1</h4>
    <strong>MVP 출시</strong>
    <p>핵심 기능 3종 런칭</p>
  </div>
  
  <div class="icon-circle card1">1</div>

  <div class="card card2">
    <div class="emoji">📈</div>
    <h4>Q2</h4>
    <strong>성장 가속</strong>
    <p>사용자 1만명 돌파 목표</p>
  </div>
  
  <div class="icon-circle icon2">2</div>

  <div class="card card3">
    <div class="emoji">🌏</div>
    <h4>Q3</h4>
    <strong>글로벌 확장</strong>
    <p>일본·동남아 시장 진출</p>
  </div>
  
  <div class="icon-circle icon3">3</div>

  <div class="card card4">
    <div class="emoji">🏆</div>
    <h4>Q4</h4>
    <strong>엔터프라이즈</strong>
    <p>대기업 맞춤 솔루션 출시</p>
  </div>
  
  <div class="icon-circle icon4">4</div>

  <div class="card card5">
    <div class="emoji">🚀</div>
    <h4>2026</h4>
    <strong>플랫폼화</strong>
    <p>3rd party 앱 마켓플레이스</p>
  </div>

  <div class="icon-circle icon5">5</div>
</div></div>
</body></html>

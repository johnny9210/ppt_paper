<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_08_roadmap" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_08_roadmap-bg">
  <div class="layer_0_background"></div>
  <div class="accent_line"></div>
</div>

<style>
  .design_08_roadmap-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background-color: #0d0e27;
  }

  .layer_0_background {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background-color: #0d0e27;
  }

  .accent_line {
    position: absolute;
    left: 0;
    top: 55%;
    width: 100%;
    height: 5%;
    background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_08_roadmap-cards">
    <div class="card" style="left: 5%; top: 15%; width: 12%; height: 30%; z-index: 10;"></div>
    <div class="card" style="left: 20%; top: 50%; width: 12%; height: 30%; z-index: 11;"></div>
    <div class="card" style="left: 40%; top: 15%; width: 12%; height: 30%; z-index: 12;"></div>
    <div class="card" style="left: 60%; top: 50%; width: 12%; height: 30%; z-index: 13;"></div>
    <div class="card" style="left: 80%; top: 15%; width: 12%; height: 30%; z-index: 14;"></div>
</div>

<style>
    .design_08_roadmap-cards {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
    }
    .design_08_roadmap-cards .card {
        position: absolute;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
    }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
  .design_08_roadmap-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
    color: #F1F5F9;
    font-family: Arial, sans-serif;
  }
  
  .design_08_roadmap-content h1 {
    position: absolute;
    left: 5%;
    top: 5%;
    font-size: 2rem;
    font-weight: 800;
  }

  .design_08_roadmap-content .phase {
    position: absolute;
    width: 12%;
    height: 30%;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .phase.q1 {
    left: 5%;
    top: 15%;
  }

  .phase.q2 {
    left: 20%;
    top: 50%;
  }

  .phase.q3 {
    left: 40%;
    top: 15%;
  }

  .phase.q4 {
    left: 60%;
    top: 50%;
  }

  .phase.y2026 {
    left: 80%;
    top: 15%;
  }

  .design_08_roadmap-content .emoji {
    font-size: 1rem;
    display: inline-block;
    margin-right: 4px;
  }

  .design_08_roadmap-content .phase-title {
    font-weight: 700;
  }
</style>

<div class="design_08_roadmap-content">
  <h1>2025 제품 로드맵</h1>
  <div class="phase q1">
    <span class="emoji">🎯</span>
    <div class="phase-title">MVP 출시</div>
    <div>핵심 기능 3종 런칭</div>
  </div>
  <div class="phase q2">
    <span class="emoji">📈</span>
    <div class="phase-title">성장 가속</div>
    <div>사용자 1만명 돌파 목표</div>
  </div>
  <div class="phase q3">
    <span class="emoji">🌏</span>
    <div class="phase-title">글로벌 확장</div>
    <div>일본·동남아 시장 진출</div>
  </div>
  <div class="phase q4">
    <span class="emoji">🏆</span>
    <div class="phase-title">엔터프라이즈</div>
    <div>대기업 맞춤 솔루션 출시</div>
  </div>
  <div class="phase y2026">
    <span class="emoji">🚀</span>
    <div class="phase-title">플랫폼화</div>
    <div>3rd party 앱 마켓플레이스</div>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
    .design_08_roadmap-icons {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        z-index: 30;
    }
    
    .design_08_roadmap-icons .icon {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
    }
    
    .design_08_roadmap-icons .icon-1 {
        left: 10%;
        top: 50%;
        background-color: #00E5FF;
    }
    
    .design_08_roadmap-icons .icon-2 {
        left: 25%;
        top: 70%;
        background-color: #FF3D00;
    }
    
    .design_08_roadmap-icons .icon-3 {
        left: 45%;
        top: 50%;
        background-color: #D500F9;
    }
    
    .design_08_roadmap-icons .icon-4 {
        left: 65%;
        top: 70%;
        background-color: #76FF03;
    }
    
    .design_08_roadmap-icons .icon-5 {
        left: 85%;
        top: 50%;
        background-color: #00E5FF;
    }
    
    .design_08_roadmap-icons .accent-line {
        position: absolute;
        left: 0;
        top: 55%;
        width: 100%;
        height: 5%;
        background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
        border-radius: 2px;
    }
</style>

<div class="design_08_roadmap-icons">
    <div class="icon icon-1"><i class="fas fa-image"></i></div>
    <div class="icon icon-2"><i class="fas fa-image"></i></div>
    <div class="icon icon-3"><i class="fas fa-image"></i></div>
    <div class="icon icon-4"><i class="fas fa-image"></i></div>
    <div class="icon icon-5"><i class="fas fa-image"></i></div>
    <div class="accent-line"></div>
</div></div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 제품 로드맵</title>
    <style>
        body {
            background-color: #0a0f1f;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timeline-container {
            position: relative;
            width: 80%;
            max-width: 1200px;
            padding: 20px;
        }
        .timeline-bar {
            position: relative;
            height: 10px;
            background: linear-gradient(to right, #0055ff, #da00ff, #0055ff);
            border-radius: 5px;
            margin: 40px 0;
        }
        .phase {
            position: absolute;
            width: 120px;
            background-color: #1a1f3d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            top: -140px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .phase:hover {
            transform: scale(1.05);
        }
        .phase::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: #1a1f3d transparent transparent transparent;
        }
        .phase span {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }
        .timeline-bar::before {
            content: "2025 제품 로드맵";
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }
        /* Position Phases */
        .phase:nth-child(1) {
            left: 0;
            top: -170px;
            border-top: 3px solid rgb(0, 224, 255);
        }
        .phase:nth-child(2) {
            left: 25%;
            top: -170px;
            border-top: 3px solid rgb(255, 102, 102);
        }
        .phase:nth-child(3) {
            left: 50%;
            top: -170px;
            border-top: 3px solid rgb(224, 132, 255);
        }
        .phase:nth-child(4) {
            left: 75%;
            top: -170px;
            border-top: 3px solid rgb(224, 243, 95);
        }
        .phase:nth-child(5) {
            right: 0;
            top: 50px;
            border-top: 3px solid rgb(0, 224, 255);
        }
    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="timeline-bar"></div>
        <div class="phase">
            <strong>Q1 🎯</strong>
            <span>MVP 출시</span>
            <span>핵심 기능 3종 런칭</span>
        </div>
        <div class="phase">
            <strong>Q2 📈</strong>
            <span>성장 가속</span>
            <span>사용자 1만명 돌파 목표</span>
        </div>
        <div class="phase">
            <strong>Q3 🌏</strong>
            <span>글로벌 확장</span>
            <span>일본·동남아 시장 진출</span>
        </div>
        <div class="phase">
            <strong>Q4 🏆</strong>
            <span>엔터프라이즈</span>
            <span>대기업 맞춤 솔루션 출시</span>
        </div>
        <div class="phase">
            <strong>2026 🚀</strong>
            <span>플랫폼화</span>
            <span>3rd party 앱 마켓플레이스</span>
        </div>
    </div>
</body>
</html></div>
</body></html>

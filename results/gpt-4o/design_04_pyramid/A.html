<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 거버넌스 프레임워크</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }
    .container {
        width: 1280px;
        height: 720px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
        box-sizing: border-box;
    }
    .tier {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px;
    }
    .card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #cccccc;
        border-radius: 8px;
        text-align: center;
        margin: 10px;
        padding: 15px;
        width: 230px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }
    .crown {
        font-size: 2.5em;
        position: absolute;
        top: 0;
    }
    .line {
        width: 90%;
        height: 2px;
        background: linear-gradient(to right, rgba(255, 200, 0, 0), rgba(255, 200, 0, 1), rgba(255, 200, 0, 0));
        position: absolute;
        top: 80px;
        z-index: -1;
    }
    .line.vertical {
        height: 60px;
        width: 2px;
        background: linear-gradient(to bottom, rgba(255, 200, 0, 0), rgba(255, 200, 0, 1), rgba(255, 200, 0, 0));
        position: absolute;
    }
    .vertical1 {left: 507px; top: 80px;}
    .vertical2 {right: 507px; top: 80px;}
    .vertical3 {left: 315px; top: 280px;}
    .vertical4 {right: 315px; top: 280px;}
</style>
</head>
<body>
<div class="container">
    <div class="crown">👑</div>
    <div class="line"></div>
    <div class="vertical1 line vertical"></div>
    <div class="vertical2 line vertical"></div>
    <div class="tier">
        <div class="card">
            <h3>데이터 전략</h3>
            <p>경영진 주도 데이터 비전 및 정책 수립</p>
        </div>
    </div>
    <div class="tier">
        <div class="card">
            📋<h3>품질 관리</h3>
            <p>데이터 표준화 및 품질 모니터링</p>
        </div>
        <div class="card">
            🔐<h3>보안 통제</h3>
            <p>접근 권한 및 개인정보 보호</p>
        </div>
    </div>
    <div class="vertical3 line vertical"></div>
    <div class="vertical4 line vertical"></div>
    <div class="tier">
        <div class="card">
            🗄️<h3>수집</h3>
            <p>원천 데이터 통합</p>
        </div>
        <div class="card">
            ⚙️<h3>처리</h3>
            <p>ETL 파이프라인</p>
        </div>
        <div class="card">
            📈<h3>분석</h3>
            <p>BI 대시보드 운영</p>
        </div>
    </div>
</div>
</body>
</html></div>
</body></html>

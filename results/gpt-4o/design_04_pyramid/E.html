<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_04_pyramid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_04_pyramid-bg">
  <div class="background-pattern"></div>
</div>

<style>
  .design_04_pyramid-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom right, #000814, #1B1E30);
    z-index: 0;
  }

  .background-pattern {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    background-color: #FFD700;
    opacity: 0.1;
    z-index: 1;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><style>
  .design_04_pyramid-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .design_04_pyramid-cards .card {
    position: absolute;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
  }

  #card_1 {
    left: 20%;
    top: 10%;
    width: 20%;
    height: 10%;
    z-index: 10;
  }

  #card_2 {
    left: 60%;
    top: 10%;
    width: 20%;
    height: 10%;
    z-index: 11;
  }

  #card_3 {
    left: 10%;
    top: 25%;
    width: 20%;
    height: 10%;
    z-index: 12;
  }

  #card_4 {
    left: 40%;
    top: 25%;
    width: 20%;
    height: 10%;
    z-index: 13;
  }

  #card_5 {
    left: 70%;
    top: 25%;
    width: 20%;
    height: 10%;
    z-index: 14;
  }
</style>

<div class="design_04_pyramid-cards">
  <div class="card" id="card_1"></div>
  <div class="card" id="card_2"></div>
  <div class="card" id="card_3"></div>
  <div class="card" id="card_4"></div>
  <div class="card" id="card_5"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:20;"><div class="design_04_pyramid-content">
  <div class="title" style="left: 45%; top: 50%; width: 10%; height: 5%; font-size: 1.5rem; font-weight: 800; color: #FFFFFF;">
    데이터 거버넌스 프레임워크
  </div>
  <div class="strategic" style="left: 20%; top: 10%; width: 20%; height: 10%; font-size: 1rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">👑 데이터 전략</div>
    <div style="line-height: 1.6;">경영진 주도 데이터 비전 및 정책 수립</div>
  </div>
  <div class="tactical-quality" style="left: 60%; top: 10%; width: 20%; height: 10%; font-size: 0.85rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">📋 품질 관리</div>
    <div style="line-height: 1.6;">데이터 표준화 및 품질 모니터링</div>
  </div>
  <div class="tactical-security" style="left: 10%; top: 25%; width: 20%; height: 10%; font-size: 0.85rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">🔐 보안 통제</div>
    <div style="line-height: 1.6;">접근 권한 및 개인정보 보호</div>
  </div>
  <div class="operational-collection" style="left: 40%; top: 25%; width: 20%; height: 10%; font-size: 0.85rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">🗄️ 수집</div>
    <div style="line-height: 1.6;">원천 데이터 통합</div>
  </div>
  <div class="operational-processing" style="left: 70%; top: 25%; width: 20%; height: 10%; font-size: 0.85rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">⚙️ 처리</div>
    <div style="line-height: 1.6;">ETL 파이프라인</div>
  </div>
  <div class="operational-analysis" style="left: 40%; top: 40%; width: 20%; height: 10%; font-size: 0.85rem; color: #F1F5F9;">
    <div style="padding: 4px 12px; border-radius: 12px; font-size: 0.75rem;">📈 분석</div>
    <div style="line-height: 1.6;">BI 대시보드 운영</div>
  </div>
</div>
<style>
  .design_04_pyramid-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .design_04_pyramid-content .title {
    z-index: 21;
  }
  .design_04_pyramid-content .strategic,
  .design_04_pyramid-content .tactical-quality,
  .design_04_pyramid-content .tactical-security,
  .design_04_pyramid-content .operational-collection,
  .design_04_pyramid-content .operational-processing,
  .design_04_pyramid-content .operational-analysis {
    position: absolute;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:30;"><style>
  .design_04_pyramid-icons {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 30;
  }

  .design_04_pyramid-icons .icon {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #FFD700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000814;
  }

  .design_04_pyramid-icons .icon#icon_1 {
    left: 46%;
    top: 11%;
  }
</style>

<div class="design_04_pyramid-icons">
  <div class="icon" id="icon_1">
    <i class="fas fa-crown"></i>
  </div>
</div></div>
</div></div>
</body></html>

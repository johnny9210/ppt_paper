<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_05_hub_spoke" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_05_hub_spoke-bg"></div>

<style>
  .design_05_hub_spoke-bg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(96, 165, 250, 0.15) 0%, rgba(15, 23, 42, 1) 50%),
                linear-gradient(135deg, rgba(3, 18, 77, 1), rgba(15, 23, 42, 1));
    overflow: hidden;
  }

  .design_05_hub_spoke-bg::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle at center, rgba(96, 165, 250, 0.4) 0%, rgba(15, 23, 42, 0) 70%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0.3;
  }

  .design_05_hub_spoke-bg::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle at center, rgba(59, 130, 246, 0.3) 0%, rgba(15, 23, 42, 0) 50%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0.2;
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:10;"><div class="design_05_hub_spoke-cards">
  <div class="card" style="left: 20%; top: 20%; width: 20%; height: 20%;"></div>
  <div class="card" style="left: 60%; top: 20%; width: 20%; height: 20%;"></div>
  <div class="card" style="left: 20%; top: 60%; width: 20%; height: 20%;"></div>
  <div class="card" style="left: 60%; top: 60%; width: 20%; height: 20%;"></div>
</div>

<style>
  .design_05_hub_spoke-cards {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .card {
    position: absolute;
    border-radius: 15px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(148, 163, 184, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.3);
  }
</style></div>
    <div style="position:absolute;inset:0;z-index:20;"><style>
  .design_05_hub_spoke-content {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 20;
  }
  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #e2e8f0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    line-height: 1.4;
  }
  .card-description {
    font-size: 0.84rem;
    color: rgba(148, 163, 184, 0.9);
    line-height: 1.55;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spoke {
    position: absolute;
  }
  .spoke-title {
    top: 20%;
  }
  .spoke-description {
    top: 40%;
  }
  #card_1 {
    left: 23%;
    top: 23%;
    width: 14%;
    height: 14%;
  }
  #card_2 {
    left: 63%;
    top: 23%;
    width: 14%;
    height: 14%;
  }
  #card_3 {
    left: 23%;
    top: 63%;
    width: 14%;
    height: 14%;
  }
  #card_4 {
    left: 63%;
    top: 63%;
    width: 14%;
    height: 14%;
  }
</style>

<div class="design_05_hub_spoke-content">
  <div id="card_1" class="spoke">
    <div class="card-title spoke-title">☁️ 클라우드 스토리지</div>
    <div class="card-description spoke-description">S3, MinIO 기반 객체 저장소</div>
  </div>
  <div id="card_2" class="spoke">
    <div class="card-title spoke-title">📡 실시간 스트리밍</div>
    <div class="card-description spoke-description">Kafka 이벤트 브로커</div>
  </div>
  <div id="card_3" class="spoke">
    <div class="card-title spoke-title">🗄️ 데이터베이스</div>
    <div class="card-description spoke-description">PostgreSQL + MongoDB</div>
  </div>
  <div id="card_4" class="spoke">
    <div class="card-title spoke-title">🔒 인증/보안</div>
    <div class="card-description spoke-description">OAuth2 + JWT 토큰</div>
  </div>
</div></div>
    <div style="position:absolute;inset:0;z-index:30;"><div class="design_05_hub_spoke-icons">
    <div class="icon" style="left: 23%; top: 23%;">
        <div class="badge">
            <i class="fas fa-shield-halved"></i>
        </div>
        <div class="accent-line"></div>
        <div class="divider"></div>
        <div class="glow-node"></div>
        <div class="decor-bar"></div>
    </div>
    <div class="icon" style="left: 63%; top: 23%;">
        <div class="badge">
            <i class="fas fa-shield-halved"></i>
        </div>
        <div class="accent-line"></div>
        <div class="divider"></div>
        <div class="glow-node"></div>
        <div class="decor-bar"></div>
    </div>
    <div class="icon" style="left: 23%; top: 63%;">
        <div class="badge">
            <i class="fas fa-shield-halved"></i>
        </div>
        <div class="accent-line"></div>
        <div class="divider"></div>
        <div class="glow-node"></div>
        <div class="decor-bar"></div>
    </div>
    <div class="icon" style="left: 63%; top: 63%;">
        <div class="badge">
            <i class="fas fa-shield-halved"></i>
        </div>
        <div class="accent-line"></div>
        <div class="divider"></div>
        <div class="glow-node"></div>
        <div class="decor-bar"></div>
    </div>
</div>

<style>
    .design_05_hub_spoke-icons {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        z-index: 30;
    }
    .design_05_hub_spoke-icons .icon {
        position: absolute;
        width: 48px;
        height: 48px;
    }
    .design_05_hub_spoke-icons .badge {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.1));
        box-shadow: 0 0 16px rgba(59, 130, 246, 0.2);
    }
    .design_05_hub_spoke-icons .badge i {
        font-size: 1.2rem;
        color: #60A5FA;
    }
    .design_05_hub_spoke-icons .accent-line {
        width: 48px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(59, 130, 246, 1), rgba(59, 130, 246, 0));
        position: absolute;
        top: 52px;
        left: 0;
    }
    .design_05_hub_spoke-icons .divider {
        width: 80%;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        position: absolute;
        top: 55px;
        left: 10%;
    }
    .design_05_hub_spoke-icons .glow-node {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #60A5FA;
        box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
        position: absolute;
        top: 58px;
        left: 50%;
        transform: translateX(-50%);
    }
    .design_05_hub_spoke-icons .decor-bar {
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #3B82F6, #60A5FA);
        border-radius: 2px;
        position: absolute;
        top: 62px;
        left: 0;
    }
</style></div>
</div></div>
</body></html>

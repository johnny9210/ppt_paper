<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #0A192F, #2C3E50);
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 1280px;
    height: 720px;
  }

  .background-pattern {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('https://www.transparenttextures.com/patterns/circuit-board.png');
    mix-blend-mode: overlay;
    z-index: 0;
  }

  .hub, .spoke {
    position: absolute;
    width: 160px;
    height: 100px;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
    backdrop-filter: blur(7.8px);
    -webkit-backdrop-filter: blur(7.8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    z-index: 2;
  }
  
  .hub {
    top: 310px;
    left: 560px;
    width: 160px;
    height: 160px;
    border-radius: 80px;
    background: rgba(0, 255, 200, 0.2);
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.6);
  }
  
  .spoke:nth-child(2), .spoke:nth-child(3) {
    top: 130px;
  }
  
  .spoke:nth-child(5), .spoke:nth-child(6) {
    top: 510px;
  }

  .spoke:nth-of-type(2),
  .spoke:nth-of-type(5) {
    left: 260px;
  }

  .spoke:nth-of-type(3),
  .spoke:nth-of-type(6) {
    left: 860px;
  }

  .line {
    position: absolute;
    height: 4px;
    background: linear-gradient(90deg, #00FFC8, #00DEA6);
    z-index: 1;
  }

  .line.vertical {
    width: 4px;
    background: linear-gradient(180deg, #00FFC8, #00DEA6);
  }

  .spoke:nth-of-type(2) ~ .line:nth-of-type(1) {
    top: 370px;
    left: 420px;
    width: 140px;
  }

  .spoke:nth-of-type(3) ~ .line:nth-of-type(2) {
    top: 370px;
    right: 420px;
    width: 140px;
  }

  .spoke:nth-of-type(5) ~ .line:nth-of-type(3) {
    top: 370px;
    left: 420px;
    width: 140px;
  }

  .spoke:nth-of-type(6) ~ .line:nth-of-type(4) {
    top: 370px;
    right: 420px;
    width: 140px;
  }
</style>

<div class="container">
  <div class="background-pattern"></div>
  <div class="hub">
    <div>🌐</div>
    <div>API Gateway</div>
  </div>
  <div class="spoke">
    <div>☁️</div>
    <div>클라우드 스토리지</div>
    <div>S3, MinIO 기반 객체 저장소</div>
  </div>
  <div class="spoke">
    <div>📡</div>
    <div>실시간 스트리밍</div>
    <div>Kafka 이벤트 브로커</div>
  </div>
  <div class="spoke">
    <div>🗄️</div>
    <div>데이터베이스</div>
    <div>PostgreSQL + MongoDB</div>
  </div>
  <div class="spoke">
    <div>🔒</div>
    <div>인증/보안</div>
    <div>OAuth2 + JWT 토큰</div>
  </div>
  <div class="spoke">
    <div>🤖</div>
    <div>AI 서비스</div>
    <div>LLM 추론 엔진</div>
  </div>
  <div class="spoke">
    <div>🌍</div>
    <div>CDN/Edge</div>
    <div>글로벌 콘텐츠 배포</div>
  </div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    overflow: hidden;
  }

  .background {
    width: 1280px;
    height: 720px;
    background: radial-gradient(circle, rgba(0,255,209,0.15), #0F172A);
    position: relative;
  }

  .dot-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: 0;
  }

  .ambient-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,209,0.15), transparent 70%);
    filter: blur(60px);
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  .card {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    width: 200px;
    height: 100px;
    position: absolute;
    z-index: 2;
  }

  .card-content {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 14px;
  }

  .center-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #00FFD1;
    box-shadow: 0 0 20px rgba(0,255,209, 0.3), 0 0 60px rgba(0,255,209, 0.1);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
  }

  .accent-line {
    width: 150px;
    height: 4px;
    background: #00FFD1;
    position: absolute;
    z-index: 3;
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #00FFD1;
    box-shadow: 0 0 20px rgba(0,255,209, 0.3), 0 0 60px rgba(0,255,209, 0.1);
    margin-right: 10px;
  }

  /* Positioning */

  .card-top-left {
    top: 10%;
    left: 10%;
  }

  .card-top-right {
    top: 10%;
    right: 10%;
  }

  .card-bottom-left {
    bottom: 10%;
    left: 10%;
  }

  .card-bottom-right {
    bottom: 10%;
    right: 10%;
  }

  .card-middle-left {
    top: 50%;
    left: 5%;
    transform: translateY(-50%);
  }

  .card-middle-right {
    top: 50%;
    right: 5%;
    transform: translateY(-50%);
  }

  /* Accent lines */

  .line-left {
    left: calc(50% - 75px);
    top: 50%;
    transform: rotate(90deg) translateX(-50%);
  }

  .line-right {
    right: calc(50% - 75px);
    top: 50%;
    transform: rotate(90deg) translateX(50%);
  }

  .line-top-left {
    top: 50%;
    left: calc(25% - 75px);
    transform: rotate(-45deg);
  }

  .line-top-right {
    top: 50%;
    right: calc(25% - 75px);
    transform: rotate(45deg);
  }

  .line-bottom-left {
    bottom: 50%;
    left: calc(25% - 75px);
    transform: rotate(45deg);
  }

  .line-bottom-right {
    bottom: 50%;
    right: calc(25% - 75px);
    transform: rotate(-45deg);
  }

</style>

<div class="background">
  <div class="dot-pattern"></div>
  <div class="ambient-glow"></div>

  <div class="card card-top-left">
    <div class="card-content">
      <div class="icon-badge"><span>☁️</span></div>
      <div>
        <strong>클라우드 스토리지</strong><br>S3, MinIO 기반 객체 저장소
      </div>
    </div>
  </div>

  <div class="card card-top-right">
    <div class="card-content">
      <div class="icon-badge"><span>📡</span></div>
      <div>
        <strong>실시간 스트리밍</strong><br>Kafka 이벤트 브로커
      </div>
    </div>
  </div>

  <div class="card card-middle-left">
    <div class="card-content">
      <div class="icon-badge"><span>🗄️</span></div>
      <div>
        <strong>데이터베이스</strong><br>PostgreSQL + MongoDB
      </div>
    </div>
  </div>

  <div class="card card-middle-right">
    <div class="card-content">
      <div class="icon-badge"><span>🔒</span></div>
      <div>
        <strong>인증/보안</strong><br>OAuth2 + JWT 토큰
      </div>
    </div>
  </div>

  <div class="card card-bottom-left">
    <div class="card-content">
      <div class="icon-badge"><span>🤖</span></div>
      <div>
        <strong>AI 서비스</strong><br>LLM 추론 엔진
      </div>
    </div>
  </div>

  <div class="card card-bottom-right">
    <div class="card-content">
      <div class="icon-badge"><span>🌍</span></div>
      <div>
        <strong>CDN/Edge</strong><br>글로벌 콘텐츠 배포
      </div>
    </div>
  </div>

  <div class="center-icon">
    <span>🌐</span>
  </div>

  <div class="accent-line line-left"></div>
  <div class="accent-line line-right"></div>
  <div class="accent-line line-top-left"></div>
  <div class="accent-line line-top-right"></div>
  <div class="accent-line line-bottom-left"></div>
  <div class="accent-line line-bottom-right"></div>
</div></div>
</body></html>

<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
    .design_07_feature_grid-bg {
        width: 1280px;
        height: 720px;
        position: relative;
        background: linear-gradient(135deg, #090d1f, #1e2334);
        overflow: hidden;
    }

    .timeline-line {
        position: absolute;
        top: 25px;
        left: 384px;
        width: 512px;
        height: 8px;
        background: linear-gradient(to right, rgba(255, 0, 255, 0.5), rgba(64, 255, 255, 0.5));
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.8), 0 0 30px rgba(64, 255, 255, 0.8);
        border-radius: 4px;
    }

    .glow-node {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 0, 255, 0.8), transparent);
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(255, 0, 255, 0.8);
    }

    .glow-node-1 { top: 120px; left: 150px; }
    .glow-node-2 { top: 120px; left: 620px; }
    .glow-node-3 { top: 120px; left: 1090px; }
    .glow-node-4 { top: 440px; left: 150px; }
    .glow-node-5 { top: 440px; left: 620px; }
    .glow-node-6 { top: 440px; left: 1090px; }

    .background-glow {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(128, 0, 255, 0.5), transparent);
        pointer-events: none;
    }

    .background-glow-1 {
        top: -100px;
        left: -100px;
        width: 300px;
        height: 300px;
        box-shadow: 0 0 150px rgba(128, 0, 255, 0.5);
    }

    .background-glow-2 {
        bottom: -100px;
        right: -100px;
        width: 300px;
        height: 300px;
        box-shadow: 0 0 150px rgba(128, 0, 255, 0.5);
    }

    .background-glow-3 {
        bottom: 200px;
        left: 500px;
        width: 400px;
        height: 400px;
        box-shadow: 0 0 150px rgba(128, 0, 255, 0.5);
    }

    .card-1, .card-2, .card-3, .card-4, .card-5, .card-6 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
    }

    .content, .text-area, .section, .highlight, .feature-title, .inner-rectangle {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
    }

    .card-1 .content, .card-3 .text-area, .card-4 .section, .card-5 .section, .card-5 .highlight, .card-6 .feature-title, .card-6 .inner-rectangle {
        font-size: 0.65rem;
        color: rgba(148, 163, 184, 0.85);
        line-height: 1.4;
    }

    .circle, .inner-circle {
        font-size: 1.5rem;
    }

    .card-1 .circle, .card-2::after, .card-3 .inner-circle, .card-5 .feature-circle, .card-6 .inner-circle {
        font-size: 0.55rem;
        color: rgba(96, 165, 250, 0.8);
        font-weight: 600;
        letter-spacing: 0.1em;
    }

    .card-1 .content, .card-5 .highlight, .card-6 .feature-title {
        font-size: 0.85rem;
        font-weight: 700;
        color: #e2e8f0;
    }
</style>

<div class="slide-container design_07_feature_grid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
  <div style="position:absolute;inset:0;z-index:0;">
    <div class="design_07_feature_grid-bg">
      <div class="timeline-line"></div>
      <div class="glow-node glow-node-1"></div>
      <div class="glow-node glow-node-2"></div>
      <div class="glow-node glow-node-3"></div>
      <div class="glow-node glow-node-4"></div>
      <div class="glow-node glow-node-5"></div>
      <div class="glow-node glow-node-6"></div>
      <div class="background-glow background-glow-1"></div>
      <div class="background-glow background-glow-2"></div>
      <div class="background-glow background-glow-3"></div>
    </div>
  </div>
  <div style="position:absolute;left:7.0%;top:15.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-1">
      <div class="circle">💬 STEP1: AI 채팅</div>
      <div class="content">멀티턴 대화형 AI 어시스턴트</div>
    </div>
  </div>
  <div style="position:absolute;left:36.0%;top:15.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-2">
      <div class="content">🔄 STEP2: 워크플로우</div>
      <div class="content">노코드 업무 자동화 빌더</div>
    </div>
  </div>
  <div style="position:absolute;left:65.0%;top:15.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-3">
      <div class="inner-circle">📄 STEP3: 문서 처리</div>
      <div class="text-area">PDF/엑셀 자동 분석 및 요약</div>
    </div>
  </div>
  <div style="position:absolute;left:7.0%;top:47.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-4">
      <div class="section">📊 STEP4: 데이터 분석</div>
      <div class="section">자연어 SQL 변환 및 시각화</div>
    </div>
  </div>
  <div style="position:absolute;left:36.0%;top:47.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-5">
      <div class="section">
        <div class="highlight">🎨 STEP5: PPT 생성</div>
      </div>
      <div class="section">
        <div class="feature-circle">AI 기반 프레젠테이션 자동 생성</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:65.0%;top:47.0%;width:22.0%;height:20.0%;z-index:10;">
    <div class="card-6">
      <div class="inner-circle">🔗 STEP6: API 연동</div>
      <div class="feature-title">외부 시스템 MCP 연결</div>
      <div class="inner-rectangle"></div>
    </div>
  </div>
  <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;">
    <div style="font-size:1.5rem;font-weight:800;color:#f1f5f9;text-shadow:0 2px 12px rgba(0,0,0,0.4);">플랫폼 핵심 기능</div>
    <div style="font-size:0.7rem;color:rgba(148,163,184,0.7);margin-top:4px;"></div>
  </div>
</div></div></body></html>

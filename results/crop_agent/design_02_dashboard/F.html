.design_02_dashboard-bg {
    width: 1280px;

}

/* Glow Background Effects */
.design_02_dashboard-bg::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 30%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(19, 235, 253, 0.4) 0%, rgba(19, 235, 253, 0) 60%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    filter: blur(100px);
    z-index: 1;
}

.design_02_dashboard-bg::after {
    content: '';
    position: absolute;
    bottom: 10%;
    right: 20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(38, 139, 210, 0.4) 0%, rgba(38, 139, 210, 0) 60%);
    transform: translate(50%, 50%);
    border-radius: 50%;
    filter: blur(80px);
    z-index: 1;
}

/* Glow Nodes */
.design_02_dashboard-bg .glow-node {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    box-shadow: 0 0 10px 8px rgba(19, 235, 253, 0.5);
    z-index: 2;
}

.glow-node.left {
    left: 20%;
    top: 15%;
    background: radial-gradient(circle, rgba(19, 235, 253, 1), rgba(0, 0, 0, 0));
}

.glow-node.center {
    left: 45%;
    top: 15%;
    background: radial-gradient(circle, rgba(127, 219, 255, 1), rgba(0, 0, 0, 0));
}

.glow-node.right {
    left: 70%;
    top: 15%;
    background: radial-gradient(circle, rgba(38, 139, 210, 1), rgba(0, 0, 0, 0));
}

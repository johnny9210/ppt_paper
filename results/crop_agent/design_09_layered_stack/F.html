<style>
.design_09_layered_stack-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: linear-gradient(180deg, #111111, #000000);
    overflow: hidden;
}

.design_09_layered_stack-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.1), transparent 60%);
    opacity: 0.8;
}

.design_09_layered_stack-bg::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
                      linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.2;
}

.neon-line {
    position: absolute;
    height: 3px;
    width: 120px;
    background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
    top: 25%;
    right: 20%;
    box-shadow: 0 0 15px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3);
}

.glow-node {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
    box-shadow: 0 0 15px rgba(255,255,255,0.8);
    top: 25%;
    right: 15%;
}

.card {
    width: 100%;
    height: 100%;
    position: relative;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(148,163,184,0.15);
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.inner {
    width: 90%;
    height: 90%;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
}

.card::before, .card::after {
    content: '';
    position: absolute;
    width: 80%;
    height: 80%;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
<div class="neon-line"></div>
<div class="glow-node"></div></div>

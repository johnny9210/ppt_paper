    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_01_timeline-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: linear-gradient(135deg, #000033 0%, #330033 100%);
    overflow: hidden;
  }

  .design_01_timeline-bg::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5), transparent 50%);
    opacity: 0.3;
  }

  .timeline-line {
    position: absolute;
    top: 30%;
    left: 10%;
    width: 80%;
    height: 4px;
    background: linear-gradient(to right, #00f4ff, #ff00e0);
    box-shadow: 0 0 15px #00f4ff, 0 0 30px #ff00e0;
  }

  .glow-node {
    position: absolute;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, #ff00e0, #00f4ff);
    border-radius: 50%;
    box-shadow: 0 0 15px #ff00e0, 0 0 30px #00f4ff;
  }

  .glow-node:nth-child(2) { left: 20%; top: 29%; }
  .glow-node:nth-child(3) { left: 40%; top: 29%; }
  .glow-node:nth-child(4) { left: 60%; top: 29%; }
  .glow-node:nth-child(5) { left: 80%; top: 29%; }

  .background-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
    border-radius: 50%;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.3;
    pointer-events: none;
  }
</style>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0a0a1a;
  }

  .slide {
    width: 1280px;
    height: 720px;
    background: radial-gradient(ellipse at 60% 40%, #1a2040 0%, #0d1225 40%, #080c18 100%);
    position: relative;
    overflow: hidden;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }

  /* Geometric network background */
  .bg-network {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.15;
    background:
      linear-gradient(30deg, transparent 40%, rgba(212, 175, 55, 0.3) 40.5%, transparent 41%),
      linear-gradient(150deg, transparent 40%, rgba(212, 175, 55, 0.3) 40.5%, transparent 41%),
      linear-gradient(60deg, transparent 55%, rgba(212, 175, 55, 0.2) 55.5%, transparent 56%),
      linear-gradient(120deg, transparent 55%, rgba(212, 175, 55, 0.2) 55.5%, transparent 56%),
      linear-gradient(45deg, transparent 48%, rgba(212, 175, 55, 0.15) 48.5%, transparent 49%),
      linear-gradient(135deg, transparent 48%, rgba(212, 175, 55, 0.15) 48.5%, transparent 49%);
  }

  .bg-network2 {
    position: absolute;
    top: 0;
    right: 0;
    width: 60%;
    height: 100%;
    opacity: 0.1;
    background:
      linear-gradient(25deg, transparent 30%, rgba(212, 175, 55, 0.4) 30.2%, transparent 30.4%),
      linear-gradient(65deg, transparent 20%, rgba(212, 175, 55, 0.3) 20.2%, transparent 20.4%),
      linear-gradient(110deg, transparent 50%, rgba(212, 175, 55, 0.3) 50.2%, transparent 50.4%),
      linear-gradient(155deg, transparent 35%, rgba(212, 175, 55, 0.25) 35.2%, transparent 35.4%),
      linear-gradient(80deg, transparent 60%, rgba(212, 175, 55, 0.2) 60.2%, transparent 60.4%);
  }

  /* Golden border frame */
  .frame-border {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 20px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    pointer-events: none;
  }

  /* Corner glows */
  .glow-bl {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle at 0% 100%, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
  }

  .glow-tr {
    position: absolute;
    top: 0;
    right: 0;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle at 100% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
  }

  .glow-right {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 300px;
    background: linear-gradient(to left, rgba(212, 175, 55, 0.15), transparent);
  }

  /* Title */
  .main-title {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(212, 175, 55, 0.9);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    z-index: 10;
  }

  /* Connection lines */
  .connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .line-v1 {
    position: absolute;
    top: 205px;
    left: 50%;
    width: 2px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(212, 175, 55, 0.6), rgba(212, 175, 55, 0.2));
  }

  .line-h1 {
    position: absolute;
    top: 245px;
    left: calc(50% - 165px);
    width: 330px;
    height: 2px;
    background: linear-gradient(to right, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.5), rgba(212, 175, 55, 0.2));
  }

  .line-v2-left {
    position: absolute;
    top: 245px;
    left: calc(50% - 165px);
    width: 2px;
    height: 30px;
    background: linear-gradient(to bottom, rgba(212, 175, 55, 0.4), rgba(212, 175, 55, 0.2));
  }

  .line-v2-right {
    position: absolute;
    top: 245px;
    left: calc(50% + 165px);
    width: 2px;
    height: 30px;
    background: linear-gradient(to bottom, rgba(212, 175, 55, 0.4), rgba(212, 175, 55, 0.2));
  }

  .line-v3-mid {
    position: absolute;
    top: 420px;
    left: 50%;
    width: 2px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(180, 140, 50, 0.5), rgba(180, 140, 50, 0.2));
  }

  .line-h2 {
    position: absolute;
    top: 460px;
    left: calc(50% - 310px);
    width: 620px;
    height: 2px;
    background: linear-gradient(to right, rgba(180, 140, 50, 0.15), rgba(180, 140, 50, 0.4), rgba(180, 140, 50, 0.15));
  }

  .line-v3-left {
    position: absolute;
    top: 460px;
    left: calc(50% - 310px);
    width: 2px;
    height: 30px;
    background: linear-gradient(to bottom, rgba(180, 140, 50, 0.4), rgba(180, 140, 50, 0.15));
  }

  .line-v3-center {
    position: absolute;
    top: 460px;
    left: 50%;
    width: 2px;
    height: 30px;
    background: linear-gradient(to bottom, rgba(180, 140, 50, 0.4), rgba(180, 140, 50, 0.15));
  }

  .line-v3-right {
    position: absolute;
    top: 460px;
    left: calc(50% + 310px);
    width: 2px;
    height: 30px;
    background: linear-gradient(to bottom, rgba(180, 140, 50, 0.4), rgba(180, 140, 50, 0.15));
  }

  /* Glass card base */
  .card {
    position: absolute;
    border-radius: 12px;
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    text-align: center;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 12px;
    pointer-events: none;
  }

  /* Strategic card - gold theme */
  .card-strategic {
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 130px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(212, 175, 55, 0.06) 100%);
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-top: 3px solid rgba(212, 175, 55, 0.8);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.3),
      0 0 60px rgba(212, 175, 55, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .card-strategic .card-shine {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .card-strategic .level-badge {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(212, 175, 55, 0.7);
    text-transform: uppercase;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .card-strategic .card-emoji {
    font-size: 30px;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.4));
  }

  .card-strategic .card-title {
    color: #f0e6c8;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .card-strategic .card-desc {
    color: rgba(200, 200, 215, 0.7);
    font-size: 11px;
    line-height: 1.4;
    max-width: 230px;
  }

  /* Tactical cards - silver theme */
  .card-tactical {
    width: 280px;
    height: 145px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(192, 192, 210, 0.05) 100%);
    border: 1px solid rgba(192, 192, 220, 0.25);
    border-top: 3px solid rgba(200, 200, 220, 0.5);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.25),
      0 0 40px rgba(192, 192, 220, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .card-tactical-1 {
    top: 275px;
    left: 50%;
    transform: translateX(calc(-50% - 160px));
  }

  .card-tactical-2 {
    top: 275px;
    left: 50%;
    transform: translateX(calc(-50% + 160px));
  }

  .card-tactical .card-shine {
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.04), transparent);
    pointer-events: none;
  }

  .card-tactical .card-shine2 {
    position: absolute;
    top: 0;
    left: 10%;
    width: 40%;
    height: 100%;
    background: linear-gradient(135deg, transparent 30%, rgba(212, 175, 55, 0.03) 50%, transparent 70%);
    pointer-events: none;
  }

  .card-tactical .level-badge {
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(180, 180, 200, 0.6);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .card-tactical .card-emoji {
    font-size: 26px;
    margin-bottom: 6px;
  }

  .card-tactical .card-title {
    color: #d0d0e0;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .card-tactical .card-desc {
    color: rgba(180, 180, 200, 0.65);
    font-size: 11px;
    line-height: 1.4;
    max-width: 220px;
  }

  /* Operational cards - bronze/copper theme */
  .card-operational {
    width: 260px;
    height: 145px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(180, 130, 60, 0.04) 100%);
    border: 1px solid rgba(200, 160, 80, 0.2);
    border-top: 3px solid rgba(200, 155, 80, 0.5);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.25),
      0 0 30px rgba(200, 155, 80, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .card-op-1 {
    top: 490px;
    left: 50%;
    transform: translateX(calc(-50% - 290px));
  }

  .card-op-2 {
    top: 490px;
    left: 50%;
    transform: translateX(-50%);
  }

  .card-op-3 {
    top: 490px;
    left: 50%;
    transform: translateX(calc(-50% + 290px));
  }

  .card-operational .circuit-pattern {
    position: absolute;
    bottom: 10px;
    left: 15px;
    right: 15px;
    height: 30px;
    opacity: 0.08;
    background:
      repeating-linear-gradient(90deg, transparent 0px, transparent 18px, rgba(212, 175, 55, 0.8) 18px, rgba(212, 175, 55, 0.8) 20px),
      repeating-linear-gradient(0deg, transparent 0px, transparent 8px, rgba(212, 175, 55, 0.5) 8px, rgba(212, 175, 55, 0.5) 10px);
  }

  .card-operational .card-shine {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.03), transparent);
    pointer-events: none;
  }

  .card-operational .level-badge {
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(200, 160, 80, 0.55);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .card-operational .card-emoji {
    font-size: 24px;
    margin-bottom: 5px;
  }

  .card-operational .card-title {
    color: #c8c0b0;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .card-operational .card-desc {
    color: rgba(170, 170, 185, 0.6);
    font-size: 11px;
    line-height: 1.4;
  }

  /* Light streaks on cards */
  .light-streak {
    position: absolute;
    pointer-events: none;
  }

  .card-strategic .light-streak {
    bottom: 20px;
    left: -10px;
    width: 120%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.15), transparent);
    transform: rotate(-2deg);
  }

  .card-tactical .light-streak {
    top: 60%;
    left: -10px;
    width: 120%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.1), rgba(255, 255, 255, 0.05), transparent);
    transform: rotate(-5deg);
  }

  /* Dot accents at intersections */
  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.5);
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    z-index: 2;
  }

  .dot-1 { top: 243px; left: calc(50% - 2px); }
  .dot-2 { top: 243px; left: calc(50% - 167px); }
  .dot-3 { top: 243px; left: calc(50% + 163px); }
  .dot-4 { top: 458px; left: calc(50% - 2px); }
  .dot-5 { top: 458px; left: calc(50% - 312px); }
  .dot-6 { top: 458px; left: calc(50% + 308px); }
</style>
</head>
<body>
  <div class="slide">
    <div class="bg-network"></div>
    <div class="bg-network2"></div>
    <div class="glow-bl"></div>
    <div class="glow-tr"></div>
    <div class="glow-right"></div>
    <div class="frame-border"></div>

    <div class="main-title">데이터 거버넌스 프레임워크</div>

    <!-- Connection lines -->
    <div class="connections">
      <div class="line-v1"></div>
      <div class="line-h1"></div>
      <div class="line-v2-left"></div>
      <div class="line-v2-right"></div>
      <div class="line-v3-mid"></div>
      <div class="line-h2"></div>
      <div class="line-v3-left"></div>
      <div class="line-v3-center"></div>
      <div class="line-v3-right"></div>
    </div>

    <!-- Dots -->
    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
    <div class="dot dot-4"></div>
    <div class="dot dot-5"></div>
    <div class="dot dot-6"></div>

    <!-- Strategic Card -->
    <div class="card card-strategic">
      <div class="card-shine"></div>
      <div class="light-streak"></div>
      <div class="level-badge">Strategic</div>
      <div class="card-emoji">👑</div>
      <div class="card-title">데이터 전략</div>
      <div class="card-desc">경영진 주도 데이터 비전 및 정책 수립</div>
    </div>

    <!-- Tactical Cards -->
    <div class="card card-tactical card-tactical-1">
      <div class="card-shine"></div>
      <div class="card-shine2"></div>
      <div class="light-streak"></div>
      <div class="level-badge">Tactical</div>
      <div class="card-emoji">📋</div>
      <div class="card-title">품질 관리</div>
      <div class="card-desc">데이터 표준화 및 품질 모니터링</div>
    </div>

    <div class="card card-tactical card-tactical-2">
      <div class="card-shine"></div>
      <div class="card-shine2"></div>
      <div class="light-streak"></div>
      <div class="level-badge">Tactical</div>
      <div class="card-emoji">🔐</div>
      <div class="card-title">보안 통제</div>
      <div class="card-desc">접근 권한 및 개인정보 보호</div>
    </div>

    <!-- Operational Cards -->
    <div class="card card-operational card-op-1">
      <div class="card-shine"></div>
      <div class="circuit-pattern"></div>
      <div class="level-badge">Operational</div>
      <div class="card-emoji">🗄️</div>
      <div class="card-title">수집</div>
      <div class="card-desc">원천 데이터 통합</div>
    </div>

    <div class="card card-operational card-op-2">
      <div class="card-shine"></div>
      <div class="circuit-pattern"></div>
      <div class="level-badge">Operational</div>
      <div class="card-emoji">⚙️</div>
      <div class="card-title">처리</div>
      <div class="card-desc">ETL 파이프라인</div>
    </div>

    <div class="card card-operational card-op-3">
      <div class="card-shine"></div>
      <div class="circuit-pattern"></div>
      <div class="level-badge">Operational</div>
      <div class="card-emoji">📈</div>
      <div class="card-title">분석</div>
      <div class="card-desc">BI 대시보드 운영</div>
    </div>
  </div>
</body>
</html>

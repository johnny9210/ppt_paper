<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .slide {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0a1628 0%, #132044 30%, #1a2a5e 50%, #0f1d3d 70%, #0a1628 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Background decorative circles */
  .bg-circle-1 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(100, 130, 180, 0.15);
    top: 100px;
    left: 250px;
    background: radial-gradient(circle, rgba(30, 60, 120, 0.3) 0%, transparent 70%);
  }

  .bg-circle-2 {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    border: 2px solid rgba(100, 130, 180, 0.1);
    top: 175px;
    left: 325px;
    background: radial-gradient(circle, rgba(25, 50, 100, 0.2) 0%, transparent 70%);
  }

  .bg-circle-3 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    border: 1px solid rgba(100, 130, 180, 0.08);
    top: -50px;
    right: -100px;
  }

  /* Light beams */
  .light-beam-1 {
    position: absolute;
    width: 300px;
    height: 600px;
    background: linear-gradient(180deg, rgba(180, 200, 255, 0.08) 0%, transparent 100%);
    top: -100px;
    left: 200px;
    transform: rotate(-15deg);
  }

  .light-beam-2 {
    position: absolute;
    width: 200px;
    height: 500px;
    background: linear-gradient(180deg, rgba(180, 200, 255, 0.05) 0%, transparent 100%);
    top: -100px;
    right: 300px;
    transform: rotate(10deg);
  }

  /* Floating geometric shapes */
  .shape {
    position: absolute;
    opacity: 0.15;
  }

  .triangle {
    width: 0;
    height: 0;
  }

  .triangle-1 {
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #8aa0c0;
    top: 150px;
    left: 60px;
    transform: rotate(-20deg);
  }

  .triangle-2 {
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 14px solid #8aa0c0;
    top: 280px;
    left: 30px;
    transform: rotate(15deg);
  }

  .triangle-3 {
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 24px solid #8aa0c0;
    top: 400px;
    left: 120px;
    transform: rotate(-30deg);
  }

  .triangle-4 {
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 16px solid #8aa0c0;
    top: 550px;
    left: 200px;
    transform: rotate(25deg);
  }

  .triangle-5 {
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid #8aa0c0;
    top: 320px;
    left: 550px;
  }

  .triangle-6 {
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 16px solid #8aa0c0;
    top: 600px;
    left: 450px;
    transform: rotate(-10deg);
  }

  .circle-shape {
    border-radius: 50%;
    border: 2px solid #8aa0c0;
  }

  .circle-1 {
    width: 14px;
    height: 14px;
    top: 200px;
    left: 480px;
  }

  .circle-2 {
    width: 10px;
    height: 10px;
    top: 580px;
    left: 100px;
  }

  .circle-3 {
    width: 12px;
    height: 12px;
    top: 480px;
    left: 620px;
  }

  .circle-4 {
    width: 8px;
    height: 8px;
    top: 160px;
    right: 200px;
  }

  .pentagon {
    width: 20px;
    height: 20px;
    border: 2px solid #8aa0c0;
    top: 200px;
    right: 150px;
    transform: rotate(15deg);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    background: transparent;
    opacity: 0.12;
  }

  .pentagon-2 {
    width: 25px;
    height: 25px;
    border: 2px solid #8aa0c0;
    top: 450px;
    right: 80px;
    transform: rotate(-10deg);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    background: rgba(138, 160, 192, 0.15);
    opacity: 0.12;
  }

  .chevron {
    width: 18px;
    height: 18px;
    border-left: 2px solid #8aa0c0;
    border-bottom: 2px solid #8aa0c0;
    transform: rotate(135deg);
  }

  .chevron-1 {
    top: 170px;
    left: 100px;
    opacity: 0.2;
  }

  .chevron-2 {
    top: 500px;
    left: 50px;
    opacity: 0.15;
    width: 14px;
    height: 14px;
  }

  .diamond {
    width: 12px;
    height: 12px;
    border: 2px solid #8aa0c0;
    transform: rotate(45deg);
  }

  .diamond-1 {
    top: 350px;
    right: 120px;
    opacity: 0.12;
  }

  .diamond-2 {
    top: 600px;
    right: 250px;
    opacity: 0.1;
    width: 10px;
    height: 10px;
  }

  /* Title */
  .title {
    position: relative;
    z-index: 10;
    margin-top: 30px;
    margin-bottom: 30px;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #f5e6a3 0%, #d4a843 40%, #c49a38 60%, #b8892e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }

  /* Main content area */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    width: 1140px;
    height: 540px;
    gap: 40px;
    align-items: center;
  }

  /* Hero card */
  .hero-card {
    position: relative;
    width: 460px;
    height: 460px;
    border: 2px solid rgba(180, 160, 100, 0.5);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 50px;
    background: linear-gradient(135deg, rgba(15, 25, 60, 0.6) 0%, rgba(20, 35, 75, 0.4) 100%);
    backdrop-filter: blur(5px);
    flex-shrink: 0;
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: -1px;
    right: -1px;
    bottom: -1px;
    border: 1px solid rgba(200, 180, 100, 0.2);
    border-radius: 4px;
  }

  .hero-value {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(180deg, #f5e6a3 0%, #d4a843 30%, #c49a38 50%, #a07828 80%, #c9a340 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(180, 140, 40, 0.3));
    margin-bottom: 10px;
    letter-spacing: -2px;
  }

  .hero-label {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.3;
    color: #ffffff;
  }

  .hero-label span {
    background: linear-gradient(180deg, #f5e6a3 0%, #d4a843 50%, #c49a38 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Stats container */
  .stats-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    justify-content: center;
  }

  /* Stat card */
  .stat-card {
    position: relative;
    height: 105px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(140, 160, 200, 0.2) 0%, rgba(100, 130, 180, 0.15) 50%, rgba(80, 110, 160, 0.1) 100%);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(160, 180, 220, 0.25);
    display: flex;
    align-items: center;
    padding: 0 30px;
    gap: 20px;
    overflow: hidden;
  }

  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #d4a843 20%, #f5e6a3 50%, #d4a843 80%, transparent 100%);
    border-radius: 0 0 12px 12px;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 10%;
    right: 10%;
    height: 15px;
    background: radial-gradient(ellipse, rgba(212, 168, 67, 0.3) 0%, transparent 70%);
    filter: blur(5px);
  }

  .stat-emoji {
    font-size: 40px;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 30, 70, 0.4);
    border-radius: 12px;
    border: 1px solid rgba(160, 180, 220, 0.15);
    flex-shrink: 0;
  }

  .stat-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(180deg, #f5e6a3 0%, #d4a843 40%, #c49a38 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .stat-label {
    font-size: 16px;
    color: rgba(200, 210, 230, 0.85);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  /* Glossy overlay on stat cards */
  .stat-card-gloss {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
    border-radius: 12px 12px 0 0;
    pointer-events: none;
  }

  /* Additional sparkle effects */
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(245, 230, 163, 0.6);
    border-radius: 50%;
    filter: blur(1px);
  }

  .sparkle-1 { top: 15px; right: 80px; }
  .sparkle-2 { top: 25px; right: 200px; width: 3px; height: 3px; opacity: 0.4; }
  .sparkle-3 { bottom: 20px; right: 150px; width: 3px; height: 3px; opacity: 0.5; }

</style>
</head>
<body>
  <div class="slide">
    <!-- Background elements -->
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-circle-3"></div>
    <div class="light-beam-1"></div>
    <div class="light-beam-2"></div>

    <!-- Floating shapes -->
    <div class="shape triangle triangle-1"></div>
    <div class="shape triangle triangle-2"></div>
    <div class="shape triangle triangle-3"></div>
    <div class="shape triangle triangle-4"></div>
    <div class="shape triangle triangle-5"></div>
    <div class="shape triangle triangle-6"></div>
    <div class="shape circle-shape circle-1"></div>
    <div class="shape circle-shape circle-2"></div>
    <div class="shape circle-shape circle-3"></div>
    <div class="shape circle-shape circle-4"></div>
    <div class="shape pentagon"></div>
    <div class="shape pentagon-2"></div>
    <div class="shape chevron chevron-1"></div>
    <div class="shape chevron chevron-2"></div>
    <div class="shape diamond diamond-1"></div>
    <div class="shape diamond diamond-2"></div>

    <!-- Title -->
    <div class="title">2025년 성과 하이라이트</div>

    <!-- Content -->
    <div class="content">
      <!-- Hero Card -->
      <div class="hero-card">
        <div class="hero-value">300%</div>
        <div class="hero-label">생산성<br><span>향상</span></div>
      </div>

      <!-- Stats -->
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-card-gloss"></div>
          <div class="stat-emoji">🏢</div>
          <div class="stat-info">
            <div class="stat-value">150+</div>
            <div class="stat-label">도입 기업</div>
          </div>
          <div class="sparkle sparkle-1"></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-gloss"></div>
          <div class="stat-emoji">👤</div>
          <div class="stat-info">
            <div class="stat-value">50K+</div>
            <div class="stat-label">월간 활성 사용자</div>
          </div>
          <div class="sparkle sparkle-2"></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-gloss"></div>
          <div class="stat-emoji">📄</div>
          <div class="stat-info">
            <div class="stat-value">2M+</div>
            <div class="stat-label">처리 문서 수</div>
          </div>
          <div class="sparkle sparkle-3"></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-gloss"></div>
          <div class="stat-emoji">⏱️</div>
          <div class="stat-info">
            <div class="stat-value">99.9%</div>
            <div class="stat-label">서비스 가동률</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
    background: #0a0a1a;
    position: relative;
  }

  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0a20 0%, #0d0b2e 25%, #100e35 50%, #0d0b2e 75%, #0a0a20 100%);
  }

  /* Diagonal lines overlay */
  .slide::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 3px
    );
    z-index: 1;
    pointer-events: none;
  }

  /* Glow effects */
  .glow-tl {
    position: absolute;
    top: 200px;
    left: -80px;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(138, 43, 226, 0.1) 40%, transparent 70%);
    z-index: 0;
    filter: blur(40px);
  }

  .glow-tr {
    position: absolute;
    top: 150px;
    right: -80px;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(138, 43, 226, 0.35) 0%, rgba(138, 43, 226, 0.1) 40%, transparent 70%);
    z-index: 0;
    filter: blur(40px);
  }

  .glow-bl {
    position: absolute;
    bottom: 50px;
    left: -50px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(180, 60, 255, 0.35) 0%, rgba(138, 43, 226, 0.1) 40%, transparent 70%);
    z-index: 0;
    filter: blur(50px);
  }

  .glow-br {
    position: absolute;
    bottom: 50px;
    right: -50px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(180, 60, 255, 0.3) 0%, rgba(138, 43, 226, 0.1) 40%, transparent 70%);
    z-index: 0;
    filter: blur(50px);
  }

  .glow-center-top {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(100, 40, 200, 0.25) 0%, transparent 70%);
    z-index: 0;
    filter: blur(30px);
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 60px 30px;
  }

  /* Title bar */
  .title-bar {
    width: 680px;
    height: 52px;
    border-radius: 8px;
    border: 1px solid rgba(100, 60, 180, 0.5);
    background: linear-gradient(180deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 45, 0.9) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .title-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(160, 80, 255, 0.5), transparent);
  }

  .title-bar h1 {
    font-size: 20px;
    font-weight: 900;
    color: #e8e0f8;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 22px;
    width: 100%;
    flex: 1;
  }

  /* Card */
  .card {
    border-radius: 12px;
    border: 1px solid rgba(100, 60, 180, 0.45);
    background: linear-gradient(135deg, rgba(20, 15, 50, 0.7) 0%, rgba(15, 12, 40, 0.85) 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0;
    backdrop-filter: blur(10px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.008) 2px,
      rgba(255,255,255,0.008) 3px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Card header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px 10px;
    background: linear-gradient(180deg, rgba(25, 15, 55, 0.9) 0%, rgba(20, 12, 45, 0.95) 100%);
    border-bottom: 1px solid rgba(100, 60, 180, 0.3);
    position: relative;
    z-index: 2;
    margin: 8px 8px 0;
    border-radius: 6px;
  }

  /* Icon circle */
  .icon-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #1a1040 0%, #0d0820 100%);
    border: 2px solid rgba(180, 80, 255, 0.7);
    box-shadow: 0 0 12px rgba(180, 80, 255, 0.4), inset 0 0 8px rgba(180, 80, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    position: relative;
  }

  .icon-circle::after {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border-radius: 50%;
    border: 1px solid rgba(180, 80, 255, 0.2);
  }

  .card-title {
    font-size: 16px;
    font-weight: 900;
    color: #f0e8ff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Card body */
  .card-body {
    flex: 1;
    padding: 10px 14px 8px;
    margin: 6px 8px 0;
    border: 1px solid rgba(100, 60, 180, 0.2);
    border-radius: 6px;
    background: rgba(15, 10, 35, 0.5);
    position: relative;
    z-index: 2;
  }

  .card-desc {
    font-size: 13px;
    color: rgba(180, 170, 210, 0.7);
    line-height: 1.8;
  }

  /* Placeholder lines to mimic the design's text lines */
  .desc-lines {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 2px;
  }

  .desc-line {
    height: 2px;
    background: rgba(120, 110, 160, 0.2);
    border-radius: 1px;
  }

  .desc-line:nth-child(1) { width: 100%; }
  .desc-line:nth-child(2) { width: 95%; }
  .desc-line:nth-child(3) { width: 88%; }
  .desc-line:nth-child(4) { width: 70%; }

  .desc-text {
    font-size: 13.5px;
    color: rgba(190, 180, 220, 0.65);
    line-height: 2;
    margin-bottom: 4px;
  }

  /* Tag button */
  .card-footer {
    padding: 6px 14px 12px;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .tag {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(220, 200, 255, 0.9);
    background: linear-gradient(135deg, rgba(160, 60, 220, 0.5) 0%, rgba(120, 40, 200, 0.4) 100%);
    border: 1px solid rgba(180, 80, 255, 0.35);
    letter-spacing: 1px;
  }

  /* Card inner border glow at top */
  .card-glow-line {
    position: absolute;
    top: 0;
    left: 20%;
    right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180, 80, 255, 0.5), transparent);
    z-index: 3;
  }

  /* Pink/magenta accent on card borders */
  .card-border-accent {
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 80, 180, 0.3), transparent);
    z-index: 3;
  }

  .card-left-accent {
    position: absolute;
    left: 0;
    top: 20%;
    bottom: 20%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(255, 80, 180, 0.25), transparent);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="glow-tl"></div>
    <div class="glow-tr"></div>
    <div class="glow-bl"></div>
    <div class="glow-br"></div>
    <div class="glow-center-top"></div>

    <div class="content">

      <div class="grid">

        <div class="card">

            <div class="icon-circle">🔄</div>
            <div class="card-title">워크플로우</div>

              <div class="desc-line"></div>

              <div class="desc-line"></div>
              <div class="desc-line"></div>
            </div>
          </div>
          <div class="card-footer">
            <div class="tag">Automation</div>
          </div>
        </div>

        <!-- Card 3: 문서 처리 -->
        <div class="card">
          <div class="card-glow-line"></div>
          <div class="card-border-accent"></div>
          <div class="card-left-accent"></div>
          <div class="card-header">
            <div class="icon-circle">📄</div>
            <div class="card-title">문서 처리</div>
          </div>
          <div class="card-body">
            <div class="desc-text">PDF/엑셀 자동 분석 및 요약</div>
            <div class="desc-lines">
              <div class="desc-line"></div>
              <div class="desc-line"></div>
              <div class="desc-line"></div>
              <div class="desc-line"></div>
            </div>
          </div>
          <div class="card-footer">
            <div class="tag">RAG</div>
          </div>
        </div>

        <!-- Card 4: 데이터 분석 -->
        <div class="card">
          <div class="card-glow-line"></div>
          <div class="card-border-accent"></div>
          <div class="card-left-accent"></div>
          <div class="card-header">
            <div class="icon-circle">📊</div>
            <div class="card-title">데이터 분석</div>
          </div>
          <div class="card-body">
            <div class="desc-text">자연어 SQL 변환 및 시각화</div>
            <div class="desc-lines">
              <div class="desc-line"></div>
              <div class="desc-line"></div>
              <div class="desc-line"></div>
              <div class="desc-line"></div>
            </div>
          </div>
          <div class="card-footer">
            <div class="tag">Analytics</div>
          </div>
        </div>

        <!-- Card 5: PPT 생성 -->
        <div class="card">
          <div class="card-glow-line"></div>
          <div class="card-border-accent"></div>
          <div class="card-left-accent"></div>
          <div class="card-header">
            <div class="icon-circle">🎨</div>
            <div class="card-title">PPT 생성</div>
          </div>
          <div class="card-body">
            <div class="desc-text">AI 기반 프레젠테이션 자동 생성</div>
            <div class="desc-lines">
              <div class="desc-line"></div>
              <div class="desc-line"></div>

          </div>
          <div class="card-footer">

        <!-- Card 6: API 연동 -->
        <div class="card">

      </div>
    </div>
  </div>
</body>
</html>

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_10_stats_hero" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><div class="design_10_stats_hero-bg"></div>

<style>
.design_10_stats_hero-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: linear-gradient(135deg, #0A0F33, #162247);
    overflow: hidden;
}

.design_10_stats_hero-bg::before {
    content: '';
    position: absolute;
    top: -50px;
    left: -50px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
    box-shadow: 0 0 60px 20px rgba(255, 255, 255, 0.2);
    pointer-events: none;
    z-index: 1;
}

.design_10_stats_hero-bg::after {
    content: '';
    position: absolute;
    top: 100px;
    left: 100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
    box-shadow: 0 0 50px 15px rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 1;
}

.glow-node {
    position: absolute;
    width: 150px;
    height: 150px;
    top: 15%;
    left: 20%;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.8), rgba(255, 215, 0, 0));
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
}
</style></div>
    <div style="position:absolute;left:75.0%;top:18.0%;width:20.0%;height:10.0%;z-index:10;">

<style>
.card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2), 0 4px 20px rgba(0, 0, 0, 0.3);
    overflow: hidden;
}

.card-1::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 16px;
}

.card-1::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
    border-radius: 16px;
}
</style>

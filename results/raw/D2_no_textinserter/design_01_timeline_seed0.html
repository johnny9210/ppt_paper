<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_01_timeline" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  body {
    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  .design_01_timeline-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.2) 10%, transparent 40%),
                radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.2) 10%, transparent 40%);
    backdrop-filter: blur(6px);
  }

  .timeline-line {
    position: absolute;
    top: 216px;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(to right, #00ffee, #a64deb, #00ffee);
    box-shadow: 0 0 15px #00ffee, 0 0 30px #a64deb;
  }

  .glow-node {
    position: absolute;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #00ffee 10%, #a64deb 60%);
    border-radius: 50%;
    box-shadow: 0 0 15px #00ffee, 0 0 30px #a64deb;
  }

  .glow-node:nth-child(1) { left: 153px; top: 196px; }
  .glow-node:nth-child(2) { left: 395px; top: 196px; }
  .glow-node:nth-child(3) { left: 640px; top: 196px; }
  .glow-node:nth-child(4) { left: 883px; top: 196px; }

  .grid {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(to right, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
    background-size: 40px 40px;
  }
</style>

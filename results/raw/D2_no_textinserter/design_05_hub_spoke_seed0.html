<!DOCTYPE html>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_05_hub_spoke" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  .design_05_hub_spoke-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: linear-gradient(135deg, #00071f, #001f3f);
    overflow: hidden;
  }

  .hub-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, rgba(54, 209, 220, 1) 0%, rgba(32, 16, 40, 0) 70%);
    border-radius: 50%;
    box-shadow: 0 0 25px 10px rgba(54, 209, 220, 0.7);
    transform: translate(-50%, -50%);
  }

  .connector {
    position: absolute;
    width: 10px;
    height: 200px;
    background: linear-gradient(to bottom, rgba(54, 209, 220, 0.7), rgba(32, 16, 40, 0));
    box-shadow: 0 0 15px rgba(54, 209, 220, 0.7), 0 0 30px rgba(54, 209, 220, 0.3);
  }

  .connector-top-left {
    top: 25%;
    left: 35%;
    transform-origin: top;
    transform: translateY(-50%) rotate(135deg);
  }

  .connector-top-right {
    top: 25%;
    left: 65%;
    transform-origin: top;
    transform: translateY(-50%) rotate(45deg);
  }

  .connector-bottom-left {
    top: 75%;
    left: 35%;
    transform-origin: top;
    transform: translateY(-50%) rotate(225deg);
  }

  .connector-bottom-right {
    top: 75%;
    left: 65%;
    transform-origin: top;
    transform: translateY(-50%) rotate(315deg);
  }
</style>

<div class="design_05_hub_spoke-bg">
  <div class="hub-circle"></div>
  <div class="connector connector-top-left"></div>
  <div class="connector connector-top-right"></div>
  <div class="connector connector-bottom-left"></div>
  <div class="connector connector-bottom-right"></div>
</div></div>

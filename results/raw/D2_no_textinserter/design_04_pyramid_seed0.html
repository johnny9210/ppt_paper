    content: '';

    width: 400px;

  .design_04_pyramid-bg::after {
    width: 300px;
    height: 300px;
    bottom: -50px;
    right: -50px;

    position: absolute;
    height: 2px;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));

<!DOCTYPE html>

<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container chat_v3_chart" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">

  .card-icon, .card-value, .card-label,
  .hero-1, .hero-2, .hero-value, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }

  .chat_v3_chart-bg-base {

    z-index: 0;
    background: linear-gradient(135deg, #021027 0%, #083045 100%);

</style>

<div class="chat_v3_chart-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">

      <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#38859F" stroke-width="0.6" fill="none" opacity="0.18"/>
      <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#38859F" stroke-width="0.6" fill="none" opacity="0.18"/>

      <circle cx="50" cy="30" r="1.5" fill="#38859F" opacity="0.18"/>
      <circle cx="75" cy="55" r="1.5" fill="#38859F" opacity="0.18"/>

  </defs>
  <rect width="100%" height="100%" fill="url(#p-circuit)"/>
</svg></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"><style>
  .chat_v3_chart-atmos {

  }
</style>
<div class="chat_v3_chart-atmos"></div></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>

    position: absolute;

    width: 5rem;
    height: 5rem;
    border-radius: 50%;
    background: rgba(190, 217, 223, 0.5);
    box-shadow: 0 0 15px #38859F, 0 0 30px #38859F, 0 0 45px #38859F;
  }

  .node1 {
    top: 10%;
    left: 5%;
  }

  .node2 {
    top: 10%;
    left: 35%;
  }

  .node3 {
    top: 10%;
    left: 65%;
  }
</style>

  <div class="glow_node node3"></div>
</div></div>

    line-height: 1.3;
  }

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(4, 37, 63, 0.8);

    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);

  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;

    white-space: nowrap;
    hyphens: none;

  }

    content: '';

    top: 0;
    left: 50%;
    width: 100%;
    height: 200px;
    background: radial-gradient(circle, rgba(56, 133, 159, 0.8) 0%, transparent 70%);
    transform: translateX(-50%);
    z-index: 1;
  }
  .chat_demo_dashboard-bg-base::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50px;
    background: rgba(62, 159, 191, 0.3);
    z-index: 1;
  }

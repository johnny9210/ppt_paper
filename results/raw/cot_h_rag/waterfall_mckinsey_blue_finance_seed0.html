<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f9f9f9;
  }

  .title {
    font-size: 24px;
    margin-bottom: 10px;
  }

  .description {
    font-size: 18px;
    margin-bottom: 30px;
    color: #555;
  }

  .metrics-container {
    display: flex;
    justify-content: space-around;
    width: 100%;
  }

  .metric {
    text-align: center;
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #017acd;
    color: white;
    margin: 0 auto 10px;
  }

  .metric-title {
    font-size: 16px;
    margin-bottom: 5px;
  }

  .metric-value {
    font-size: 18px;
  }
</style>

<div class="title">Operating margin expanded 320 bps driven primarily by COGS reduction</div>
<div class="description">FY2024 → FY2025 margin bridge</div>

<div class="metrics-container">
  <div class="metric">
    <div class="icon-badge">🔁</div>
    <div class="metric-title">COGS reduction</div>
    <div class="metric-value">+180 bps</div>
  </div>

  <div class="metric">
    <div class="icon-badge">🔁</div>
    <div class="metric-title">Pricing power</div>
    <div class="metric-value">+90 bps</div>
  </div>

  <div class="metric">
    <div class="icon-badge">🔁</div>
    <div class="metric-title">SG&A increase</div>
    <div class="metric-value">-40 bps</div>
  </div>

  <div class="metric">
    <div class="icon-badge">🔁</div>
    <div class="metric-title">Mix shift</div>
    <div class="metric-value">+90 bps</div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    width: 1280px;
    height: 720px;
    margin: 0;
    padding: 20px;
  }
  .title {
    font-size: 32px;
    font-weight: bold;
    color: #990000;
  }
  .description {
    font-size: 20px;
    margin-top: 10px;
  }
  .chart {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
  }
  .bar-container {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  .bar {
    height: 20px;
    background: #990000;
    border-radius: 5px;
  }
  .bar-label {
    width: 100px;
  }
  .bar-value {
    margin-left: 10px;
  }
  .icon-badge-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #990000;
    color: white;
    font-weight: bold;
    margin-left: 20px;
  }
</style>

<div>
  <div class="title">3 cost categories represent 78% of total addressable savings</div>
  <div class="description">Savings opportunity by cost category</div>
  <div class="chart">
    <div class="bar-container">
      <div class="bar-label">Procurement</div>
      <div class="bar" style="width: 320px;"></div>
      <div class="bar-value">$320M</div>
      <div class="icon-badge-circle">100%</div>
    </div>
    <div class="bar-container">
      <div class="bar-label">Workforce</div>
      <div class="bar" style="width: 250px;"></div>
      <div class="bar-value">$250M</div>
      <div class="icon-badge-circle">87%</div>
    </div>
    <div class="bar-container">
      <div class="bar-label">Tech</div>
      <div class="bar" style="width: 180px;"></div>
      <div class="bar-value">$180M</div>
      <div class="icon-badge-circle">78%</div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="background: linear-gradient(135deg, #00202a, #0f3d4b); width: 1280px; height: 720px; position: relative; overflow: hidden; background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
  <div style="position: relative; padding: 20px; text-align: center; color: #fff;">
    <h1 style="color: #00f5ff;">Q4 2025 비즈니스 성과 대시보드</h1>
    
    <div style="display: flex; justify-content: space-around; margin-top: 50px;">
      <div style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 250px; height: 200px; box-shadow: 0 0 20px rgba(0,245,255,0.3), 0 0 60px rgba(0,245,255,0.1); position: relative;">
        <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 10px auto;">
          <span style="font-size: 24px;">💰</span>
        </div>
        <div style="color: #00f5ff; font-size: 32px;">₩128억</div>
        <div style="color: #0f3d4b; font-size: 16px;">+23% YoY</div>
      </div>
      
      <div style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 250px; height: 200px; box-shadow: 0 0 20px rgba(0,245,255,0.3), 0 0 60px rgba(0,245,255,0.1); position: relative;">
        <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 10px auto;">
          <span style="font-size: 24px;">👥</span>
        </div>
        <div style="color: #00f5ff; font-size: 32px;">2.4M</div>
        <div style="color: #0f3d4b; font-size: 16px;">+15% MoM</div>
      </div>
      
      <div style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 250px; height: 200px; box-shadow: 0 0 20px rgba(0,245,255,0.3), 0 0 60px rgba(0,245,255,0.1); position: relative;">
        <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 10px auto;">
          <span style="font-size: 24px;">⭐</span>
        </div>
        <div style="color: #00f5ff; font-size: 32px;">4.7/5.0</div>
        <div style="color: #0f3d4b; font-size: 16px;">+0.3</div>
      </div>
    </div>
    
    <div style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;">
      <h2 style="color: #00f5ff;">월별 매출 추이</h2>
      <div style="position:absolute;bottom:0;left:0;width:100%;height:6px;background:#00f5ff;"></div>
    </div>
  </div>
</div></div>
</body></html>

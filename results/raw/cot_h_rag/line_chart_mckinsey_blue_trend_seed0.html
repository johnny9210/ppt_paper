<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f4f4f4;
  }

  .title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .description {
    font-size: 18px;
    margin-bottom: 20px;
  }

  .chart-container {
    width: 90%;
    height: 50%;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #ddd;
  }

  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #ddd;
    position: absolute;
    top: 50px;
    right: 50px;
  }
</style>

<div class="container">
  <div class="title">Monthly active users tripled from 1.2M to 3.6M over 24 months</div>
  <div class="description">MAU trajectory, Jan 2024 - Dec 2025</div>
  <div class="chart-container">
    <!-- Placeholder for chart -->
    <img src="https://via.placeholder.com/800x400.png?text=Chart" alt="Chart Image">
  </div>
  <div class="icon-badge">📈</div>
</div></div>
</body></html>

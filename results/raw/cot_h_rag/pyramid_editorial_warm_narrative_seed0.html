<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="width: 1280px; height: 720px; background: linear-gradient(to top, #e6b092, #f8e4d9); padding: 40px; box-sizing: border-box; font-family: Arial, sans-serif; color: #ba5a30;">
    <h1 style="text-align: center; margin-bottom: 20px;">Brand story rests on three values: craftsmanship, trust, and continuity</h1>
    <h2 style="text-align: center; margin-bottom: 40px;">Brand pyramid</h2>
    <div style="width: 50%; margin: 0 auto; padding: 40px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); border-radius: 16px; background-color: #ffffff;">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; background-color: #f0a376; color: #ffffff; font-size: 14px;">
                Timeless craftsmanship
            </div>
        </div>
        <div style="display: flex; justify-content: space-around;">
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #cc7a46; color: #ffffff; margin-bottom: 10px;">⚒️</div>
                <div>Craftsmanship</div>
            </div>
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #cc7a46; color: #ffffff; margin-bottom: 10px;">🔍</div>
                <div>Trust</div>
            </div>
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #cc7a46; color: #ffffff; margin-bottom: 10px;">♾️</div>
                <div>Continuity</div>
            </div>
        </div>
    </div>
</div></div>
</body></html>

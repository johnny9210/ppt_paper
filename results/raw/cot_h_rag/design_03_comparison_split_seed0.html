<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    background: linear-gradient(to right, blue , purple);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .comparison-container {
    display: flex;
    position: relative;
    width: 80%;
  }
  .card {
    flex: 1;
    margin: 0 20px;
    backdrop-filter: blur(12px); 
    background: rgba(255,255,255,0.08); 
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 16px;
    padding: 20px;
    color: white;
  }
  .card-shadow {
    box-shadow: 0 4px 24px rgba(0,0,0,0.12); 
    border-radius: 16px;
  }
  .card h3 {
    text-align: center;
  }
  .item {
    margin: 10px 0;
    display: flex;
    align-items: center;
  }
  .icon {
    width: 48px; 
    height: 48px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    margin-right: 10px;
  }
  .icon.left {
    background: radial-gradient(circle, rgba(0,151,255,0.15), transparent 70%); 
    filter: blur(60px);
  }
  .icon.right {
    background: radial-gradient(circle, rgba(191,64,191,0.15), transparent 70%); 
    filter: blur(60px);
  }
  .neon-glow {
    box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1);
  }
  .vs-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="comparison-container">
    <div class="card card-shadow">
      <h3>온프레미스</h3>
      <div class="item">
        <div class="icon left neon-glow">⚙️</div>
        초기 투자비용 높음
      </div>
      <div class="item">
        <div class="icon left neon-glow">☁️</div>
        확장에 수주~수개월 소요
      </div>
      <div class="item">
        <div class="icon left neon-glow">🔒</div>
        보안 직접 관리 필요
      </div>
      <div class="item">
        <div class="icon left neon-glow">🔍</div>
        유지보수 인력 상시 필요
      </div>
    </div>
    <div class="vs-circle">VS</div>
    <div class="card card-shadow">
      <h3>클라우드 네이티브</h3>
      <div class="item">
        <div class="icon right neon-glow">⚡</div>
        사용량 기반 과금
      </div>
      <div class="item">
        <div class="icon right neon-glow">🖥️</div>
        분 단위 자동 스케일링
      </div>
      <div class="item">
        <div class="icon right neon-glow">🔐</div>
        관리형 보안 서비스
      </div>
      <div class="item">
        <div class="icon right neon-glow">🎯</div>
        인프라 자동화로 인력 절감
      </div>
    </div>
  </div>
</body>
</html></div>
</body></html>

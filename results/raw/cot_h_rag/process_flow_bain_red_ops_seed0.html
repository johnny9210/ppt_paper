<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="width: 1280px; height: 720px; font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; color: #333;">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 24px; margin: 0;">Optimized order-to-cash cycle compresses to 4.2 days from 9.1</h1>
        <p style="font-size: 16px; color: #777;">O2C process redesign</p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="background-color: #ccc; padding: 10px; width: 150px; text-align: center;">
            <p style="margin: 0;">Order</p>
            <p style="margin: 0;">1.0 day</p>
        </div>
        <div style="background-color: #d9534f; padding: 10px; width: 150px; text-align: center;">
            <p style="margin: 0;">Validate</p>
            <p style="margin: 0; color: #fff;">0.4 days</p>
            <p style="margin: 0; color: #fff;">↓ (-50%)</p>
        </div>
        <div style="background-color: #d9534f; padding: 10px; width: 150px; text-align: center;">
            <p style="margin: 0;">Pack</p>
            <p style="margin: 0; color: #fff;">1.2 days</p>
            <p style="margin: 0; color: #fff;">↓ (-67%)</p>
        </div>
        <div style="background-color: #ccc; padding: 10px; width: 150px; text-align: center;">
            <p style="margin: 0;">Ship</p>
            <p style="margin: 0;">1.0 day</p>
        </div>
        <div style="background-color: #d9534f; padding: 10px; width: 150px; text-align: center;">
            <p style="margin: 0;">Invoice</p>
            <p style="margin: 0; color: #fff;">0.6 days</p>
            <p style="margin: 0; color: #fff;">↓ (-40%)</p>
        </div>
    </div>
    <div style="margin-top: 20px; text-align: center;">
        <div style="display: inline-block; padding: 20px; background-color: #d43f3a; color: #fff;">
            <p style="margin: 0;">↓ -4.9 days (-54%)</p>
            <p style="margin: 0; font-size: 24px;">4.2 days</p>
            <p style="margin: 0;">(was 9.1)</p>
        </div>
    </div>
</div></div>
</body></html>

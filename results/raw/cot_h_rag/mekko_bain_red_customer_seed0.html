<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
  }
  .container {
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 1280px;
    margin: auto;
    padding: 20px;
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #555;
    margin-bottom: 20px;
  }
  .metrics {
    display: flex;
    justify-content: space-around;
    width: 100%;
    margin-bottom: 40px;
  }
  .metric {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .metric span {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f2f2f2;
    margin-right: 10px;
    font-size: 24px;
  }
  .metric-detail {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .chart {
    max-width: 800px;
    width: 100%;
    border: 1px solid #ddd;
    background-color: #f9f9f9;
    padding: 20px;
  }
  .chart-title {
    font-size: 20px;
    margin-bottom: 15px;
  }
</style>

<div class="container">
  <div class="title">Tier-1 customers contribute 64% of revenue from only 18% of accounts</div>
  <div class="description">Account count × revenue contribution by customer tier</div>
  <div class="metrics">
    <div class="metric">
      <span>📐</span>
      <div class="metric-detail">
        <div>Tier-1</div>
        <div>18%</div>
      </div>
    </div>
    <div class="metric">
      <span>📐</span>
      <div class="metric-detail">
        <div>Tier-2</div>
        <div>35%</div>
      </div>
    </div>
    <div class="metric">
      <span>📐</span>
      <div class="metric-detail">
        <div>Tier-3</div>
        <div>47%</div>
      </div>
    </div>
  </div>
  <div class="chart">
    <div class="chart-title">Account count × revenue contribution by customer tier</div>
  </div>
</div></div>
</body></html>

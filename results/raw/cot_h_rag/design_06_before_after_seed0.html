<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="background: linear-gradient(to right, red, blue); width: 1280px; height: 720px; display: flex; align-items: center; justify-content: center; position: relative;">
  <div style="position: absolute; width: 600px; height: 720px; display: flex; justify-content: space-between;">
    <div style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 280px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); padding: 20px;">
      <h2 style="text-align: center; color: #ffcccc;">도입 전</h2>
      <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">📝</span>
          <div>
            <p>수작업 보고서 작성</p>
            <p>주 8시간 소요</p>
          </div>
        </div>
      </div>
      <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">🔍</span>
          <div>
            <p>수동 데이터 검색</p>
            <p>건당 30분</p>
          </div>
        </div>
      </div>
      <div>
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">📞</span>
          <div>
            <p>전화/이메일 응대</p>
            <p>평균 응답 4시간</p>
          </div>
        </div>
      </div>
    </div>
    <div style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 280px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); padding: 20px;">
      <h2 style="text-align: center; color: #ccffcc;">도입 후</h2>
      <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">🤖</span>
          <div>
            <p>자동 보고서 생성</p>
            <p>주 30분으로 단축</p>
          </div>
        </div>
      </div>
      <div style="margin-bottom: 20px;">
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">⚡</span>
          <div>
            <p>RAG 기반 즉시 검색</p>
            <p>건당 5초</p>
          </div>
        </div>
      </div>
      <div>
        <div style="display: flex; align-items: center;">
          <span style="font-size: 30px; margin-right: 10px;">💬</span>
          <div>
            <p>AI 챗봇 자동 응대</p>
            <p>평균 응답 10초</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="position: absolute; box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1); height: 100px; width: 200px; background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%); filter: blur(60px); display: flex; align-items: center; justify-content: center;">
    <div style="width: 0; height: 0; border-top: 50px solid transparent; border-bottom: 50px solid transparent; border-left: 100px solid white;"></div>
  </div>
</div></div>
</body></html>

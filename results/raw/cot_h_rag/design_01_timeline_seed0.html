<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    background: linear-gradient(90deg, blue, purple);
    font-family: 'Arial', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 720px;
    margin: 0;
  }
  .cards-container {
    display: flex;
    gap: 16px;
  }
  .card {
    width: 200px;
    height: 300px;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,255,255,0.3), 0 0 60px rgba(0,255,255,0.1);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .icon-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(128,0,255,0.15), transparent 70%);
    filter: blur(60px);
    margin-bottom: 16px;
  }
  .icon-badge span {
    font-size: 24px;
  }
  h1 {
    margin-bottom: 32px;
  }
</style>

<div>
  <h1>디지털 전환 로드맵 2025</h1>
  <div class="cards-container">
    <div class="card">
      <div class="icon-badge"><span>📊</span></div>
      <h2>현황 진단</h2>
      <p>레거시 시스템 분석 및 디지털 성숙도 평가</p>
    </div>
    <div class="card">
      <div class="icon-badge"><span>🏗️</span></div>
      <h2>기반 구축</h2>
      <p>클라우드 마이그레이션 및 API 플랫폼 설계</p>
    </div>
    <div class="card">
      <div class="icon-badge"><span>🔄</span></div>
      <h2>프로세스 혁신</h2>
      <p>업무 자동화 및 데이터 기반 의사결정 체계 도입</p>
    </div>
    <div class="card">
      <div class="icon-badge"><span>🚀</span></div>
      <h2>스케일업</h2>
      <p>AI/ML 적용 확대 및 전사 디지털 문화 정착</p>
    </div>
  </div>
</div></div>
</body></html>

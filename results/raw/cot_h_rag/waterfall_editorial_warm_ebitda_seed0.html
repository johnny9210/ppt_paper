<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
    body {
      font-family: serif;
      background-color: #f9f6ef;
      width: 1280px;
      height: 720px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .header {
      color: #333;
    }
    .subheader {
      color: #8c7b61;
      margin-bottom: 20px;
    }
    .chart {
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .bar {
      margin: 0 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bar-volume, .bar-price, .bar-mix {
      background: linear-gradient(to top, #d94f2a, #e97b53);
      height: 60px;
      width: 30px;
    }
    .bar-inflation {
      background: linear-gradient(to top, #e3ad25, #f2c94c);
      height: 40px;
      width: 30px;
    }
    .bar-opex {
      background: linear-gradient(to top, #a8a8a8, #d5d5d5);
      height: 20px;
      width: 30px;
    }
    .label {
      margin-top: 10px;
      color: #000;
    }
    .total {
      background: linear-gradient(to top, #7d7d7d, #b1b1b1);
      height: 100px;
      width: 60px;
      margin: 0 20px;
    }
  </style>
</head>
<body>
  <div class="header">EBITDA bridge reveals 11% YoY uplift from operational excellence</div>
  <div class="subheader">EBITDA $128M → $142M decomposition</div>
  <div class="chart">
    <div class="bar">
      <div class="total"></div>
      <div class="label">$128M</div>
    </div>
    <div class="bar">
      <div class="bar-volume"></div>
      <div class="label">+ $8M</div>
    </div>
    <div class="bar">
      <div class="bar-price"></div>
      <div class="label">+ $11M</div>
    </div>
    <div class="bar">
      <div class="bar-inflation"></div>
      <div class="label">- $6M</div>
    </div>
    <div class="bar">
      <div class="bar-mix"></div>
      <div class="label">+ $3M</div>
    </div>
    <div class="bar">
      <div class="bar-opex"></div>
      <div class="label">- $2M</div>
    </div>
    <div class="bar">
      <div class="total"></div>
      <div class="label">$142M</div>
    </div>
  </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(0deg, #F8F4ED, #E8E2D4);
  }
  .chart-container {
    width: 1280px;
    height: 720px;
    padding: 20px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    border-radius: 16px;
    position: relative;
  }
  .title {
    font-size: 36px;
    margin-bottom: 10px;
  }
  .chart-title {
    font-size: 18px;
    color: #555;
  }
  .neon-text {
    display: inline-block;
    padding: 8px 16px;
    color: white;
    background-color: #C5531B;
    box-shadow: 0 0 20px rgba(197, 83, 27, 0.3), 0 0 60px rgba(197, 83, 27, 0.1);
    border-radius: 8px;
    position: absolute;
    top: 50%;
    left: 60%;
    transform: translate(-50%, -50%);
  }
  .dot-pattern {
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    height: 50%;
    width: 100%;
    position: absolute;
    top: 30%;
  }
</style>

<div class="chart-container">
  <div class="title">Newsletter subscribers reached 1.4M, growing 8% MoM</div>
  <div class="chart-title">Subscriber count, last 18 months</div>
  <div class="dot-pattern"></div>
  <div class="neon-text">1.4M Subscribers, +8% MoM Growth</div>
</div></div>
</body></html>

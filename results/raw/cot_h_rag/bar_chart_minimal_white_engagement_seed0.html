<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .title {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 20px;
            color: #555;
        }

        .metrics {
            display: flex;
            justify-content: space-between;
        }

        .metric {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eeeeee;
        }

        .chart-title {
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Engagement dropped 22% on weekends across the user base</div>
        <div class="description">Daily active users by day-of-week</div>
        <div class="metrics">
            <div class="metric" title="Mon: 85K">📊</div>
            <div class="metric" title="Tue: 85K">📊</div>
            <div class="metric" title="Wed: 85K">📊</div>
            <div class="metric" title="Thu: 85K">📊</div>
            <div class="metric" title="Fri: 85K">📊</div>
            <div class="metric" title="Sat: 66K">📊</div>
        </div>
        <div class="chart-title">Daily active users by day-of-week</div>
    </div>
</body>
</html></div>
</body></html>

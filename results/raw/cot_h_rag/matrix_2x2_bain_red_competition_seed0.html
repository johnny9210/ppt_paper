<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 720px;
            margin: 0;
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            width: 80%;
        }
        .title {
            font-size: 24px;
            color: red;
            margin-bottom: 10px;
        }
        .description {
            font-size: 18px;
            color: gray;
            margin-bottom: 20px;
        }
        .chart {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            justify-items: center;
            align-items: center;
        }
        .icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: gray;
        }
        .icon.large {
            width: 80px;
            height: 80px;
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Vendor B owns the High-Capability / High-Stability sweet spot</div>
        <div class="description">Competitive landscape map</div>
        <div class="chart">
            <div class="icon large">B</div>
            <div class="icon">A</div>
            <div class="icon">E</div>
            <div class="icon">C</div>
            <div class="icon">D</div>
            <div class="icon">F</div>
        </div>
    </div>
</body>
</html></div>
</body></html>

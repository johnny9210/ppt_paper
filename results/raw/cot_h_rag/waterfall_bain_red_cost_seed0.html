<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="width: 1280px; height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Arial, sans-serif;">
  <div style="font-size: 28px; color: darkred; margin-bottom: 5px;">
    $120M cost reduction unlocks 4-pp margin gain by year 2
  </div>
  <div style="font-size: 18px; color: lightgrey; margin-bottom: 20px;">
    Cost-out program contribution
  </div>
  <div style="display: flex; align-items: center; justify-content: space-evenly; width: 100%; margin-bottom: 20px;">
    <div style="text-align: center;">
      <div style="width: 96px; height: 200px; background-color: gray; display: flex; align-items: center; justify-content: center; color: white;">
        $820M
      </div>
      <div>Start</div>
    </div>
    <div style="text-align: center;">
      <div style="width: 96px; height: 150px; background-color: red; display: flex; align-items: center; justify-content: center; color: white;">
        $45M
      </div>
      <div>-Procurement (-$45M)</div>
    </div>
    <div style="text-align: center;">
      <div style="width: 96px; height: 110px; background-color: red; display: flex; align-items: center; justify-content: center; color: white;">
        $40M
      </div>
      <div>-Headcount (-$40M)</div>
    </div>
    <div style="text-align: center;">
      <div style="width: 96px; height: 90px; background-color: red; display: flex; align-items: center; justify-content: center; color: white;">
        $25M
      </div>
      <div>-Tech consolidation (-$25M)</div>
    </div>
    <div style="text-align: center;">
      <div style="width: 96px; height: 80px; background-color: red; display: flex; align-items: center; justify-content: center; color: white;">
        $10M
      </div>
      <div>-Real estate (-$10M)</div>
    </div>
    <div style="text-align: center;">
      <div style="width: 96px; height: 200px; background-color: gray; display: flex; align-items: center; justify-content: center; color: white;">
        $700M
      </div>
      <div>End</div>
    </div>
  </div>
  <div style="font-size: 16px; color: darkred; margin-top: 20px;">
    Total Reduction: $120M
  </div>
  <div style="font-size: 14px; color: grey; position: absolute; bottom: 10px; right: 10px;">
    Source: Operations review, 2025
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #0A0A23, #2C2C54);
  }
  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1280px;
  }
  .card {
    position: relative;
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    padding: 20px;
  }
  .card:before {
    content: '';
    position: absolute;
    top: -10%;
    left: -10%;
    right: -10%;
    bottom: -10%;
    background: radial-gradient(circle, rgba(119, 51, 255, 0.15), transparent 70%);
    filter: blur(60px);
    z-index: -1;
  }
  .icon {
    background: #ff00ff;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    margin-bottom: 10px;
    box-shadow: 0 0 20px rgba(255, 0, 255, 0.3), 0 0 60px rgba(255, 0, 255, 0.1);
  }
  h2 {
    margin: 0;
    font-size: 16px;
    color: #fff;
  }
  p {
    margin: 10px 0 0;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">💬</div>
      <h2>AI 채팅</h2>
      <p>멀티턴 대화형 AI 어시스턴트</p>
    </div>
    <div class="card">
      <div class="icon">🔄</div>
      <h2>워크플로우</h2>
      <p>노코드 업무 자동화 빌더</p>
    </div>
    <div class="card">
      <div class="icon">📄</div>
      <h2>문서 처리</h2>
      <p>PDF/엑셀 자동 분석 및 요약</p>
    </div>
    <div class="card">
      <div class="icon">📊</div>
      <h2>데이터 분석</h2>
      <p>자연어 SQL 변환 및 시각화</p>
    </div>
    <div class="card">
      <div class="icon">🎨</div>
      <h2>PPT 생성</h2>
      <p>AI 기반 프레젠테이션 자동 생성</p>
    </div>
    <div class="card">
      <div class="icon">🔗</div>
      <h2>API 연동</h2>
      <p>외부 시스템 MCP 연결</p>
    </div>
  </div>
</body>
</html></div>
</body></html>

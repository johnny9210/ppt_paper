<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:relative; width:1280px; height:720px; background:linear-gradient(to right, #0d1b2a, #1b263b); overflow:hidden; z-index:0;">
  <div style="position:absolute; width:100%; height:100%; background:radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 60%); z-index:2; pointer-events:none;"></div>
  
  <!-- Decorative Split Line -->
  <div style="position:absolute; left:50%; top:0; width:2px; height:100%; background:linear-gradient(to bottom, #00d4ff, #ff00ff); z-index:5;"></div>
  
  <!-- Panels -->
  <div style="position:absolute; top:50px; left:50px; width:540px; height:500px; backdrop-filter:blur(10px); background:rgba(13, 27, 42, 0.5); border-radius:15px; border:1px solid rgba(255,255,255,0.2); z-index:10; box-shadow:0 0 20px rgba(0,212,255,0.5);">
    <div style="position:absolute; width:100%; height:50px; background:linear-gradient(to right, #00d4ff, #07a0c3); border-radius:15px 15px 0 0;">
      <div style="position:absolute; left:20px; top:10px; color:white; font-size:20px; z-index:20;">온프레미스</div>
    </div>
    <div style="position:absolute; top:70px; left:20px; color:white; font-size:18px; z-index:20; line-height:1.5;">
      <div>초기 투자비용 높음</div>
      <div>확장에 수주~수개월 소요</div>
      <div>보안 직접 관리 필요</div>
      <div>유지보수 인력 상시 필요</div>
    </div>
  </div>

  <div style="position:absolute; top:50px; right:50px; width:540px; height:500px; backdrop-filter:blur(10px); background:rgba(27, 38, 59, 0.5); border-radius:15px; border:1px solid rgba(255,255,255,0.2); z-index:10; box-shadow:0 0 20px rgba(255,0,255,0.5);">
    <div style="position:absolute; width:100%; height:50px; background:linear-gradient(to right, #ff00ff, #7a00ff); border-radius:15px 15px 0 0;">
      <div style="position:absolute; left:20px; top:10px; color:white; font-size:20px; z-index:20;">클라우드 네이티브</div>
    </div>
    <div style="position:absolute; top:70px; left:20px; color:white; font-size:18px; z-index:20; line-height:1.5;">
      <div>사용량 기반 과금</div>
      <div>분 단위 자동 스케일링</div>
      <div>관리형 보안 서비스</div>
      <div>인프라 자동화로 인력 절감</div>
    </div>
  </div>

  <!-- VS Badge -->
  <div style="position:absolute; left:calc(50% - 50px); top:calc(50% - 50px); width:100px; height:100px; background:linear-gradient(to bottom, #00d4ff, #ff00ff); border-radius:50%; z-index:30; box-shadow:0 0 20px rgba(255,255,255,0.8);">
    <div style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); color:white; font-size:24px; font-weight:bold;">VS</div>
  </div>
</div></div>
</body></html>

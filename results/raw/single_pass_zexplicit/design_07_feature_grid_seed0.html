<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #1e003c, #1c0030);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .atmosphere {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 2;
    background: radial-gradient(circle at top left, rgba(233, 30, 99, 0.3), transparent 200px);
  }

  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 20px;
    z-index: 10;
    position: relative;
  }

  .card {
    backdrop-filter: blur(5px);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    padding: 20px;
    width: 300px;
    height: 150px;
    position: relative;
  }

  .icon-badge {
    position: absolute;
    top: -15px;
    left: -15px;
    background: linear-gradient(135deg, #e91e63, #ff4081);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 30;
  }

  .content {
    position: relative;
    z-index: 20;
  }

  .title {
    font-size: 18px;
    color: white;
    margin-bottom: 10px;
  }

  .description {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
  }

  .tag {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: #9c27b0;
    color: white;
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 12px;
    z-index: 30;
  }
</style>
<div class="atmosphere"></div>
<div class="container">
  <div class="card">
    <div class="icon-badge">💬</div>
    <div class="content">
      <div class="title">AI 채팅</div>
      <div class="description">멀티턴 대화형 AI 어시스턴트</div>
    </div>
    <div class="tag">Core</div>
  </div>
  <div class="card">
    <div class="icon-badge">🔄</div>
    <div class="content">
      <div class="title">워크플로우</div>
      <div class="description">노코드 업무 자동화 빌더</div>
    </div>
    <div class="tag">Automation</div>
  </div>
  <div class="card">
    <div class="icon-badge">📄</div>
    <div class="content">
      <div class="title">문서 처리</div>
      <div class="description">PDF/엑셀 자동 분석 및 요약</div>
    </div>
    <div class="tag">RAG</div>
  </div>
  <div class="card">
    <div class="icon-badge">📊</div>
    <div class="content">
      <div class="title">데이터 분석</div>
      <div class="description">자연어 SQL 변환 및 시각화</div>
    </div>
    <div class="tag">Analytics</div>
  </div>
  <div class="card">
    <div class="icon-badge">🎨</div>
    <div class="content">
      <div class="title">PPT 생성</div>
      <div class="description">AI 기반 프레젠테이션 자동 생성</div>
    </div>
    <div class="tag">Creative</div>
  </div>
  <div class="card">
    <div class="icon-badge">🔗</div>
    <div class="content">
      <div class="title">API 연동</div>
      <div class="description">외부 시스템 MCP 연결</div>
    </div>
    <div class="tag">Integration</div>
  </div>
</div></div>
</body></html>

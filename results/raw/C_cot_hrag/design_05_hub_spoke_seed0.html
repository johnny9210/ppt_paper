<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(circle, rgba(0, 255, 255, 0.15), #0F172A);
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .container {
    position: relative;
    width: 1280px;
    height: 720px;
  }

  .ambient-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 255, 0.15), transparent 70%);
    filter: blur(60px);
    top: calc(50% - 150px);
    left: calc(50% - 150px);
    z-index: 1;
  }

  .hub {
    position: absolute;
    top: calc(50% - 60px);
    left: calc(50% - 60px);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.1);
    z-index: 2;
  }

  .hub i {
    color: #fff;
    font-size: 40px;
  }

  .hub-title {
    color: #fff;
    text-align: center;
    font-size: 16px;
  }

  .spoke {
    position: absolute;
    width: 200px;
    height: 80px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.1);
    z-index: 2;
  }

  .spoke i {
    color: #fff;
    font-size: 24px;
    margin-right: 10px;
  }

  .spoke-title {
    color: #fff;
    font-size: 14px;
  }

  .spoke-desc {
    color: #fff;
    font-size: 12px;
  }

  .line {
    position: absolute;
    width: 200px;
    height: 4px;
    border-radius: 2px;
    background: #00FFFF;
    z-index: -1;
  }

  .spoke:nth-child(1) { top: 50px; left: 50px; }
  .spoke:nth-child(2) { top: 50px; right: 50px; }
  .spoke:nth-child(3) { bottom: 50px; left: 50px; }
  .spoke:nth-child(4) { bottom: 50px; right: 50px; }
  .spoke:nth-child(5) { top: 320px; left: 50px; }
  .spoke:nth-child(6) { bottom: 320px; right: 50px; }

  .line:nth-child(7) { top: 110px; left: 140px; }
  .line:nth-child(8) { top: 110px; right: 140px; }
  .line:nth-child(9) { bottom: 110px; left: 140px; }
  .line:nth-child(10) { bottom: 110px; right: 140px; }
  .line:nth-child(11) { top: 380px; left: 140px; }
  .line:nth-child(12) { bottom: 380px; right: 140px; }
</style>

<div class="container">
  <div class="ambient-glow"></div>
  <div class="hub">
    <i>🌐</i>
  </div>
  <div class="spoke">
    <i>☁️</i>
    <div>
      <div class="spoke-title">클라우드 스토리지</div>
      <div class="spoke-desc">S3, MinIO 기반 객체 저장소</div>
    </div>
  </div>
  <div class="spoke">
    <i>📡</i>
    <div>
      <div class="spoke-title">실시간 스트리밍</div>
      <div class="spoke-desc">Kafka 이벤트 브로커</div>
    </div>
  </div>
  <div class="spoke">
    <i>🗄️</i>
    <div>
      <div class="spoke-title">데이터베이스</div>
      <div class="spoke-desc">PostgreSQL + MongoDB</div>
    </div>
  </div>
  <div class="spoke">
    <i>🔒</i>
    <div>
      <div class="spoke-title">인증/보안</div>
      <div class="spoke-desc">OAuth2 + JWT 토큰</div>
    </div>
  </div>
  <div class="spoke">
    <i>🤖</i>
    <div>
      <div class="spoke-title">AI 서비스</div>
      <div class="spoke-desc">LLM 추론 엔진</div>
    </div>
  </div>
  <div class="spoke">
    <i>🌍</i>
    <div>
      <div class="spoke-title">CDN/Edge</div>
      <div class="spoke-desc">글로벌 콘텐츠 배포</div>
    </div>
  </div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</div></div>
</body></html>

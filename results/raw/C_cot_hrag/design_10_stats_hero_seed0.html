<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    background: radial-gradient(circle at 50% 50%, #1E293B, #0F172A);
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .title {
    position: absolute;
    top: 40px;
    left: 50px;
    font-size: 32px;
    z-index: 4;
    box-shadow: 0 0 20px rgba(209, 170, 78, 0.3), 0 0 60px rgba(209, 170, 78, 0.1);
  }

  .hero {
    position: absolute;
    top: 120px;
    left: 50px;
    font-size: 48px;
    font-weight: bold;
    z-index: 4;
    box-shadow: 0 0 20px rgba(209, 170, 78, 0.3), 0 0 60px rgba(209, 170, 78, 0.1);
  }

  .subtitle {
    position: absolute;
    top: 190px;
    left: 50px;
    font-size: 24px;
    z-index: 4;
  }

  .card {
    width: 300px;
    padding: 20px;
    margin-top: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 3;
    left: 50px;
  }

  .icon_badge_circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fbbf24;
  }

  .stat {
    text-align: right;
  }

  .accent_line {
    width: 48px;
    height: 4px;
    border-radius: 2px;
    background: #fbbf24;
    position: absolute;
    bottom: 10px;
    left: 0;
  }
</style>

<div class="slide">
  <div class="title">2025년 성과 하이라이트</div>
  <div class="hero">300%</div>
  <div class="subtitle">생산성 향상</div>

  <div class="card" style="top: 250px;">
    <div class="icon_badge_circle">🏢</div>
    <div class="stat">
      <div>150+</div>
      <div>도입 기업</div>
    </div>
    <div class="accent_line"></div>
  </div>

  <div class="card" style="top: 340px;">
    <div class="icon_badge_circle">👤</div>
    <div class="stat">
      <div>50K+</div>
      <div>월간 활성 사용자</div>
    </div>
    <div class="accent_line"></div>
  </div>

  <div class="card" style="top: 430px;">
    <div class="icon_badge_circle">📄</div>
    <div class="stat">
      <div>2M+</div>
      <div>처리 문서 수</div>
    </div>
    <div class="accent_line"></div>
  </div>

  <div class="card" style="top: 520px;">
    <div class="icon_badge_circle">⏱️</div>
    <div class="stat">
      <div>99.9%</div>
      <div>서비스 가동률</div>
    </div>
    <div class="accent_line"></div>
  </div>
</div></div>
</body></html>

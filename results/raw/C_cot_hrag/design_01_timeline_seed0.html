<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0F172A, #1E293B);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }
  .container {
    position: relative;
    width: 1280px;
    height: 720px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .ambient-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,0,255,0.15), transparent 70%);
    filter: blur(60px);
    z-index: 1;
  }
  .neon-line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    margin: auto;
    width: 100%;
    height: 4px;
    background: #00FFFF;
    border-radius: 2px;
    z-index: 2;
  }
  .icon-badge {
    position: absolute;
    top: 45%;
    left: 20%;
    margin-left: -24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #00FFFF;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.1);
    z-index: 3;
  }
  .icon-badge:nth-child(2) { left: 40%; }
  .icon-badge:nth-child(3) { left: 60%; }
  .icon-badge:nth-child(4) { left: 80%; }
  .glass-card {
    position: absolute;
    bottom: 20%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    width: 200px;
    height: 150px;
    z-index: 4;
  }
  .glass-card:nth-child(5) { left: 8%; }
  .glass-card:nth-child(6) { left: 28%; }
  .glass-card:nth-child(7) { left: 48%; }
  .glass-card:nth-child(8) { left: 68%; }
  .text-title {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    color: #FFFFFF;
    z-index: 5;
  }
  .text-description {
    position: absolute;
    top: 15%;
    width: 100%;
    text-align: center;
    font-size: 24px;
    color: #FFFFFF;
    z-index: 5;
  }
  .card-content {
    padding: 16px;
    color: #FFFFFF;
  }
  .card-content h3 {
    margin: 0;
    font-size: 24px;
  }
  .card-content p {
    margin: 8px 0 0 0;
    font-size: 16px;
  }
</style>

<div class="container">
  <div class="ambient-glow" style="left: 10%; top: 10%;"></div>
  <div class="neon-line"></div>
  <div class="icon-badge"><span>📊</span></div>
  <div class="icon-badge"><span>🏗️</span></div>
  <div class="icon-badge"><span>🔄</span></div>
  <div class="icon-badge"><span>🚀</span></div>
  <div class="glass-card">
    <div class="card-content">
      <h3>현황 진단</h3>
      <p>레거시 시스템 분석 및 디지털 성숙도 평가</p>
    </div>
  </div>
  <div class="glass-card">
    <div class="card-content">
      <h3>기반 구축</h3>
      <p>클라우드 마이그레이션 및 API 플랫폼 설계</p>
    </div>
  </div>
  <div class="glass-card">
    <div class="card-content">
      <h3>프로세스 혁신</h3>
      <p>업무 자동화 및 데이터 기반 의사결정 체계 도입</p>
    </div>
  </div>
  <div class="glass-card">
    <div class="card-content">
      <h3>스케일업</h3>
      <p>AI/ML 적용 확대 및 전사 디지털 문화 정착</p>
    </div>
  </div>
  <div class="text-title">디지털 전환 로드맵 2025</div>
  <div class="text-description">4단계 전환 마일스톤과 핵심 목표</div>
</div></div>
</body></html>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #020b2a; font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    margin: 0 auto;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,255,255,.14) 0%, rgba(0,255,255,.05) 18%, rgba(2,11,42,0) 38%),
      radial-gradient(circle at 50% 50%, rgba(0,180,255,.10) 0%, rgba(2,11,42,0) 55%),
      linear-gradient(180deg, #02113a 0%, #020b2a 100%);
  }

  .title {
    position: absolute;
    top: 26px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #dffcff;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(76,245,255,.35);
    z-index: 5;
  }

  .circuit {
    position: absolute;
    inset: 0;
    opacity: .22;
    background:
      linear-gradient(90deg, transparent 0 47.8%, rgba(74,255,236,.8) 48%, transparent 48.2%) center/100% 100% no-repeat,
      linear-gradient(180deg, transparent 0 45.5%, rgba(74,255,236,.65) 45.7%, transparent 45.9%) center/100% 100% no-repeat,
      linear-gradient(180deg, transparent 0 54.1%, rgba(74,255,236,.55) 54.3%, transparent 54.5%) center/100% 100% no-repeat;
    z-index: 0;
  }
  .circuit:before,
  .circuit:after {
    content: "";
    position: absolute;
    inset: 90px 240px 90px 240px;
    background:
      linear-gradient(90deg, transparent 0 10%, rgba(74,255,236,.35) 10% 10.3%, transparent 10.3% 20%, rgba(74,255,236,.35) 20% 20.3%, transparent 20.3% 80%, rgba(74,255,236,.35) 80% 80.3%, transparent 80.3% 90%, rgba(74,255,236,.35) 90% 90.3%, transparent 90.3% 100%),
      linear-gradient(180deg, transparent 0 12%, rgba(74,255,236,.35) 12% 12.3%, transparent 12.3% 28%, rgba(74,255,236,.35) 28% 28.3%, transparent 28.3% 72%, rgba(74,255,236,.35) 72% 72.3%, transparent 72.3% 88%, rgba(74,255,236,.35) 88% 88.3%, transparent 88.3% 100%);
    filter: drop-shadow(0 0 6px rgba(74,255,236,.25));
  }
  .circuit:after {
    inset: 120px 310px 120px 310px;
    opacity: .6;
  }

  .hub-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 300px;
    height: 300px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(98,255,248,.3) 0%, rgba(32,196,255,.18) 28%, rgba(0,0,0,0) 68%);
    filter: blur(6px);
    z-index: 1;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 214px;
    height: 214px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(54,255,248,.28) 0, rgba(54,255,248,.08) 34%, rgba(8,22,58,.95) 68%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
    border: 4px solid rgba(104,255,236,.85);
    box-shadow:
      0 0 0 8px rgba(57,231,255,.18),
      0 0 36px rgba(57,231,255,.45),
      inset 0 0 20px rgba(57,231,255,.18);
    z-index: 4;
  }

  .hub .center-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #d6ffff;
    box-shadow: 0 0 18px #79fff7, 0 0 30px #48e6ff;
  }

  .hub .ring {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    border: 2px solid rgba(119,255,240,.18);
  }

  .network {
    position: absolute;
    inset: 0;
    z-index: 5;
  }
  .network .n {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0b2d57;
    border: 4px solid #72fff0;
    box-shadow: 0 0 10px rgba(114,255,240,.65);
  }
  .network .l {
    position: absolute;
    height: 3px;
    background: rgba(114,255,240,.95);
    transform-origin: left center;
    box-shadow: 0 0 8px rgba(114,255,240,.65);
    border-radius: 2px;
  }

  .conn {
    position: absolute;
    height: 16px;
    border-radius: 18px;
    background: linear-gradient(90deg, rgba(63,231,255,.95), rgba(111,255,223,.95));
    box-shadow:
      0 0 20px rgba(63,231,255,.55),
      0 0 8px rgba(111,255,223,.45);
    z-index: 2;
  }
  .conn:after {
    content: "";
    position: absolute;
    inset: 4px 14px;
    border-radius: 10px;
    background:
      radial-gradient(circle at 8% 50%, rgba(255,255,255,.55) 0 1px, transparent 2px),
      radial-gradient(circle at 18% 50%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 28% 50%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 38% 50%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 48% 50%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 58% 50%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 68% 50%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 50%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 50%, rgba(255,255,255,.35) 0 1px, transparent 2px);
    opacity: .65;
  }

  .c1 { width: 215px; left: 350px; top: 174px; transform: rotate(21deg); }
  .c2 { width: 202px; left: 345px; top: 378px; transform: rotate(0deg); }
  .c3 { width: 220px; left: 354px; top: 551px; transform: rotate(-22deg); }

  .c4 { width: 215px; left: 714px; top: 174px; transform: rotate(-21deg); }
  .c5 { width: 202px; left: 733px; top: 378px; transform: rotate(0deg); }
  .c6 { width: 220px; left: 707px; top: 551px; transform: rotate(22deg); }

  .card {
    position: absolute;
    width: 320px;
    height: 180px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06)),
      linear-gradient(135deg, rgba(178,229,255,.12), rgba(255,255,255,.03) 35%, rgba(50,78,133,.09) 100%);
    border: 2px solid rgba(181,232,255,.42);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      0 0 18px rgba(75,245,255,.18);
    backdrop-filter: blur(2px);
    z-index: 3;
  }
  .card:before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background:
      linear-gradient(115deg, rgba(255,255,255,.18), rgba(255,255,255,0) 35%),
      linear-gradient(295deg, rgba(108,255,217,.18), rgba(255,255,255,0) 30%);
    pointer-events: none;
  }

  .icon-ring {
    position: absolute;
    left: 24px;
    top: 24px;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 4px solid rgba(102,255,237,.9);
    box-shadow:
      0 0 0 6px rgba(87,239,255,.12),
      0 0 20px rgba(87,239,255,.38),
      inset 0 0 12px rgba(87,239,255,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9bfff5;
    font-size: 44px;
    text-shadow: 0 0 14px rgba(87,239,255,.65);
  }

  .card .text {
    position: absolute;
    left: 145px;
    right: 22px;
    top: 30px;
    color: #e6fdff;
  }
  .card .t1 {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(87,239,255,.22);
  }
  .card .t2 {

  .right1 { right: 60px; top: 70px; }

  .right3 { right: 60px; top: 520px; }
</style>

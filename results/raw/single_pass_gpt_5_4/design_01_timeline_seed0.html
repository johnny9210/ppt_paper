<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #05081f; font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; }
  .slide {
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    color: #eef8ff;
    background:
      radial-gradient(circle at 28% 18%, rgba(59,245,255,.45), transparent 10%),
      radial-gradient(circle at 72% 18%, rgba(214,95,255,.35), transparent 10%),
      radial-gradient(circle at 10% 58%, rgba(54,232,255,.22), transparent 8%),
      radial-gradient(circle at 50% 58%, rgba(206,91,255,.18), transparent 10%),
      radial-gradient(circle at 80% 60%, rgba(72,235,255,.18), transparent 12%),
      linear-gradient(180deg, #081657 0%, #07124a 35%, #070f37 62%, #05081f 100%);
  }

  /* top star field */
  .stars,
  .stars:before,
  .stars:after {
    content: "";
    position: absolute;
    inset: 0;
    background-repeat: repeat;
    pointer-events: none;
  }
  .stars {
    opacity: .8;
    background-image:
      radial-gradient(circle at 12% 24%, rgba(113,206,255,.9) 0 1px, transparent 2px),
      radial-gradient(circle at 39% 19%, rgba(208,126,255,.9) 0 1.2px, transparent 2px),
      radial-gradient(circle at 61% 24%, rgba(164,224,255,.9) 0 1.2px, transparent 2px),
      radial-gradient(circle at 90% 24%, rgba(117,185,255,.8) 0 1.2px, transparent 2px),
      radial-gradient(circle at 50% 10%, rgba(128,240,255,.8) 0 1px, transparent 2px),
      radial-gradient(circle at 86% 85%, rgba(214,114,255,.9) 0 1.3px, transparent 2px),
      radial-gradient(circle at 18% 91%, rgba(114,242,255,.8) 0 1.2px, transparent 2px),
      radial-gradient(circle at 50% 86%, rgba(135,232,255,.9) 0 1.3px, transparent 2px);
  }

  /* grid */
  .grid {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(105,190,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(105,190,255,.16) 1px, transparent 1px);
    background-size: 74px 68px;
    mask-image: linear-gradient(to bottom, rgba(255,255,255,.9) 0%, rgba(255,255,255,.9) 60%, rgba(255,255,255,.55) 78%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(255,255,255,.9) 0%, rgba(255,255,255,.9) 60%, rgba(255,255,255,.55) 78%, transparent 100%);
  }

  .floor {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 210px;
    background:
      linear-gradient(rgba(109,193,255,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(109,193,255,.22) 1px, transparent 1px);
    background-size: 74px 40px;
    transform: perspective(700px) rotateX(68deg);
    transform-origin: bottom;
    opacity: .9;
  }

  .title-wrap {
    position: absolute;
    top: 42px;
    left: 80px;
    z-index: 5;
  }
  .title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0;
    color: #ecfbff;
    text-shadow:
      0 0 10px rgba(115,240,255,.45),
      0 0 22px rgba(188,102,255,.25);
  }
  .desc {
    margin-top: 10px;
    font-size: 18px;
    color: rgba(225,241,255,.85);
    letter-spacing: -.2px;
    text-shadow: 0 0 12px rgba(111,224,255,.25);
  }

  /* top neon rail */
  .rail {
    position: absolute;
    left: -10px;
    top: 242px;
    width: 1300px;
    height: 18px;
    border-radius: 20px;
    background:
      linear-gradient(90deg,
        rgba(77,249,255,.95) 0%,
        rgba(151,248,255,.9) 18%,
        rgba(203,146,255,.95) 40%,
        rgba(113,255,255,.9) 62%,
        rgba(214,123,255,.95) 86%,
        rgba(180,82,255,.95) 100%);
    box-shadow:
      0 0 16px rgba(66,243,255,.9),
      0 0 34px rgba(182,97,255,.55),
      0 0 60px rgba(66,243,255,.35);
    z-index: 2;
  }
  .rail:before {
    content: "";
    position: absolute;
    inset: 6px 0;
    border-radius: 20px;
    background: linear-gradient(90deg, rgba(255,255,255,.6), rgba(255,255,255,.18), rgba(255,255,255,.55));
    filter: blur(2px);
  }

  .connector-bottom {
    position: absolute;
    left: 562px;
    top: 548px;
    width: 210px;
    height: 10px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(110,245,255,.65), rgba(190,105,255,.45), rgba(97,239,255,.65));
    box-shadow: 0 0 18px rgba(96,241,255,.65);
    z-index: 1;
  }

  .nodes {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
  }
  .node {
    position: absolute;
    top: 206px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid rgba(173,245,255,.7);
    background:
      radial-gradient(circle at 50% 50%, rgba(234,248,255,.95) 0%, rgba(119,239,255,.95) 18%, rgba(192,112,255,.82) 55%, rgba(113,235,255,.18) 72%, rgba(113,235,255,.04) 100%);
    box-shadow:
      0 0 10px rgba(95,245,255,.9),
      0 0 28px rgba(95,245,255,.55),
      0 0 48px rgba(187,106,255,.35);
  }
  .node:before,
  .node:after {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1px solid rgba(145,233,255,.22);
  }
  .node:after {
    inset: -18px;
    border-style: dashed;
    border-color: rgba(204,118,255,.2);
  }
  .n1 { left: 208px; }
  .n2 { left: 505px; }
  .n3 { left: 802px; }
  .n4 { left: 1099px; }

  .cards {
    position: absolute;
    left: 0;
    right: 0;
    top: 340px;
    display: flex;
    justify-content: center;
    gap: 92px;
    z-index: 4;
  }

  .card {
    position: relative;
    width: 246px;
    height: 276px;
    border-radius: 24px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.12) 28%, rgba(255,255,255,.05) 29%, rgba(255,255,255,.03) 100%);
    border: 2px solid rgba(172,242,255,.45);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 0 16px rgba(97,242,255,.32),
      0 0 30px rgba(196,106,255,.18);
    backdrop-filter: blur(2px);
  }
  .card.purple {
    border-color: rgba(215,135,255,.45);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 0 16px rgba(186,110,255,.28),
      0 0 30px rgba(97,242,255,.15);
  }

  .card:before {
    content: "";
    position: absolute;
    top: 0;
    right: 36px;
    width: 66px;
    height: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.06));
    transform: skewX(-22deg);
    filter: blur(.2px);
    opacity: .6;
    pointer-events: none;
  }

  .wire {
    position: absolute;
    left: 50%;
    top: -88px;
    transform: translateX(-50%);
    width: 4px;
    height: 88px;
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(132,245,255,.95), rgba(132,245,255,.15));
    box-shadow: 0 0 14px rgba(100,243,255,.65);
  }
  .wire.purple {
    background: linear-gradient(180deg, rgba(210,123,255,.95), rgba(210,123,255,.12));
    box-shadow: 0 0 14px rgba(196,106,255,.65);
  }

  .slot {
    position: absolute;
    left: 18px;
    right: 18px;
    border: 2px solid;
    border-radius: 11px;
    background: rgba(10,18,52,.14);
  }
  .slot.top {
    top: 20px;
    height: 34px;
    border-color: rgba(126,241,255,.75);
    box-shadow: inset 0 0 10px rgba(98,240,255,.14), 0 0 10px rgba(98,240,255,.12);
  }
  .slot.middle {
    top: 70px;
    height: 64px;
    border-color: rgba(126,241,255,.75);
    box-shadow: inset 0 0 10px rgba(98,240,255,.14), 0 0 10px rgba(98,240,255,.12);
  }
  .slot.small1, .slot.small2 {
    bottom: 20px;
    width: 78px;
    height: 78px;
    border-color: rgba(126,241,255,.75);
    box-shadow: inset 0 0 10px rgba(98,240,255,.14), 0 0 10px rgba(98,240,255,.12);
  }
  .slot.small1 { left: 18px; }
  .slot.small2 { right: 18px; }

  .purple .slot.top,
  .purple .slot.middle,
  .purple .slot.small1,
  .purple .slot.small2 {
    border-color: rgba(215,135,255,.75);
    box-shadow: inset 0 0 10px rgba(196,106,255,.14), 0 0 10px rgba(196,106,255,.12);
  }

  .content {
    position: absolute;
    inset: 0;
    padding: 24px 24px 18px;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  .step {
    font-size: 12px;
    font-weight: 700;
    color: rgba(224,247,255,.8);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 4px;
  }
  .emoji {
    margin-top: 12px;
    font-size: 28px;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255,255,255,.28);
  }
  .card-title {
    margin-top: 14px;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.15;
    color: #f5fdff;
    text-shadow: 0 0 12px rgba(97,242,255,.22);
  }
  .purple .card-title {
    text-shadow: 0 0 12px rgba(196,106,255,.22);
  }
  .card-desc {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.5;
    color: rgba(228,242,255,.86);
    width: 86%;
  }

  .badge {
    position: absolute;
    right: 18px;
    bottom: 18px;
    min-width: 44px;
    height: 44px;
    padding: 0 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: white;
    background: linear-gradient(135deg, rgba(84,248,255,.95), rgba(180,96,255,.95));
    box-shadow:
      0 0 12px rgba(95,243,255,.55),
      0 0 22px rgba(196,106,255,.35);
  }

  .glow-left, .glow-right {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .18;
    pointer-events: none;
  }
  .glow-left {
    left: -80px; top: 250px;
    background: rgba(62,239,255,.8);
  }
  .glow-right {
    right: -100px; top: 210px;
    background: rgba(192,98,255,.8);
  }
</style>

<div class="slide">

      <div class="content">

    <div class="card purple">

        <div class="card-desc">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>

</div>

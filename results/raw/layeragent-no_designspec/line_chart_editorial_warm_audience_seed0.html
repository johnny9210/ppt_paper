<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container line_chart_editorial_warm_audience" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .line_chart_editorial_warm_audience-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #fff 0%, #f3f0e5 100%);
  }
</style>
<div class="line_chart_editorial_warm_audience-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .line_chart_editorial_warm_audience-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .line_chart_editorial_warm_audience-decor .timeline_line {
    position: absolute;
    left: 7.5%;
    top: 25%;
    width: 85%;
    height: 2px;
    background: linear-gradient(to right, transparent 0%, #888 50%, transparent 100%);
    background-size: 10px 2px;
    background-repeat: repeat-x;
  }
  .line_chart_editorial_warm_audience-decor .frame_accent {
    position: absolute;
    left: 70%;
    top: 15%;
    width: 21px;
    height: 21px;
    background: #888;
    border-radius: 50%;
  }
</style>
<div class="line_chart_editorial_warm_audience-decor">
  <div class="timeline_line"></div>
  <div class="frame_accent"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:90.0%;height:40.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f6f2e7;
    border: 2px solid #9a8e83;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    padding: 20px;
    box-sizing: border-box;
    font-size: 14px; /* Updated font-size */
  }
  .hero-1 .hero-value {
    font-size: 3.625rem; /* 58px scaled */
    font-weight: bold;
    color: #d1693a;
    text-align: center;
  }
  .hero-1 .hero-subtitle {
    font-size: 1.5rem; /* 24px scaled */
    color: #53524e;
    text-align: center;
    margin-top: 10px;
  }
</style>

<div class="hero-1">
  <div class="hero-value">Newsletter subscribers reached 1.4M, growing 8% MoM</div>
  <div class="hero-subtitle">Subscriber count, last 18 months</div>
</div></div>
  <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div><div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/></svg></div>
</div>

    
</div></div>
</body></html>

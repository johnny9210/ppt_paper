<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container process_flow_bain_red_ops" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
      <style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

        body {
          margin: 0;
          padding: 0;
        }

        .process_flow_bain_red_ops-bg-base {
          position: absolute;
          inset: 0;
          z-index: 0;
          background: linear-gradient(135deg, #000, #888);
        }
      </style>

      <div class="process_flow_bain_red_ops-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
      <style>
        .process_flow_bain_red_ops-decor {
          position: absolute;
          inset: 0;
          z-index: 2;
          pointer-events: none;
        }

        .arrow-connector {
          position: absolute;
          width: 0;
          height: 0;
          border-left: 10px solid transparent;
          border-right: 10px solid transparent;
          border-bottom: 20px solid #888;
          left: 15%;
          top: 25%;
        }
      </style>
      <div class="process_flow_bain_red_ops-decor">
        <div class="arrow-connector"></div>
      </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    <div class="hero-wrap-1" style="position:absolute;left:70.0%;top:20.0%;width:25.0%;height:60.0%;z-index:20;">
      <div style="position:absolute;inset:0;">
        <style>
          .hero-1 {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #F8EFF0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
          }

          .hero-1 .hero-value {
            font-size: 4.2rem; /* 59px */
            color: #A6192E;
            font-weight: bold;
          }

          .hero-1 .hero-subtitle {
            font-size: 1.5rem; /* 22px */
            color: #000000;
            margin-top: 10px;
          }
        </style>

        <div class="hero-1">
          <div class="hero-value">4.2 days</div>
          <div class="hero-subtitle">↓ -4.9 days (-54%) (was 9.1)</div>
        </div>
      </div>
      <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div>
      <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
        </svg>
      </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
      <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">
        Optimized order-to-cash cycle compresses to 4.2 days from 9.1
      </div>
      <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">
        O2C process redesign
      </div>
    </div>
</div></div>
</body></html>

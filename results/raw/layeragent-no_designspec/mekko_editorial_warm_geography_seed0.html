<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .mekko_editorial_warm_geography-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to bottom, #000, #888);
  }

  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #B13E0D;
    padding: 1rem;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    font-size: 12.8px; /* 20% 감소 */
  }

  .hero-1 .hero-value {
    font-size: 3.6875rem; /* 59px equivalent */
    color: #A34723;
    font-weight: bold;
    text-align: center;
  }

  .hero-1 .hero-subtitle {
    font-size: 3.0625rem; /* 49px equivalent */
    color: #C38060;
    text-align: center;
    margin-top: 0.5rem;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    background-color: #B13E0D;
    border-radius: 0.5rem;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1rem;
    position: relative;
  }
  
  .card-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }

  .card-1 .card-icon {
    font-size: 1.25rem;
    color: #F6F3E6;
  }

  .card-1 .card-value {
    font-size: 1.25rem;
    color: #F6F3E6;
    margin-top: 0.5rem;
  }

  .card-1 .card-label {
    font-size: 1rem;
    color: #E4D3B0;
  }

  .card-accent {
    background-color: #DEA915;
    height: 0.25rem;
    width: 100%;
    border-radius: 0.25rem;
    margin-top: 1rem;
  }

  .card-3 .card-icon {
    width: 24px;
    height: 24px;
    background-color: #B33E0D;
    border-radius: 50%;
    font-size: 12px; /* 25% 감소 */
  }
</style>

<div class="slide-container mekko_editorial_warm_geography" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
  <div style="position:absolute;inset:0;z-index:0;">
    <div class="mekko_editorial_warm_geography-bg-base"></div>
  </div>
  <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"></div>
  <div style="position:absolute;inset:0;z-index:8;pointer-events:none;">
    <div style="position:absolute;left:8.0%;top:80.0%; width:84.0%;height:15.0%;z-index:8; display:flex;flex-direction:column;align-items:center;justify-content:center; padding:2%;">
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">Ad spend by country × media channel</div>
      <svg width="600" height="108" viewBox="0 0 600 108">
        <rect x="33.3" y="10.0" width="83.3" height="78.0" fill="#D4AF37" opacity="0.85" rx="3"/><text x="75.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">UK</text>
        <rect x="183.3" y="19.8" width="83.3" height="68.2" fill="#D4AF37" opacity="0.85" rx="3"/><text x="225.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">DE</text>
        <rect x="333.3" y="34.4" width="83.3" height="53.6" fill="#D4AF37" opacity="0.85" rx="3"/><text x="375.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">FR</text>
        <rect x="483.3" y="44.1" width="83.3" height="43.9" fill="#D4AF37" opacity="0.85" rx="3"/><text x="525.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">IT</text>
      </svg>
    </div>
  </div>
  <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:90.0%;height:20.0%;z-index:20;">
    <div style="position:absolute;inset:0;">
      <div class="hero-1">
        <div class="hero-value">European Q4 ad spend skewed 71% toward digital despite TV reach gains</div>
        <div class="hero-subtitle">Ad spend by country × media channel</div>
      </div>
    </div>
    <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div>
    <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
      </svg>
    </div>
  </div>
  <div class="card-wrap-1" style="position:absolute;left:5.0%;top:30.0%;width:15.0%;height:55.0%;z-index:10;">
    <div style="position:absolute;inset:0;">
      <div class="card-1">
        <div class="card-header">
          <div class="card-icon"><i class="fas fa-chart-line" style="font-size:1.8rem;color:#D4AF37;"></i></div>
          <div class="card-value">€455M</div>
        </div>
        <div class="card-body">
          <div class="card-label">TV €128M</div>
          <div class="card-label">Print €57M</div>
        </div>
        <div class="card-accent"></div>
      </div>
    </div>
  </div>
  <div class="card-wrap-2" style="position:absolute;left:25.0%;top:30.0%;width:15.0%;height:55.0%;z-index:10;">
    <div style="position:absolute;inset:0;">
      <div class="card-2">
        <div class="card-header">
          <div class="card-icon"><i class="fas fa-code" style="font-size:1.8rem;color:#D4AF37;"></i></div>
          <div class="card-value"></div>
        </div>
        <div class="card-label"></div>
        <div class="card-accent"></div>
      </div>
    </div>
  </div>
  <div class="card-wrap-3" style="position:absolute;left:45.0%;top:30.0%;width:15.0%;height:55.0%;z-index:10;">
    <div style="position:absolute;inset:0;">
      <div class="card-3">
        <div class="card-header">
          <div class="card-icon"><i class="fas fa-network-wired" style="font-size:1.44rem;color:#D4AF37;"></i></div>
          <div class="card-value"></div>
        </div>
        <div class="card-body">
          <div class="card-label"></div>
        </div>
        <div class="card-accent"></div>
      </div>
    </div>
  </div>
  <div class="card-wrap-4" style="position:absolute;left:65.0%;top:30.0%;width:15.0%;height:55.0%;z-index:10;">
    <div style="position:absolute;inset:0;">
      <div class="card-4">
        <div class="card-header">
          <div class="card-icon"><i class="fas fa-award" style="font-size:1.8rem;color:#D4AF37;"></i></div>
        </div>
        <div class="card-body">
          <div class="card-value">값자리</div>
          <div class="card-label">라벨자리</div>
        </div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">European Q4 ad spend skewed 71% toward digital despite TV reach gains</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Ad spend by country × media channel</div>
  </div>
</div></div>
</body></html>

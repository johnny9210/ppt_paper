<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container process_flow_bcg_green_go_to_market" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: #000;
            }
            .process_flow_bcg_green_go_to_market-bg-base {
                position: absolute;
                inset: 0;
                z-index: 0;
                background: linear-gradient(180deg, #000 0%, #888 100%);
            }
        </style>
        <div class="process_flow_bcg_green_go_to_market-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <style>
            .process_flow_bcg_green_go_to_market-decor {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
            }
            .arrow {
                position: absolute;
                background-color: #888;
                width: 0;
                height: 0;
                border-left: 15px solid transparent;
                border-right: 15px solid transparent;
                border-bottom: 25px solid #888;
            }
            .arrow1 {
                top: 50%;
                left: 14%;
                transform: translate(-50%, -50%);
            }
            .arrow2 {
                top: 50%;
                left: 28%;
                transform: translate(-50%, -50%);
            }
            .arrow3 {
                top: 50%;
                left: 42%;
                transform: translate(-50%, -50%);
            }
            .arrow4 {
                top: 50%;
                left: 56%;
                transform: translate(-50%, -50%);
            }
            .arrow5 {
                top: 50%;
                left: 70%;
                transform: translate(-50%, -50%);
            }
        </style>
        <div class="process_flow_bcg_green_go_to_market-decor">
            <div class="arrow arrow1"></div>
            <div class="arrow arrow2"></div>
            <div class="arrow arrow3"></div>
            <div class="arrow arrow4"></div>
            <div class="arrow arrow5"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Six-step GTM motion converts 22% of qualified leads</div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Sales pipeline workflow</div>
    </div>
</div></div>
</body></html>

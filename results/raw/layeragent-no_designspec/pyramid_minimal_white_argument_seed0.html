<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .pyramid_minimal_white_argument-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #000, #888);
  }
</style>
<style>
  .pyramid_minimal_white_argument-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .line {
    position: absolute;
    background-color: #888;
    width: 2px;
    height: 10%;
  }

  .line1 { top: 25%; left: 50%; }
  .line2 { top: 40%; left: 25%; }
  .line3 { top: 40%; left: 50%; }
  .line4 { top: 40%; left: 75%; }
</style>

<style>
  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #CED3D6;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7D848C, #CED3D6);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 8px;
  }

  .card-1 .card-icon {
    margin-right: 8px;
    background: #495058;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 12px; /* Reduced by 25% */
  }

  .card-1 .card-value {
    font-size: 1rem;
    color: #161E28;
  }

  .card-body {
    background: #F5FAFE;
    border-radius: 6px;
    padding: 16px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-1 .card-label {
    font-size: 0.875rem;
    color: #495058;
  }

  .card-accent {
    background: linear-gradient(90deg, #7D848C, transparent);
    height: 4px;
    width: 60%;
    margin-top: 8px;
    border-radius: 2px;
  }
</style>

<style>
  .card-2 {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    width: 100%;
    height: 100%;
    position: relative;
    background: #CED3D6;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 16px;
    box-sizing: border-box;
  }

  .card-header {
    display: flex;
    align-items: center;
    background: linear-gradient(to right, #fdfdfd, #fefefe);
    border-radius: 20px;
    padding: 8px 16px;
    margin-bottom: 16px;
  }

  .card-2 .card-icon {
    width: 24px;
    height: 24px;
    background: #212529;
    border-radius: 50%;
    margin-right: 8px;
    font-size: 13px; /* Reduced by 20% */
  }

  .card-2 .card-value {
    font-size: 1rem;
    color: #212529;
  }

  .card-2 .card-label {
    font-size: 0.875rem;
    color: #212529;
  }
</style>

<style>
  .card-3 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #CED3D6;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 1rem;
  }

  .card-header {
    display: flex;
    align-items: center;
    background-color: #1D1F21;
    border-radius: 5px;
    padding: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .card-3 .card-icon {
    width: 25px;
    height: 25px;
    background-color: #9C9C9C;
    border-radius: 50%;
    margin-right: 0.5rem;
  }

  .card-3 .card-value {
    color: #FFFFFF;
    font-size: 1.25rem; /* 약 20px */
  }

  .card-body {
    background-color: #575B5E;
    border-radius: 5px;
    padding: 1rem;
    width: 100%;
  }

  .card-3 .card-label {
    color: #F5F7F7;
    font-size: 0.8rem; /* Reduced by 20% */
    margin-bottom: 0.25rem;
    line-height: 1.2; /* Adjusted line-height */
  }
</style>

<div class="slide-container pyramid_minimal_white_argument" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
      <div class="pyramid_minimal_white_argument-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
      <div class="pyramid_minimal_white_argument-decor">
        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
        <div class="line line4"></div>
      </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    <div class="card-wrap-1" style="position:absolute;left:35.0%;top:15.0%;width:30.0%;height:10.0%;z-index:10;">
      <div style="position:absolute;inset:0;">
        <div class="card-1">
          <div class="card-header">
            <div class="card-icon"><i class="fas fa-arrow-trend-up" style="font-size:1.8rem;color:#D4AF37;"></i></div>
            <div class="card-value">main conclusion</div>
          </div>
          <div class="card-body">
            <div class="card-label"></div>
          </div>
          <div class="card-accent"></div>
        </div>
      </div>
    </div>
    
    <div class="card-wrap-2" style="position:absolute;left:15.0%;top:30.0%;width:20.0%;height:10.0%;z-index:10;">
      <div style="position:absolute;inset:0;">
        <div class="card-2">
          <div class="card-header">
            <div class="card-icon"><i class="fas fa-gear" style="font-size:1.8rem;color:#D4AF37;"></i></div>
            <div class="card-value">reason 1</div>
          </div>
          <div class="card-label"></div>
        </div>
      </div>
    </div>
    
    <div class="card-wrap-3" style="position:absolute;left:35.0%;top:30.0%;width:20.0%;height:10.0%;z-index:10;">
      <div style="position:absolute;inset:0;">
        <div class="card-3">
          <div class="card-header">
            <div class="card-icon"><i class="fas fa-bullseye" style="font-size:1.8rem;color:#D4AF37;"></i></div>
            <div class="card-value">reason 2</div>
          </div>
          <div class="card-body">
            <div class="card-label"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
      <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">The case for restructuring rests on 3 compounding factors</div>
      <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Strategic argument hierarchy</div>
    </div>
</div></div>
</body></html>

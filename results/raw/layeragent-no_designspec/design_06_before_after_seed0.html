<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .design_06_before_after-bg-base {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(to right, #000, #888);
  }

  .design_06_before_after-decor {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
  }
  .design_06_before_after-decor::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 15%;
      height: 15%;
      background: radial-gradient(circle, #888 0%, transparent 100%);
      transform: translate(-50%, -50%);
  }

  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #342D2A;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(92, 165, 193, 0.8);
    backdrop-filter: blur(8px);
    color: #D4E5D9;
    text-align: center;
    padding: 20px;
  }

  .hero-1 .hero-value {
    font-size: 3rem;
    color: #5F91A1;
    font-weight: bold;
    text-shadow: 0 0 10px #D89775;
  }

  .hero-1 .hero-subtitle {
    font-size: 1.2rem;
    color: #D4E5D9;
    margin-top: 10px;
    opacity: 0.8;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, #8C4E38, #6A433A);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(92, 165, 193, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
  }

  .card-header {
    background: rgba(224, 157, 127, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 90%;
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
  }

  .card-1 .card-icon {
    width: 30px;
    height: 30px;
    background: #B06C54;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(176, 108, 84, 0.8);
  }

  .card-1 .card-value {
    flex-grow: 1;
    background: linear-gradient(90deg, #E09D7F, #B06C54);
    height: 12px;
    border-radius: 6px;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
    font-size: 14px; /* 줄임 */
    line-height: 1.2; /* 추가 */
  }

  .card-1 .card-label {
    margin-top: 20px;
    width: 80%;
    height: 12px;
    background: linear-gradient(90deg, #6A433A, #8C4E38);
    border-radius: 6px;
    line-height: 12px;
    text-align: center;
  }

  .card-accent {
    margin-top: 20px;
    width: 50%;
    height: 10px;
    background: linear-gradient(90deg, #441E07, #6A433A);
    border-radius: 5px;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
  }

  .card-2 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #8C4E38, #6A433A);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(92, 165, 193, 0.8);
    padding: 15px;
    backdrop-filter: blur(8px);
  }
  
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(180, 108, 83, 0.8);
    border-radius: 25px;
    padding: 8px;
    margin-bottom: 10px;
  }

  .card-2 .card-icon {
    width: 30px;
    height: 30px;
    background: #B46C53;
    border-radius: 50%;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
  }

  .card-2 .card-value {
    flex-grow: 1;
    margin-left: 10px;
    color: #ffffff;
    font-size: 1rem;
  }

  .card-body {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: rgba(102, 66, 58, 0.6);
    border-radius: 15px;
    padding: 10px;
  }

  .card-2 .card-label {
    height: 1.5rem;
    line-height: 1.5rem;
    color: #ffffff;
    font-size: 0.8rem;
    border-radius: 10px;
    padding: 0 10px;
    background: linear-gradient(0deg, #8C4730, #E5A17E);
  }
  
  .card-accent {
    width: 100%;
    height: 8px;
    border-radius: 8px;
    background: linear-gradient(90deg, #8C4730, #E5A17E);
    margin-top: 10px;
  }
</style>

<div class="slide-container design_06_before_after" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="design_06_before_after-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <div class="design_06_before_after-decor"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    <div class="hero-wrap-1" style="position:absolute;left:44.0%;top:30.0%;width:12.0%;height:40.0%;z-index:20;">
        <div style="position:absolute;inset:0;">
            <div class="hero-1">
                <div class="hero-value">도입 후</div>
                <div class="hero-subtitle">AI 기반 업무</div>
            </div>
        </div>
        <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div>
        <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>
        </div>
    </div>
    <div class="card-wrap-1" style="position:absolute;left:5.0%;top:10.0%;width:36.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon">📝</div>
                    <div class="card-value">수작업 보고서 작성</div>
                </div>
                <div class="card-label">주 8시간 소요</div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-2" style="position:absolute;left:5.0%;top:35.0%;width:36.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-2">
                <div class="card-header">
                    <div class="card-icon">🔍</div>
                    <div class="card-value">수동 데이터 검색</div>
                </div>
                <div class="card-body">
                    <div class="card-label">건당 30분</div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">AI 도입 전후 업무 효율성 비교</div>
    </div>
</div></div>
</body></html>

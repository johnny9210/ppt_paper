<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .mekko_minimal_white_industry-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #000, #888);
  }
  
  /* Reduce font-size to fix overflow for specific selectors */
  .card-2 {
    font-size: 13px; /* Reduced by approximately 19% */
  }

  .hero-1 {
    font-size: 13px; /* Reduced by approximately 19% */
  }

  .hero-1 .hero-value {
    font-size: 3.75rem; /* Maintaining the original font size */
  }

  .hero-1 .hero-subtitle {
    font-size: 2.5rem; /* Maintaining the original font size */
    line-height: 1.2; /* Adjust line-height instead of font size */
  }

  .card-5 {
    font-size: 14px; /* Reduced by approximately 12% */
  }
  
  .card-icon {
    font-size: 12px; /* Reduced by 25% */
  }
</style>

<div class="slide-container mekko_minimal_white_industry" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="mekko_minimal_white_industry-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;">
        <div style="position:absolute;left:8.0%;top:78.0%;width:84.0%;height:17.0%;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;">
            <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">
                Industry × buyer-persona TAM breakdown
            </div>
            <svg width="600" height="122" viewBox="0 0 600 122">
                <rect x="26.7" y="10.0" width="66.7" height="92.0" fill="#D4AF37" opacity="0.85" rx="3"/>
                <text x="60.0" y="118" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Healthca</text>
                <rect x="146.7" y="27.2" width="66.7" height="74.8" fill="#D4AF37" opacity="0.85" rx="3"/>
                <text x="180.0" y="118" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Tech</text>
                <rect x="266.7" y="50.2" width="66.7" height="51.8" fill="#D4AF37" opacity="0.85" rx="3"/>
                <text x="300.0" y="118" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Finance</text>
                <rect x="386.7" y="61.8" width="66.7" height="40.2" fill="#D4AF37" opacity="0.85" rx="3"/>
                <text x="420.0" y="118" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Retail</text>
                <rect x="506.7" y="73.2" width="66.7" height="28.8" fill="#D4AF37" opacity="0.85" rx="3"/>
                <text x="540.0" y="118" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Other</text>
            </svg>
        </div>
    </div>
    
    <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:90.0%;height:10.0%;z-index:20;">
        <div style="position:absolute;inset:0;">
            <div class="hero-1">
              <div class="hero-value">58%</div>
              <div class="hero-subtitle">Healthcare and Tech industries together</div>
            </div>
        </div>
        <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div>
        <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>
        </div>
    </div>
    
    <div class="card-wrap-1" style="position:absolute;left:5.0%;top:20.0%;width:20.0%;height:35.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
              <div class="card-header">
                <div class="card-icon"><i class="fas fa-rocket" style="font-size:1.8rem;color:#D4AF37;"></i></div>
                <div class="card-value">32%</div>
              </div>
              <div class="card-body">
                <div class="card-label">Healthcare</div>
              </div>
            </div>
        </div>
    </div>
    
    <div class="card-wrap-2" style="position:absolute;left:25.0%;top:20.0%;width:20.0%;height:35.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-2">
              <div class="card-header">
                <div class="card-icon"><i class="fas fa-building" style="font-size:1.8rem;color:#D4AF37;"></i></div>
                <div class="card-value">26%</div>
              </div>
              <div class="card-body">Tech</div>
              <div class="card-label"></div>
            </div>
        </div>
    </div>
    
    <div class="card-wrap-3" style="position:absolute;left:45.0%;top:20.0%;width:20.0%;height:35.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-3">
              <div class="card-header">
                <div class="card-icon"><i class="fas fa-chart-line" style="font-size:1.8rem;color:#D4AF37;"></i></div>
                <div class="card-value">18%</div>
              </div>
              <div class="card-body">
                <div class="card-label">Finance</div>
              </div>
              <div class="card-accent"></div>
            </div>
        </div>
    </div>
    
    <div class="card-wrap-4" style="position:absolute;left:65.0%;top:20.0%;width:20.0%;height:35.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-4">
              <div class="card-header">
                <div class="card-icon"><i class="fas fa-network-wired" style="font-size:1.8rem;color:#D4AF37;"></i></div>
                <div class="card-value">14%</div>
              </div>
              <div class="card-label">Retail</div>
            </div>
        </div>
    </div>
    
    <div class="card-wrap-5" style="position:absolute;left:5.0%;top:55.0%;width:20.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-5">
              <div class="card-header">
                <div class="card-icon"><i class="fas fa-trophy" style="font-size:1.8rem;color:#D4AF37;"></i></div>
                <div class="card-value">10%</div>
              </div>
              <div class="card-body">
                <div class="card-label">Other</div>
              </div>
              <div class="card-accent"></div>
            </div>
        </div>
    </div>
    
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">
            Healthcare and Tech industries together account for 58% of TAM
        </div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">
            Industry × buyer-persona TAM breakdown
        </div>
    </div>
</div></div>
</body></html>

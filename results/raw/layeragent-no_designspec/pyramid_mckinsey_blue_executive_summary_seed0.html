<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

            body {
              margin: 0;
              height: 100vh;
              background: #000;
            }
            .pyramid_mckinsey_blue_executive_summary-bg-base {
              position: absolute;
              inset: 0;
              z-index: 0;
              background: linear-gradient(135deg, #000, #888);
            }
        </style>

<style>
            .pyramid_mckinsey_blue_executive_summary-decor {
              position: absolute;
              inset: 0;
              z-index: 2;
              pointer-events: none;
            }

            .line {
              position: absolute;
              width: 2px;
              background-color: #888;
            }

            .line1 {
              top: 35%;
              left: 20%;
              height: 5%;
            }

            .line2 {
              top: 35%;
              left: 50%;
              height: 5%;
            }

            .line3 {
              top: 35%;
              left: 80%;
              height: 5%;
            }
        </style>

<style>
                .hero-1 {
                  width: 100%;
                  height: 100%;
                  position: relative;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  background-color: #F3FAFB;
                  border: 3px solid #08284A;
                  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                  font-size: 12px; /* 25% reduction from 16px */
                }
                
                .hero-1 .hero-value {
                  font-size: 1.5rem; /* Adjust after main class font size decrease */
                  color: #1f4a73;
                  font-weight: bold;
                }
                
                .hero-1 .hero-subtitle {
                  font-size: 0.9375rem; /* Adjust after main class font size decrease */
                  color: #7E8D99;
                  margin-top: 0.5rem;
                }
            </style>

<style>
              .card-1 {
                width: 100%;
                height: 100%;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #F4FDFE;
                border: 3px solid #08284A;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                font-size: 12px; /* 25% reduction from 16px */
              }

              .card-header {
                display: flex;
                align-items: center;
                background: #BCD0E2;
                border-radius: 16px;
                padding: 4px 12px;
                margin-bottom: 8px;
              }

              .card-1 .card-icon {
                width: 24px;
                height: 24px;
                background: #092D50;
                border-radius: 50%;
                margin-right: 8px;
              }

              .card-1 .card-value {
                font-size: 0.75rem; /* Adjust after main class font size decrease */
                color: #092D50;
                font-weight: bold;
              }

              .card-body {
                display: flex;
                width: 80%;
                justify-content: center;
                align-items: center;
                background: #F4FDFE;
                border: 1px solid #BCD0E2;
                border-radius: 8px;
                padding: 8px;
                margin-bottom: 8px;
              }

              .card-1 .card-label {
                font-size: 0.65625rem; /* Adjust after main class font size decrease */
                color: #344F65;
              }
            </style>

<style>
              .card-2 {
                width: 100%;
                height: 100%;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-around;
                background: #F4FDFE;
                border: 3px solid #08284A;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                padding: 10px;
              }

              .card-header {
                display: flex;
                align-items: center;
                background: linear-gradient(to right, #C3D7E8, #9DB2C4);
                border-radius: 5px;
                padding: 5px 15px;
              }

              .card-2 .card-icon {
                font-size: 0.85rem; /* 15% reduction from 1rem */
                color: #082D50;
                margin-right: 8px;
              }

              .card-2 .card-value {
                font-size: 1.1rem;
                color: #344E64;
              }

              .card-2 .card-label {
                font-size: 0.9rem;
                color: #082D50;
                margin-top: 10px;
              }

              .card-accent {
                width: 80%;
                height: 4px;
                background: #9DB2C4;
                border-radius: 2px;
                margin-top: 10px;
              }
            </style>

<style>
              .card-3 {
                width: 100%;
                height: 100%;
                background: #F4FDFE;
                border: 3px solid #08284A;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 16px;
                position: relative;
              }

              .card-header {
                display: flex;
                align-items: center;
                background: #C4D8E8;
                border-radius: 20px;
                padding: 4px 12px;
                margin-bottom: 8px;
              }

              .card-3 .card-icon {
                background: #092D50;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                margin-right: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #F4FDFE;
                font-size: 0.85rem; /* 15% reduction from 1rem */
              }

              .card-3 .card-value {
                color: #092D50;
                font-size: 1rem;
                font-weight: bold;
              }

              .card-body {
                background: #ffffff;
                padding: 10px;
                border-radius: 8px;
                width: 100%;
                box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
                text-align: center;
              }

              .card-3 .card-label {
                color: #344E63;
                font-size: 0.875rem;
                margin-top: 8px;
              }
            </style>

<div class="slide-container pyramid_mckinsey_blue_executive_summary" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_04_pyramid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .design_04_pyramid-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #000 0%, #333 100%);
  }
</style>
<div class="design_04_pyramid-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
    .design_04_pyramid-decor {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
    }
    .design_04_pyramid-decor::before,
    .design_04_pyramid-decor::after {
        content: '';
        position: absolute;
        background-color: #888;
    }
    .design_04_pyramid-decor::before {
        top: 23%;
        left: 50%;
        width: 2px;
        height: 70px;
        transform: translateX(-50%);
    }
    .design_04_pyramid-decor::after {
        top: 45%;
        left: 50%;
        width: 2px;
        height: 100px;
        transform: translateX(-50%);
    }
</style>
<div class="design_04_pyramid-decor"></div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:43.0%;top:11.0%;width:14.0%;height:12.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(139, 117, 74, 0.8), rgba(88, 87, 85, 0.8));
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    border-radius: 12px;
    padding: 20px;
  }
  
  .hero-1 .hero-value {
    font-size: 1.44rem;
    color: #d4af37;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    margin-bottom: 8px;
  }

  .hero-1 .hero-subtitle {
    font-size: 1.06rem;
    color: #ffffff;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
  }
</style>

<div class="hero-1">
  <div class="hero-value">👑 데이터 전략</div>
  <div class="hero-subtitle">경영진 주도 데이터 비전 및 정책 수립</div>
</div></div>
  <div style="position:absolute;inset:0;border:1px solid rgba(212,175,55,0.35);opacity:1.0;pointer-events:none;"></div><div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/></svg></div>
</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">데이터 거버넌스 프레임워크</div>
    
</div>
</div></div>
</body></html>

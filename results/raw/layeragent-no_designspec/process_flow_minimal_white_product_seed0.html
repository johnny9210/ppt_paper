<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container process_flow_minimal_white_product" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

    .process_flow_minimal_white_product-bg-base {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(to bottom, #000, #888);
    }
</style>
<div class="process_flow_minimal_white_product-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
    .process_flow_minimal_white_product-decor {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
    }

    .process_flow_minimal_white_product-decor .arrow {
        position: absolute;
        width: 0; 
        height: 0; 
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 20px solid #888;
    }

    .process_flow_minimal_white_product-decor .arrow:nth-child(1) {
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
    }

    .process_flow_minimal_white_product-decor .arrow:nth-child(2) {
        top: 42%;
        left: 50%;
        transform: translateX(-50%);
    }
    
    .process_flow_minimal_white_product-decor .arrow:nth-child(3) {
        top: 54%;
        left: 50%;
        transform: translateX(-50%);
    }
</style>

<div class="process_flow_minimal_white_product-decor">
    <div class="arrow"></div>
    <div class="arrow"></div>
    <div class="arrow"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Product launch follows a 4-phase decision gate process</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">New product launch process</div>
</div>
</div></div>
</body></html>

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 0 20px rgba(0, 192, 255, 0.8);
    padding: 20px;
  }

  }

    width: 50px;
    height: 50px;
    border-radius: 50%;

    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-1 .card-value {
    color: #ffffff;
    font-size: 0.16rem;
  }
  .card-body {
    margin-top: 10px;
    padding: 0 20px;

    border-radius: 15px;
    box-shadow: 0 0 10px #4B789E inset;
    flex-grow: 1;
    display: flex;
    align-items: center;
  }
  .card-1 .card-label {
    color: #ffffff;
    font-size: 0.14rem;
    line-height: 1.5;
  }
  .card-accent {
    width: 80%;
    height: 4px;
    margin-top: 15px;

    box-shadow: 0 0 5px #85D5ED;
  }

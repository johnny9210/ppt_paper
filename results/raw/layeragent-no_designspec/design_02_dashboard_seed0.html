<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_02_dashboard" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

    .design_02_dashboard-bg-base {
        position: absolute;

</style>

    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>

    }
</style>

    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"><div style="position:absolute;left:8.0%;top:55.0%;

    <div class="card-wrap-1" style="position:absolute;left:5.0%;top:15.0%;width:25.0%;height:25.0%;z-index:10;">
  <div style="position:absolute;inset:0;"><style>
  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #03253F, #22425E);
    border-radius: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 20px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(62, 185, 233, 0.2);
    border-radius: 35px;
    padding: 10px 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(62, 185, 233, 0.5);
  }

  .card-1 .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #3EB9E9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(62, 185, 233, 0.8);
    margin-right: 10px;
  }

  .card-1 .card-value {
    font-size: 2rem;
    color: #3EB9E9;
  }

  .card-body {
    width: 100%;
    background: rgba(31, 44, 58, 0.5);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 10px rgba(31, 44, 58, 0.5);
  }

  .card-1 .card-label {
    font-size: 1rem;
    color: #4F8AB0;
    line-height: 1.2;
  }

  .card-accent {
    width: 50%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #03253F, #3EB9E9);
    margin-top: 20px;
  }
</style>

<div class="card-1">

    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(145deg, #03253F, #22425E);
    border-radius: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);

    border: 1px solid rgba(255, 255, 255, 0.2);

    display: flex;

  .card-3 .card-icon {
    width: 40px;

  }

    background: linear-gradient(to right, #13E9E0, rgba(19, 233, 224, 0));
    border-radius: 10px;

  }
</style>

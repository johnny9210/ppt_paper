<!DOCTYPE html>

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container process_flow_mckinsey_blue_transformation" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

    body {
        margin: 0;
        font-family: sans-serif;
    }
    .process_flow_mckinsey_blue_transformation-bg-base {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #000; /* bg_primary */
        background: linear-gradient(90deg, #000 0%, #888 100%); /* bg_primary to bg_secondary */
    }
</style>
<div class="process_flow_mckinsey_blue_transformation-bg-base"></div></div>

    .triangle:nth-child(2) { top: 50%; left: 38%; transform: translate(-50%, -50%); }
    .triangle:nth-child(3) { top: 50%; left: 56%; transform: translate(-50%, -50%); }

</div></div>

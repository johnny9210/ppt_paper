<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  .design_10_stats_hero-bg {
    width: 1280px;
    height: 720px;
    position: relative;
    background: linear-gradient(135deg, #0a0e1a, #2c3650);
    overflow: hidden;
  }
  
  .design_10_stats_hero-bg::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 25%;
    width: 200px;
    height: 100px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), rgba(0,0,0,0));
    box-shadow: 0 0 15px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.3);
    transform: translate(-50%, -50%);
    opacity: 0.5;
  }
  
  .design_10_stats_hero-bg::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    left: 60%;
    top: 40%;
    background: radial-gradient(circle, rgba(255,255,255,0.25), rgba(0,0,0,0));
    opacity: 0.2;
    transform: translate(-50%, -50%);
  }

  .design_10_stats_hero-bg .glow-node {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,1), rgba(255,255,255,0));
    box-shadow: 0 0 15px rgba(255,255,255,0.7), 0 0 30px rgba(255,255,255,0.4);
  }

  .design_10_stats_hero-bg .glow-node:nth-child(1) {
    top: 25%;
    left: 65%;
  }
  
  .design_10_stats_hero-bg .glow-node:nth-child(2) {
    top: 40%;
    left: 65%;
  }
  
  .design_10_stats_hero-bg .glow-node:nth-child(3) {
    top: 55%;
    left: 65%;
  }
  
  .design_10_stats_hero-bg .glow-node:nth-child(4) {
    top: 70%;
    left: 65%;
  }
</style>
<div class="slide-container design_10_stats_hero" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
  <div style="position:absolute;inset:0;z-index:0;">
    <div class="design_10_stats_hero-bg"></div>
  </div>
  <div style="position:absolute;left:65.0%;top:25.0%;width:30.0%;height:8.0%;z-index:10;">
    <style>
      .card-1 {
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 16px;
        border: 1px solid rgba(148,163,184,0.15);
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        background: rgba(12, 37, 63, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        padding: 10px;
        overflow: hidden;
      }

      .card-1::before {
        content: '';
        position: absolute;
        top: 10px;
        left: 10px;
        width: 70px;
        height: 70px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.15);
        z-index: 1;
      }

      .card-1::after {
        content: '';
        position: absolute;
        top: 10px;
        left: 90px;
        right: 10px;
        height: 70px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        z-index: 1;
      }
    </style>
    <div class="card-1">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.55rem; color:rgba(96,165,250,0.8); font-weight:600; letter-spacing:0.1em;">STEP 1</div>
        <div style="font-size:1.5rem;">🏢</div>
        <div style="font-size:0.85rem; font-weight:700; color:#e2e8f0;">도입 기업</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.65rem; color:rgba(148,163,184,0.85); line-height:1.4;">150+ 기업이 우리의 솔루션을 적극적으로 도입했습니다.</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:65.0%;top:40.0%;width:30.0%;height:8.0%;z-index:10;">
    <style>
      .card-2 {
        width: 100%;
        height: 100%;
        position: relative;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(148,163,184,0.15);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        padding: 20px;
      }
      
      .card-2 .internal-section {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        margin: 10px 0;
        padding: 10px;
      }
    </style>
    <div class="card-2">
      <div class="internal-section" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.55rem; color:rgba(96,165,250,0.8); font-weight:600; letter-spacing:0.1em;">STEP 2</div>
        <div style="font-size:1.5rem;">👤</div>
        <div style="font-size:0.85rem; font-weight:700; color:#e2e8f0;">월간 활성 사용자</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.65rem; color:rgba(148,163,184,0.85); line-height:1.4;">50K+ 명의 사용자가 매달 서비스를 사용하고 있습니다.</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:65.0%;top:55.0%;width:30.0%;height:8.0%;z-index:10;">
    <style>
      .card-3 {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(148,163,184,0.15);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .inner-area-1,
      .inner-area-2 {
        position: absolute;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 16px;
      }

      .inner-area-1 {
        top: 10px;
        left: 10px;
        right: 10px;
        height: 50%;
      }

      .inner-area-2 {
        bottom: 10px;
        left: 10px;
        right: 10px;
        height: 45%;
      }
    </style>
    <div class="card-3">
      <div class="inner-area-1" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.55rem; color:rgba(96,165,250,0.8); font-weight:600; letter-spacing:0.1em;">STEP 3</div>
        <div style="font-size:1.5rem;">📄</div>
        <div style="font-size:0.85rem; font-weight:700; color:#e2e8f0;">처리 문서 수</div>
      </div>
      <div class="inner-area-2" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.65rem; color:rgba(148,163,184,0.85); line-height:1.4;">2M+ 파일이 처리되었습니다.</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:65.0%;top:70.0%;width:30.0%;height:8.0%;z-index:10;">
    <style>
      .card-4 {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(148,163,184,0.15);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .card-4-section {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 16px;
        margin: 10px;
        padding: 10px;
        position: relative;
      }

      .card-4-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(to right, rgba(255, 215, 0, 0.5), transparent);
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        pointer-events: none;
      }
    </style>
    <div class="card-4">
      <div class="card-4-section" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.55rem; color:rgba(96,165,250,0.8); font-weight:600; letter-spacing:0.1em;">STEP 4</div>
        <div style="font-size:1.5rem;">⏱️</div>
        <div style="font-size:0.85rem; font-weight:700; color:#e2e8f0;">서비스 가동률</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px;">
        <div style="font-size:0.65rem; color:rgba(148,163,184,0.85); line-height:1.4;">99.9% 가동률을 유지하고 있습니다.</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;">
    <div style="font-size:1.5rem;font-weight:800;color:#f1f5f9;text-shadow:0 2px 12px rgba(0,0,0,0.4);">2025년 성과 하이라이트</div>
  </div>
</div></div>
</body></html>

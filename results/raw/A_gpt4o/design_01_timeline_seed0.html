<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #0d0f2b;
    color: white;
  }
  .container {
    width: 1280px;
    height: 720px;
    display: grid;
    grid-template-rows: 1fr 6fr;
    align-items: center;
    justify-items: center;
  }
  .title {
    font-size: 2em;
    text-align: center;
    margin-bottom: 20px;
  }
  .description {
    font-size: 1.2em;
    text-align: center;
    margin-bottom: 40px;
  }
  .steps {
    display: flex;
    justify-content: space-between;
    width: 80%;
  }
  .step {
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 20px;
    width: 20%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    text-align: center;
  }
  .emoji {
    font-size: 2em;
    margin-bottom: 10px;
  }
  .step-title {
    font-size: 1.5em;
    margin-bottom: 10px;
  }
  .step-description {
    font-size: 1em;
  }
</style>

<div class="container">
  <div>
    <div class="title">디지털 전환 로드맵 2025</div>
    <div class="description">4단계 전환 마일스톤과 핵심 목표</div>
  </div>
  <div class="steps">
    <div class="step">
      <div class="emoji">📊</div>
      <div class="step-title">현황 진단</div>
      <div class="step-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
    </div>
    <div class="step">
      <div class="emoji">🏗️</div>
      <div class="step-title">기반 구축</div>
      <div class="step-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
    </div>
    <div class="step">
      <div class="emoji">🔄</div>
      <div class="step-title">프로세스 혁신</div>
      <div class="step-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
    </div>
    <div class="step">
      <div class="emoji">🚀</div>
      <div class="step-title">스케일업</div>
      <div class="step-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    background-color: #0e1a3a;
    color: white;
    width: 1280px;
    height: 720px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    display: flex;
    flex-direction: row;
    border: 2px solid #bd9b5e;
    padding: 20px;
    max-width: 1200px;
    width: 100%;
  }
  .left-panel {
    flex: 1;
    padding: 20px;
    border-right: 2px solid #bd9b5e;
  }
  .right-panel {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .hero-value {
    font-size: 56px;
    font-weight: bold;
    color: #bd9b5e;
  }
  .hero-label {
    font-size: 24px;
    color: #bd9b5e;
  }
  .stat {
    display: flex;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: bold;
    color: #bd9b5e;
    margin-right: 10px;
  }
  .stat-label {
    font-size: 18px;
    color: #bd9b5e;
  }
</style>
<div class="container">
  <div class="left-panel">
    <div class="title">2025년 성과 하이라이트</div>
    <div class="hero-value">300%</div>
    <div class="hero-label">생산성 향상</div>
  </div>
  <div class="right-panel">
    <div class="stat">
      <div class="stat-value">🏢 150+</div>
      <div class="stat-label">도입 기업</div>
    </div>
    <div class="stat">
      <div class="stat-value">👤 50K+</div>
      <div class="stat-label">월간 활성 사용자</div>
    </div>
    <div class="stat">
      <div class="stat-value">📄 2M+</div>
      <div class="stat-label">처리 문서 수</div>
    </div>
    <div class="stat">
      <div class="stat-value">⏱️ 99.9%</div>
      <div class="stat-label">서비스 가동률</div>
    </div>
  </div>
</div></div>
</body></html>

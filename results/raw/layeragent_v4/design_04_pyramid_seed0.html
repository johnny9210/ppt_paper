    pointer-events: none;

  .triangle {
    position: absolute;
    top: 20%;
    left: 40%;
    width: 0;
    height: 0;
    border-left: 60px solid transparent;
    border-right: 60px solid transparent;
    border-bottom: 100px solid rgba(211, 194, 164, 0.5);
    transform: rotate(15deg);
  }

  .hexagon {
    position: absolute;
    top: 50%;
    left: 60%;
    width: 100px;
    height: 58px;
    background-color: rgba(211, 194, 164, 0.5);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    transform: rotate(-10deg);
  }

  .diamond {
    position: absolute;
    top: 70%;
    left: 30%;
    width: 100px;
    height: 100px;
    background-color: transparent;
    border: 2px solid rgba(211, 194, 164, 0.5);
    transform: rotate(45deg);
  }
</style>

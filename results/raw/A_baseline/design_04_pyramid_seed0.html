<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #292E43;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
        }
        .box {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .title {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .description {
            font-size: 16px;
        }
        .crown {
            position: absolute;
            top: 20px;
            left: calc(50% - 100px);
            width: 200px;
        }
        .tactic {
            position: absolute;
            top: 200px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .tactic .box {
            width: 300px;
            margin: 0 20px;
        }
        .operational {
            position: absolute;
            top: 450px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .operational .box {
            width: 280px;
            margin: 0 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="crown box">
        <div class="title">👑 데이터 전략</div>
        <div class="description">경영진 주도 데이터 비전 및 정책 수립</div>
    </div>
    <div class="tactic">
        <div class="box">
            <div class="title">📋 품질 관리</div>
            <div class="description">데이터 표준화 및 품질 모니터링</div>
        </div>
        <div class="box">
            <div class="title">🔐 보안 통제</div>
            <div class="description">접근 권한 및 개인정보 보호</div>
        </div>
    </div>
    <div class="operational">
        <div class="box">
            <div class="title">🗄️ 수집</div>
            <div class="description">원천 데이터 통합</div>
        </div>
        <div class="box">
            <div class="title">⚙️ 처리</div>
            <div class="description">ETL 파이프라인</div>
        </div>
        <div class="box">
            <div class="title">📈 분석</div>
            <div class="description">BI 대시보드 운영</div>
        </div>
    </div>
</div>

</body>
</html></div>
</body></html>

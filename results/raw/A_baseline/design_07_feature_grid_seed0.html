<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #1e1f39;
  }

  .container {
    width: 1280px;
    height: 720px;
    display: grid;
    grid-template-rows: 0.2fr 1fr;
    gap: 10px;
    padding: 20px;
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    margin: 0;
    padding: 10px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
    border-radius: 5px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }

  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .feature {
    background: linear-gradient(145deg, #29315b, #1f2647);
    border-radius: 10px;
    box-shadow: 4px 4px 10px #181a31, -4px -4px 10px #1f213d;
    padding: 10px;
    position: relative;
  }

  .feature h2 {
    margin: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .feature p {
    font-size: 14px;
    line-height: 1.4;
    opacity: 0.8;
  }

  .tag {
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding: 5px 10px;
    background-color: #61afef;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    color: #1e1f39;
  }
</style>

<div class="container">
  <h1>플랫폼 핵심 기능</h1>
  <div class="features">
    <div class="feature">
      <h2>💬 AI 채팅</h2>
      <p>멀티턴 대화형 AI 어시스턴트</p>
      <div class="tag">Core</div>
    </div>
    <div class="feature">
      <h2>🔄 워크플로우</h2>
      <p>노코드 업무 자동화 빌더</p>
      <div class="tag">Automation</div>
    </div>
    <div class="feature">
      <h2>📄 문서 처리</h2>
      <p>PDF/엑셀 자동 분석 및 요약</p>
      <div class="tag">RAG</div>
    </div>
    <div class="feature">
      <h2>📊 데이터 분석</h2>
      <p>자연어 SQL 변환 및 시각화</p>
      <div class="tag">Analytics</div>
    </div>
    <div class="feature">
      <h2>🎨 PPT 생성</h2>
      <p>AI 기반 프레젠테이션 자동 생성</p>
      <div class="tag">Creative</div>
    </div>
    <div class="feature">
      <h2>🔗 API 연동</h2>
      <p>외부 시스템 MCP 연결</p>
      <div class="tag">Integration</div>
    </div>
  </div>
</div></div>
</body></html>

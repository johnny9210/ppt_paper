<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #1a1a2e;
    color: #ffffff;
  }

  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
  }

  .title-section {
    flex: 1;
    max-width: 600px;
    padding: 20px;
    background-color: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
  }

  .stats-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding-left: 40px;
  }

  .hero-value {
    font-size: 100px;
    font-weight: bold;
    color: #f0ab00;
  }

  .hero-label {
    font-size: 24px;
    font-weight: bold;
    color: #e0e0e0;
  }

  .stat {
    margin: 16px 0;
    padding: 16px;
    background-color: #23233a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat-emoji {
    font-size: 36px;
    margin-right: 16px;
  }

  .stat-value {
    font-size: 36px;
    color: #f0ab00;
  }

  .stat-label {
    font-size: 18px;
    color: #e0e0e0;
  }
</style>

<div class="container">
  <div class="title-section">
    <div class="hero-value">300%</div>
    <div class="hero-label">생산성 향상</div>
  </div>
  <div class="stats-section">
    <div class="stat">
      <div class="stat-emoji">🏢</div>
      <div>
        <div class="stat-value">150+</div>
        <div class="stat-label">도입 기업</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-emoji">👤</div>
      <div>
        <div class="stat-value">50K+</div>
        <div class="stat-label">월간 활성 사용자</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-emoji">📄</div>
      <div>
        <div class="stat-value">2M+</div>
        <div class="stat-label">처리 문서 수</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-emoji">⏱️</div>
      <div>
        <div class="stat-value">99.9%</div>
        <div class="stat-label">서비스 가동률</div>
      </div>
    </div>
  </div>
</div></div>
</body></html>

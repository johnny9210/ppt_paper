<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #0b0e24;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
  }
  .container {
    width: 1280px;
    height: 720px;
    position: relative;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .glow-line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #00f6ff, #ff00ff);
    box-shadow: 0 0 20px #00f6ff;
    z-index: 1;
  }
  .glow-circle {
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #00f6ff, #ff00ff, transparent);
    border-radius: 50%;
    box-shadow: 0 0 15px #00f6ff;
    z-index: 2;
  }
  .card {
    flex: 1;
    max-width: 300px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 246, 255, 0.5);
    padding: 20px;
    text-align: center;
    z-index: 1;
  }
  .emoji {
    font-size: 30px;
    margin-bottom: 15px;
  }
  .card-title {
    font-size: 18px;
    margin: 10px 0;
    font-weight: bold;
    text-transform: uppercase;
  }
  .card-description {
    font-size: 16px;
  }
  .title {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    z-index: 2;
  }
  .subtitle {
    position: absolute;
    top: 60px;
    width: 100%;
    text-align: center;
    font-size: 18px;
    z-index: 2;
  }
</style>

<div class="container">
  <div class="glow-line"></div>
  <div class="title">디지털 전환 로드맵 2025</div>
  <div class="subtitle">4단계 전환 마일스톤과 핵심 목표</div>
  <div class="glow-circle" style="left: calc(12.5% - 25px);"></div>
  <div class="glow-circle" style="left: calc(37.5% - 25px);"></div>
  <div class="glow-circle" style="left: calc(62.5% - 25px);"></div>
  <div class="glow-circle" style="left: calc(87.5% - 25px);"></div>
  <div class="card">
    <div class="emoji">📊</div>
    <div class="card-title">현황 진단</div>
    <div class="card-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
  </div>
  <div class="card">
    <div class="emoji">🏗️</div>
    <div class="card-title">기반 구축</div>
    <div class="card-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
  </div>
  <div class="card">
    <div class="emoji">🔄</div>
    <div class="card-title">프로세스 혁신</div>
    <div class="card-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
  </div>
  <div class="card">
    <div class="emoji">🚀</div>
    <div class="card-title">스케일업</div>
    <div class="card-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
  </div>
</div></div>
</body></html>

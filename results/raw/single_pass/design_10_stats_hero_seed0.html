<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: #0b0d3e;
  }
  .container {
    width: 1280px;
    height: 720px;
    position: relative;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hero-section {
    flex: 3;
    color: white;
    padding: 30px;
    backdrop-filter: brightness(1.1);
  }
  .hero-title {
    color: #d4af37;
    font-size: 48px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .hero-label {
    font-size: 28px;
  }
  .stats-section {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-right: 30px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 10px;
    color: #ffffff;
    backdrop-filter: blur(10px);
  }
  .stat-emoji {
    font-size: 24px;
    margin-right: 10px;
  }
  .stat-value {
    font-size: 24px;
    color: #d4af37;
    font-weight: bold;
  }
  .stat-label {
    font-size: 18px;
  }
</style>

<div class="container">
  <div class="hero-section">
    <div class="hero-title">2025년 성과 하이라이트</div>
    <div class="hero-value" style="font-size: 80px; color: #d4af37;">300%</div>
    <div class="hero-label">생산성 향상</div>
  </div>
  <div class="stats-section">
    <div class="stat-item">
      <div class="stat-emoji">🏢</div>
      <div><span class="stat-value">150+</span> <span class="stat-label">도입 기업</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-emoji">👤</div>
      <div><span class="stat-value">50K+</span> <span class="stat-label">월간 활성 사용자</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-emoji">📄</div>
      <div><span class="stat-value">2M+</span> <span class="stat-label">처리 문서 수</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-emoji">⏱️</div>
      <div><span class="stat-value">99.9%</span> <span class="stat-label">서비스 가동률</span></div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f7f7f7;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background-color: white;
    padding: 40px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  }
  .title {
    font-size: 32px;
    color: #004d40;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #9e9e9e;
    margin-bottom: 50px;
  }
  .chart {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 400px;
    margin-bottom: 20px;
  }
  .bar-group {
    text-align: center;
  }
  .bar {
    width: 60px;
    margin-bottom: 5px;
    border-radius: 8px;
  }
  .year1 {
    background: #aed581;
    height: 200px;
  }
  .year3 {
    background: #388e3c;
    height: 260px;
  }
  .label {
    font-size: 16px;
    color: #333;
    margin-top: 10px;
  }
  .footer {
    font-size: 14px;
    color: #9e9e9e;
    text-align: right;
  }
</style>

<div class="slide">
  <div class="title">Customer LTV grew 31% YoY across all 5 cohorts</div>
  <div class="description">LTV by acquisition cohort</div>
  <div class="chart">
    <div class="bar-group">
      <div class="bar year1"></div>
      <div class="bar year3"></div>
      <div class="label">📊 2021</div>
    </div>
    <div class="bar-group">
      <div class="bar year1"></div>
      <div class="bar year3"></div>
      <div class="label">📊 2022</div>
    </div>
    <div class="bar-group">
      <div class="bar year1"></div>
      <div class="bar year3"></div>
      <div class="label">📊 2023</div>
    </div>
    <div class="bar-group">
      <div class="bar year1"></div>
      <div class="bar year3"></div>
      <div class="label">📊 2024</div>
    </div>
    <div class="bar-group">
      <div class="bar year1"></div>
      <div class="bar year3"></div>
      <div class="label">📊 2025</div>
    </div>
  </div>
  <div class="footer">Source: Cohort LTV model, Dec 2025</div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            overflow: hidden;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #fff;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            color: #3e3e3e;
            margin: 40px;
        }
        .description {
            font-size: 24px;
            color: #7d7d7d;
            margin: 0 40px;
        }
        .process {
            width: 80%;
            margin: 100px auto;
            display: flex;
            justify-content: space-between;
        }
        .step {
            flex: 1;
            margin: 0 10px;
            position: relative;
            text-align: center;
            background-color: #d3d3d3;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .step:nth-child(2n) {
            background-color: #a31645;
            color: #fff;
        }
        .step .arrow {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 20px solid #d3d3d3;
            position: absolute;
            top: 50%;
            right: -30px;
            transform: translateY(-50%);
        }
        .step:nth-child(2n) .arrow {
            border-top-color: #a31645;
        }
        .summary {
            position: absolute;
            right: 40px;
            top: calc(50% - 50px);
            text-align: center;
            color: #a31645;
            font-size: 28px;
        }
        .summary .detail {
            margin-top: 10px;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Optimized order-to-cash cycle compresses to 4.2 days from 9.1</div>
        <div class="description">O2C process redesign</div>
        <div class="process">
            <div class="step">Order<br><span>1.0 day</span><div class="arrow"></div></div>
            <div class="step">Validate<br><span>0.4 days<br>↓ (-50%)</span><div class="arrow"></div></div>
            <div class="step">Pack<br><span>1.2 days<br>↓ (-67%)</span><div class="arrow"></div></div>
            <div class="step">Ship<br><span>1.0 day</span><div class="arrow"></div></div>
            <div class="step">Invoice<br><span>0.6 days<br>↓ (-40%)</span></div>
        </div>
        <div class="summary">
            ↓ 4.9 days (-54%)
            <div class="detail">4.2 days<br><span style="font-size: 22px;color: #7d7d7d;">(was 9.1)</span></div>
        </div>
    </div>
</body>
</html></div>
</body></html>

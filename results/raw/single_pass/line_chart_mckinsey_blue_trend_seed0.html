<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fff;
    }
    .container {
        width: 1280px;
        height: 720px;
        position: relative;
        display: flex;
        flex-direction: column;
    }
    .header {
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        color: #1a2c4b;
    }
    .description {
        font-size: 18px;
        color: #1a2c4b;
        text-align: center;
    }
    .chart {
        width: 480px;
        height: 320px;
        background: linear-gradient(#eaeef2, #fff);
        margin: auto;
        border: 1px solid #ddd;
        position: relative;
    }
    .chart-title {
        font-size: 16px;
        color: #1a2c4b;
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
    }
    .line {
        stroke: #1a2c4b;
        stroke-width: 2;
        fill: none;
    }
    .point {
        fill: #1a2c4b;
    }
    .label {
        font-size: 14px;
        background: #1a2c4b;
        color: #fff;
        padding: 5px;
        border-radius: 5px;
        position: absolute;
        transform: translate(-50%, -50%);
    }
    .source {
        font-size: 12px;
        color: #555;
        text-align: right;
        padding: 10px;
        position: absolute;
        bottom: 0;
        right: 20px;
    }
</style>
<div class="container">
    <div class="header">Monthly active users tripled from 1.2M to 3.6M over 24 months</div>
    <div class="description">MAU trajectory, Jan 2024 - Dec 2025</div>
    <div class="chart">
        <div class="chart-title">MAU trajectory, Jan 2024 - Dec 2025</div>
        <svg width="100%" height="100%">
            <polyline class="line" points="10,270 120,160 240,110 360,70" />
            <circle class="point" cx="10" cy="270" r="5"></circle>
            <circle class="point" cx="120" cy="160" r="5"></circle>
            <circle class="point" cx="240" cy="110" r="5"></circle>
            <circle class="point" cx="360" cy="70" r="5"></circle>
        </svg>
        <div class="label" style="left: 120px; top: 150px;">‘Q3 2024 launch’</div>
        <div class="label" style="left: 240px; top: 100px;">‘Q1 2025 paid acquisition’</div>
    </div>
    <div class="source">Source: Product analytics, Dec 2025</div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    width: 1280px;
    height: 720px;
    background-color: #f8f5f2;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0;
  }
  .title {
    font-size: 36px;
    font-weight: bold;
    color: #222;
  }
  .description {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 30px;
  }
  .workflow {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step {
    text-align: center;
    margin: 0 20px;
  }
  .circle {
    width: 60px;
    height: 60px;
    background-color: #a14423;
    color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    margin-bottom: 10px;
  }
  .arrow {
    color: #a14423;
    font-size: 24px;
    margin: 0 10px;
  }
  .footer {
    position: absolute;
    bottom: 20px;
    font-size: 14px;
    color: #555;
  }
</style>

<div class="title">Marketing campaign cycle spans 6 stages over 8 weeks</div>
<div class="description">Campaign development workflow</div>
<div class="workflow">
  <div class="step">
    <div class="circle">1</div>
    <div>Brief</div>
  </div>
  <div class="arrow">➔</div>
  <div class="step">
    <div class="circle">2</div>
    <div>Creative</div>
  </div>
  <div class="arrow">➔</div>
  <div class="step">
    <div class="circle">3</div>
    <div>Approval</div>
  </div>
  <div class="arrow">➔</div>
  <div class="step">
    <div class="circle">4</div>
    <div>Production</div>
  </div>
  <div class="arrow">➔</div>
  <div class="step">
    <div class="circle">5</div>
    <div>Launch</div>
  </div>
  <div class="arrow">➔</div>
  <div class="step">
    <div class="circle">6</div>
    <div>Measure</div>
  </div>
</div>
<div class="footer">Source: Marketing ops handbook, 2025 | Page 5</div></div>
</body></html>

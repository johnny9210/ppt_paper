<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="width: 1280px; height: 720px; background-color: white; font-family: Arial, sans-serif; position: relative; padding: 40px;">
    <div style="font-size: 36px; font-weight: bold; color: black;">Our market share grew while top 2 competitors lost ground</div>
    <div style="font-size: 24px; color: #666; margin-bottom: 40px;">Market share by quarter, top 4 players</div>
    
    <div style="position: absolute; bottom: 60px; left: 40px; right: 40px; height: 400px; border-left: 2px solid #ccc; border-bottom: 2px solid #ccc;">
        <div style="position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-around; height: 40px; font-size: 14px; color: #777;">
            <div>Q1 Y1</div> <div>Q2 Y1</div> <div>Q3 Y1</div> <div>Q4 Y1</div>
            <div>Q1 Y2</div> <div>Q2 Y2</div> <div>Q3 Y2</div> <div>Q4 Y2</div>
            <div>Q1 Y3</div> <div>Q2 Y3</div> <div>Q3 Y3</div> <div>Q4 Y3</div>
        </div>
        
        <div style="position: absolute; left: -30px; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; font-size: 14px; color: #777;">
            <div style="transform: translateY(50%);">40%</div>
            <div>30%</div>
            <div>20%</div>
            <div>10%</div>
            <div>0%</div>
        </div>

        <div style="position: absolute; bottom: 0; left: 0; height: 3px; width: 9%; background-color: #005f3c; transition: width 0.3s;"></div>
        <div style="position: absolute; border-left: 3px solid #005f3c; border-radius: 8px; background-color: #fff; width: 10px; height: 10px; left: 9%; bottom: 20%;"></div>

        <div style="position: absolute; bottom: 20%; left: 0; height: 4px; width: 10%; background-color: #ccc; transform: rotate(-5deg); transition: width 0.3s;"></div>
        <div style="position: absolute; border-left: 3px solid #444; border-radius: 8px; background-color: #fff; width: 10px; height: 10px; left: 9%; bottom: 30%;"></div>

        <div style="position: absolute; bottom: 17%; left: 0; height: 4px; width: 11%; background-color: #bbb; transform: rotate(-8deg); transition: width 0.3s;"></div>
        <div style="position: absolute; border-left: 3px solid #888; border-radius: 8px; background-color: #fff; width: 10px; height: 10px; left: 9%; bottom: 27%;"></div>

        <div style="position: absolute; bottom: 45px; right: 120px; font-size: 16px; color: #005f3c;">27% (Q4 Y3)</div>
    </div>

    <div style="position: absolute; right: 40px; top: 120px; font-size: 18px;">
        <div style="display: flex; align-items: center; margin-bottom: 8px;">
            <div style="width: 20px; height: 20px; background-color: #005f3c; margin-right: 10px;"></div> Our Firm
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 8px;">
            <div style="width: 20px; height: 20px; background-color: #444; margin-right: 10px;"></div> Competitor A
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 8px;">
            <div style="width: 20px; height: 20px; background-color: #888; margin-right: 10px;"></div> Competitor B
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 8px;">
            <div style="width: 20px; height: 20px; background-color: #bbb; margin-right: 10px;"></div> Competitor C
        </div>
    </div>

    <div style="position: absolute; bottom: 20px; left: 40px; font-size: 12px; color: #777;">
        Source: Industry tracker, 2025
    </div>

    <div style="position: absolute; bottom: 20px; right: 40px; font-size: 12px; color: #777;">
        14
    </div>
</div></div>
</body></html>

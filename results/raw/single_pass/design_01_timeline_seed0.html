<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, #1e1e40, #090918);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .container {
    width: 1280px;
    height: 720px;
    background: linear-gradient(145deg, #1e1e40, #1a1a38);
    padding: 20px;
    box-shadow: 0 0 20px #0008;
    border-radius: 12px;
    backdrop-filter: blur(4px);
    position: relative;
    overflow: hidden;
  }

  .title {
    font-size: 30px;
    text-align: center;
    margin-bottom: 20px;
  }

  .description {
    font-size: 18px;
    text-align: center;
    margin-bottom: 40px;
  }

  .milestone {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .item {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 15px rgba(72, 128, 255, 0.5);
  }

  .item:before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 130%;
    height: 130%;
    background: rgba(72, 128, 255, 0.2);
    transform: translate(-50%, -50%);
    filter: blur(15px);
    border-radius: 50%;
    z-index: -1;
  }

  .emoji {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .step-title {
    font-size: 20px;
    margin-bottom: 10px;
  }

  .step-description {
    font-size: 14px;
  }
</style>
<div class="container">
  <div class="title">디지털 전환 로드맵 2025</div>
  <div class="description">4단계 전환 마일스톤과 핵심 목표</div>
  <div class="milestone">
    <div class="item">
      <div class="emoji">📊</div>
      <div class="step-title">현황 진단</div>
      <div class="step-description">레거시 시스템 분석 및 디지털 성숙도 평가</div>
    </div>
    <div class="item">
      <div class="emoji">🏗️</div>
      <div class="step-title">기반 구축</div>
      <div class="step-description">클라우드 마이그레이션 및 API 플랫폼 설계</div>
    </div>
    <div class="item">
      <div class="emoji">🔄</div>
      <div class="step-title">프로세스 혁신</div>
      <div class="step-description">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
    </div>
    <div class="item">
      <div class="emoji">🚀</div>
      <div class="step-title">스케일업</div>
      <div class="step-description">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f5f5f5;
    margin: 0;
  }

  .container {
    width: 1280px;
    height: 720px;
    background-color: white;
    border: 2px solid #eaeaea;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
    padding: 20px;
    box-sizing: border-box;
  }

  .title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #000;
  }

  .description {
    font-size: 18px;
    color: #777;
    margin-bottom: 20px;
  }

  .pipeline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .step {
    width: 140px;
    text-align: center;
    background-color: #fff;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }

  .step-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
  }

  .step-data {
    font-size: 14px;
    color: #555;
    margin-bottom: 10px;
  }

  .arrow {
    width: 0; 
    height: 0; 
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 20px solid #58b760;
    margin: 0 auto;
  }
  
  .convert {
    font-size: 14px;
    color: #58b760;
    margin-top: 5px;
  }

  .highlight {
    background-color: #58b760;
    color: white;
    padding: 5px 10px;
    border-radius: 10px;
    margin-top: 10px;
  }
</style>

<div class="container">
  <div class="title">Six-step GTM motion converts 22% of qualified leads</div>
  <div class="description">Sales pipeline workflow</div>
  <div class="pipeline">
    <div class="step">
      <div class="step-title">Awareness</div>
      <div class="step-data">10,000 Leads</div>
      <div class="arrow"></div>
      <div class="convert">70% Convert</div>
    </div>
    <div class="step">
      <div class="step-title">Interest</div>
      <div class="step-data">7,000 Leads</div>
      <div class="arrow"></div>
      <div class="convert">60% Convert</div>
    </div>
    <div class="step">
      <div class="step-title">Qualification</div>
      <div class="step-data">4,200 Leads</div>
      <div class="arrow"></div>
      <div class="convert">50% Convert</div>
    </div>
    <div class="step">
      <div class="step-title">Evaluation</div>
      <div class="step-data">2,100 Leads</div>
      <div class="arrow"></div>
      <div class="convert">40% Convert</div>
    </div>
    <div class="step">
      <div class="step-title">Decision</div>
      <div class="step-data">840 Leads</div>
      <div class="arrow"></div>
      <div class="convert">65% Convert</div>
    </div>
    <div class="step">
      <div class="step-title">Onboarding</div>
      <div class="step-data">546 Customers</div>
      <div class="highlight">Total 22% Conversion</div>
    </div>
  </div>
</div></div>
</body></html>

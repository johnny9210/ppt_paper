<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    width: 1280px;
    height: 720px;
    background: #fff;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    position: relative;
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #666;
    margin-bottom: 20px;
  }
  .quadrant {
    display: flex;
    justify-content: space-around;
    height: 90%;
    border: 2px solid #ccc;
    position: relative;
  }
  .axis-label {
    position: absolute;
    font-size: 14px;
    color: #999;
  }
  .axis-vertical {
    left: -50px;
    top: 50%;
    transform: rotate(-90deg);
  }
  .axis-horizontal {
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
  }
  .circle {
    border-radius: 50%;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
  .largest {
    width: 110px;
    height: 110px;
    background: linear-gradient(145deg, #4caf50, #66bb6a);
    left: 60%;
    top: 20%;
  }
  .bcg-green {
    width: 90px;
    height: 90px;
    background: linear-gradient(145deg, #66bb6a, #81c784);
  }
  .light-green {
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, #81c784, #a5d6a7);
  }
  .gray {
    width: 80px;
    height: 80px;
    background: linear-gradient(145deg, #bdbdbd, #e0e0e0);
    color: #333;
  }
  .top-left { left: 10%; top: 10%; }
  .mid-top { left: 50%; top: 10%; transform: translateX(-50%); }
  .mid-center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .bottom-right { right: 10%; bottom: 10%; }
  .highlight {
    position: absolute;
    background: #fafafa;
    padding: 10px;
    border: 2px solid #4caf50;
    font-weight: bold;
    color: #333;
    left: 50%;
    top: 80%;
    transform: translateX(-50%);
  }
</style>
<div class="container">
  <div class="title">Three product lines are in the Stars quadrant, justifying 70% of capex</div>
  <div class="description">BCG Growth-Share Matrix</div>
  <div class="quadrant">
    <div class="axis-label axis-vertical">Market Growth Rate</div>
    <div class="axis-label axis-horizontal">Market Share</div>
    <div class="circle largest">ProdA</div>
    <div class="circle bcg-green mid-top">ProdC</div>
    <div class="circle light-green bottom-right">ProdD</div>
    <div class="circle light-green bottom-right top-left">ProdE</div>
    <div class="circle gray top-left mid-center">ProdF</div>
  </div>
  <div class="highlight">Stars drive 70% of Revenue & Capex</div>
</div></div>
</body></html>

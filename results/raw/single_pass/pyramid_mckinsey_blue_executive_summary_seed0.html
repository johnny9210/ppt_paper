<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Priorities</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f8f8f8;
        }
        .container {
            width: 1280px;
            height: 720px;
            background: #fff;

            font-size: 1.4em;

            margin-bottom: 20px;
        }
        .title, .level {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            border: 2px solid #005792;
            padding: 10px 20px;
            margin: 20px 10px;
            border-radius: 8px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .level {
            flex-direction: column;
        }

            width: 2px;
            height: 20px;
            background: #005792;
            position: absolute;
            top: -25px;
        }

    <div class="container">
        <h1>Three strategic priorities support our 2026 growth ambition</h1>
        <div class="title">Executive summary</div>
        <div class="level">
            <div class="arrow"></div>

        </div>
        <div class="level">

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    width: 1280px;
    height: 720px;
    padding: 50px;
    box-sizing: border-box;
  }
  .title {
    font-size: 28px;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #666;
    margin-bottom: 40px;
  }
  .chart {
    display: flex;
    align-items: flex-end;
    height: 400px;
  }
  .bar {
    width: 120px;
    position: relative;
    margin-right: 20px;
    text-align: center;
    color: #fff;
  }
  .cogs {
    height: 180px;
    background-color: #003366;
  }
  .pricing {
    height: 90px;
    background-color: #003366;
  }
  .sga {
    height: 40px;
    background-color: #999;
  }
  .mix {
    height: 90px;
    background-color: #003366;
  }
  .value {
    position: absolute;
    bottom: 10px;
    width: 100%;
  }
  .startEnd {
    background-color: #003366;
    color: #fff;
    height: 124px;
  }
  .text {
    color: black;
    font-size: 22px;
  }
</style>
<div class="container">
  <div class="title">Operating margin expanded 320 bps driven primarily by COGS reduction</div>
  <div class="description">FY2024 → FY2025 margin bridge</div>
  <div class="chart">
    <div class="bar startEnd">
      <div class="value">12.4%</div>
    </div>
    <div class="bar cogs">
      <div class="value">+180 bps</div>
    </div>
    <div class="bar pricing">
      <div class="value">+90 bps</div>
    </div>
    <div class="bar sga">
      <div class="value">-40 bps</div>
    </div>
    <div class="bar mix">
      <div class="value">+90 bps</div>
    </div>
    <div class="bar startEnd">
      <div class="value">15.6%</div>
    </div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f4f8;
  }
  .container {
    position: relative;
    width: 1280px;
    height: 720px;
    background-color: white;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    padding: 20px;
  }
  .title {
    font-size: 32px;
    font-weight: bold;
    color: #333;
  }
  .description {
    font-size: 18px;
    color: #666;
    margin-bottom: 40px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    align-items: center;
    height: calc(100% - 100px);
  }
  .circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background-color: #63a4ff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 16px;
    margin: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }
  .circle:nth-child(3), .circle:nth-child(4), .circle:nth-child(5), .circle:nth-child(6) {
    background-color: #cbcfd6;
  }
</style>
<div class="container">
  <div class="title">Quadrant analysis isolates 4 high-priority investments</div>
  <div class="description">Strategic investment prioritization</div>
  <div class="grid">
    <div class="circle">🟢 Initiative 1</div>
    <div class="circle">🟢 Initiative 2</div>
    <div class="circle">🟢 Initiative 3</div>
    <div class="circle">🟢 Initiative 4</div>
    <div class="circle">🟢 Initiative 5</div>
    <div class="circle">🟢 Initiative 6</div>
  </div>
</div></div>
</body></html>

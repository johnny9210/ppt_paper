<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f8f8;
  }
  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
  }
  .title {
    font-size: 32px;
    color: #8B0000;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #808080;
    margin-bottom: 50px;
  }
  .grid {
    position: relative;
    width: 800px;
    height: 400px;
    border-right: 2px solid #ccc;
    border-top: 2px solid #ccc;
  }
  .axis-label {
    position: absolute;
    color: #808080;
    font-size: 16px;
  }
  .axis-label.vertical {
    left: -60px;
    top: 150px;
    transform: rotate(-90deg);
  }
  .axis-label.horizontal {
    left: 350px;
    top: 420px;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: bold;
  }
  .vendor-b {
    background-color: #b22222;
    width: 140px;
    height: 140px;
    left: 520px;
    top: 50px;
  }
  .vendor-a {
    background-color: #808080;
    width: 100px;
    height: 100px;
    left: 180px;
    top: 40px;
  }
  .vendor-c {
    background-color: #808080;
    width: 80px;
    height: 80px;
    left: 95px;
    top: 300px;
  }
  .vendor-d {
    background-color: #808080;
    width: 80px;
    height: 80px;
    left: 250px;
    top: 300px;
  }
  .vendor-e {
    background-color: #808080;
    width: 100px;
    height: 100px;
    left: 550px;
    top: 300px;
  }
  .vendor-f {
    background-color: #808080;
    width: 80px;
    height: 80px;
    left: 400px;
    top: 270px;
  }
</style>

<div class="container">
  <div class="title">Vendor B owns the High-Capability / High-Stability sweet spot</div>
  <div class="description">Competitive landscape map</div>
  <div class="grid">
    <div class="axis-label vertical">Capability</div>
    <div class="axis-label horizontal">Stability</div>
    <div class="bubble vendor-b">Vendor B 🟢</div>
    <div class="bubble vendor-a">Vendor A 🟢</div>
    <div class="bubble vendor-c">Vendor C 🟢</div>
    <div class="bubble vendor-d">Vendor D 🟢</div>
    <div class="bubble vendor-e">Vendor E 🟢</div>
    <div class="bubble vendor-f">Vendor F 🟢</div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f7f8fa;
  }
  .container {
    width: 1280px;
    height: 720px;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    position: relative;
    box-sizing: border-box;
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .description {
    font-size: 18px;
    color: #666;
    margin-bottom: 50px;
  }
  .chart {
    display: flex;
    align-items: flex-end;
    height: 400px;
    width: 100%;
  }
  .bar {
    width: 160px;
    margin-right: 10px;
    border-radius: 6px 6px 0 0;
    position: relative;
  }
  .bar1 {
    height: 160px;
    background-color: #232c39;
  }
  .bar2 {
    height: 94px;
    background-color: #394452;
  }
  .bar3 {
    height: 60px;
    background-color: #9eaab5;
  }
  .bar4 {
    height: 40px;
    background-color: #c2c9d1;
  }
  .value {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    color: #fff;
  }
  .footer {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-size: 14px;
    color: #999;
  }
</style>

<div class="container">
  <div class="title">ARR grew 28% with $32M net new contributions despite $14M churn</div>
  <div class="description">Annual recurring revenue bridge</div>
  <div class="chart">
    <div class="bar bar1">
      <div class="value">$48M</div>
    </div>
    <div class="bar bar2">
      <div class="value">$76M</div>
    </div>
    <div class="bar bar3">
      <div class="value">$94M</div>
    </div>
    <div class="bar bar4">
      <div class="value">$80M</div>
    </div>
  </div>
  <div class="footer">Source: ARR snapshot, Dec 2025</div>
</div></div>
</body></html>

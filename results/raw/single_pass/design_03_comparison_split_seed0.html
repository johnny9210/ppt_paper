<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    position: relative;
  }
  .title {
    position: absolute;
    top: 30px;
    width: 1280px;
    text-align: center;
    font-size: 32px;
    color: #fff;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 0;
    border-radius: 10px;
  }
  .box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .box label {
    margin-bottom: 20px;
    font-size: 24px;
    text-shadow: 0 0 10px #fff;
  }
  .item {
    width: 450px;
    margin: 10px 0;
    backdrop-filter: blur(5px);
    background: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    font-size: 18px;
    display: flex;
    align-items: center;
  }
  .item:nth-child(odd) {
    background: rgba(10, 150, 252, 0.2);
    box-shadow: 0 0 15px rgba(10, 150, 252, 0.6);
  }
  .item:nth-child(even) {
    background: rgba(228, 96, 252, 0.2);
    box-shadow: 0 0 15px rgba(228, 96, 252, 0.6);
  }
  .vs-circle {
    width: 80px;
    height: 80px;
    backdrop-filter: blur(5px);
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    text-shadow: 0 0 20px #fff, 0 0 20px #fff;
  }
</style>
<div class="container">
  <div class="title">온프레미스 vs 클라우드 네이티브</div>
  <div class="box">
    <label>온프레미스</label>
    <div class="item">초기 투자비용 높음</div>
    <div class="item">확장에 수주~수개월 소요</div>
    <div class="item">보안 직접 관리 필요</div>
    <div class="item">유지보수 인력 상시 필요</div>
  </div>
  <div class="vs-circle">VS</div>
  <div class="box">
    <label>클라우드 네이티브</label>
    <div class="item">사용량 기반 과금</div>
    <div class="item">분 단위 자동 스케일링</div>
    <div class="item">관리형 보안 서비스</div>
    <div class="item">인프라 자동화로 인력 절감</div>
  </div>
</div></div>
</body></html>

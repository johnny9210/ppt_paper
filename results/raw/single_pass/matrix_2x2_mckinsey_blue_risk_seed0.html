<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f4f4f4;
  }
  .container {
    width: 1280px;
    height: 720px;
    background-color: white;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    padding: 20px;
    box-sizing: border-box;
  }
  .title {
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: bold;
  }
  .description {
    font-size: 18px;
    color: #555;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 20px;
    height: 100%;
  }
  .item {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 15px;
    background: linear-gradient(145deg, #e2e2e2, #ffffff);
    box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
    transition: 0.3s;
  }
  .item:hover {
    box-shadow: 10px 10px 15px #bbb, -10px -10px 15px #ffffff;
  }
  .emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
  }
  .item-title {
    font-size: 20px;
    font-weight: bold;
  }
  .item-description {
    font-size: 14px;
    color: #777;
  }
</style>

<div class="container">
  <div class="title">Two risk events fall in the High-Impact / High-Likelihood quadrant</div>
  <div class="description">Risk register prioritization</div>
  <div class="grid">
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R1</div>
        <div class="item-description">None</div>
      </div>
    </div>
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R2</div>
        <div class="item-description">None</div>
      </div>
    </div>
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R3</div>
        <div class="item-description">None</div>
      </div>
    </div>
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R4</div>
        <div class="item-description">None</div>
      </div>
    </div>
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R5</div>
        <div class="item-description">None</div>
      </div>
    </div>
    <div class="item">
      <div>
        <span class="emoji">🟢</span>
        <div class="item-title">R6</div>
        <div class="item-description">None</div>
      </div>
    </div>
  </div>
</div></div>
</body></html>

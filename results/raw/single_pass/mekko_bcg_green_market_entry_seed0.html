<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background-color: #f8f9fa;
  }
  .container {
    width: 1280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .title {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .description {
    font-size: 20px;
    color: gray;
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 10px;
    width: 90%;
    height: 400px;
  }
  .column {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background-color: #008043;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    border-radius: 8px;
    padding: 10px;
  }
  .column:nth-child(3n+1) {
    background-color: #004f27;
  }
  .value-column {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background-color: #d4d4d4;
    color: black;
    font-size: 18px;
    line-height: 1.6;
    border-radius: 8px;
    padding: 10px;
  }
  .segment {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
  }
</style>
<div class="container">
  <div class="title">Premium and Mid-tier segments justify 73% of next-year marketing spend</div>
  <div class="description">Market size by segment × channel</div>
  <div class="grid">
    <div class="column" style="grid-column: span 3;">Online: $450M</div>
    <div class="column" style="grid-column: span 3;">Retail: $320M</div>
    <div class="column" style="grid-column: span 3;">Wholesale: $180M</div>
    <div class="column" style="grid-column: span 3;">B2B: $90M</div>
    <div class="column" style="grid-column: span 4;">Online: $800M</div>
    <div class="column" style="grid-column: span 4;">Retail: $650M</div>
    <div class="column" style="grid-column: span 4;">Wholesale: $400M</div>
    <div class="value-column" style="grid-column: span 3;">Online: $400M</div>
    <div class="value-column" style="grid-column: span 3;">Retail: $350M</div>
    <div class="value-column" style="grid-column: span 3;">Wholesale: $250M</div>
    <div class="value-column" style="grid-column: span 3;">B2B: $100M</div>
  </div>
  <div class="grid" style="margin-top: 15px;">
    <div class="segment" style="grid-column: span 3;">📐 Premium 28%</div>
    <div class="segment" style="grid-column: span 6;">📐 Mid 45%</div>
    <div class="segment" style="grid-column: span 3;">📐 Value 27%</div>
  </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            width: 1280px;
            height: 720px;
            background: #fff;
            color: #333;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        .title {
            font-size: 28px;
            color: #a32020;
            text-align: center;
            margin-bottom: 10px;
        }
        .description {
            font-size: 18px;
            color: #777;
            text-align: center;
            margin-bottom: 50px;
        }
        .chart {
            position: relative;
            margin-top: 30px;
            height: 400px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .bar {
            width: 80px;
            background-color: #d6d6d6;
            text-align: center;
            position: relative;
        }
        .bar.red {
            background-color: #c70039;
            color: #fff;
        }
        .bar span {
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .chart-title {
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .metrics {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">$120M cost reduction unlocks 4-pp margin gain by year 2</div>
        <div class="description">Cost-out program contribution</div>
        <div class="chart-title">Cost-out program contribution</div>
        <div class="chart">
            <div class="bar">
                <span>$820M</span>
            </div>
            <div class="bar red">
                <span>-45M</span>
            </div>
            <div class="bar red">
                <span>-40M</span>
            </div>
            <div class="bar red">
                <span>-25M</span>
            </div>
            <div class="bar red">
                <span>-10M</span>
            </div>
            <div class="bar">
                <span>$700M</span>
            </div>
        </div>
        <div class="metrics">
            🔁 Procurement(-$45M) | 🔁 Headcount(-$40M) | 🔁 Tech consolidation(-$25M) | 🔁 Real estate(-$10M)
        </div>
    </div>
</body>
</html></div>
</body></html>

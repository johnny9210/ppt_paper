<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050726;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Inter", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background:
      radial-gradient(circle at 28% 18%, rgba(57,236,255,.35), transparent 10%),
      radial-gradient(circle at 72% 18%, rgba(212,84,255,.28), transparent 11%),
      radial-gradient(circle at 14% 57%, rgba(46,233,255,.25), transparent 8%),
      radial-gradient(circle at 50% 58%, rgba(170,80,255,.15), transparent 16%),
      radial-gradient(circle at 66% 72%, rgba(46,233,255,.14), transparent 14%),
      linear-gradient(180deg, #07105b 0%, #07104d 30%, #050833 58%, #03051f 100%);
    border-radius: 6px;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(120,190,255,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,255,.16) 1px, transparent 1px);
    background-size: 74px 68px;
    opacity: .65;
    pointer-events: none;
  }

  .slide::after {
    content: "";
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 0;
    height: 42%;
    background:
      linear-gradient(rgba(120,190,255,.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,255,.2) 1px, transparent 1px);
    background-size: 76px 42px;
    transform: perspective(720px) rotateX(70deg);
    transform-origin: bottom;
    opacity: .52;
    filter: drop-shadow(0 -8px 12px rgba(68,222,255,.18));
    pointer-events: none;
  }

  .ambient {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ambient i {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #8eefff;
    box-shadow: 0 0 8px 2px rgba(110,236,255,.9), 0 0 20px 8px rgba(110,236,255,.35);
    opacity: .9;
  }
  .ambient i:nth-child(2n) {
    background: #d889ff;
    box-shadow: 0 0 8px 2px rgba(216,137,255,.9), 0 0 20px 8px rgba(216,137,255,.35);
  }
  .ambient i.s1 { left: 138px; top: 168px; }
  .ambient i.s2 { left: 502px; top: 99px; }
  .ambient i.s3 { left: 643px; top: 66px; }
  .ambient i.s4 { left: 785px; top: 98px; }
  .ambient i.s5 { left: 1154px; top: 169px; }
  .ambient i.s6 { left: 1093px; top: 596px; }
  .ambient i.s7 { left: 639px; top: 612px; }
  .ambient i.s8 { left: 217px; top: 636px; }
  .ambient i.s9 { left: 879px; top: 267px; }
  .ambient i.s10 { left: 999px; top: 347px; }
  .ambient i.s11 { left: 716px; top: 430px; }
  .ambient i.s12 { left: 934px; top: 508px; }

  .header {
    position: absolute;
    top: 34px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
  }
  .header .title {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: .02em;
    color: #f4fbff;
    text-shadow:
      0 0 8px rgba(125,239,255,.95),
      0 0 18px rgba(125,239,255,.45),
      0 0 34px rgba(212,110,255,.28);
  }
  .header .desc {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 500;
    color: rgba(220,244,255,.9);
    letter-spacing: .06em;
    text-shadow: 0 0 10px rgba(140,235,255,.3);
  }

  .timeline {
    position: absolute;
    top: 246px;
    left: 0;
    width: 100%;
    height: 24px;
    z-index: 2;
  }
  .timeline .beam {
    position: absolute;
    left: -24px;
    right: -24px;
    top: 50%;
    height: 12px;
    transform: translateY(-50%);
    background:
      linear-gradient(90deg,
        rgba(61,246,255,.98) 0%,
        rgba(163,233,255,.95) 22%,
        rgba(214,114,255,.95) 48%,
        rgba(132,248,255,.95) 68%,
        rgba(211,110,255,.98) 100%);
    box-shadow:
      0 0 10px rgba(85,243,255,.9),
      0 0 22px rgba(121,219,255,.75),
      0 0 42px rgba(201,106,255,.55);
  }

  .nodes {
    position: absolute;
    left: 0;
    top: 202px;
    width: 100%;
    height: 112px;
    z-index: 3;
  }

  .node {
    position: absolute;
    top: 0;
    width: 118px;
    height: 100px;
    transform: translateX(-50%);
  }

  .node::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 31px;
    width: 56px;
    height: 56px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(141,255,255,.7);
    background:
      radial-gradient(circle at 50% 50%, rgba(235,255,255,.95) 0%, rgba(118,246,255,.95) 22%, rgba(187,117,255,.85) 58%, rgba(255,255,255,.05) 72%);
    box-shadow:
      0 0 12px rgba(95,247,255,.95),
      0 0 28px rgba(95,247,255,.55),
      0 0 46px rgba(188,117,255,.38);
  }

  .node::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 31px;
    width: 86px;
    height: 86px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(117,239,255,.22);
    box-shadow:
      inset 0 0 14px rgba(126,246,255,.12),
      0 0 0 7px rgba(122,240,255,.06),
      0 0 22px rgba(122,240,255,.14);
  }

  .node.cyan::before {
    border-color: rgba(127,255,255,.75);
    background:
      radial-gradient(circle at 50% 50%, rgba(235,255,255,.96) 0%, rgba(93,245,255,.94) 26%, rgba(118,215,255,.75) 56%, rgba(255,255,255,.03) 74%);
    box-shadow:
      0 0 12px rgba(77,245,255,.95),
      0 0 28px rgba(77,245,255,.62),
      0 0 46px rgba(77,245,255,.32);
  }

  .node.magenta::before {
    border-color: rgba(214,142,255,.78);
    background:
      radial-gradient(circle at 50% 50%, rgba(245,251,255,.96) 0%, rgba(204,120,255,.9) 28%, rgba(112,244,255,.6) 57%, rgba(255,255,255,.03) 74%);
    box-shadow:
      0 0 12px rgba(205,112,255,.95),
      0 0 28px rgba(205,112,255,.62),
      0 0 46px rgba(205,112,255,.32);
  }

  .node .ring {
    position: absolute;
    left: 50%;
    top: 31px;
    width: 96px;
    height: 96px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border-top: 2px solid rgba(121,240,255,.26);
    border-right: 2px solid rgba(121,240,255,.08);
    border-bottom: 2px solid rgba(213,111,255,.18);
    border-left: 2px solid rgba(213,111,255,.08);
    filter: drop-shadow(0 0 10px rgba(144,230,255,.14));
  }

  .cards {
    position: absolute;
    left: 0;
    right: 0;
    top: 340px;
    display: flex;
    justify-content: center;
    gap: 94px;
    z-index: 4;
  }

  .card {
    position: relative;
    width: 206px;
    height: 278px;
    padding: 18px 18px 16px;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(230,244,255,.18), rgba(126,154,255,.08));
    border: 2px solid rgba(141,241,255,.55);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 22px 36px rgba(255,255,255,.05),
      0 0 18px rgba(95,240,255,.28),
      0 0 42px rgba(95,240,255,.14);
    backdrop-filter: blur(1px);
  }

  .card.magenta {
    border-color: rgba(211,136,255,.58);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 22px 36px rgba(255,255,255,.05),
      0 0 18px rgba(211,136,255,.28),
      0 0 42px rgba(211,136,255,.14);
  }

  .card.mix {
    border-color: rgba(141,241,255,.58);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 22px 36px rgba(255,255,255,.05),
      0 0 18px rgba(95,240,255,.24),
      0 0 42px rgba(211,136,255,.14);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background:
      linear-gradient(118deg, rgba(255,255,255,.22) 0 24%, rgba(255,255,255,.02) 24% 100%);
    pointer-events: none;
  }

  .slot {
    position: absolute;
    border-radius: 10px;
    border: 2px solid rgba(130,245,255,.72);
    box-shadow: inset 0 0 12px rgba(105,241,255,.08), 0 0 10px rgba(95,240,255,.12);
  }
  .card.magenta .slot {
    border-color: rgba(213,140,255,.7);
    box-shadow: inset 0 0 12px rgba(213,140,255,.08), 0 0 10px rgba(213,140,255,.12);
  }
  .card.mix .slot.top,
  .card.mix .slot.mid { border-color: rgba(130,245,255,.72); }
  .card.mix .slot.bot1,
  .card.mix .slot.bot2 { border-color: rgba(213,140,255,.7); }

  .slot.top  { left: 18px; top: 20px; width: 170px; height: 36px; }
  .slot.mid  { left: 18px; top: 68px; width: 170px; height: 64px; }
  .slot.bot1 { left: 18px; top: 178px; width: 78px;  height: 78px; }
  .slot.bot2 { right: 18px; top: 178px; width: 78px;  height: 78px; }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: 38px 82px 1fr;
    align-items: start;
  }

  .step {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    color: #eaffff;
    font-size: 16px;
    letter-spacing: .06em;
    text-shadow: 0 0 10px rgba(114,240,255,.45);
    padding-left: 8px;
  }
  .card.magenta .step { text-shadow: 0 0 10px rgba(213,140,255,.45); }

  .hero {
    padding: 10px 12px 0;
  }

  .emoji {
    font-size: 30px;
    line-height: 1;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.22));
  }

  .item-title {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
    color: #f5fbff;
    text-shadow:
      0 0 10px rgba(120,240,255,.5),
      0 0 20px rgba(211,136,255,.2);
  }

  .item-desc {
    padding: 14px 12px 0;
    font-size: 13px;
    line-height: 1.45;
    color: rgba(230,245,255,.92);
    word-break: keep-all;
    text-shadow: 0 0 10px rgba(120,240,255,.12);
  }

  .glow-under {
    position: absolute;
    width: 220px;
    height: 28px;
    bottom: 122px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(73,242,255,.55), rgba(73,242,255,.14) 42%, transparent 72%);
    filter: blur(8px);
    z-index: 1;
  }
  .g1 { left: 94px; }
  .g2 { left: 410px; background: radial-gradient(circle, rgba(207,126,255,.45), rgba(207,126,255,.14) 42%, transparent 72%); }
  .g3 { left: 716px; }
  .g4 { left: 1017px; background: radial-gradient(circle, rgba(207,126,255,.45), rgba(207,126,255,.14) 42%, transparent 72%); }
</style>

<div class="slide">
  <div class="ambient">
    <i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i>
    <i class="s5"></i><i class="s6"></i><i class="s7"></i><i class="s8"></i>
    <i class="s9"></i><i class="s10"></i><i class="s11"></i><i class="s12"></i>
  </div>

  <div class="header">
    <div class="title">디지털 전환 로드맵 2025</div>
    <div class="desc">4단계 전환 마일스톤과 핵심 목표</div>
  </div>

  <div class="timeline">
    <div class="beam"></div>
  </div>

  <div class="nodes">
    <div class="node cyan" style="left: 222px;"><div class="ring"></div></div>
    <div class="node magenta" style="left: 521px;"><div class="ring"></div></div>
    <div class="node cyan" style="left: 821px;"><div class="ring"></div></div>
    <div class="node magenta" style="left: 1119px;"><div class="ring"></div></div>
  </div>

  <div class="glow-under g1"></div>
  <div class="glow-under g2"></div>
  <div class="glow-under g3"></div>
  <div class="glow-under g4"></div>

  <div class="cards">
    <div class="card">
      <div class="slot top"></div>
      <div class="slot mid"></div>
      <div class="slot bot1"></div>
      <div class="slot bot2"></div>
      <div class="content">
        <div class="step">STEP 1</div>
        <div class="hero">
          <div class="emoji">📊</div>
          <h3 class="item-title">현황 진단</h3>
        </div>
        <div class="item-desc">레거시 시스템 분석 및 디지털 성숙도 평가</div>
      </div>
    </div>

    <div class="card magenta">
      <div class="slot top"></div>
      <div class="slot mid"></div>
      <div class="slot bot1"></div>
      <div class="slot bot2"></div>
      <div class="content">
        <div class="step">STEP 2</div>
        <div class="hero">
          <div class="emoji">🏗️</div>
          <h3 class="item-title">기반 구축</h3>
        </div>
        <div class="item-desc">클라우드 마이그레이션 및 API 플랫폼 설계</div>
      </div>
    </div>

    <div class="card mix">
      <div class="slot top"></div>
      <div class="slot mid"></div>
      <div class="slot bot1"></div>
      <div class="slot bot2"></div>
      <div class="content">
        <div class="step">STEP 3</div>
        <div class="hero">
          <div class="emoji">🔄</div>
          <h3 class="item-title">프로세스 혁신</h3>
        </div>
        <div class="item-desc">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
      </div>
    </div>

    <div class="card magenta">
      <div class="slot top"></div>
      <div class="slot mid"></div>
      <div class="slot bot1"></div>
      <div class="slot bot2"></div>
      <div class="content">
        <div class="step">STEP 4</div>
        <div class="hero">
          <div class="emoji">🚀</div>
          <h3 class="item-title">스케일업</h3>
        </div>
        <div class="item-desc">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
      </div>
    </div>
  </div>
</div></div>
</body></html>

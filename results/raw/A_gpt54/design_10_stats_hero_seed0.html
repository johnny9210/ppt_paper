<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  :root{
    --bg1:#020f34;
    --bg2:#071a4d;
    --bg3:#03102d;
    --gold:#d8b06a;
    --gold-strong:#f1cf8a;
    --gold-deep:#a9752f;
    --white:#f5f4f2;
    --panel:rgba(186,196,220,.22);
    --panel-border:rgba(255,255,255,.24);
  }

  *{box-sizing:border-box}
  body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh;font-family:Georgia,"Times New Roman",serif}
  .slide{
    position:relative;
    width:1280px;
    height:720px;
    overflow:hidden;
    background:
      radial-gradient(circle at 52% 52%, rgba(117,141,197,.16) 0 18%, rgba(117,141,197,.04) 18% 32%, transparent 32%),
      radial-gradient(circle at 25% 84%, rgba(73,95,153,.22) 0 11%, transparent 11.5%),
      radial-gradient(circle at 86% 10%, rgba(53,73,132,.18) 0 10%, transparent 10.5%),
      linear-gradient(120deg, #021033 0%, #041743 35%, #021334 72%, #010a21 100%);
    color:var(--white);
  }

  .slide:before{
    content:"";
    position:absolute; inset:-10% auto auto -8%;
    width:520px; height:300px;
    background:linear-gradient(145deg, rgba(255,255,255,.70), rgba(255,255,255,.14) 35%, rgba(255,255,255,0) 65%);
    filter:blur(6px);
    transform:rotate(-12deg);
    pointer-events:none;
  }

  .slide:after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 150px, rgba(186,206,255,.10) 151px 154px, transparent 155px),
      radial-gradient(circle at 49% 49%, transparent 0 240px, rgba(186,206,255,.08) 241px 244px, transparent 245px),
      radial-gradient(circle at 95% 8%, transparent 0 74px, rgba(186,206,255,.10) 75px 78px, transparent 79px),
      radial-gradient(circle at 13% 92%, transparent 0 68px, rgba(186,206,255,.08) 69px 72px, transparent 73px);
    pointer-events:none;
  }

  .title{
    position:absolute;
    top:18px; left:0; right:0;
    text-align:center;
    font-size:44px;
    line-height:1;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.45);
  }

  .hero-box{
    position:absolute;
    left:52px;
    top:184px;
    width:625px;
    height:415px;
    border:2px solid rgba(222,188,114,.72);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 0 25px rgba(0,0,0,.28);
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  }

  .hero-value{
    position:absolute;
    left:92px;
    top:240px;
    font-size:132px;
    line-height:.92;
    font-weight:700;
    letter-spacing:-2px;
    color:#f1d28d;
    text-shadow:
      0 0 2px rgba(255,237,191,.8),
      0 0 10px rgba(231,183,93,.55),
      0 2px 0 rgba(112,71,21,.55);
  }

  .hero-label{
    position:absolute;
    left:92px;
    top:425px;
    width:470px;
    font-size:72px;
    line-height:.95;
    font-weight:700;
    color:var(--white);
    text-shadow:0 3px 10px rgba(0,0,0,.45);
  }

  .hero-label .accent{
    display:block;
    color:var(--gold);
  }

  .stats{
    position:absolute;
    right:60px;
    top:116px;
    width:458px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .stat{
    position:relative;
    height:130px;
    border-radius:16px;
    background:
      linear-gradient(180deg, rgba(220,226,240,.26), rgba(170,178,199,.18)),
      rgba(255,255,255,.04);
    border:1px solid var(--panel-border);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      inset 0 -1px 0 rgba(0,0,0,.10),
      0 10px 25px rgba(0,0,0,.26);
    overflow:hidden;
    backdrop-filter: blur(2px);
  }

  .stat:before{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:12px;
    background:linear-gradient(90deg, rgba(197,137,55,.82), rgba(246,205,124,.95), rgba(197,137,55,.82));
    box-shadow:0 0 14px rgba(243,196,102,.6);
  }

  .stat:after{
    content:"";
    position:absolute;
    right:12px; top:10px;
    width:86px; height:86px;
    border-radius:18px;
    background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.13), rgba(255,255,255,0) 60%);
    filter:blur(3px);
    pointer-events:none;
  }

  .icon{
    position:absolute;
    left:18px;
    top:18px;
    width:94px;
    height:94px;
    display:grid;
    place-items:center;
    font-size:46px;
    color:var(--gold);
    text-shadow:0 0 10px rgba(226,184,100,.25);
  }

  .stat-value{
    position:absolute;
    left:136px;
    top:18px;
    font-size:60px;
    line-height:1;
    font-weight:700;
    color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.35);
    letter-spacing:-1px;
  }

  .stat-label{
    position:absolute;
    left:136px;
    right:28px;
    top:78px;
    font-size:26px;
    line-height:1.15;
    color:var(--white);
    text-shadow:0 2px 8px rgba(0,0,0,.35);
    word-break:keep-all;
  }

  .shape{position:absolute; border:4px solid rgba(209,173,101,.38); opacity:.75}
  .tri{width:58px;height:58px;clip-path:polygon(50% 6%, 95% 92%, 5% 92%); background:transparent}
  .ring{border-radius:50%}
  .hex{
    width:78px;height:68px;
    clip-path:polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
    background:transparent;
  }

  .s1{left:88px; top:92px; width:44px; height:44px; border-width:4px}
  .s2{left:330px; top:118px}
  .s3{left:430px; top:124px; width:20px;height:20px; border-width:3px}
  .s4{left:710px; top:170px; width:34px;height:34px; border-width:4px}
  .s5{left:755px; top:260px}
  .s6{left:744px; top:378px; width:42px;height:42px; border-width:4px}
  .s7{left:960px; top:514px; width:54px;height:54px; border-width:4px}
  .s8{left:1190px; top:130px}
  .s9{left:1180px; top:565px; width:40px;height:40px; border-width:4px}
  .s10{left:1230px; top:515px; width:34px; height:34px; border-width:3px}
  .s11{left:250px; top:640px; width:72px; height:72px; border-width:5px}
  .s12{left:20px; top:552px; width:90px; height:90px}
  .s13{left:465px; top:535px}
  .s14{left:14px; top:391px; width:20px;height:20px; border-width:3px}
</style>

<div class="slide">
  <div class="title">2025년 성과 하이라이트</div>

  <div class="hero-box"></div>
  <div class="hero-value">300%</div>
  <div class="hero-label">생산성 <span class="accent">향상</span></div>

  <div class="stats">
    <div class="stat">
      <div class="icon">🏢</div>
      <div class="stat-value">150+</div>
      <div class="stat-label">도입 기업</div>
    </div>
    <div class="stat">
      <div class="icon">👤</div>
      <div class="stat-value">50K+</div>
      <div class="stat-label">월간 활성 사용자</div>
    </div>
    <div class="stat">
      <div class="icon">📄</div>
      <div class="stat-value">2M+</div>
      <div class="stat-label">처리 문서 수</div>
    </div>
    <div class="stat">
      <div class="icon">⏱️</div>
      <div class="stat-value">99.9%</div>
      <div class="stat-label">서비스 가동률</div>
    </div>
  </div>

  <div class="shape tri s1"></div>
  <div class="shape tri s2"></div>
  <div class="shape ring s3"></div>
  <div class="shape ring s4"></div>
  <div class="shape tri s5"></div>
  <div class="shape ring s6"></div>
  <div class="shape ring s7"></div>
  <div class="shape hex s8"></div>
  <div class="shape tri s9"></div>
  <div class="shape ring s10"></div>
  <div class="shape ring s11"></div>
  <div class="shape tri s12"></div>
  <div class="shape tri s13"></div>
  <div class="shape ring s14"></div>
</div></div>
</body></html>

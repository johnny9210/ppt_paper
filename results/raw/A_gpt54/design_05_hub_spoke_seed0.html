<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #020b2b; font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .slide {
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    color: #eaffff;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,255,220,.12) 0%, rgba(0,255,220,.04) 18%, rgba(0,0,0,0) 40%),
      radial-gradient(circle at 50% 50%, rgba(20,80,180,.18) 0%, rgba(0,0,0,0) 55%),
      linear-gradient(180deg, #03133f 0%, #021034 45%, #020b28 100%);
  }

  .title {
    position: absolute;
    top: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #dffeff;
    text-shadow: 0 0 14px rgba(78,255,231,.45);
    z-index: 5;
  }

  .circuit {
    position: absolute;
    inset: 0;
    opacity: .2;
    z-index: 0;
  }
  .vline, .hline {
    position: absolute;
    background: linear-gradient(180deg, rgba(69,255,229,.0), rgba(69,255,229,.55), rgba(69,255,229,.0));
    filter: drop-shadow(0 0 6px rgba(69,255,229,.35));
  }
  .vline { width: 2px; }
  .hline {
    height: 2px;
    background: linear-gradient(90deg, rgba(69,255,229,.0), rgba(69,255,229,.45), rgba(69,255,229,.0));
  }

  .center-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 340px;
    height: 340px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(96,255,241,.2) 0%, rgba(96,255,241,.08) 36%, rgba(0,0,0,0) 70%);
    filter: blur(4px);
    z-index: 1;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 236px;
    height: 236px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 4;
    background:
      radial-gradient(circle at 50% 50%, rgba(118,255,245,.28) 0%, rgba(61,215,255,.12) 25%, rgba(10,32,87,.78) 62%, rgba(8,20,64,.95) 100%);
    border: 4px solid rgba(106,255,236,.85);
    box-shadow:
      0 0 0 8px rgba(76,255,234,.12),
      0 0 25px rgba(56,255,226,.55),
      0 0 60px rgba(56,255,226,.28),
      inset 0 0 30px rgba(74,255,238,.15);
  }
  .hub::before {
    content: "";
    position: absolute;
    inset: 16px;
    border-radius: 50%;
    border: 2px solid rgba(118,255,245,.24);
    box-shadow: inset 0 0 18px rgba(118,255,245,.12);
  }
  .hub-core {
    position: absolute;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: 86px;
    height: 86px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    color: #b8ffff;
    text-shadow: 0 0 18px rgba(90,255,236,.95);
    z-index: 2;
  }
  .hub-network {
    position: absolute;
    inset: 42px;
    border-radius: 50%;
  }
  .node, .link {
    position: absolute;
    background: rgba(117,255,240,.95);
    box-shadow: 0 0 10px rgba(117,255,240,.95);
  }
  .node {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .link {
    height: 2px;
    transform-origin: left center;
    opacity: .9;
  }

  .hub-label {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    text-align: center;
    width: 180px;
  }
  .hub-label .t1 {
    font-size: 24px;
    font-weight: 800;
    color: #eaffff;
    letter-spacing: .3px;
    text-shadow: 0 0 14px rgba(97,255,238,.45);
  }

  .spoke-line {
    position: absolute;
    height: 18px;
    border-radius: 20px;
    z-index: 2;
    background:
      linear-gradient(90deg, rgba(49,215,255,.88), rgba(98,255,210,.9));
    box-shadow:
      0 0 16px rgba(58,240,255,.6),
      0 0 32px rgba(58,240,255,.28);
  }
  .spoke-line::after {
    content: "";
    position: absolute;
    inset: 5px 12px;
    border-radius: 12px;
    background:
      radial-gradient(circle at 10px 50%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 35px 50%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 60px 50%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 85px 50%, rgba(255,255,255,.28) 0 1px, transparent 2px);
    opacity: .5;
  }

  .card {
    position: absolute;
    width: 322px;
    height: 146px;
    border-radius: 18px;
    z-index: 3;
    background:
      linear-gradient(135deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,.04) 100%);
    border: 2px solid rgba(190,235,255,.45);
    box-shadow:
      inset 0 0 28px rgba(170,220,255,.08),
      0 0 24px rgba(80,255,228,.18);
    backdrop-filter: blur(2px);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.15),
      0 0 14px rgba(90,255,238,.22);
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    right: 18px;
    width: 120px;
    height: 56px;
    background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,0));
    border-bottom-left-radius: 50px 24px;
    border-top-right-radius: 18px;
    opacity: .55;
    pointer-events: none;
  }

  .icon-ring {
    position: absolute;
    left: 36px;
    top: 24px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 5px solid rgba(111,255,233,.75);
    box-shadow:
      0 0 18px rgba(91,255,235,.55),
      inset 0 0 18px rgba(91,255,235,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b9ffff;
    text-shadow: 0 0 16px rgba(91,255,235,.9);
    font-size: 44px;
    background: radial-gradient(circle, rgba(75,255,226,.08), rgba(0,0,0,0) 70%);
  }

  .content {
    position: absolute;
    left: 166px;
    top: 28px;
    right: 22px;
    color: #e8ffff;
  }
  .content .title2 {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 10px;
    text-shadow: 0 0 12px rgba(85,255,235,.35);
  }
  .content .desc {
    font-size: 14px;
    line-height: 1.45;
    color: rgba(228,249,255,.86);
  }

  .left1 { left: 58px; top: 70px; }
  .left2 { left: 5px; top: 295px; }
  .left3 { left: 58px; top: 520px; }

  .right1 { right: 58px; top: 70px; }
  .right2 { right: 5px; top: 295px; }
  .right3 { right: 58px; top: 520px; }

  .l1 {
    left: 362px; top: 169px; width: 214px; transform: rotate(24deg);
  }
  .l2 {
    left: 324px; top: 377px; width: 255px; transform: rotate(0deg);
  }
  .l3 {
    left: 362px; top: 556px; width: 214px; transform: rotate(-24deg);
  }
  .r1 {
    left: 705px; top: 169px; width: 214px; transform: rotate(-24deg);
  }
  .r2 {
    left: 702px; top: 377px; width: 258px; transform: rotate(0deg);
  }
  .r3 {
    left: 705px; top: 556px; width: 214px; transform: rotate(24deg);
  }
</style>

<div class="slide">
  <div class="title">마이크로서비스 아키텍처</div>

  <div class="circuit">
    <div class="vline" style="left:640px; top:0; height:280px;"></div>
    <div class="vline" style="left:606px; top:0; height:220px;"></div>
    <div class="vline" style="left:674px; top:0; height:220px;"></div>
    <div class="vline" style="left:640px; bottom:0; height:270px;"></div>
    <div class="vline" style="left:606px; bottom:0; height:210px;"></div>
    <div class="vline" style="left:674px; bottom:0; height:210px;"></div>

    <div class="hline" style="left:160px; top:360px; width:330px;"></div>
    <div class="hline" style="right:160px; top:360px; width:330px;"></div>

    <div class="hline" style="left:420px; top:170px; width:130px;"></div>
    <div class="hline" style="left:420px; top:548px; width:130px;"></div>
    <div class="hline" style="right:420px; top:170px; width:130px;"></div>
    <div class="hline" style="right:420px; top:548px; width:130px;"></div>
  </div>

  <div class="center-glow"></div>

  <div class="spoke-line l1"></div>
  <div class="spoke-line l2"></div>
  <div class="spoke-line l3"></div>
  <div class="spoke-line r1"></div>
  <div class="spoke-line r2"></div>
  <div class="spoke-line r3"></div>

  <div class="hub">
    <div class="hub-network">
      <div class="link" style="left:38px; top:64px; width:44px; transform:rotate(-28deg);"></div>
      <div class="link" style="left:82px; top:44px; width:42px; transform:rotate(28deg);"></div>
      <div class="link" style="left:122px; top:64px; width:44px; transform:rotate(28deg);"></div>
      <div class="link" style="left:32px; top:98px; width:56px; transform:rotate(0deg);"></div>
      <div class="link" style="left:78px; top:98px; width:56px; transform:rotate(0deg);"></div>
      <div class="link" style="left:122px; top:98px; width:50px; transform:rotate(0deg);"></div>
      <div class="link" style="left:38px; top:100px; width:42px; transform:rotate(30deg);"></div>
      <div class="link" style="left:80px; top:100px; width:42px; transform:rotate(-30deg);"></div>
      <div class="link" style="left:122px; top:100px; width:42px; transform:rotate(30deg);"></div>
      <div class="link" style="left:38px; top:132px; width:44px; transform:rotate(-28deg);"></div>
      <div class="link" style="left:82px; top:152px; width:42px; transform:rotate(28deg);"></div>
      <div class="link" style="left:122px; top:132px; width:44px; transform:rotate(28deg);"></div>
      <div class="link" style="left:82px; top:44px; width:2px; height:112px; transform:none;"></div>

      <div class="node" style="left:32px; top:62px;"></div>
      <div class="node" style="left:74px; top:40px;"></div>
      <div class="node" style="left:120px; top:40px;"></div>
      <div class="node" style="left:162px; top:62px;"></div>
      <div class="node" style="left:24px; top:96px;"></div>
      <div class="node" style="left:68px; top:96px;"></div>
      <div class="node" style="left:116px; top:96px;"></div>
      <div class="node" style="left:156px; top:96px;"></div>
      <div class="node" style="left:32px; top:132px;"></div>
      <div class="node" style="left:74px; top:154px;"></div>
      <div class="node" style="left:120px; top:154px;"></div>
      <div class="node" style="left:162px; top:132px;"></div>
      <div class="node" style="left:95px; top:95px; width:10px; height:10px;"></div>
    </div>
    <div class="hub-core">🌐</div>
    <div class="hub-label">
      <div class="t1">API Gateway</div>
    </div>
  </div>

  <div class="card left1">
    <div class="icon-ring">☁️</div>
    <div class="content">
      <div class="title2">클라우드 스토리지</div>
      <div class="desc">S3, MinIO 기반 객체 저장소</div>
    </div>
  </div>

  <div class="card left2">
    <div class="icon-ring">🗄️</div>
    <div class="content">
      <div class="title2">데이터베이스</div>
      <div class="desc">PostgreSQL + MongoDB</div>
    </div>
  </div>

  <div class="card left3">
    <div class="icon-ring">🤖</div>
    <div class="content">
      <div class="title2">AI 서비스</div>
      <div class="desc">LLM 추론 엔진</div>
    </div>
  </div>

  <div class="card right1">
    <div class="icon-ring">📡</div>
    <div class="content">
      <div class="title2">실시간 스트리밍</div>
      <div class="desc">Kafka 이벤트 브로커</div>
    </div>
  </div>

  <div class="card right2">
    <div class="icon-ring">🔒</div>
    <div class="content">
      <div class="title2">인증/보안</div>
      <div class="desc">OAuth2 + JWT 토큰</div>
    </div>
  </div>

  <div class="card right3">
    <div class="icon-ring">🌍</div>
    <div class="content">
      <div class="title2">CDN/Edge</div>
      <div class="desc">글로벌 콘텐츠 배포</div>
    </div>
  </div>
</div></div>
</body></html>

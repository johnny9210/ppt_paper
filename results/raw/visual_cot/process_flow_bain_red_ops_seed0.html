<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            width: 1280px;
            height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 1000px;
            height: 400px;
            padding: 0 40px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: black;
            margin-bottom: 10px;
        }
        .description {
            font-size: 18px;
            color: gray;
            margin-bottom: 20px;
        }
        .process {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .step {
            text-align: center;
            width: 100px;
        }
        .step.gray {
            color: white;
            background-color: gray;
        }
        .step.red {
            color: white;
            background-color: red;
        }
        .metrics {
            font-size: 16px;
            color: red;
        }
        .divider {
            height: 100%;
            width: 2px;
            background-color: red;
            position: absolute;
            left: 850px;
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .final-metric {
            position: relative;
            margin-left: 60px;
            text-align: center;
        }
        .final-days {
            font-size: 24px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Optimized order-to-cash cycle compresses to 4.2 days from 9.1</div>
        <div class="description">O2C process redesign</div>
        <div class="process">
            <div class="step gray">
                <div>Order</div>
                <div>1.0 day</div>
            </div>
            <div class="step red">
                <div>Validate</div>
                <div class="metrics">0.4 days</div>
                <div class="metrics">↓ (-50%)</div>
            </div>
            <div class="step red">
                <div>Pack</div>
                <div class="metrics">1.2 days</div>
                <div class="metrics">↓ (-67%)</div>
            </div>
            <div class="step gray">
                <div>Ship</div>
                <div>1.0 day</div>
            </div>
            <div class="step red">
                <div>Invoice</div>
                <div class="metrics">0.6 days</div>
                <div class="metrics">↓ (-40%)</div>
            </div>
        </div>
        <div class="divider"></div>
        <div class="final-metric">
            <div class="metrics">↓ -4.9 days (-54%)</div>
            <div class="final-days">4.2 days</div>
            <div>was 9.1</div>
        </div>
    </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            width: 1280px;
            height: 720px;
            background-color: #FFFFFF;
            font-family: Arial, sans-serif;
            color: #000000;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }
        .title {
            font-size: 36px;
            margin-bottom: 20px;
        }
        .description {
            font-size: 18px;
            color: #6B7280;
        }
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 80%;
            height: 60%;
        }
        .chart {
            position: relative;
            width: 100%;
            height: 100%;
            border-bottom: 2px solid #eee;
            border-left: 2px solid #eee;
        }
        .line {
            stroke: #6B7280;
            fill: none;
            stroke-width: 3;
        }
        .key-points {
            stroke: #000000;
            stroke-width: 4;
            fill: #000000;
        }
        .chart-title {
            font-size: 16px;
            margin-top: 10px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">ARR growth accelerated to 43% YoY by FY2025-end</div>
        <div class="description">ARR growth rate trajectory</div>
        <div class="chart-container">
            <svg class="chart">
                <polyline points="20,400 100,360 180,340 260,320 340,300 420,300 500,280 580,250 660,210 740,190" class="line"></polyline>
                <circle cx="740" cy="190" r="6" class="key-points"></circle>
                <circle cx="660" cy="210" r="6" class="key-points"></circle>
                <circle cx="580" cy="250" r="6" class="key-points"></circle>
            </svg>
            <div class="chart-title">ARR Growth Rate (%)</div>
        </div>
    </div>
</body>
</html></div>
</body></html>

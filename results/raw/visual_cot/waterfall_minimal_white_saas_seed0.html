<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARR Revenue Bridge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            color: #000000;
        }
        
        .container {
            width: 1280px;
            height: 720px;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            font-size: 18px;
            margin-bottom: 50px;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            width: 80%;
            margin-bottom: 30px;
        }

        .bar {
            width: 100px;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bar div {
            background-color: #111111;
            width: 100%;
            opacity: 0.9;
        }

        .start-arr {
            height: 60px;
            margin-bottom: 10px;
        }

        .new {
            height: 35px;
            margin-bottom: 10px;
        }

        .expansion {
            height: 22px;
            margin-bottom: 10px;
        }

        .contraction {
            height: 8px;
            margin-bottom: 10px;
            background-color: #CDCDCD;
            opacity: 0.9;
        }
        
        .churn {
            height: 6px;
            margin-bottom: 10px;
            background-color: #CDCDCD;
            opacity: 0.9;
        }

        .end-arr {
            height: 100px;
            margin-bottom: 10px;
        }

        .label {
            font-size: 14px;
            margin-top: 5px;
        }

        .source {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">ARR grew 28% with $32M net new contributions despite $14M churn</div>
        <div class="description">Annual recurring revenue bridge</div>
        <div class="bar-chart">
            <div class="bar">
                <div class="start-arr"></div>
                <div class="label">Start ARR<br>$48M</div>
            </div>
            <div class="bar">
                <div class="new"></div>
                <div class="label">New<br>$28M</div>
            </div>
            <div class="bar">
                <div class="expansion"></div>
                <div class="label">Expansion<br>$18M</div>
            </div>
            <div class="bar">
                <div class="contraction"></div>
                <div class="label">Contraction<br>-$8M</div>
            </div>
            <div class="bar">
                <div class="churn"></div>
                <div class="label">Churn<br>-$6M</div>
            </div>
            <div class="bar">
                <div class="end-arr"></div>
                <div class="label">End ARR<br>$80M</div>
            </div>
        </div>
        <div class="source">Source: ARR snapshot, Dec 2025</div>
    </div>
</body>
</html></div>
</body></html>

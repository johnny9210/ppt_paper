<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: black;
            width: 1280px;
            height: 720px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            font-size: 36px;
            color: black;
        }
        .header span {
            color: red;
        }
        .description {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .chart {
            position: relative;
            width: 900px;
            height: 450px;
        }
        .line {
            stroke: red;
            stroke-width: 2;
            fill: none;
        }
        .benchmark-line {
            stroke: gray;
            stroke-width: 2;
            stroke-dasharray: 5,5;
            fill: none;
        }
        .circle {
            fill: red;
        }
        .crossover {
            position: absolute;
            top: 310px;
            left: 560px;
            font-size: 14px;
            background-color: white;
            border: 1px solid black;
            padding: 5px;
        }
        .x-axis {
            stroke: black;
            stroke-width: 2;
        }
        .text {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cost-to-serve <span>dropped below industry benchmark</span> in Q3 2025</h1>
        <div class="description">Cost per transaction, our co. vs benchmark</div>
    </div>
    <div class="chart">
        <svg width="900" height="450">
            <line class="x-axis" x1="50" y1="400" x2="850" y2="400"></line>
            <polyline class="line" points="50,80 150,130 250,180 350,230 450,280 550,310 650,350" />
            <line class="benchmark-line" x1="50" y1="300" x2="850" y2="300"></line>
            <circle class="circle" cx="560" cy="310" r="5"></circle>
        </svg>
        <div class="crossover">Crossover point: Our cost fell below benchmark in Q2 2025</div>
    </div>
</body>
</html></div>
</body></html>

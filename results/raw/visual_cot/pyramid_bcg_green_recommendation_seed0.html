<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Recommendation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            width: 1280px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF;
        }
        .container {
            width: 1100px;
            text-align: center;
        }
        .title {
            font-size: 32px;
            color: #000000;
            margin-bottom: 5px;
        }
        .description {
            font-size: 18px;
            color: #666666;
            margin-bottom: 20px;
        }
        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .layer {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            width: 80%;
        }
        .box {
            background-color: #008000;
            color: #FFFFFF;
            padding: 10px;
            border-radius: 5px;
            width: 28%;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        .line {
            position: absolute;
            width: 2px;
            height: 30px;
            background-color: #008000;
        }
        .diagonal {
            height: 20px;
            width: 2px;
            background-color: #008000;
            transform: rotate(45deg);
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Recommendation: invest $40M in Asia expansion, supported by 3 imperatives</div>
        <div class="description">Investment recommendation pyramid</div>
        <div class="pyramid">
            <div class="box">Establish Singapore hub</div>
            <div class="layer">
                <div class="box">Build local sales team</div>
                <div class="box">Tailor product for APAC SMEs</div>
            </div>
            <div class="line" style="top: 60px; left: 490px;"></div>
            <div class="diagonal" style="top: 80px; left: 600px;"></div>
            <div class="diagonal" style="top: 80px; left: 380px; transform: rotate(-45deg);"></div>
        </div>
    </div>
</body>
</html></div>
</body></html>

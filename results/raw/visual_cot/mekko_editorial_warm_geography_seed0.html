<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Spend Visualization</title>
    <style>
        body {
            background-color: #F6F3ED;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1280px;
            height: 720px;
        }
        .container {
            width: 90%;
            text-align: center;
        }
        .title {
            color: #994A02;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .description {
            color: #6D542C;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .chart-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }
        .chart {
            width: 22%;
            background-color: #F6F3ED;
        }
        .digital {
            background-color: #B25D07;
            color: white;
            padding: 20px 0;
            font-size: 18px;
        }
        .tv {
            background-color: #E4B400;
            color: white;
            padding: 10px 0;
            font-size: 16px;
        }
        .print {
            background-color: #E8DABA;
            color: black;
            padding: 10px 0;
            font-size: 16px;
        }
        .country {
            margin-top: 10px;
            color: #6D542C;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            European Q4 ad spend skewed 71% toward digital despite TV reach gains
        </div>
        <div class="description">
            Ad spend by country × media channel
        </div>
        <div class="chart-container">
            <div class="chart">
                <div class="digital">Digital €455M</div>
                <div class="tv">TV €128M</div>
                <div class="print">Print €57M</div>
                <div class="country">📐 UK 32%</div>
            </div>
            <div class="chart">
                <div class="digital">Digital €392M</div>
                <div class="tv">TV €110M</div>
                <div class="print">Print €58M</div>
                <div class="country">📐 DE 28%</div>
            </div>
            <div class="chart">
                <div class="digital">Digital €308M</div>
                <div class="tv">TV €86M</div>
                <div class="print">Print €46M</div>
                <div class="country">📐 FR 22%</div>
            </div>
            <div class="chart">
                <div class="digital">Digital €252M</div>
                <div class="tv">TV €70M</div>
                <div class="print">Print €38M</div>
                <div class="country">📐 IT 18%</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

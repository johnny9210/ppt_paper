<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #F5F1E9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 1280px;
            height: 720px;
            border: 1px solid #B22222;
            box-sizing: border-box;
            padding: 20px;
        }
        .title {
            font-size: 32px;
            color: #B22222;
            margin-bottom: 10px;
        }
        .description {
            font-size: 18px;
            color: #8B4513;
            margin-bottom: 30px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .headers {
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }
        .cell {
            padding: 10px;
            vertical-align: middle;
        }
        .badge {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #D2691E;
            margin-right: 10px;
        }
        .badge.half {
            background: conic-gradient(#D2691E 50%, transparent 50%);
        }
        .badge.empty {
            background: conic-gradient(#D2691E 10%, transparent 10%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            Candidate B exceeds requirements on culture and execution dimensions
        </div>
        <div class="description">
            Senior leadership candidate scoring
        </div>
        <table class="table">
            <tr class="headers">
                <th class="cell"></th>
                <th class="cell">Candidate A</th>
                <th class="cell">Candidate B</th>
                <th class="cell">Candidate C</th>
            </tr>
            <tr>
                <td class="cell">Vision</td>
                <td class="cell"><div class="badge half"></div></td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge empty"></div></td>
            </tr>
            <tr>
                <td class="cell">Execution</td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge empty"></div></td>
            </tr>
            <tr>
                <td class="cell">Culture fit</td>
                <td class="cell"><div class="badge half"></div></td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge half"></div></td>
            </tr>
            <tr>
                <td class="cell">Domain depth</td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge half"></div></td>
                <td class="cell"><div class="badge half"></div></td>
            </tr>
            <tr>
                <td class="cell">Reference quality</td>
                <td class="cell"><div class="badge half"></div></td>
                <td class="cell"><div class="badge"></div></td>
                <td class="cell"><div class="badge half"></div></td>
            </tr>
        </table>
    </div>
</body>
</html></div>
</body></html>

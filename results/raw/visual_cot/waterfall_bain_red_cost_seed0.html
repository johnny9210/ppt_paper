<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            width: 1280px;
            height: 720px;
            background-color: white;
            margin: 0;
            font-family: Arial, sans-serif;
            color: black;
        }
        .title {
            text-align: center;
            color: red;
            font-size: 32px;
            margin-top: 20px;
        }
        .description {
            text-align: center;
            color: gray;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 500px;
            margin: 0 50px;
        }
        .bar {
            background-color: red;
            width: 100px;
            color: white;
            text-align: center;
            position: relative;
        }
        .bar.start, .bar.end {
            background-color: gray;
            height: 400px;
        }
        .bar.procurement {
            height: 225px;
        }
        .bar.headcount {
            height: 200px;
        }
        .bar.tech {
            height: 125px;
        }
        .bar.real-estate {
            height: 50px;
        }
        .bar-label {
            position: absolute;
            bottom: -20px;
            font-size: 14px;
            width: 100%;
            color: black;
        }
        .total-reduction {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 16px;
            color: black;
        }
    </style>
</head>
<body>

    <div class="title">$120M cost reduction unlocks 4-pp margin gain by year 2</div>
    <div class="description">Cost-out program contribution</div>
    
    <div class="chart">
        <div class="bar start">
            <div class="bar-label">$820M</div>
        </div>
        <div class="bar procurement">
            <div>🔁</div>
            <div>$45M</div>
            <div>-($45M)</div>
            <div class="bar-label">Procurement</div>
        </div>
        <div class="bar headcount">
            <div>🔁</div>
            <div>$40M</div>
            <div>-($40M)</div>
            <div class="bar-label">Headcount</div>
        </div>
        <div class="bar tech">
            <div>🔁</div>
            <div>$25M</div>
            <div>-($25M)</div>
            <div class="bar-label">Tech consolidation</div>
        </div>
        <div class="bar real-estate">
            <div>🔁</div>
            <div>$10M</div>
            <div>-($10M)</div>
            <div class="bar-label">Real estate</div>
            <div class="total-reduction">Total Reduction: $120M</div>
        </div>
        <div class="bar end">
            <div class="bar-label">$700M</div>
        </div>
    </div>

</body>
</html></div>
</body></html>

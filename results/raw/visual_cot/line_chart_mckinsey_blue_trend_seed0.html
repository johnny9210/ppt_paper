<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #FFFFFF;
        }
        .title {
            font-size: 36px;
            color: #000;
            margin-top: 20px;
        }
        .description {
            font-size: 18px;
            color: #000;
            margin-bottom: 20px;
        }
        .chart-container {
            width: 90%;
            height: 60%;
            position: relative;
            border: 1px solid #777;
        }
        .line {
            position: absolute;
            top: 30%;
            left: 10%;
            width: 80%;
            height: 50%;
            border-top: 4px solid #000;
            transform: rotate(5deg);
        }
        .callout1, .callout2 {
            position: absolute;
            padding: 5px;
            background-color: #003366;
            color: #FFF;
            border-radius: 4px;
        }
        .callout1 {
            top: 40%;
            left: 35%;
        }
        .callout2 {
            top: 25%;
            right: 35%;
        }
        .metrics {
            margin-top: 20px;
            font-size: 24px;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="title">Monthly active users tripled from 1.2M to 3.6M over 24 months</div>
    <div class="description">MAU trajectory, Jan 2024 - Dec 2025</div>

    <div class="chart-container">
        <div class="line"></div>
        <div class="callout1">'Q3 2024 launch'</div>
        <div class="callout2">'Q1 2025 paid acquisition'</div>
    </div>

    <div class="metrics">
        📈 MAU: 3.6M
    </div>

</body>
</html></div>
</body></html>

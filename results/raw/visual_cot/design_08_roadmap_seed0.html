<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-color: #0c0f23;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
        }
        .background-pattern {
            background-image: url('pattern.jpg');
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            opacity: 0.3;
        }
        .timeline {
            width: 80%;
            height: 10px;
            background: linear-gradient(to right, blue, purple, blue);
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .phase {
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            top: 30%;
        }
        .phase:nth-child(1) { left: 0; }
        .phase:nth-child(2) { left: 20%; }
        .phase:nth-child(3) { left: 40%; }
        .phase:nth-child(4) { left: 60%; }
        .phase:nth-child(5) { left: 80%; }
        .phase-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .phase-description {
            font-size: 0.9em;
            text-align: center;
            padding: 0 10px;
        }
        .emoji {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .number-badge {
            background-color: white;
            color: black;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: -20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-pattern"></div>
            <div class="timeline"></div>

            <div class="phase" style="background: rgba(0, 0, 255, 0.1);">
                <div class="emoji">🎯</div>
                <div class="phase-title">MVP 출시</div>
                <div class="phase-description">핵심 기능 3종 런칭</div>
                <div class="number-badge">1</div>
            </div>

            <div class="phase" style="background: rgba(255, 165, 0, 0.1);">
                <div class="emoji">📈</div>
                <div class="phase-title">성장 가속</div>
                <div class="phase-description">사용자 1만명 돌파 목표</div>
                <div class="number-badge">2</div>
            </div>

            <div class="phase" style="background: rgba(128, 0, 128, 0.1);">
                <div class="emoji">🌏</div>
                <div class="phase-title">글로벌 확장</div>
                <div class="phase-description">일본·동남아 시장 진출</div>
                <div class="number-badge">3</div>
            </div>

            <div class="phase" style="background: rgba(255, 255, 0, 0.1);">
                <div class="emoji">🏆</div>
                <div class="phase-title">엔터프라이즈</div>
                <div class="phase-description">대기업 맞춤 솔루션 출시</div>
                <div class="number-badge">4</div>
            </div>

            <div class="phase" style="background: rgba(0, 255, 255, 0.1);">
                <div class="emoji">🚀</div>
                <div class="phase-title">플랫폼화</div>
                <div class="phase-description">3rd party 앱 마켓플레이스</div>
                <div class="number-badge">5</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

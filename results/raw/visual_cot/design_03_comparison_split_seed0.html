<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온프레미스 vs 클라우드 네이티브</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1a1f36, #4e007f);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .half {
            width: 40%;
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .vs {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 40px;
            text-shadow: 0 0 10px #61dafb, 0 0 20px #61dafb;
        }
        .icon {
            float: left;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .left .icon {
            background: rgba(0,150,255,0.2);
        }
        .right .icon {
            background: rgba(255,0,150,0.2);
        }
        .left .item, .right .item {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="half left">
            <h2>온프레미스</h2>
            <div class="item">
                <div class="icon"></div>
                <span>초기 투자비용 높음</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>확장에 수주~수개월 소요</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>보안 직접 관리 필요</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>유지보수 인력 상시 필요</span>
            </div>
        </div>
        <div class="vs">VS</div>
        <div class="half right">
            <h2>클라우드 네이티브</h2>
            <div class="item">
                <div class="icon"></div>
                <span>사용량 기반 과금</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>분 단위 자동 스케일링</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>관리형 보안 서비스</span>
            </div>
            <div class="item">
                <div class="icon"></div>
                <span>인프라 자동화로 인력 절감</span>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

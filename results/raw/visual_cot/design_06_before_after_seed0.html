<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 도입 전후 업무 효율성 비교</title>
<style>
    body {
        margin: 0;
        width: 1280px;
        height: 720px;
        background: linear-gradient(to right, orange, blue);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
    }
    .container {
        display: flex;
        justify-content: space-between;
        width: 90%;
        height: 80%;
        position: relative;
    }
    .card {
        width: 45%;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        padding: 20px;
    }
    .title {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
    }
    .list-item {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
    }
    .emoji {
        font-size: 40px;
        margin-right: 15px;
    }
    .item-content {
        font-size: 18px;
    }
    .description {
        font-size: 14px;
        color: lightgray;
    }
    .arrow {
        position: absolute;
        left: 48%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 60px;
        color: lightblue;
        text-shadow: 0 0 10px white;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">도입 전</div>
            <div class="list-item">
                <div class="emoji">📝</div>
                <div class="item-content">
                    수작업 보고서 작성<br>
                    <span class="description">주 8시간 소요</span>
                </div>
            </div>
            <div class="list-item">
                <div class="emoji">🔍</div>
                <div class="item-content">
                    수동 데이터 검색<br>
                    <span class="description">건당 30분</span>
                </div>
            </div>
            <div class="list-item">
                <div class="emoji">📞</div>
                <div class="item-content">
                    전화/이메일 응대<br>
                    <span class="description">평균 응답 4시간</span>
                </div>
            </div>
        </div>
        <div class="arrow">→</div>
        <div class="card">
            <div class="title">도입 후</div>
            <div class="list-item">
                <div class="emoji">🤖</div>
                <div class="item-content">
                    자동 보고서 생성<br>
                    <span class="description">주 30분으로 단축</span>
                </div>
            </div>
            <div class="list-item">
                <div class="emoji">⚡</div>
                <div class="item-content">
                    RAG 기반 즉시 검색<br>
                    <span class="description">건당 5초</span>
                </div>
            </div>
            <div class="list-item">
                <div class="emoji">💬</div>
                <div class="item-content">
                    AI 챗봇 자동 응대<br>
                    <span class="description">평균 응답 10초</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

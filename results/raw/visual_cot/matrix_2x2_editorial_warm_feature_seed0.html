<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F5F4F0;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
        }
        .title {
            font-size: 32px;
            color: black;
            margin: 20px;
        }
        .description {
            font-size: 18px;
            color: black;
            margin: 20px;
        }
        .matrix {
            display: flex;
            position: absolute;
            left: 100px;
            top: 180px;
        }
        .quadrant {
            width: 280px;
            height: 280px;
            position: relative;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
        }
        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFF;
            font-size: 14px;
            margin: 10px;
            text-align: center;
            position: absolute;
        }
        .must-have {
            background-color: #C44730;
        }
        .ideas-to-validate {
            background-color: #C68842;
        }
        .text-label {
            position: absolute;
            left: -80px;
            top: 135px;
            transform: rotate(-90deg);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Six features rank as 'must-have' on importance and feasibility</div>
        <div class="description">Feature prioritization matrix</div>
        <div class="matrix">
            <div class="quadrant">
                <div class="circle must-have" style="top: 20px; left: 35px;">🟢<br>Feature 1</div>
                <div class="circle must-have" style="top: 110px; left: 35px;">🟢<br>Feature 2</div>
            </div>
            <div class="quadrant">
                <div class="circle must-have" style="top: 20px; left: 35px;">🟢<br>Feature 3</div>
                <div class="circle must-have" style="top: 110px; left: 35px;">🟢<br>Feature 4</div>
                <div class="circle must-have" style="top: 200px; left: 35px;">🟢<br>Feature 5</div>
                <div class="circle must-have" style="top: 290px; left: 35px;">🟢<br>Feature 6</div>
            </div>
            <!-- Right quadrants, styles not needed for this demo -->
        </div>
    </div>
</body>
</html></div>
</body></html>

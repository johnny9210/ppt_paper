<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f4ee;
            height: 720px;
            width: 1280px;
            position: relative;
            overflow: hidden;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
        }

        .title {
            text-align: center;
            color: #8B4513;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #8B4513;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .pyramid {
            width: 100%;
            position: relative;
            margin: 0 auto;
        }

        .pyramid .level {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            padding: 10px;
            background: linear-gradient(to bottom, #D2691E, #CD853F);
            border: 1px solid #8B4513;
            color: #FFFFFF;
            font-weight: bold;
            border-radius: 3px;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .pyramid .levels {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .pyramid .levels div {
            width: 30%;
            margin: 0 5px;
            padding: 20px;
            border: 1px solid #8B4513;
            background-color: #D2691E;
            color: #FFFFFF;
            border-radius: 3px;
            position: relative;
        }

        .icon {
            width: 24px;
            height: 24px;
            background-color: gold;
            border-radius: 50%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            Brand story rests on three values: craftsmanship, trust, and continuity
        </div>
        <div class="description">Brand pyramid</div>
        <div class="pyramid">
            <div class="level">
                <div>Timeless craftsmanship</div>
            </div>
            <div class="levels">
                <div>
                    <div class="icon"></div>
                    Craftsmanship
                </div>
                <div>
                    <div class="icon"></div>
                    Trust
                </div>
                <div>
                    <div class="icon"></div>
                    Continuity
                </div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            width: 1280px;
            height: 720px;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        h1 {
            font-size: 24px;
            color: #000;
            text-align: center;
        }
        .bar-chart {
            width: 80%;
            height: 50%;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            margin-top: 20px;
        }
        .bar {
            width: 12%;
            background-color: #gray;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            color: white;
            margin: 2px;
        }
        .positive {
            background-color: #2ca02c;
        }
        .negative {
            background-color: #d62728;
        }
        .tooltip {
            font-size: 14px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Revenue grew $4.2B from $12.8B base, 60% from cross-sell expansion</h1>
        <div class="bar-chart">
            <div class="bar" style="height: 80%;">
                <div class="tooltip">🔁 New customers<br>$1.4B</div>
            </div>
            <div class="bar positive" style="height: 50%;">
                <div class="tooltip">🔁 Cross-sell<br>$2.5B</div>
            </div>
            <div class="bar positive" style="height: 12%;">
                <div class="tooltip">🔁 Price<br>$0.6B</div>
            </div>
            <div class="bar negative" style="height: 6%;">
                <div class="tooltip">🔁 Churn<br>-$0.3B</div>
            </div>
            <div class="bar positive" style="height: 4%;">
                <div class="tooltip">🔁 FX<br>$0.2B</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

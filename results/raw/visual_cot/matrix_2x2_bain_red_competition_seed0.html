<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        .title {
            font-size: 36px;
            color: #b70000;
            text-align: center;
            margin-top: 20px;
        }
        .description {
            font-size: 18px;
            color: #494949;
            text-align: center;
            margin-top: 10px;
        }
        .graph {
            width: 80%;
            height: 70%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #cccccc;
        }
        .axis {
            position: absolute;
            border-left: 2px solid #000;
            border-bottom: 2px solid #000;
            width: 100%;
            height: 100%;
        }
        .vendor {
            position: absolute;
            border-radius: 50%;
            background-color: #7f7f7f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .vendorB {
            background-color: #b70000;
            width: 150px;
            height: 150px;
            top: 60px;
            left: 480px;
        }
        .vendorA {
            width: 100px;
            height: 100px;
            top: 50px;
            left: 200px;
        }
        .vendorC {
            width: 80px;
            height: 80px;
            top: 300px;
            left: 100px;
        }
        .vendorD {
            width: 80px;
            height: 80px;
            top: 350px;
            left: 220px;
        }
        .vendorE {
            width: 100px;
            height: 100px;
            top: 500px;
            left: 640px;
        }
        .vendorF {
            width: 60px;
            height: 60px;
            top: 200px;
            left: 520px;
        }
    </style>
</head>
<body>
    <div class="title">Vendor B owns the High-Capability / High-Stability sweet spot</div>
    <div class="description">Competitive landscape map</div>
    <div class="graph">
        <div class="axis"></div>
        <div class="vendor vendorB">Vendor B</div>
        <div class="vendor vendorA">Vendor A</div>
        <div class="vendor vendorC">Vendor C</div>
        <div class="vendor vendorD">Vendor D</div>
        <div class="vendor vendorE">Vendor E</div>
        <div class="vendor vendorF">Vendor F</div>
    </div>
</body>
</html></div>
</body></html>

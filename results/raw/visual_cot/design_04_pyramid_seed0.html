<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(to bottom right, #1e2a47, #16212e);
        color: white;
    }
    .container {
        width: 960px;
        height: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .title {
        font-size: 28px;
        margin-bottom: 20px;
    }
    .level {
        display: flex;
        flex-direction: row;
        justify-content: center;
        width: 100%;
        margin-bottom: 20px;
    }
    .tier {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        border: 1px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        padding: 10px;
        margin: 0 10px;
        width: 140px;
        height: 120px;
    }
    .icon {
        font-size: 24px;
        margin-bottom: 10px;
    }
    .tier-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .description {
        font-size: 12px;
        text-align: center;
    }
</style>
</head>
<body>
<div class="container">
    <div class="title">데이터 거버넌스 프레임워크</div>
    <div class="level">
        <div class="tier">
            <div class="icon">👑</div>
            <div class="tier-title">데이터 전략</div>
            <div class="description">경영진 주도 데이터 비전 및 정책 수립</div>
        </div>
    </div>
    <div class="level">
        <div class="tier">
            <div class="icon">📋</div>
            <div class="tier-title">품질 관리</div>
            <div class="description">데이터 표준화 및 품질 모니터링</div>
        </div>
        <div class="tier">
            <div class="icon">🔐</div>
            <div class="tier-title">보안 통제</div>
            <div class="description">접근 권한 및 개인정보 보호</div>
        </div>
    </div>
    <div class="level">
        <div class="tier">
            <div class="icon">🗄️</div>
            <div class="tier-title">수집</div>
            <div class="description">원천 데이터 통합</div>
        </div>
        <div class="tier">
            <div class="icon">⚙️</div>
            <div class="tier-title">처리</div>
            <div class="description">ETL 파이프라인</div>
        </div>
        <div class="tier">
            <div class="icon">📈</div>
            <div class="tier-title">분석</div>
            <div class="description">BI 대시보드 운영</div>
        </div>
    </div>
</div>
</body>
</html></div>
</body></html>

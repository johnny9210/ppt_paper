<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: white;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .title {
            font-size: 32px;
            color: black;
            margin-bottom: 10px;
        }
        .description {
            font-size: 20px;
            color: darkgray;
            margin-bottom: 40px;
        }
        .quadrant {
            position: relative;
            width: 80%;
            height: 50%;
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 600px;
            height: 400px;
            justify-items: center;
            align-items: center;
            border: 2px solid black;
        }
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .red {
            background-color: red;
        }
        .orange {
            background-color: orange;
        }
        .yellow {
            background-color: yellow;
            color: black;
        }
        .gray {
            background-color: gray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Two risk events fall in the High-Impact / High-Likelihood quadrant</div>
        <div class="description">Risk register prioritization</div>
        <div class="quadrant">
            <div class="grid">
                <div class="circle red">R1</div>
                <div class="circle red">R2</div>
                <div class="circle yellow">R3</div>
                <div class="circle yellow">R4</div>
                <div class="circle yellow">R5</div>
                <div class="circle orange">R6</div>
                <div class="circle orange">R7</div>
                <div class="circle gray">R8</div>
                <div class="circle gray">R9</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

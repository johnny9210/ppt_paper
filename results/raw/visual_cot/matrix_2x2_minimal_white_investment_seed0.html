<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .title {
            font-size: 36px;
            color: black;
            text-align: center;
        }
        .description {
            font-size: 24px;
            color: black;
            text-align: center;
            margin-bottom: 20px;
        }
        .quadrant {
            width: 80%;
            height: 60%;
            border: 1px solid black;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }
        .quadrant div {
            border: 1px solid lightgray;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .feature {
            font-size: 18px;
            color: black;
        }
        .emoji {
            font-size: 24px;
            margin-right: 5px;
        }
        .axis-labels {
            width: 80%;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="title">Quadrant analysis isolates 4 high-priority investments</div>
    <div class="description">Strategic investment prioritization</div>
    <div class="quadrant">
        <div class="feature"><span class="emoji">🟢</span> Initiative 1</div>
        <div class="feature"><span class="emoji">🟢</span> Initiative 2</div>
        <div class="feature"><span class="emoji">🟢</span> Initiative 3</div>
        <div class="feature"><span class="emoji">🟢</span> Initiative 4</div>
        <div class="feature"><span class="emoji">🟢</span> Initiative 5</div>
        <div class="feature"><span class="emoji">🟢</span> Initiative 6</div>
    </div>
    <div class="axis-labels">
        <div>Low Effort</div>
        <div>High Effort</div>
    </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            width: 1280px;
            height: 720px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            width: 80%;
            text-align: center;
        }
        .title {
            font-size: 24px;
            color: #333;
        }
        .description {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 300px;
            margin: 20px 0;
        }
        .bar {
            width: 50px;
            background-color: #333;
            text-align: center;
            color: white;
            position: relative;
        }
        .bar-value-85K {
            height: 255px;
        }
        .bar-value-66K {
            height: 198px;
            background-color: #999;
        }
        .value {
            position: absolute;
            top: -20px;
            width: 100%;
            font-size: 12px;
        }
        .label {
            margin-top: 5px;
            font-size: 14px;
            color: #333;
        }
        .source {
            font-size: 10px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Engagement dropped 22% on weekends across the user base</div>
        <div class="description">Daily active users by day-of-week</div>
        <div class="chart">
            <div class="bar bar-value-85K">
                <div class="value">85K</div>
                <div class="emoji">📊</div>
                <div class="label">Mon</div>
            </div>
            <div class="bar bar-value-85K">
                <div class="value">85K</div>
                <div class="emoji">📊</div>
                <div class="label">Tue</div>
            </div>
            <div class="bar bar-value-85K">
                <div class="value">85K</div>
                <div class="emoji">📊</div>
                <div class="label">Wed</div>
            </div>
            <div class="bar bar-value-85K">
                <div class="value">85K</div>
                <div class="emoji">📊</div>
                <div class="label">Thu</div>
            </div>
            <div class="bar bar-value-85K">
                <div class="value">85K</div>
                <div class="emoji">📊</div>
                <div class="label">Fri</div>
            </div>
            <div class="bar bar-value-66K">
                <div class="value">66K</div>
                <div class="emoji">📊</div>
                <div class="label">Sat</div>
            </div>
            <div class="bar bar-value-66K">
                <div class="value">66K</div>
                <div class="emoji">📊</div>
                <div class="label">Sun</div>
            </div>
        </div>
        <div class="source">Source: Product analytics, Nov 2025</div>
    </div>
</body>
</html></div>
</body></html>

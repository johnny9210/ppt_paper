<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F5F1EB;
            font-family: Arial, sans-serif;
            color: #333333;
        }
        .container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
        }
        .description {
            font-size: 24px;
            color: #C7C1B5;
            margin-bottom: 40px;
        }
        .workflow {
            display: flex;
            align-items: center;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
            text-align: center;
        }
        .step-icon {
            background-color: #B14E3B;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .step-title {
            font-size: 18px;
            font-weight: bold;
        }
        .step-description {
            font-size: 14px;
        }
        .arrow {
            border: solid #C7A16B;
            border-width: 0 4px 4px 0;
            display: inline-block;
            padding: 8px;
            margin-top: 15px;
        }
        .right {
            transform: rotate(-45deg);
            -webkit-transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Marketing campaign cycle spans 6 stages over 8 weeks</div>
        <div class="description">Campaign development workflow</div>
        <div class="workflow">
            <div class="step">
                <div class="step-icon">1</div>
                <div class="step-title">Brief</div>
                <div class="step-description">Stage 1</div>
            </div>
            <div class="arrow right"></div>
            <div class="step">
                <div class="step-icon">2</div>
                <div class="step-title">Creative</div>
                <div class="step-description">Stage 2</div>
            </div>
            <div class="arrow right"></div>
            <div class="step">
                <div class="step-icon">3</div>
                <div class="step-title">Approval</div>
                <div class="step-description">Stage 3</div>
            </div>
            <div class="arrow right"></div>
            <div class="step">
                <div class="step-icon">4</div>
                <div class="step-title">Production</div>
                <div class="step-description">Stage 4</div>
            </div>
            <div class="arrow right"></div>
            <div class="step">
                <div class="step-icon">5</div>
                <div class="step-title">Launch</div>
                <div class="step-description">Stage 5</div>
            </div>
            <div class="arrow right"></div>
            <div class="step">
                <div class="step-icon">6</div>
                <div class="step-title">Measure</div>
                <div class="step-description">Stage 6</div>
            </div>
        </div>
    </div>
</body>
</html></div>
</body></html>

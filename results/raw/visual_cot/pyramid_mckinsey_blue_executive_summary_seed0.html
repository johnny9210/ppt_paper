<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Priorities Design</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            position: relative;
        }
        .title {
            font-size: 36px;
            font-weight: bold;
            color: #000000;
            text-align: center;
            margin-top: 40px;
        }
        .description {
            font-size: 20px;
            color: #000000;
            text-align: center;
            margin-top: 10px;
        }
        .box {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 40px;
        }
        .box > div {
            border: 1px solid #000000;
            padding: 20px;
            width: 300px;
            text-align: center;
            background-color: #FFFFFF;
        }
        .arrow {
            position: absolute;
            width: 2px;
            height: 20px;
            background-color: #000000;
            left: 50%;
            transform: translateX(-50%);
        }
        .arrow.down {
            top: 150px;
        }
        .arrow.horizontal {
            top: 300px;
        }
        .box:last-child {
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="title">Three strategic priorities support our 2026 growth ambition</div>
    <div class="description">Executive summary</div>
    <div class="arrow down"></div>
    <div class="box">
        <div>Achieve $200M ARR by FY2026</div>
    </div>
    <div class="arrow horizontal"></div>
    <div class="box">
        <div>Expand APAC presence</div>
        <div>Launch Tier-2 products</div>
        <div>Build B2B partnerships</div>
    </div>
</body>
</html></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Implementation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 1280px;
            height: 720px;
            position: relative;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
            color: #000000;
        }
        p {
            font-size: 16px;
            text-align: center;
            color: #000000;
        }
        .chart {
            position: absolute;
            width: 1000px;
            left: 140px;
            top: 150px;
        }
        .bar {
            width: 150px;
            display: inline-block;
            vertical-align: bottom;
            text-align: center;
        }
        .bar span {
            display: block;
            color: #FFFFFF;
            margin-top: -20px;
        }
        .bar .cogs {
            height: 180px;
            background-color: #01355A;
        }
        .bar .pricing {
            height: 90px;
            background-color: #01355A;
        }
        .bar .sga {
            height: 40px;
            background-color: #B3B3B3;
            margin-top: 50px;
        }
        .bar .mix {
            height: 90px;
            background-color: #01355A;
        }
        footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Operating margin expanded 320 bps driven primarily by COGS reduction</h1>
        <p>FY2024 → FY2025 margin bridge</p>
        <div class="chart">
            <div class="bar">
                <div class="cogs"></div>
                <span>+180 bps</span>
            </div>
            <div class="bar">
                <div class="pricing"></div>
                <span>+90 bps</span>
            </div>
            <div class="bar">
                <div class="sga"></div>
                <span>-40 bps</span>
            </div>
            <div class="bar">
                <div class="mix"></div>
                <span>+90 bps</span>
            </div>
        </div>
        <footer>Source: Financial review, Q4 2025</footer>
    </div>
</body>
</html></div>
</body></html>

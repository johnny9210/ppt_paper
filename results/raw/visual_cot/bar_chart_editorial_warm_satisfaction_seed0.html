<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #F5F1E7;
        }
        .container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }
        .title {
            font-size: 2rem;
            color: #333;
            margin: 0;
        }
        .subtitle {
            font-size: 1rem;
            color: #C98D73;
            margin: 10px 0 20px 0;
        }
        .chart {
            position: absolute;
            bottom: 40px;
            left: 40px;
            height: 60%;
            width: calc(100% - 80px);
        }
        .bar-wrapper {
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }
        .bar {
            width: 10%;
            background-color: #943A1D;
            transition: height 0.3s ease-in-out;
        }
        .bar:nth-child(1) { height: 50%; }
        .bar:nth-child(2) { height: 55%; }
        .bar:nth-child(3) { height: 60%; }
        .bar:nth-child(4) { height: 65%; }
        .bar:nth-child(5) { height: 70%; }
        .bar:nth-child(6) { height: 75%; }
        .bar:nth-child(7) { height: 77%; }
        .bar:nth-child(8) { height: 85%; }
        .line {
            width: calc(100% - 80px);
            height: 2px;
            background-color: #D4A349;
            position: absolute;
            bottom: 40%;
            left: 40px;
            z-index: 2;
        }
        .arrow {
            position: absolute;
            font-size: 4rem;
            color: #FFD700;
            top: 10px;
            right: 40px;
        }
        .key-driver {
            position: absolute;
            bottom: 180px;
            left: 320px;
            background-color: #F5EBD4;
            padding: 5px 10px;
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">NPS rose to 67 driven by support quality improvements</h1>
        <h2 class="subtitle">NPS by quarter, last 8 quarters</h2>
        <div class="chart">
            <div class="bar-wrapper">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="line"></div>
        </div>
        <div class="key-driver">Key Driver: Enhanced support response time & resolution</div>
        <div class="arrow">67 ↑</div>
    </div>
</body>
</html></div>
</body></html>

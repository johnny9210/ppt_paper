<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container line_chart_minimal_white_saas" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .line_chart_minimal_white_saas-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: #EFF0F0;
    background: linear-gradient(180deg, #EFF0F0 0%, #8D939A 100%);
  }
</style>
<div class="line_chart_minimal_white_saas-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .line_chart_minimal_white_saas-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .line_chart_minimal_white_saas-decor svg {
    width: 100%;
    height: 100%;
  }
  .line_chart_minimal_white_saas-decor line {
    stroke: rgba(78, 86, 97, 0.5);
    stroke-width: 2;
  }
  .line_chart_minimal_white_saas-decor circle {
    fill: rgba(78, 86, 97, 0.5);
    r: 5;
  }
</style>

<div class="line_chart_minimal_white_saas-decor">
  <svg viewBox="0 0 100 100">
    <line x1="10" y1="65" x2="95" y2="35" />
    <circle cx="10" cy="65" />
    <circle cx="25" cy="60" />
    <circle cx="40" cy="55" />
    <circle cx="55" cy="50" />
    <circle cx="70" cy="45" />
    <circle cx="85" cy="40" />
    <circle cx="95" cy="35" />
  </svg>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"><div style="position:absolute;left:8.0%;top:58.0%;
                        width:84.0%;height:37.0%;z-index:8;
                        display:flex;flex-direction:column;align-items:center;justify-content:center;
                        padding:2%;">
  <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">ARR growth rate trajectory</div>
  <svg width="520" height="140" viewBox="0 0 520 140">
      <polyline points="0.0,140.0 74.3,118.5 148.6,123.8 222.9,96.9 297.1,80.8 371.4,64.6 445.7,37.7 520.0,0.0" stroke="#7A7F86" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"
                style="filter:drop-shadow(0 0 3px #7A7F8688);"/>
    </svg>
</div></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:90.0%;height:25.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f0f0f0;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 20px;
  }

  .hero-1 .hero-value {
    font-size: 2.8125rem; /* 45px */
    color: #000000; /* accent */
    font-weight: bold;
  }

  .hero-1 .hero-subtitle {
    font-size: 1.8125rem; /* ~29px */
    color: #333333; /* text_primary */
  }
</style>

<div class="hero-1">
  <div class="hero-value">ARR growth accelerated to 43% YoY by FY2025-end</div>
  <div class="hero-subtitle">ARR growth rate trajectory</div>
</div></div>
  <div style="position:absolute;inset:0;border:1px solid rgba(78, 86, 97, 0.5);opacity:1.0;pointer-events:none;"></div><div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/></svg></div>
</div>
<div class="card-wrap-1" style="position:absolute;left:4.0%;top:18.0%;width:92.0%;height:37.0%;z-index:10;">
  <div style="position:absolute;inset:0;"><style>
  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(to bottom, #E7E8E9, #C4C6C9);
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  .card-header {
    display: flex;
    align-items: center;
    margin-bottom: 1rem;
  }
  .card-1 .card-icon {
    background-color: #252F3A;
    border-radius: 50%;
    width: 2rem;
    height: 2rem;
    margin-right: 0.5rem;
  }
  .card-1 .card-value {
    font-size: 1.8125rem; /* 29px */
    color: #252F3A;
    font-weight: bold;
  }
  .card-body {
    width: 100%;
    padding: 1rem;
    background: #f0f0f0;
    border-radius: 0.5rem;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
  }
  .card-1 .card-label {
    font-size: 1.125rem; /* 18px */
    color: #252F3A;
    text-align: center;
  }
</style>

<div class="card-1">
  <div class="card-header">
    <div class="card-icon"><i class="fas fa-circle" style="font-size:1.8rem;color:#7A7F86;"></i></div>
    <div class="card-value">43%</div>
  </div>
  <div class="card-body">
    <div class="card-label">ARR Growth Rate 📈</div>
  </div>
</div></div>
</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:sans-serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">ARR growth accelerated to 43% YoY by FY2025-end</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">ARR growth rate trajectory</div>
</div>
</div></div>
</body></html>

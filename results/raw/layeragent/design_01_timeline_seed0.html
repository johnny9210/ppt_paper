        position: absolute;

        width: 5%;

        background: rgba(124, 153, 235, 0.7);

    margin: 0;

    align-items: center;
    justify-content: center;
    position: relative;
    background-color: rgba(35, 97, 141, 0.5);
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(62, 242, 236, 0.6);
    backdrop-filter: blur(12px);
  }

  .card-icon, .card-value, .card-label {
    width: 75%;
    height: 20%;
    background-color: rgba(112, 214, 237, 0.3);
    margin-bottom: 8px;
    border-radius: 6px;
    box-shadow: inset 0 0 8px rgba(112, 214, 237, 0.5);
  }

  .card-1 .card-icon, .card-2 .card-icon, .card-3 .card-icon, .card-4 .card-icon {
    height: 25%;
  }

  .card-3 .card-value, .card-4 .card-value {
    text-align: center;
    font-size: 1rem;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  .card-3 .card-label, .card-4 .card-label {
    text-align: center;
    font-size: 0.75rem;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

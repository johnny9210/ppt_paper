<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_09_layered_stack" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <style>
  /* v10 CJK guard */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-value, .card-label,
  .hero-1, .hero-2, .hero-value, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }

.design_09_layered_stack-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #0B0919 30%, #1a1a2e);
}
        </style>
        <div class="design_09_layered_stack-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
            <defs>
                <pattern id="p-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                    <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#F19A6E" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#F19A6E" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <circle cx="30" cy="20" r="1.5" fill="#F19A6E" opacity="0.18"/>
                    <circle cx="60" cy="40" r="1.5" fill="#F19A6E" opacity="0.18"/>
                    <circle cx="50" cy="30" r="1.5" fill="#F19A6E" opacity="0.18"/>
                    <circle cx="75" cy="55" r="1.5" fill="#F19A6E" opacity="0.18"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#p-circuit)"/>
        </svg>
    </div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;">
        <style>
            body {
                margin: 0;
                background-color: #0B0919;
                overflow: hidden;
            }

            .design_09_layered_stack-atmos {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: radial-gradient(circle at top, rgba(255, 255, 255, 0.25), transparent 60%),
                            linear-gradient(135deg, rgba(241, 154, 110, 0.1), transparent);
                filter: blur(30px);
            }
        </style>
        <div class="design_09_layered_stack-atmos"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;">
        <div style="position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%; color: #FFA65C;">
            <div style="font-family:display;font-size:1.75rem;font-weight:700;color:#F19A6E;letter-spacing:0.08em;text-transform:uppercase;">시스템 아키텍처 스택</div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <style>
            .design_09_layered_stack-decor {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
            }

            .gradient-panel {
                position: absolute;
                border-radius: 15px;
                backdrop-filter: blur(10px);
                box-shadow: 0 0 15px rgba(241, 154, 110, 0.5);
                border: 2px solid rgba(255, 255, 255, 0.2);
            }

            .top-layer, .middle-layer, .bottom-layer {
                background: linear-gradient(135deg, #FFA65C, #FF6EC4);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 500;
                text-align: center;
                padding: 10px;
            }

            .top-layer {
                left: 25%;
                top: 10%;
                width: 50%;
                height: 20%;
            }

            .middle-layer {
                left: 20%;
                top: 30%;
                width: 60%;
                height: 20%;
            }

            .bottom-layer {
                left: 15%;
                top: 50%;
                width: 70%;
                height: 20%;
            }

            .connector {
                position: absolute;
                left: 75%;
                top: 20%;
                width: 20%;
                height: 2px;
                background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
        </style>
        <div class="design_09_layered_stack-decor">
            <div class="gradient-panel top-layer">
                <div>🎨 프레젠테이션 계층<br/>React + Ant Design UI</div>
            </div>
            <div class="gradient-panel middle-layer">
                <div>⚡ API 계층<br/>Express Gateway + Moleculer</div>
            </div>
            <div class="gradient-panel bottom-layer">
                <div>🧠 서비스 계층<br/>FastAPI + LangGraph AI 에이전트</div>
            </div>
            <div class="gradient-panel" style="left: 10%; top: 70%; width: 80%; height: 20%;">
                <div>💾 인프라 계층<br/>MongoDB + OpenSearch + Redis + MinIO</div>
            </div>
            <div class="connector"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
</div></div>
</body></html>

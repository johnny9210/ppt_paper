<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_02_dashboard" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <style>
            .design_02_dashboard-bg-base {
                position: absolute;
                inset: 0;
                z-index: 0;
                background: linear-gradient(135deg, #021027 0%, #073559 100%);
            }
        </style>
        <div class="design_02_dashboard-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
            <defs>
                <pattern id="p-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                    <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#38859F" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#38859F" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <circle cx="30" cy="20" r="1.5" fill="#38859F" opacity="0.18"/>
                    <circle cx="60" cy="40" r="1.5" fill="#38859F" opacity="0.18"/>
                    <circle cx="50" cy="30" r="1.5" fill="#38859F" opacity="0.18"/>
                    <circle cx="75" cy="55" r="1.5" fill="#38859F" opacity="0.18"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#p-circuit)"/>
        </svg>
    </div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;">
        <style>
            .design_02_dashboard-atmos {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: 
                    radial-gradient(circle at top, rgba(56, 133, 159, 0.15), transparent 60%),
                    radial-gradient(circle at center, rgba(56, 133, 159, 0.2), transparent 70%);
            }
        </style>
        <div class="design_02_dashboard-atmos"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <style>
            .design_02_dashboard-decor {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
            }

            .glow-decor {
                position: absolute;
                width: 100px;
                height: 100px;
                border-radius: 50%;
                box-shadow: 0 0 15px rgba(56, 133, 159, 0.6), 0 0 30px rgba(56, 133, 159, 0.4);
                background: rgba(56, 133, 159, 0.1);
            }

            .glow-decor.one {
                top: 20%;
                left: 30%;
            }

            .glow-decor.two {
                top: 40%;
                left: 60%;
            }

            .glow-decor.three {
                top: 70%;
                left: 40%;
            }
        </style>

        <div class="design_02_dashboard-decor">
            <div class="glow-decor one"></div>
            <div class="glow-decor two"></div>
            <div class="glow-decor three"></div>
        </div>
    </div>
    
    <div class="card-wrap-1" style="position:absolute;left:10.0%;top:15.0%;width:20.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-1 {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    height: 100%;
                    background: rgba(31, 71, 103, 0.8);
                    border-radius: 15px;
                    box-shadow: 0 0 15px rgba(66, 185, 228, 0.7);
                    backdrop-filter: blur(10px);
                }

                .card-icon {
                    width: 60px;
                    height: 60px;
                    background: linear-gradient(135deg, #366B91, #42B9E4);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 0 10px rgba(66, 185, 228, 0.6);
                    margin-bottom: 15px;
                }

                .card-value {
                    font-size: 1.5rem;
                    color: #e0f7ff;
                    margin-bottom: 10px;
                    text-shadow: 0 0 5px rgba(66, 185, 228, 0.9);
                }

                .card-label {
                    font-size: 0.9rem;
                    color: #16e2e2;
                    opacity: 0.8;
                }
            </style>

            <div class="card-1">
                <div class="card-icon"><i class="fas fa-chart-column" style="font-size:1.8rem;color:#38859F;"></i></div>
                <div class="card-value">₩128억</div>
                <div class="card-label">매출</div>
            </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#38859F;opacity:1.0;pointer-events:none;"></div>
    </div>
    <div class="card-wrap-2" style="position:absolute;left:35.0%;top:15.0%;width:20.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-2 {
                    width: 100%;
                    height: 100%;
                    background: rgba(31, 71, 103, 0.8);
                    border-radius: 15px;
                    box-shadow: 0 0 15px rgba(66, 185, 228, 0.7);
                    backdrop-filter: blur(10px);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    position: relative;
                }

                .card-icon {
                    width: 60px;
                    height: 60px;
                    background: #4EC9E1;
                    border-radius: 50%;
                    margin-bottom: 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 0 10px #4EC9E1;
                }

                .card-value {
                    font-size: 2rem;
                    color: #ffffff;
                    text-shadow: 0 0 5px #ffffff;
                    margin-bottom: 5px;
                }

                .card-label {
                    width: 80%;
                    height: 8px;
                    background: rgba(76, 201, 225, 0.2);
                    border-radius: 4px;
                }
            </style>

            <div class="card-2">
                <div class="card-icon"><i class="fas fa-user" style="font-size:1.8rem;color:#38859F;"></i></div>
                <div class="card-value">2.4M</div>
                <div class="card-label">활성 사용자</div>
            </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#38859F;opacity:1.0;pointer-events:none;"></div>
    </div>
    <div class="card-wrap-3" style="position:absolute;left:60.0%;top:15.0%;width:20.0%;height:20.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-3 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background: rgba(31, 71, 103, 0.8);
                    border-radius: 15px;
                    box-shadow: 0 0 15px rgba(66, 185, 228, 0.7);
                }

                .card-icon {
                    width: 60px;
                    height: 60px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, #58D4D4, #1D3B4F);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 0 10px rgba(88, 212, 212, 0.7);
                    margin-bottom: 10px;
                }

                .card-value {
                    font-size: 1.5rem;
                    color: #FFFFFF;
                    font-weight: bold;
                    margin-bottom: 5px;
                }

                .card-label {
                    font-size: 0.8rem;
                    color: #e0f7ff;
                    opacity: 0.8;
                }
            </style>

            <div class="card-3">
                <div class="card-icon"><i class="fas fa-network-wired" style="font-size:1.8rem;color:#38859F;"></i></div>
                <div class="card-value">4.7/5.0</div>
                <div class="card-label">고객 만족도</div>
            </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#38859F;opacity:1.0;pointer-events:none;"></div>
    </div>
    <div class="card-wrap-4" style="position:absolute;left:15.0%;top:45.0%;width:70.0%;height:30.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-4 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background: rgba(31, 71, 103, 0.8);
                    box-shadow: 0 0 15px rgba(66, 185, 228, 0.7);
                    border-radius: 15px;
                    backdrop-filter: blur(10px);
                    color: #e0f7ff;
                }

                .card-icon {
                    font-size: 2.5rem;
                    margin-bottom: 0.5rem;
                    color: #95d4e2;
                }

                .card-value {
                    font-size: 5.375rem;
                    font-weight: bold;
                    color: #ffffff;
                }

                .card-label {
                    font-size: 1.25rem;
                    margin-top: 0.5rem;
                    color: #16e2e2;
                }
            </style>

            <div class="card-4">
                <div class="card-icon"><i class="fas fa-cloud" style="font-size:1.8rem;color:#38859F;"></i></div>
                <div class="card-value">월별 매출 추이</div>
                <div class="card-label">라벨자리</div>
            </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#38859F;opacity:1.0;pointer-events:none;"></div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:sans-serif;font-size:1.75rem;font-weight:700;color:#38859F;letter-spacing:0.08em;text-transform:uppercase;">Q4 2025 비즈니스 성과 대시보드</div>
    </div>
</div></div>
</body></html>

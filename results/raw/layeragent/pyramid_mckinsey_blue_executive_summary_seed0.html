<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container pyramid_mckinsey_blue_executive_summary" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

            .pyramid_mckinsey_blue_executive_summary-bg-base {
                position: absolute;
                inset: 0;
                z-index: 0;
                background: linear-gradient(to bottom, #ECEEF0, #A0AAB2);
            }
        </style>
        <div class="pyramid_mckinsey_blue_executive_summary-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none"
            style="position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;">
            <defs>
                <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="0.6" result="coloredBlur" />
                    <feMerge>
                        <feMergeNode in="coloredBlur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            <g filter="url(#neon-glow)">
                <path d="M50.50,19.00 Q34.20,17.70 21.50,28.00" stroke="#60A5FA" stroke-width="0.4" fill="none"
                    stroke-linecap="round" opacity="0.5" />
                <path d="M50.50,19.00 Q47.20,22.90 47.50,28.00" stroke="#60A5FA" stroke-width="0.4" fill="none"
                    stroke-linecap="round" opacity="0.5" />
                <path d="M50.50,19.00 Q60.70,28.30 74.50,28.00" stroke="#60A5FA" stroke-width="0.4" fill="none"
                    stroke-linecap="round" opacity="0.5" />
            </g>
        </svg>
    </div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <style>
            .pyramid_mckinsey_blue_executive_summary-decor {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
            }

            .pyramid_mckinsey_blue_executive_summary-decor div {
                position: absolute;
                transform: translate(-50%, -50%);
                width: 2px;
                height: 50px;
                background-color: rgba(160, 170, 178, 0.5);
            }

            .line-1 {
                top: 25%;
                left: 50%;
            }

            .line-2 {
                top: 35%;
                left: 25%;
            }

            .line-3 {
                top: 35%;
                left: 50%;
            }

            .line-4 {
                top: 35%;
                left: 75%;
            }
        </style>

        <div class="pyramid_mckinsey_blue_executive_summary-decor">
            <div class="line-1"></div>
            <div class="line-2"></div>
            <div class="line-3"></div>
            <div class="line-4"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>

    <div style="position:absolute;left:42.5%;top:11.0%;
                        width:16.0%;aspect-ratio:1;z-index:15;display:flex;
                        align-items:center;justify-content:center;border-radius:50%;
                        background:radial-gradient(circle, rgba(74,222,222,0.25) 0%, transparent 70%);

                        border:2px solid #60A5FA;">
        <i class="fas fa-network-wired" style="font-size:3rem;color:#60A5FA;filter:drop-shadow(0 0 10px #60A5FA);"></i>
    </div>

        <div style="position:absolute;inset:0;">
            <style>
                .hero-1 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: #ffffff;
                    border: 1px solid #000000;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    border-radius: 8px;
                }

                .hero-1 .hero-value {
                    font-size: 24px;
                    font-weight: bold;
                    color: #0055a4;
                    margin-bottom: 8px;
                }

                .hero-1 .hero-subtitle {
                    font-size: 16px;
                    color: #000000;
                }
            </style>

            <div class="hero-1">
                <div class="hero-value">Achieve $200M ARR by FY2026</div>
                <div class="hero-subtitle">Executive summary</div>
            </div>
        </div>
        <div style="position:absolute;inset:0;border:1px solid rgba(160, 170, 178, 0.5);opacity:1.0;pointer-events:none;"></div>
        <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7" />
            </svg>
        </div>
    </div>
    <div class="card-wrap-1" style="position:absolute;left:10.0%;top:25.0%;width:23.0%;height:6.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-1 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    background: linear-gradient(135deg, #E6EFF4, #C7D4DF);
                    border: 1px solid #000000;
                    border-radius: 8px;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    padding: 10px;
                    margin-top: 10px;
                    backdrop-filter: blur(4px);
                }

                .card-header {
                    display: flex;
                    align-items: center;
                    background: #062B4D;
                    border-radius: 16px;
                    padding: 5px 10px;
                    margin-right: 10px;
                }

                .card-1 .card-icon {
                    width: 30px;
                    height: 30px;
                    border-radius: 50%;
                    background: #244665;
                    margin-right: 8px;
                }

                .card-1 .card-value {
                    color: #E6EFF4;
                    font-size: 1.28rem;
                    font-weight: bold;
                }

                .card-body {
                    flex-grow: 1;
                    background-color: #20415F;
                    border-radius: 8px;
                    padding: 10px;
                    margin-left: 10px;
                }

                .card-1 .card-label {
                    text-align: center;
                    color: #E6EFF4;
                    font-size: 0.8rem;
                    margin-top: 5px;
                }

                .card-accent {
                    height: 6px;
                    background: linear-gradient(90deg, #244665, #20415F);
                    border-radius: 8px;
                    margin-top: 5px;
                }
            </style>

            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-bullseye" style="font-size:1.8rem;color:#A0AAB2;"></i></div>
                    <div class="card-value">Achieve $200M ARR by FY2026</div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                    <div class="card-accent"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-wrap-2" style="position:absolute;left:36.0%;top:25.0%;width:23.0%;height:6.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-2 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: #ffffff;
                    border: 1px solid #000000;
                    border-radius: 8px;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    padding: 1rem;
                }

                .card-header {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 0.5rem 1rem;
                    background-color: #89898A;
                    border-radius: 20px;
                    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
                    margin-bottom: 1rem;
                }

                .card-2 .card-icon {
                    font-size: 0.9375rem;
                    /* 15px */
                    margin-right: 0.5rem;
                }

                .card-2 .card-value {
                    font-size: 0.9375rem;
                    /* 15px */
                    font-weight: bold;
                    color: #1B1B1B;
                }

                .card-2 .card-label {
                    font-size: 0.75rem;
                    /* 12px */
                    color: #494949;
                    text-align: center;
                    margin-top: 0.5rem;
                }
            </style>

            <div class="card-2">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-chart-bar" style="font-size:1.8rem;color:#A0AAB2;"></i></div>
                    <div class="card-value">Expand APAC presence</div>
                </div>
                <div class="card-label"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-3" style="position:absolute;left:63.0%;top:25.0%;width:23.0%;height:6.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <style>
                .card-3 {
                    width: 100%;
                    height: 100%;
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: #ffffff;
                    border: 1px solid #000000;
                    border-radius: 8px;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    padding: 20px;
                    box-sizing: border-box;
                }

                .card-header {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: linear-gradient(90deg, #0B1E34 0%, #738594 100%);
                    border-radius: 20px;
                    padding: 8px 16px;
                    margin-bottom: 10px;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
                }

                .card-3 .card-icon {
                    font-size: 1rem;
                    /* Placeholder size */
                    margin-right: 10px;
                    color: #F1F1F1;
                }

                .card-3 .card-value {
                    font-size: 0.8125rem;
                    /* Equals 13px, OCR derived */
                    color: #F1F1F1;
                }

                .card-body {
                    background-color: #738594;
                    width: 100%;
                    padding: 10px;
                    border-radius: 10px;
                    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .card-3 .card-label {
                    font-size: 0.75rem;
                    color: #0B1E34;
                    line-height: 1.2;
                    text-align: center;
                }
            </style>

            <div class="card-3">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-handshake" style="font-size:1.8rem;color:#A0AAB2;"></i></div>
                    <div class="card-value">Launch Tier-2 products</div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                </div>
            </div>
        </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div
            style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">
            Three strategic priorities support our 2026 growth ambition</div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Executive summary</div>
    </div>
</div></div>
</body></html>

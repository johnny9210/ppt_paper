<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-value, .card-label,
  .hero-1, .hero-2, .hero-value, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }

  .design_06_before_after-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to right, #201E21, #A0D5D1);
  }

  .design_06_before_after-atmos {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle, rgba(160, 213, 209, 0.25) 0%, rgba(32, 30, 33, 0) 70%);
    filter: blur(80px);
  }

  .design_06_before_after-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .flare-effect {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20vw;
    height: 20vw;
    background: radial-gradient(circle, rgba(160, 213, 209, 0.8), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    filter: blur(30px);
  }

  .arrow-effect {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-left: 10vw solid transparent;
    border-right: 10vw solid transparent;
    border-bottom: 20vw solid #A0D5D1;
    filter: blur(5px);
  }

  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #EBDEC7, #5C818C, #403430);
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }

  .hero-value {
    font-size: 3rem;
    color: #C07456;
    text-shadow: 0 0 10px #C07456;
    text-align: center;
    margin-bottom: 10px;
  }

  .hero-subtitle {
    font-size: 1.5rem;
    color: #EBDEC7;
    opacity: 0.8;
    text-align: center;
  }

  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #070e19;
    height: 100vh;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(145deg, #4C2110, #704940);
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    padding: 1rem;
    font-size: 12px; /* Reduced from 16px */
  }

  .card-2 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1rem;
    border-radius: 15px;
    background: linear-gradient(145deg, #5E2411, #9A4F34);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    color: #ffffff;
    font-size: 13px; /* Reduced from 16px */
  }

  .card-3 {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    background: linear-gradient(145deg, #68413A, #A05845);
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    width: 100%;
    height: 100%;
    position: relative;
    padding: 1rem;
    font-size: 14px; /* Reduced from 16px */
  }

  .card-6 .card-value {
    color: #C3F4F4;
    font-size: 26px; /* Reduced from 28px */
  }

  .card-icon, .card-value, .card-label {
    flex: 1;
    background-color: rgba(148, 80, 55, 0.8);
    border: 1px solid #A0D5D1;
    border-radius: 8px;
    margin-bottom: 1rem;
    box-shadow: 0 0 10px #AF715C;
  }

  .card-value {
    line-height: 1.2; /* Adjusted line-height */
  }

</style>

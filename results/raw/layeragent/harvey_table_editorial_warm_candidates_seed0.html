<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container harvey_table_editorial_warm_candidates" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

.harvey_table_editorial_warm_candidates-bg-base {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(135deg, #F6F2E6 0%, #F0E8D6 100%);
}
</style>
<div class="harvey_table_editorial_warm_candidates-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    <style>
    .lt-table-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5%;
      box-sizing: border-box;
    }
    .lt-table {
      width: 100%;
      max-height: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(203, 148, 116, 1);
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      color: #F6F2E6;
    }
    .lt-table thead th {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
      color: #CB9474;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: left;
      padding: 14px 18px;
      letter-spacing: 0.04em;
      border-bottom: 1px solid rgba(203, 148, 116, 1);
    }
    .lt-table tbody td {
      padding: 12px 18px;
      font-size: 0.85rem;
      color: #F6F2E6;
      border-bottom: 1px solid rgba(203, 148, 116, 1);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .lt-table tbody tr:last-child td {
      border-bottom: none;
    }
    .lt-table tbody tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }
    .lt-table tbody td:first-child {
      color: rgba(153, 149, 140, 0.8);
      font-weight: 600;
    }
    </style>
<div style="position:absolute;left:6.0%;top:14.0%;width:88.0%;height:80.0%;z-index:9;">
  <div class="lt-table-wrap">
    <table class="lt-table">
      <thead><tr><th>Vision</th><th>Execution</th><th>Culture fit</th><th>Domain depth</th><th>Reference quality</th></tr></thead>
      <tbody><tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr><tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr><tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr><tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr><tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr></tbody>
    </table>
  </div>
</div>
    
    
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Candidate B exceeds requirements on culture and execution dimensions</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Senior leadership candidate scoring</div>
</div>
</div></div>
</body></html>

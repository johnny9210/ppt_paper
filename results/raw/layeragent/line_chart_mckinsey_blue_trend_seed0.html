<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .line_chart_mckinsey_blue_trend-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(180deg, #093B63, #8F9BA5);
  }

  .line_chart_mckinsey_blue_trend-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .timeline_line {
    position: absolute;
    left: 5%;
    top: 20%;
    width: 90%;
    height: 5px;
    background-color: #8F9BA5;
  }
  .glow_node {
    position: absolute;
    width: 5%;
    height: 5%;
    background-color: #8F9BA5;
    box-shadow: 0 0 0 rgba(143, 155, 165, 0);
    border-radius: 50%;
  }
  .glow_node:nth-child(2) {
    left: 15%;
    top: 70%;
  }
  .glow_node:nth-child(3) {
    left: 60%;
    top: 50%;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, #F2F3F3, #D2D6D9);
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    padding: 10px;
  }

  .card-header {
    background-color: #073A61;
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 5px 10px;
    margin-bottom: 10px;
  }

  .card-1 .card-icon {
    width: 18px;
    height: 18px;
    background-color: #91A5B2;
    border-radius: 50%;
    margin-right: 8px;
    font-size: 12px; /* Reduced by 25% from 16px */
  }

  .card-1 .card-value {
    font-size: 1.125rem; /* ~18px */
    color: #F2F3F3;
  }

  .card-body {
    background-color: #4E6D85;
    border-radius: 10px;
    padding: 10px;
    color: #F2F3F3;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-1 .card-label {
    font-size: 1rem; /* ~16px */
    color: #F2F3F3;
  }
</style>

<div class="slide-container line_chart_mckinsey_blue_trend" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="line_chart_mckinsey_blue_trend-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <div class="line_chart_mckinsey_blue_trend-decor">
            <div class="timeline_line"></div>
            <div class="glow_node"></div>
            <div class="glow_node"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;">
        <div style="position:absolute;left:8.0%;top:58.0%;
                        width:84.0%;height:37.0%;z-index:8;
                        display:flex;flex-direction:column;align-items:center;justify-content:center;
                        padding:2%;">
            <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">MAU trajectory, Jan 2024 - Dec 2025</div>
            <svg width="520" height="140" viewBox="0 0 520 140">
                <polyline points="0.0,140.0 74.3,118.5 148.6,123.8 222.9,96.9 297.1,80.8 371.4,64.6 445.7,37.7 520.0,0.0" stroke="#8F9BA5" stroke-width="2" fill="none"
                          stroke-linecap="round" stroke-linejoin="round"
                          style="filter:drop-shadow(0 0 3px #8F9BA588);"/>
            </svg>
        </div>
    </div>
    <div class="card-wrap-1" style="position:absolute;left:4.0%;top:18.0%;width:92.0%;height:37.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-chart-line" style="font-size:1.8rem;color:#8F9BA5;"></i></div>
                    <div class="card-value">3.6</div>
                </div>
                <div class="card-body">
                    <div class="card-label">MAU</div>
                </div>
            </div>
        </div>
    </div>
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:sans-serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Monthly active users tripled from 1.2M to 3.6M over 24 months</div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">MAU trajectory, Jan 2024 - Dec 2025</div>
    </div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .waterfall_bcg_green_growth-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to bottom right, #F0F0F0, #5AB189);
  }

  .waterfall_bcg_green_growth-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .waterfall_bcg_green_growth-decor .timeline_line {
    position: absolute;
    left: 5%;
    top: 28%;
    width: 90%;
    height: 2px;
    background-color: rgba(137, 137, 137, 0.5);
  }
  
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #e8e8e7;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 1rem;
    font-size: 13px; /* Reduced from 16px to 13px */
  }
  .hero-1 .hero-value {
    font-size: 2.5rem; /* 대략 40px */
    font-weight: bold;
    color: #29b573;
  }
  .hero-1 .hero-subtitle {
    font-size: 2.125rem; /* 대략 34px */
    color: #333333;
    margin-top: 0.5rem;
    text-align: center;
  }
  
  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    background-color: #e8e8e7;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 10px;
  }

  .card-header {
    display: flex;
    align-items: center;
    background-color: #898989;
    border-radius: 20px;
    padding: 5px 12px;
    backdrop-filter: blur(5px);
  }

  .card-1 .card-icon {
    font-size: 1rem; 
    color: #F0F1F1;
    margin-right: 8px;
  }

  .card-1 .card-value {
    font-size: 1.3125rem; /* 21px */
    color: #F0F1F1;
  }

  .card-body {
    display: flex;
    align-items: center;
    background-color: rgba(192, 193, 193, 0.8);
    border-radius: 4px;
    padding: 5px 10px;
    margin-top: 5px;
    width: 60%;
  }

  .card-1 .card-label {
    font-size: 0.8125rem; /* 13px */
    color: #353535;
  }

  .card-3 .card-icon {
    width: 24px;
    height: 24px;
    background-color: #1F955C;
    border-radius: 50%;
    margin-right: 8px;
    font-size: 13px; /* Reduced from 16px to 13px */
  }
  
  .card-3 .card-value {
    font-size: 2rem; /* Approximates 32px */
    color: #FFFFFF;
  }

  .card-body {
    background: #F0F3F2;
    border-radius: 8px;
    padding: 12px;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .card-3 .card-label {
    font-size: 1.125rem; /* Approximates 18px */
    color: #333333;
    text-align: center;
    margin-top: 8px;
  }

  .card-accent {
    height: 4px;
    background: linear-gradient(90deg, #70A28A 0%, #1F955C 100%);
    border-radius: 2px;
    margin-top: 8px;
  }
</style>

<div class="slide-container waterfall_bcg_green_growth" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="waterfall_bcg_green_growth-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <div class="waterfall_bcg_green_growth-decor">
            <div class="timeline_line"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;">
        <div style="position:absolute;left:8.0%;top:80.0%;width:84.0%;height:15.0%;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;">
            <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">Revenue bridge $12.8B → $17.0B</div>
            <svg width="600" height="108" viewBox="0 0 600 108">
                <rect x="26.7" y="44.3" width="66.7" height="43.7" fill="#5AB189" opacity="0.85" rx="3"/>
                <text x="60.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">New cust</text>
                <rect x="146.7" y="10.0" width="66.7" height="78.0" fill="#5AB189" opacity="0.85" rx="3"/>
                <text x="180.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Cross-se</text>
                <rect x="266.7" y="69.3" width="66.7" height="18.7" fill="#5AB189" opacity="0.85" rx="3"/>
                <text x="300.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Price</text>
                <rect x="386.7" y="97.4" width="66.7" height="-9.4" fill="#5AB189" opacity="0.85" rx="3"/>
                <text x="420.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Churn</text>
                <rect x="506.7" y="81.8" width="66.7" height="6.2" fill="#5AB189" opacity="0.85" rx="3"/>
                <text x="540.0" y="104" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">FX</text>
            </svg>
        </div>
    </div>
    <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:70.0%;height:10.0%;z-index:20;">
        <div style="position:absolute;inset:0;">
            <div class="hero-1">
                <div class="hero-value">$4.2B from $12.8B base, 60%</div>
                <div class="hero-subtitle">Revenue grew from cross-sell expansion</div>
            </div>
        </div>
        <div style="position:absolute;inset:0;border:1px solid rgba(137, 137, 137, 0.5);opacity:1.0;pointer-events:none;"></div>
        <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>
        </div>
    </div>
    <div class="card-wrap-1" style="position:absolute;left:5.0%;top:30.0%;width:20.0%;height:60.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-rocket" style="font-size:1.8rem;color:#5AB189;"></i></div>
                    <div class="card-value">1.4</div>
                </div>
                <div class="card-body">
                    <div class="card-label">New customers</div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-wrap-2" style="position:absolute;left:25.0%;top:30.0%;width:20.0%;height:60.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-2">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-arrow-trend-up" style="font-size:1.8rem;color:#5AB189;"></i></div>
                    <div class="card-value">2.5</div>
                </div>
                <div class="card-body">
                    <div class="card-label">Cross-sell</div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-3" style="position:absolute;left:45.0%;top:30.0%;width:20.0%;height:60.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-3">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-bullseye" style="font-size:1.8rem;color:#5AB189;"></i></div>
                    <div class="card-value">0.6</div>
                </div>
                <div class="card-body">
                    <div class="card-label">Price</div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-4" style="position:absolute;left:65.0%;top:30.0%;width:20.0%;height:60.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-4">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-users" style="font-size:1.8rem;color:#5AB189;"></i></div>
                    <div class="card-value">-0.3</div>
                </div>
                <div class="card-body">
                    <div class="card-label">Churn</div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-5" style="position:absolute;left:85.0%;top:30.0%;width:15.0%;height:60.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-5">
                <div class="card-value">0.2</div>
                <div class="card-label">FX</div>
            </div>
        </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:sans-serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Revenue grew $4.2B from $12.8B base, 60% from cross-sell expansion</div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Revenue bridge $12.8B → $17.0B</div>
    </div>
</div></div>
</body></html>

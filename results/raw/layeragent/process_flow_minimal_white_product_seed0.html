<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container process_flow_minimal_white_product" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

    .process_flow_minimal_white_product-bg-base {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
            135deg,
            #EDEEEE 0%,
            #C6C8CA 100%
        );
    }
</style>
<div class="process_flow_minimal_white_product-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
  <defs>
    <pattern id="p-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
      <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
      <circle cx="30" cy="20" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="60" cy="40" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="50" cy="30" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="75" cy="55" r="1.5" fill="#60A5FA" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p-circuit)"/>
</svg></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .process_flow_minimal_white_product-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .connector-line {
    position: absolute;
    width: 2px;
    height: 10%;
    background-color: rgba(105, 110, 116, 0.8);
    left: 50%;
    transform: translateX(-50%);
  }
  .connector-line:nth-child(1) { top: 30%; }
  .connector-line:nth-child(2) { top: 45%; }
  .connector-line:nth-child(3) { top: 60%; }

  .diamond-shape {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: rgba(105, 110, 116, 0.8);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .diamond-shape:nth-child(4) { top: 25%; left: 50%; }
  .diamond-shape:nth-child(5) { top: 40%; left: 50%; }
  .diamond-shape:nth-child(6) { top: 55%; left: 50%; }
  .diamond-shape:nth-child(7) { top: 70%; left: 50%; }
</style>

<div class="process_flow_minimal_white_product-decor">
  <div class="connector-line"></div>
  <div class="connector-line"></div>
  <div class="connector-line"></div>
  <div class="diamond-shape"></div>
  <div class="diamond-shape"></div>
  <div class="diamond-shape"></div>
  <div class="diamond-shape"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:sans-serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Product launch follows a 4-phase decision gate process</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">New product launch process</div>
</div>
</div></div>
</body></html>

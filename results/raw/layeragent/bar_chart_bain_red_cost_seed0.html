<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container bar_chart_bain_red_cost" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .bar_chart_bain_red_cost-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to right, #ECE5E7, #B50328);
  }
</style>
<div class="bar_chart_bain_red_cost-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .bar_chart_bain_red_cost-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .bar_chart_bain_red_cost-decor .rectangle {
    position: absolute;
    left: 5%;
    top: 20%;
    width: 90%;
    height: 10%;
    background-color: rgba(181, 3, 40, 0.5);
    border-radius: 10px;
    border: 2px solid #B50328;
  }
  .bar_chart_bain_red_cost-decor .timeline_line {
    position: absolute;
    left: 5%;
    top: 60%;
    width: 90%;
    height: 2px;
    background-color: #B50328;
  }
</style>

<div class="bar_chart_bain_red_cost-decor">
  <div class="rectangle"></div>
  <div class="timeline_line"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"><div style="position:absolute;left:8.0%;top:55.0%;
                        width:84.0%;height:40.0%;z-index:8;
                        display:flex;flex-direction:column;align-items:center;justify-content:center;
                        padding:2%;">
  <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">Savings opportunity by cost category</div>
  <svg width="520" height="140" viewBox="0 0 520 140">
      <polyline points="0.0,140.0 74.3,118.5 148.6,123.8 222.9,96.9 297.1,80.8 371.4,64.6 445.7,37.7 520.0,0.0" stroke="#B50328" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"
                style="filter:drop-shadow(0 0 3px #B5032888);"/>
    </svg>
</div></div>
    
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">3 cost categories represent 78% of total addressable savings</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Savings opportunity by cost category</div>
</div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0a0f19, #1f2a37);
    width: 1280px;
    height: 720px;
  }

  .slide {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .title {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: gold;
    z-index: 1;
  }

  .hero-value {
    position: absolute;
    top: 35%;
    left: 20%;
    font-size: 64px;
    color: gold;
    z-index: 2;
  }

  .hero-label {
    position: absolute;
    top: 50%;
    left: 20%;
    font-size: 24px;
    color: white;
    z-index: 2;
  }

  .stat-card {
    position: absolute;
    top: 30%;
    right: 10%;
    width: 300px;
    height: 80px;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    z-index: 3;
  }

  .stat-emoji {
    font-size: 40px;
    margin: 0 20px;
    color: gold;
  }

  .stat-value {
    font-size: 24px;
    color: gold;
  }

  .stat-label {
    font-size: 16px;
    color: white;
  }

</style>

<div class="slide">
  <div class="title">2025년 성과 하이라이트</div>
  <div class="hero-value">300%</div>
  <div class="hero-label">생산성 향상</div>

  <div class="stat-card" style="top: 30%;">
    <div class="stat-emoji">🏢</div>
    <div>
      <div class="stat-value">150+</div>
      <div class="stat-label">도입 기업</div>
    </div>
  </div>

  <div class="stat-card" style="top: 40%;">
    <div class="stat-emoji">👤</div>
    <div>
      <div class="stat-value">50K+</div>
      <div class="stat-label">월간 활성 사용자</div>
    </div>
  </div>

  <div class="stat-card" style="top: 50%;">
    <div class="stat-emoji">📄</div>
    <div>
      <div class="stat-value">2M+</div>
      <div class="stat-label">처리 문서 수</div>
    </div>
  </div>

  <div class="stat-card" style="top: 60%;">
    <div class="stat-emoji">⏱️</div>
    <div>
      <div class="stat-value">99.9%</div>
      <div class="stat-label">서비스 가동률</div>
    </div>
  </div>
</div></div>
</body></html>

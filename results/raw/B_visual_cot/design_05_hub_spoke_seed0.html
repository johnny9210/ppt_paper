<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0a0f29;
    overflow: hidden;
    position: relative;
  }

  .circuit-pattern {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(90deg, rgba(0, 255, 194, 0.1) 50%, transparent 50%), linear-gradient(rgba(0, 255, 194, 0.1) 50%, transparent 50%);
    background-size: 30px 30px;
    z-index: 0;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center-node {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 150px;
    height: 150px;
    background: #0a0f29;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(0, 255, 194, 0.6);
    z-index: 2;
  }

  .center-node::before {
    content: '🌐';
    font-size: 50px;
    color: #00ffc2;
  }

  .center-node-text {
    position: absolute;
    margin-top: 95px;
    color: #fff;
    font-size: 18px;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    position: absolute;
    width: 100%;
    height: 100%;
    justify-content: space-around;
    align-items: center;
  }

  .card {
    width: 150px;
    height: 100px;
    backdrop-filter: blur(10px);
    background: rgba(10, 15, 41, 0.8);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 255, 194, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .card-title {
    color: #00ffc2;
    font-size: 18px;
    margin-top: 10px;
  }

  .card-description {
    color: #fff;
    font-size: 14px;
    text-align: center;
    margin-top: 5px;
  }
</style>

<div class="circuit-pattern"></div>
<div class="slide">
  <div class="center-node"></div>
  <div class="center-node-text">API Gateway</div>
  <div class="container">
    <div class="card">
      <div>☁️</div>
      <div class="card-title">클라우드 스토리지</div>
      <div class="card-description">S3, MinIO 기반 객체 저장소</div>
    </div>
    <div class="card">
      <div>📡</div>
      <div class="card-title">실시간 스트리밍</div>
      <div class="card-description">Kafka 이벤트 브로커</div>
    </div>
    <div class="card">
      <div>🗄️</div>
      <div class="card-title">데이터베이스</div>
      <div class="card-description">PostgreSQL + MongoDB</div>
    </div>
    <div class="card">
      <div>🔒</div>
      <div class="card-title">인증/보안</div>
      <div class="card-description">OAuth2 + JWT 토큰</div>
    </div>
    <div class="card">
      <div>🤖</div>
      <div class="card-title">AI 서비스</div>
      <div class="card-description">LLM 추론 엔진</div>
    </div>
    <div class="card">
      <div>🌍</div>
      <div class="card-title">CDN/Edge</div>
      <div class="card-description">글로벌 콘텐츠 배포</div>
    </div>
  </div>
</div></div>
</body></html>

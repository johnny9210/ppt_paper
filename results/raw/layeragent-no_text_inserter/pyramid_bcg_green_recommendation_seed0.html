<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">

<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container pyramid_bcg_green_recommendation" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">

  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .pyramid_bcg_green_recommendation-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;

  .card-1 {
    width: 100%;

  }
  .card-accent {
    margin-top: 12px;
    width: 50px;
    height: 6px;
    background: linear-gradient(to right, #E6FCF5, #97D5BA);
    border-radius: 3px;
  }
</style>

<div class="card-1">

  <div class="card-body">

  </div>

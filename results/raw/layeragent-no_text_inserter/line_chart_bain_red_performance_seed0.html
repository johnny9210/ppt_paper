<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container line_chart_bain_red_performance" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .line_chart_bain_red_performance-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to bottom, #FFFFFF, #EBE8E8);
  }
</style>
<div class="line_chart_bain_red_performance-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .line_chart_bain_red_performance-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  
  .line_chart_bain_red_performance-decor .line {
    position: absolute;
    left: 15%;
    top: 30%;
    width: 80%;
    height: 2px;
    background: rgba(128, 128, 128, 0.5);
  }
</style>

<div class="line_chart_bain_red_performance-decor">
  <div class="line"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"><div style="position:absolute;left:8.0%;top:55.0%;
                        width:84.0%;height:40.0%;z-index:8;
                        display:flex;flex-direction:column;align-items:center;justify-content:center;
                        padding:2%;">
  <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">Cost per transaction, our co. vs benchmark</div>
  <svg width="520" height="140" viewBox="0 0 520 140">
      <polyline points="0.0,140.0 74.3,118.5 148.6,123.8 222.9,96.9 297.1,80.8 371.4,64.6 445.7,37.7 520.0,0.0" stroke="#CA6765" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round"
                style="filter:drop-shadow(0 0 3px #CA676588);"/>
    </svg>
</div></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:5.0%;top:5.0%;width:65.0%;height:20.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #ffffff;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 20px;
    gap: 10px;
  }
  
  .hero-1 .hero-value {
    font-size: 2.6rem;
    color: #c21807;
    font-weight: bold;
  }
  
  .hero-1 .hero-subtitle {
    font-size: 1.3rem;
    color: #5B5B5B;
    text-align: center;
  }
</style>

<div class="hero-1">
  <div class="hero-value">Cost-to-serve</div>
  <div class="hero-subtitle">Cost per transaction, our co. vs benchmark</div>
</div></div>
  <div style="position:absolute;inset:0;border:1px solid rgba(128, 128, 128, 0.5);opacity:1.0;pointer-events:none;"></div><div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/></svg></div>
</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">Cost-to-serve dropped below industry benchmark in Q3 2025</div>
    <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">Cost per transaction, our co. vs benchmark</div>
</div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container line_chart_editorial_warm_audience" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F6F2E6;
  }
  .line_chart_editorial_warm_audience-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #F6F2E6 0%, #FFFFFA 100%);
  }
</style>
<div class="line_chart_editorial_warm_audience-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
.line_chart_editorial_warm_audience-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.timeline_line {
    position: absolute;
    left: 10%;
    top: 32%;
    width: 80%;
    height: 2px;
    background: rgba(188, 94, 49, 0.8);
}

.glow_node {
    position: absolute;
    left: 85%;
    top: 36%;
    width: 10px;
    height: 10px;
    background: #BC5E31;
    border-radius: 50%;
}
</style>

<div class="line_chart_editorial_warm_audience-decor">
    <div class="timeline_line"></div>
    <div class="glow_node"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    
    
</div></div>
</body></html>

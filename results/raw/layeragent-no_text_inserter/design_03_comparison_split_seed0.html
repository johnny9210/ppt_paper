<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_03_comparison_split" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

    .design_03_comparison_split-bg-base {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(90deg, #0F0E38 50%, #9360B9 50%);
        color: #FFFFFF;
    }
</style>

<div class="design_03_comparison_split-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
  <defs>
    <pattern id="p-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
      <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
      <circle cx="30" cy="20" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="60" cy="40" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="50" cy="30" r="1.5" fill="#60A5FA" opacity="0.18"/>
      <circle cx="75" cy="55" r="1.5" fill="#60A5FA" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p-circuit)"/>
</svg></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"><style>
  .design_03_comparison_split-atmos {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(87, 151, 200, 0.8) 0%, rgba(15, 14, 56, 0) 70%), 
                radial-gradient(circle at left, rgba(147, 96, 185, 0.2), transparent 60%),
                radial-gradient(circle at right, rgba(147, 96, 185, 0.2), transparent 60%);
    filter: blur(20px);
  }
</style>
<div class="design_03_comparison_split-atmos"></div></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .design_03_comparison_split-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .design_03_comparison_split-decor::before,
  .design_03_comparison_split-decor::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 50%;
    height: 200px;
    background: none;
    border: 3px solid rgba(87, 151, 200, 0.8);
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(87, 151, 200, 0.8);
    pointer-events: none;
    transform: translateY(-50%);
  }

  .design_03_comparison_split-decor::before {
    left: 10%;
  }

  .design_03_comparison_split-decor::after {
    right: 10%;
  }

  .design_03_comparison_split-decor .vs-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    background: none;
    border: 3px solid rgba(87, 151, 200, 0.8);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(87, 151, 200, 0.8);
    transform: translate(-50%, -50%);
  }
</style>

<div class="design_03_comparison_split-decor">
  <div class="vs-icon"></div>
</div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:45.0%;top:45.0%;width:10.0%;height:10.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to right, #322677, #534CAA);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border: 3px solid #5B9AD8;
  }

  .hero-1 .hero-value {
    font-size: 1.92em; /* OCR 데이터가 있었다면 그 값을 사용 */
    color: #C9E3FD;
    margin-bottom: 0.5em;
    text-shadow: 0 0 10px #5B9AD8;
  }

  .hero-1 .hero-subtitle {
    font-size: 0.96em;
    color: #A263DB;
    text-shadow: 0 0 5px #5B9AD8;
  }
</style>

<div class="hero-1">
  <div class="hero-value">값자리</div>
  <div class="hero-subtitle">서브자리</div>
</div></div>
  <div style="position:absolute;inset:0;border:1px solid rgba(87, 151, 200, 0.8);opacity:1.0;pointer-events:none;"></div><div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/></svg></div>
</div>
<div class="card-wrap-1" style="position:absolute;left:5.0%;top:15.0%;width:35.0%;height:10.0%;z-index:10;">
  <div style="position:absolute;inset:0;"><style>
  .card-1 {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    border-radius: 50%;
    background: linear-gradient(to right, #322677, #534CAA);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    background: rgba(0, 179, 255, 0.1);
    padding: 10px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    margin-left: 10px;
  }

  .card-1 .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #93E2F4, #001336);
    box-shadow: 0 0 10px rgba(84, 144, 185, 0.8);
    margin-right: 10px;
  }

  .card-1 .card-value {
    color: #FFFFFF;
    font-size: 1rem;
    text-shadow: 0 0 5px #00BFFF;
  }

  .card-body {
    display: flex;
    flex-direction: column;
    margin-left: 10px;
  }

  .card-1 .card-label {
    color: #FFFFFF;
    font-size: 0.8rem;
    margin-top: 5px;
    line-height: 1.2;
  }
</style>

<div class="card-1">
  <div class="card-header">
    <div class="card-icon"><i class="fas fa-gear" style="font-size:1.8rem;color:#9360B9;"></i></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
  </div>
</div></div>
</div>
<div class="card-wrap-2" style="position:absolute;left:5.0%;top:30.0%;width:35.0%;height:10.0%;z-index:10;">
  <div style="position:absolute;inset:0;"><style>
  .card-2 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    background: linear-gradient(to right, #322677, #534CAA);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }

  .card-2 .card-header {
    display: flex;
    align-items: center;
    border-radius: 10px;
    background: linear-gradient(225deg, #88DDF5, #3588BF);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    padding: 8px;
  }

  .card-2 .card-2 .card-icon {
    width: 40px;
    height: 40px;
    background-color: #01173B;
    border-radius: 50%;
    margin-right: 10px;
  }

  .card-2 .card-2 .card-value {
    flex: 1;
    color: #ffffff;
    font-size: 0.80rem;
  }

  .card-2 .card-body {
    margin-top: 10px;
    padding: 10px;
    background-color: #01173B;
    border-radius: 15px;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
  }

  .card-2 .card-2 .card-label {
    margin-top: 10px;
    color: #88DDF5;
    font-size: 0.64rem;
  }
</style>

<div class="card-2">
  <div class="card-header">
    <div class="card-icon"><i class="fas fa-file-lines" style="font-size:1.8rem;color:#9360B9;"></i></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
  </div>
</div></div>
</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:display;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">온프레미스 vs 클라우드 네이티브</div>
    
</div>
</div></div>
</body></html>

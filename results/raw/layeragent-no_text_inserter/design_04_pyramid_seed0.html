<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_04_pyramid" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .design_04_pyramid-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(to bottom right, #191C24, #111317);
  }
</style>

<div class="design_04_pyramid-bg-base"></div></div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
  <defs>
    <pattern id="p-hex" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,4 55,18 55,38 30,52 5,38 5,18" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#p-hex)"/>
</svg></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"><style>
    .design_04_pyramid-atmos {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.25), transparent 60%),
                    radial-gradient(circle, rgba(0, 0, 0, 0.15), transparent 70%);
    }
</style>
<div class="design_04_pyramid-atmos"></div></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"><style>
  .design_04_pyramid-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .triangle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 300px;
    height: 300px;
    background: repeating-linear-gradient(
      60deg,
      transparent,
      transparent 10px,
      rgba(148,132,109,0.8) 10px,
      rgba(148,132,109,0.8) 20px
    );
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }
</style>

<div class="design_04_pyramid-decor">
  <div class="triangle"></div>
</div><div style="position:absolute;left:2.0%;top:10.0%;width:6.0%;height:6.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="50,10 90,90 10,90" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.15"/></svg></div><div style="position:absolute;left:92.0%;top:5.0%;width:5.0%;height:5.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="50,8 88,30 88,70 50,92 12,70 12,30" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.12"/></svg></div><div style="position:absolute;left:0.0%;top:80.0%;width:10.0%;height:10.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="42" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.12"/></svg></div><div style="position:absolute;left:80.0%;top:80.0%;width:7.0%;height:7.0%;pointer-events:none;"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="50,10 90,90 10,90" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.1"/></svg></div></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>
    
    
    <div class="hero-wrap-1" style="position:absolute;left:42.0%;top:5.0%;width:16.0%;height:15.0%;z-index:20;">
  <div style="position:absolute;inset:0;"><style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #131a29;
  }

  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 215, 0, 0.5);
  }

  .hero-1 .hero-value {
    font-size: 2em;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .hero-1 .hero-subtitle {
    font-size: 1em;
    color: #848481;
  }
</style>

<div class="hero-1">
  <div class="hero-value">값자리</div>
  <div class="hero-subtitle">서브자리</div>
</div></div>

</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
    <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">데이터 거버넌스 프레임워크</div>
    
</div>
</div></div>
</body></html>

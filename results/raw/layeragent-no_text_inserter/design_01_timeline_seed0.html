<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  .design_01_timeline-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #080E3C, #1B2854);
    overflow: hidden;
  }
  .glow-effect {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(115, 178, 221, 0.3) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .card-1 .card-icon, .card-2 .card-icon {
    font-size: 13px; /* 줄이기: 15% 감소 */
  }
  .design_01_timeline-atmos {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 20%, rgba(115, 178, 221, 0.25), transparent 60%),
                radial-gradient(circle, rgba(115, 178, 221, 0.2), transparent 70%);
    backdrop-filter: blur(20px);
  }
  .design_01_timeline-decor {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .glow_node {
    position: absolute;
    width: 5%;
    height: 5%;
    background: radial-gradient(circle, rgba(115, 178, 221, 0.8), transparent);
    border-radius: 50%;
    box-shadow: 0 0 15px 5px rgba(115, 178, 221, 0.7);
  }

  .timeline_line {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, rgba(115, 178, 221, 0.7), rgb(115, 178, 221, 0));
    z-index: 1;
  }

  .glow_node:nth-child(1) {
    top: 25%;
    left: 15%;
  }

  .glow_node:nth-child(2) {
    top: 25%;
    left: 35%;
  }

  .glow_node:nth-child(3) {
    top: 25%;
    left: 55%;
  }

  .glow_node:nth-child(4) {
    top: 25%;
    left: 75%;
  }

  .timeline_line {
    top: 25.5%;
    left: 10%;
    width: 70%;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, rgba(58, 104, 134, 0.6), rgba(44, 73, 109, 0.6));
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(128, 220, 234, 0.8), 0 0 30px rgba(100, 165, 184, 0.8);
    backdrop-filter: blur(10px);
    padding: 10px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90%;
    height: 20%;
    background: radial-gradient(circle, rgba(60, 139, 166, 0.9), rgba(128, 220, 234, 0.8));
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(60, 139, 166, 0.8);
  }

  .card-1 .card-icon {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    margin-right: 5px;
  }

  .card-1 .card-value {
    flex: 3;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    height: 100%;
  }

  .card-body {
    width: 90%;
    height: 60%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }

  .card-1 .card-label {
    background: linear-gradient(90deg, rgba(60, 139, 166, 0.9), rgba(100, 165, 184, 0.8));
    border-radius: 5px;
    height: 15%;
  }

  .card-accent {
    width: 80%;
    height: 5%;
    background: linear-gradient(90deg, #3C8BA6, #80DCEA);
    border-radius: 5px;
    box-shadow: 0 0 5px #80DCEA;
  }

  .card-2 {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, rgba(58, 104, 134, 0.6), rgba(44, 73, 109, 0.6));
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(128, 220, 234, 0.8), 0 0 30px rgba(100, 165, 184, 0.8);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: space-between;
    backdrop-filter: blur(10px);
  }

  .card-header {
    display: flex;
    align-items: center;
    background: rgba(146, 203, 237, 0.2);
    border-radius: 20px;
    padding: 5px 10px;
    box-shadow: 0 0 10px rgba(50, 200, 255, 0.5);
  }

  .card-2 .card-icon {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #766FC9, transparent);
    border-radius: 50%;
    margin-right: 10px;
  }

  .card-2 .card-value {
    flex-grow: 1;
    color: #ffffff;
    font-size: 0.875rem;
  }

  .card-body {
    flex-grow: 1;
    background: rgba(28, 68, 130, 0.4);
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.3);
  }

  .card-2 .card-label {
    background: linear-gradient(90deg, rgba(83, 109, 172, 0.5), rgba(146, 203, 237, 0.5));
    border-radius: 5px;
    height: 1rem;
    line-height: 1rem;
    color: #ffffff;
    text-align: center;
    font-size: 0.75rem;
  }

  .card-accent {
    height: 5px;
    background: linear-gradient(90deg, #536DAC, #6892C1);
    border-radius: 2.5px;
    box-shadow: 0 0 10px rgba(100, 220, 255, 0.7);
  }

  .card-3 {
    width: 190px;
    height: 240px;
    background: linear-gradient(135deg, rgba(58, 104, 134, 0.6), rgba(44, 73, 109, 0.6));
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 2px solid rgba(169, 169, 235, 0.8);
    box-shadow: 0 0 20px rgba(128, 220, 234, 0.8), 0 0 30px rgba(100, 165, 184, 0.8);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .card-header {
    background: linear-gradient(90deg, rgba(80, 176, 216, 0.7), rgba(113, 125, 203, 0.7));
    border-radius: 8px;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    box-shadow: 0 0 8px rgba(153, 209, 255, 0.5);
    width: 100%;
    justify-content: center;
  }

  .card-3 .card-icon {
    width: 20px;
    height: 20px;
    margin-right: 5px;
    background: radial-gradient(circle, rgba(61, 112, 180, 0.8), rgba(22, 70, 155, 0.8));
    border-radius: 50%;
  }

  .card-3 .card-value {
    color: #ffffff;
    font-size: 1rem;
    text-shadow: 0 0 5px rgba(169, 169, 235, 0.9);
  }

  .card-body {
    background: rgba(25, 55, 120, 0.5);
    border-radius: 15px;
    width: 100%;
    height: 60%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 10px rgba(0, 150, 255, 0.4);
  }

  .card-3 .card-label {
    color: #a873f0;
    font-size: 0.8rem;
    text-align: center;
    margin-top: 10px;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
  }

  .card-accent {
    width: 80%;
    height: 5px;
    background: linear-gradient(90deg, rgba(61, 112, 180, 1), rgba(113, 125, 203, 1));
    border-radius: 4px;
    margin-top: 10px;
  }

  .card-4 {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, rgba(58, 104, 134, 0.6), rgba(44, 73, 109, 0.6));
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(128, 220, 234, 0.8), 0 0 30px rgba(100, 165, 184, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
  }
  
  .card-header {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 10px 20px;
    margin-bottom: 10px;
    box-shadow: 0 0 8px #BEB1F0;
  }
  
  .card-4 .card-icon {
    font-size: 1.5rem;
    color: #BEB1F0;
    margin-right: 10px;
  }
  
  .card-4 .card-value {
    font-size: 1.5rem;
    color: #FFFFFF;
  }
  
  .card-body {
    width: 80%;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 15px;
    box-shadow: inset 0 0 5px #2F4B92;
    margin-bottom: 10px;
  }
  
  .card-4 .card-label {
    text-align: center;
    color: #a873f0;
    font-size: 0.9rem;
    line-height: 1.2rem;
  }

  .card-accent {
    width: 60%;
    height: 5px;
    background: linear-gradient(90deg, #33f1ff, #8A75C7);
    border-radius: 5px;
    box-shadow: 0 0 6px #33f1ff;
  }
</style>

<div class="slide-container design_01_timeline" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="design_01_timeline-bg-base">
            <div class="glow-effect"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;pointer-events:none;">
            <defs>
                <pattern id="p-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                    <path d="M 0,20 L 30,20 L 30,40 L 60,40 L 60,15 L 80,15" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <path d="M 10,0 L 10,30 L 50,30 L 50,55 L 75,55 L 75,80" stroke="#60A5FA" stroke-width="0.6" fill="none" opacity="0.18"/>
                    <circle cx="30" cy="20" r="1.5" fill="#60A5FA" opacity="0.18"/>
                    <circle cx="60" cy="40" r="1.5" fill="#60A5FA" opacity="0.18"/>
                    <circle cx="50" cy="30" r="1.5" fill="#60A5FA" opacity="0.18"/>
                    <circle cx="75" cy="55" r="1.5" fill="#60A5FA" opacity="0.18"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#p-circuit)"/>
        </svg>
    </div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;">
        <div class="design_01_timeline-atmos"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;">
        <div class="design_01_timeline-decor">
            <div class="glow_node"></div>
            <div class="glow_node"></div>
            <div class="glow_node"></div>
            <div class="glow_node"></div>
            <div class="timeline_line"></div>
        </div>
    </div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;"></div>

    <div class="card-wrap-1" style="position:absolute;left:10.0%;top:50.0%;width:10.0%;height:25.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-database" style="font-size:1.8rem;color:#73B2DD;"></i></div>
                    <div class="card-value"></div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                    <div class="card-label"></div>
                    <div class="card-label"></div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-2" style="position:absolute;left:30.0%;top:50.0%;width:10.0%;height:25.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-2">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-shield-halved" style="font-size:1.8rem;color:#73B2DD;"></i></div>
                    <div class="card-value"></div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-3" style="position:absolute;left:50.0%;top:50.0%;width:10.0%;height:25.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-3">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-globe" style="font-size:1.8rem;color:#73B2DD;"></i></div>
                    <div class="card-value"></div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div class="card-wrap-4" style="position:absolute;left:70.0%;top:50.0%;width:10.0%;height:25.0%;z-index:10;box-shadow:0 3px 0 0 #60A5FA;">
        <div style="position:absolute;inset:0;">
            <div class="card-4">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-user" style="font-size:1.5rem;color:#73B2DD;"></i></div>
                    <div class="card-value">값자리</div>
                </div>
                <div class="card-body">
                    <div class="card-label">라벨자리</div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:display;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">디지털 전환 로드맵 2025</div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">4단계 전환 마일스톤과 핵심 목표</div>
    </div>
</div></div>
</body></html>

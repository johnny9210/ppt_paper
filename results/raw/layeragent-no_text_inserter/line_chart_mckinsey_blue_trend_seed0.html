<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  /* v10 CJK guard — long Korean labels can wrap mid-character */
  .card-1, .card-2, .card-3, .card-4, .card-5, .card-6, .card-7, .card-8,
  .card-icon, .card-label, .hero-1, .hero-2, .hero-subtitle {
    word-break: keep-all;
    overflow-wrap: anywhere;
    hyphens: none;
  }
  /* 값 토큰은 절대 분해 금지 (예: +180%, 8.5만, ₩128억) */
  .card-value, .hero-value {
    word-break: keep-all;
    overflow-wrap: normal;
    white-space: nowrap;
    hyphens: none;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  .line_chart_mckinsey_blue_trend-bg-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #093B63 0%, #BAC0C5 100%);
  }

  .hero-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #0A3B62;
    color: #FFF;
    padding: 20px;
    background: linear-gradient(to bottom right, #61798C, #9FA9B0);
    border-radius: 10px;
  }
  .hero-1 .hero-value {
    font-size: 1.8rem;
    color: #003366;
    margin-bottom: 10px;
  }
  .hero-1 .hero-subtitle {
    font-size: 1.3rem;
    color: #EEEFEF;
  }

  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(to bottom right, #61798C, #9FA9B0);
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 16px;
    color: #F2F3F3;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: #073A61;
    border-radius: 8px;
    padding: 8px;
  }

  .card-1 .card-icon {
    width: 24px;
    height: 24px;
    background: #D2D6D9;
    border-radius: 50%;
    margin-right: 8px;
    font-size: 12.8px;
  }

  .card-1 .card-value {
    font-size: 0.9375rem; /* ~15px */
    font-weight: bold;
  }

  .card-body {
    margin-top: 16px;
    background: #4E6D85;
    border-radius: 8px;
    padding: 12px;
  }

  .card-1 .card-label {
    font-size: 1rem; /* ~16px */
    line-height: 1.5;
    color: #91A5B2;
  }

  .card-accent {
    margin-top: 16px;
    height: 5px;
    border-radius: 5px;
    background: linear-gradient(90deg, #4E6D85, #073A61);
  }
</style>

<div class="slide-container line_chart_mckinsey_blue_trend" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;">
        <div class="line_chart_mckinsey_blue_trend-bg-base"></div>
    </div>
    <div style="position:absolute;inset:0;z-index:1;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:2;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:4;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;z-index:8;pointer-events:none;">
        <div style="position:absolute;left:8.0%;top:58.0%;width:84.0%;height:37.0%;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2%;">
            <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:8px;font-weight:600;">
                MAU trajectory, Jan 2024 - Dec 2025
            </div>
            <svg width="520" height="140" viewBox="0 0 520 140">
                <polyline points="0.0,140.0 74.3,118.5 148.6,123.8 222.9,96.9 297.1,80.8 371.4,64.6 445.7,37.7 520.0,0.0" stroke="#BAC0C5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px #BAC0C588);"/>
            </svg>
        </div>
    </div>
    <div class="hero-wrap-1" style="position:absolute;left:10.0%;top:10.0%;width:80.0%;height:80.0%;z-index:20;">
        <div style="position:absolute;inset:0;">
            <div class="hero-1">
                <div class="hero-value">큰 값 자리</div>
                <div class="hero-subtitle">서브 자리</div>
            </div>
        </div>
        <div style="position:absolute;inset:0;border:1px solid rgba(141, 160, 176, 0.1);opacity:1.0;pointer-events:none;"></div>
        <div style="position:absolute;left:0.0%;top:0.0%;width:8.0%;height:8.0%;pointer-events:none;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polyline points="5,40 5,5 40,5" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>
        </div>
    </div>
    <div class="card-wrap-1" style="position:absolute;left:4.0%;top:18.0%;width:92.0%;height:37.0%;z-index:10;">
        <div style="position:absolute;inset:0;">
            <div class="card-1">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-users" style="font-size:1.8rem;color:#BAC0C5;"></i></div>
                    <div class="card-value"></div>
                </div>
                <div class="card-body">
                    <div class="card-label"></div>
                </div>
                <div class="card-accent"></div>
            </div>
        </div>
    </div>
    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;max-width:90%;">
        <div style="font-family:serif;font-size:1.75rem;font-weight:700;color:#60A5FA;letter-spacing:0.08em;text-transform:uppercase;">
            Monthly active users tripled from 1.2M to 3.6M over 24 months
        </div>
        <div style="font-size:0.75rem;color:#F1F5F9;margin-top:4px;opacity:0.85;">MAU trajectory, Jan 2024 - Dec 2025</div>
    </div>
</div></div>
</body></html>

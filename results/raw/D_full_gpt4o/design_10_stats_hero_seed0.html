<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div class="slide-container design_10_stats_hero" style="width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Noto Sans KR',sans-serif;">
    <div style="position:absolute;inset:0;z-index:0;"><style>
    .design_10_stats_hero-bg {
        width: 1280px;
        height: 720px;
        background: linear-gradient(135deg, #1A1A2E, #16213E);
        position: relative;
        overflow: hidden;
    }

    .design_10_stats_hero-bg::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 20%, transparent 70%);
        top: 50%;
        left: 30%;
        transform: translate(-50%, -50%);
        opacity: 0.5;
        filter: blur(50px);
    }

    .glow-node {
        position: absolute;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.5);
    }
    
    .glow-node-1 {
        top: 35%;
        left: 75%;
    }
    
    .glow-node-2 {
        top: 55%;
        left: 45%;
    }
</style>

<div class="design_10_stats_hero-bg">
    <div class="glow-node glow-node-1"></div>
    <div class="glow-node glow-node-2"></div>
</div></div>
    <div style="position:absolute;left:55.0%;top:15.0%;width:40.0%;height:7.0%;z-index:10;">
<style>
    .card-1 {
        width: 100%;
        height: 100%;
        position: relative;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(10, 10, 10, 0.2);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0, 0, 128, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-1::before {
        content: '';
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        background: rgba(20, 20, 20, 0.4);
        border-radius: 16px;
    }

    .text-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px;
    }

    .step-label {
        font-size: 0.55rem;
        color: rgba(96, 165, 250, 0.8);
        font-weight: 600;
        letter-spacing: 0.1em;
    }

    .emoji {
        font-size: 1.5rem;
    }

    .title {
        font-size: 0.85rem;
        font-weight: 700;
        color: #e2e8f0;
    }

    .description {
        font-size: 0.65rem;
        color: rgba(148, 163, 184, 0.85);
        line-height: 1.4;
    }
</style>

<div class="card-1">
    <div class="text-content">
        <div class="step-label">STEP 1</div>
        <div class="emoji">🏢</div>
        <div class="title">150+</div>
    </div>
    <div class="text-content">
        <div class="description">도입 기업</div>
    </div>
</div>
</div>
<div style="position:absolute;left:55.0%;top:25.0%;width:40.0%;height:7.0%;z-index:10;">
<style>
    .card-2 {
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 16px;
        background: rgba(43, 45, 66, 0.2);
        border: 1px solid rgba(148, 163, 184, 0.15);
        box-shadow: 0 0 15px rgba(0, 0, 128, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
    }

    .inner-section {
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.1);
    }
</style>

<div class="card-2">
    <div class="inner-section">
        <div class="text-content">
            <div class="step-label">STEP 2</div>
            <div class="emoji">👤</div>
            <div class="title">50K+</div>
        </div>
        <div class="text-content">
            <div class="description">월간 활성 사용자</div>
        </div>
    </div>
</div>
</div>
<div style="position:absolute;left:55.0%;top:35.0%;width:40.0%;height:7.0%;z-index:10;">
<style>
.card-3 {
  width: 100%;
  height: 100%;
  position: relative;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(148, 163, 184, 0.15);
  border-radius: 16px;
  box-shadow: 0 0 15px rgba(0, 0, 128, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.card-3::before {
  content: '';
  position: absolute;
  top: 10%;
  left: 10%;
  right: 10%;
  height: 30%;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
}

.card-3::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 10%;
  right: 10%;
  height: 30%;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 16px;
  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
}
</style>

<div class="card-3">
    <div class="text-content">
        <div class="step-label">STEP 3</div>
        <div class="emoji">📄</div>
        <div class="title">2M+</div>
    </div>
    <div class="text-content">
        <div class="description">처리 문서 수</div>
    </div>
</div>
</div>
<div style="position:absolute;left:55.0%;top:45.0%;width:40.0%;height:7.0%;z-index:10;">
<style>
    .card-4 {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(36, 36, 36, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 16px;
        box-shadow: 0 0 15px rgba(0, 0, 128, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        padding: 10px 20px;
    }

    .card-4 .icon-section {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 50%;
        flex: 0 0 50px;
        height: 50px;
        margin-right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-4 .text-section {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 10px;
        flex: 1;
    }
</style>

<div class="card-4">
    <div class="icon-section">
        <!-- 아이콘용 빈 공간 -->
    </div>
    <div class="text-section">
        <div class="text-content">
            <div class="step-label">STEP 4</div>
            <div class="emoji">⏱️</div>
            <div class="title">99.9%</div>
        </div>
        <div class="text-content">
            <div class="description">서비스 가동률</div>
        </div>
    </div>
</div>
</div>

    <div style="position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:25;text-align:center;">
    <div style="font-size:1.5rem;font-weight:800;color:#f1f5f9;text-shadow:0 2px 12px rgba(0,0,0,0.4);">2025년 성과 하이라이트</div>
    <div style="font-size:0.7rem;color:rgba(148,163,184,0.7);margin-top:4px;"></div>
</div>
</div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
.card-2 {
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, #EFF1F2, #C9CED1);
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.card-header {
  background-color: #053152;
  padding: 0.5rem 1rem;
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
}

.card-icon {
  width: 1.25rem;
  height: 1.25rem;
  margin-right: 0.5rem;
  flex-shrink: 0;
}

.card-value {
  font-size: 1.1875rem; /* 19px */
  color: #EFF1F2;
}

.card-body {
  padding: 1rem;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-label {
  font-size: 1.1875rem; /* 19px */
  color: #333333;
  line-height: 1.5;
}

.card-accent {
  height: 0.5rem;
  background-color: #8F9498;
  width: 100%;
  border-radius: 0 0 8px 8px;
}
</style>

<div class="card-2">
  <div class="card-header">
    <div class="card-icon"></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
  </div>
  <div class="card-accent"></div>
</div></div></div></div>
</body></html>

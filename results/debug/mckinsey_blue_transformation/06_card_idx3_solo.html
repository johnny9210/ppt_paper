<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
  .card-3 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #CCD1D4;
    border: 2px solid #043154;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }
  
  .card-header {
    display: flex;
    background: #043154;
    color: #F1F3F4;
    padding: 8px;
    justify-content: space-between;
    align-items: center;
  }
  
  .card-icon {
    font-size: 1.25rem;
  }
  
  .card-value {
    font-size: 1.25rem;
  }
  
  .card-body {
    padding: 16px;
    background: #F1F3F4;
    color: #333333;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  
  .card-label {
    font-size: 0.9375rem;
    color: #515A64;
  }
  
  .card-accent {
    height: 4px;
    background: linear-gradient(to right, #8E9599, #F1F3F4);
    border-radius: 2px;
  }
</style>

<div class="card-3">
  <div class="card-header">
    <div class="card-icon">ICON</div>
    <div class="card-value">3. Pilot</div>
  </div>
  <div class="card-body">
    <div class="card-label">Launch MVP in select areas</div>
    <div class="card-label">Test new processes & tools</div>
    <div class="card-label">Gather user feedback & iterate</div>
  </div>
  <div class="card-accent"></div>
</div></div></div></div>
</body></html>

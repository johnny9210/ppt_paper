<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
  .card-5 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #013359;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }
  
  .card-header {
    background: linear-gradient(135deg, #003d66, #013359);
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .card-icon {
    background: #DFE2E4;
    border-radius: 50%;
    width: 2rem;
    height: 2rem;
  }

  .card-value {
    color: #DFE2E4;
    font-size: 1.2rem;
    font-weight: bold;
    margin-left: 0.5rem;
  }

  .card-body {
    padding: 1rem;
    background: #24272C;
    color: #959A9E;
    flex: 1;
  }

  .card-label {
    font-size: 1rem;
    color: #959A9E;
    line-height: 1.5;
  }

  .card-accent {
    width: 100%;
    height: 0.25rem;
    background: linear-gradient(90deg, #555D66, #24272C);
  }
</style>

<div class="card-5">
  <div class="card-header">
    <div class="card-icon"></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
  </div>
  <div class="card-accent"></div>
</div></div></div></div>
</body></html>

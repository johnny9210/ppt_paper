<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
  .card-4 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background-color: #053052;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 16px;
    color: #E4E7E9;
  }

  .card-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }

  .card-icon {
    font-size: 1.25rem;
    background-color: #81868A;
    border-radius: 50%;
    padding: 8px;
    margin-right: 12px;
    background: linear-gradient(145deg, #4A525B, #81868A);
  }

  .card-value {
    font-size: 1.5rem;
    font-weight: bold;
  }

  .card-body {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-label {
    font-size: 1rem;
    margin-top: 10px;
    line-height: 1.5;
  }

  .card-accent {
    width: 70%;
    height: 8px;
    margin-top: 16px;
    background: linear-gradient(to right, #81868A, #E4E7E9);
    border-radius: 4px;
  }
</style>

<div class="card-4">
  <div class="card-header">
    <div class="card-icon"></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
  </div>
  <div class="card-accent"></div>
</div></div></div></div>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
    .mckinsey_blue_transformation-decor {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
    }
    .mckinsey_blue_transformation-decor .arrow {
        position: absolute;
        width: 0; 
        height: 0; 
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-top: 20px solid #6D7B86;
        transform: translateX(-50%);
    }
    .mckinsey_blue_transformation-decor .arrow1 {
        left: 20%;
        top: 50%;
    }
    .mckinsey_blue_transformation-decor .arrow2 {
        left: 42%;
        top: 50%;
    }
    .mckinsey_blue_transformation-decor .arrow3 {
        left: 61%;
        top: 50%;
    }
    .mckinsey_blue_transformation-decor .arrow4 {
        left: 80%;
        top: 50%;
    }
</style>
<div class="mckinsey_blue_transformation-decor">
    <div class="arrow arrow1"></div>
    <div class="arrow arrow2"></div>
    <div class="arrow arrow3"></div>
    <div class="arrow arrow4"></div>
</div></div>
</body></html>

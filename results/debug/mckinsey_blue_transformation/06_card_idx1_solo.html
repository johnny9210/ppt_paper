<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
  .card-1 {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(to bottom, #043153, #4E5760);
    border-radius: 10px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    color: #E9ECED;
    padding: 1rem;
  }
  
  .card-header {
    display: flex;
    align-items: center;
    margin-bottom: 1rem;
    background: #043153;
    border-radius: 8px;
    padding: 0.5rem;
    box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.2);
  }

  .card-icon {
    font-size: 1.0625rem; /* 17px */
    margin-right: 0.5rem;
  }
  
  .card-value {
    font-size: 1.375rem; /* 22px */
    font-weight: bold;
  }

  .card-body {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 1rem;
    flex-grow: 1;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
  }

  .card-label {
    font-size: 1.1875rem; /* 19px */
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  .card-accent {
    background: #043153;
    border-radius: 4px;
    height: 4px;
    width: 30%;
    margin-top: 1rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
</style>

<div class="card-1">
  <div class="card-header">
    <div class="card-icon"></div>
    <div class="card-value"></div>
  </div>
  <div class="card-body">
    <div class="card-label"></div>
    <div class="card-label"></div>
    <div class="card-label"></div>
  </div>
  <div class="card-accent"></div>
</div></div></div></div>
</body></html>

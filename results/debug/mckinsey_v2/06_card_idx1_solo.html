<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<div style="width:1280px;height:720px;overflow:hidden;position:relative;"><div style="position:absolute;inset:0;background:#101524;"></div><div style="position:absolute;left:25%;top:20%;width:50%;height:60%;outline:1px dashed rgba(255,255,255,0.25);"><div style="position:absolute;inset:0;"><style>
.card-1 {
  width:100%; height:100%; position:relative; overflow:hidden;
  background:#EBECED;
  border:none;
  border-radius:0;
  display:flex; flex-direction:column;
  clip-path:polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
}
.card-1 .card-header {
  background:#07365C; color:#FCFCFC;
  padding:0.5rem 1rem;
  font-weight:700; font-size:1.2rem;
  min-height:20.0%;
  display:flex; align-items:center; gap:0.4rem;
  flex:0 0 auto;
}
.card-1 .card-value {
  font-weight:inherit; font-size:inherit;
}
.card-1 .card-icon {
  color:#FCFCFC; font-size:1.2rem;
  display:inline-flex; align-items:center;
}
.card-1 .card-body {
  background:#FCFCFC; color:#1A2230;
  padding:0.6rem 0.9rem;
  font-size:0.85rem; line-height:1.35;
  flex:1 1 auto; display:flex; flex-direction:column; gap:0.45rem;
}
.card-1 .card-label {
  color:#1A2230;
  position:relative; padding-left:0.85em;
}
.card-1 .card-label::before {
  content:'\2022'; color:#1A2230;
  position:absolute; left:0; top:0;
}
.card-1 .card-footer {
  background:#EBECED; color:#1A2230;
  font-weight:400; font-size:0.8rem;
  padding:0.4rem 1rem; border-top:1px solid rgba(109, 123, 134, 0.5);
  min-height:12.0%;
  flex:0 0 auto; display:flex; align-items:center;
}
</style><div class="card-1">  <div class="card-header"><div class="card-value"></div></div>  <div class="card-body"><div class="card-label"></div><div class="card-label"></div><div class="card-label"></div></div>  <div class="card-footer"></div></div></div></div></div>
</body></html>

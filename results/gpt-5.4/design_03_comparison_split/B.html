  *{box-sizing:border-box;}

  .slide{

  /* z=0 background circuit patterns */
  .bg-circuit-left,
  .bg-circuit-right{
    position:absolute;
    top:0; bottom:0;
    width:50%;
    pointer-events:none;
    opacity:.38;
    z-index:0;
  }
  .bg-circuit-left{left:0;}
  .bg-circuit-right{right:0;}

  .bg-circuit-left::before,
  .bg-circuit-right::before{
    content:"";
    position:absolute; inset:0;
    background-repeat:no-repeat;

      linear-gradient(90deg, rgba(82,166,255,.15) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(82,166,255,.12) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(82,166,255,.14) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(82,166,255,.10) 0 2px, transparent 2px 100%),
      radial-gradient(circle, rgba(82,166,255,.22) 0 3px, transparent 4px),
      radial-gradient(circle, rgba(82,166,255,.20) 0 3px, transparent 4px),
      radial-gradient(circle, rgba(82,166,255,.18) 0 3px, transparent 4px);
    background-size:
      220px 2px, 180px 2px, 210px 2px, 170px 2px,
      12px 12px, 12px 12px, 12px 12px;
    background-position:
      0 178px, 0 293px, 0 420px, 0 548px,
      332px 286px, 250px 415px, 348px 542px;
  }

  .bg-circuit-right::before{
    background-image:
      linear-gradient(90deg, rgba(208,108,255,.14) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(208,108,255,.12) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(208,108,255,.10) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(208,108,255,.12) 0 2px, transparent 2px 100%),
      radial-gradient(circle, rgba(208,108,255,.24) 0 3px, transparent 4px),
      radial-gradient(circle, rgba(208,108,255,.22) 0 3px, transparent 4px),
      radial-gradient(circle, rgba(208,108,255,.18) 0 3px, transparent 4px);
    background-size:
      190px 2px, 220px 2px, 170px 2px, 210px 2px,
      12px 12px, 12px 12px, 12px 12px;
    background-position:
      right 0 top 178px, right 0 top 293px, right 0 top 420px, right 0 top 548px,

  .circuit-left-2{left:266px; top:414px; background:rgba(99,200,255,.35); box-shadow:0 0 10px rgba(99,200,255,.45);}
  .circuit-left-3{left:370px; top:540px; background:rgba(99,200,255,.3); box-shadow:0 0 10px rgba(99,200,255,.4);}
  .circuit-right-1{right:240px; top:302px; background:rgba(208,108,255,.38); box-shadow:0 0 10px rgba(208,108,255,.5);}
  .circuit-right-2{right:526px; top:407px; background:rgba(208,108,255,.3); box-shadow:0 0 10px rgba(208,108,255,.45);}

    top:150px;
    width:100%;
    height:530px;

    height:98px;

  .badge .icon{

    z-index:2;

    box-shadow: inset 0 0 18px rgba(255,255,255,.08);

  .vs-wrap::after{

  .vs{

    text-shadow:

  /* z=8 spark particles */
  .particle{

  .p1{left:634px; top:147px; background:rgba(140,220,255,.7); box-shadow:0 0 8px rgba(140,220,255,.8);}

  .p6{left:662px; top:578px; background:rgba(220,140,255,.65); box-shadow:0 0 8px rgba(220,140,255,.8);}

  /* z=9 topmost soft sheen */
  .sheen{
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.03), transparent 20%, transparent 80%, rgba(255,255,255,.02));
    mix-blend-mode:screen;
  }
</style>

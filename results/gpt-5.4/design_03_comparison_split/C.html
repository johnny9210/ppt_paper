<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a12; font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
    color: #fff;
    background: linear-gradient(90deg, #031A3A, #1A0B3A);
  }

  .dot-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.22;
    mask-image: radial-gradient(circle at center, rgba(0,0,0,0.9), transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.9), transparent 75%);
  }

  .glow-left,
  .glow-right,
  .glow-center {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
  }

  .glow-left {
    width: 320px;
    height: 320px;
    left: -60px;
    top: 180px;
    background: radial-gradient(circle, rgba(0,210,255,0.15), transparent 70%);
  }

  .glow-right {
    width: 340px;
    height: 340px;
    right: -80px;
    top: 170px;
    background: radial-gradient(circle, rgba(184,77,255,0.15), transparent 70%);
  }

  .glow-center {
    width: 360px;
    height: 360px;
    left: 460px;
    top: 190px;
    background: radial-gradient(circle, rgba(110,231,255,0.15), transparent 70%);
  }

  .circuit-left,
  .circuit-right {
    position: absolute;
    top: 140px;
    width: 340px;
    height: 440px;
    z-index: 1;
    opacity: 0.18;
  }

  .circuit-left {
    left: 0;
    background:
      linear-gradient(90deg, rgba(78,187,255,0.35), rgba(78,187,255,0.0)) 0 40px / 220px 2px no-repeat,
      linear-gradient(90deg, rgba(78,187,255,0.35), rgba(78,187,255,0.0)) 0 170px / 220px 2px no-repeat,
      linear-gradient(90deg, rgba(78,187,255,0.35), rgba(78,187,255,0.0)) 0 300px / 220px 2px no-repeat,
      linear-gradient(90deg, rgba(78,187,255,0.35), rgba(78,187,255,0.0)) 0 430px / 220px 2px no-repeat;
  }

  .circuit-right {
    right: 0;
    background:
      linear-gradient(270deg, rgba(209,112,255,0.35), rgba(209,112,255,0.0)) 100% 40px / 220px 2px no-repeat,
      linear-gradient(270deg, rgba(209,112,255,0.35), rgba(209,112,255,0.0)) 100% 170px / 220px 2px no-repeat,
      linear-gradient(270deg, rgba(209,112,255,0.35), rgba(209,112,255,0.0)) 100% 300px / 220px 2px no-repeat,
      linear-gradient(270deg, rgba(209,112,255,0.35), rgba(209,112,255,0.0)) 100% 430px / 220px 2px no-repeat;
  }

  .center-line {
    position: absolute;
    left: 50%;
    top: 40px;
    transform: translateX(-50%);
    width: 6px;
    height: 640px;
    border-radius: 999px;
    z-index: 1;
    background: linear-gradient(180deg, rgba(110,231,255,0.0), rgba(110,231,255,0.95), rgba(184,77,255,0.95), rgba(184,77,255,0.0));
    box-shadow: 0 0 20px rgba(110,231,255, 0.3), 0 0 60px rgba(110,231,255, 0.1);
  }

  .title-bar {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 850px;
    height: 74px;
    z-index: 2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  }

  .title-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(96,196,255, 0.3), 0 0 60px rgba(96,196,255, 0.1);
    pointer-events: none;
  }

  .title-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(196,96,255, 0.3), 0 0 60px rgba(196,96,255, 0.1);
    pointer-events: none;
  }

  .title-text {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 0 18px rgba(255,255,255,0.16);
  }

  .side-label {
    position: absolute;
    top: 124px;
    z-index: 3;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .side-label.left { left: 210px; color: #a9e9ff; }
  .side-label.right { right: 175px; color: #efb8ff; }

  .side-label .line {
    margin-top: 10px;
    width: 48px;
    height: 4px;
    border-radius: 2px;
  }

  .side-label.left .line { background: #53cfff; }
  .side-label.right .line { background: #d170ff; }

  .vs-badge {
    position: absolute;
    left: 50%;
    top: 358px;
    transform: translate(-50%, -50%);
    width: 126px;
    height: 126px;
    border-radius: 50%;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  }

  .vs-badge::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(96,196,255, 0.3), 0 0 60px rgba(96,196,255, 0.1);
  }

  .vs-badge::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 20px rgba(196,96,255, 0.3), 0 0 60px rgba(196,96,255, 0.1);
  }

  .vs-text {
    position: relative;
    z-index: 4;
    font-size: 54px;
    font-weight: 900;
    letter-spacing: -0.05em;
    background: linear-gradient(90deg, #75e9ff, #d170ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 16px rgba(255,255,255,0.2);
  }

  .column {
    position: absolute;
    top: 156px;
    width: 470px;
    z-index: 2;
  }

  .column.left { left: 72px; }
  .column.right { right: 72px; }

  .item {
    position: relative;
    height: 118px;
    margin-bottom: 32px;
  }

  .item:last-child { margin-bottom: 0; }

  .icon-badge {
    position: absolute;
    top: 6px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  }

  .icon-badge.left {
    left: 0;
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(96,196,255, 0.3),
      0 0 60px rgba(96,196,255, 0.1);
  }

  .icon-badge.right {
    left: 0;
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(196,96,255, 0.3),
      0 0 60px rgba(196,96,255, 0.1);
  }

  .icon-glyph {
    position: relative;
    z-index: 4;
    font-size: 38px;
    font-weight: 700;
  }

  .icon-badge.left .icon-glyph { color: #a7ebff; }
  .icon-badge.right .icon-glyph { color: #f0b6ff; }

  .connector {
    position: absolute;
    top: 48px;
    width: 48px;
    height: 4px;
    border-radius: 2px;
    z-index: 1;
  }

  .column.left .connector {
    left: 88px;
    background: #53cfff;
  }

  .column.right .connector {
    left: 88px;
    background: #d170ff;
  }

  .card {
    position: absolute;
    top: 0;
    left: 94px;
    width: 334px;
    height: 112px;
    padding: 18px 20px 18px 22px;
    z-index: 2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  }

  .column.left .card {
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(96,196,255, 0.3),
      0 0 60px rgba(96,196,255, 0.1);
  }

  .column.right .card {
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(196,96,255, 0.3),
      0 0 60px rgba(196,96,255, 0.1);
  }

  .card-text {
    position: relative;
    z-index: 3;
    font-size: 24px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,0.94);
    min-height: 62px;
    display: flex;
    align-items: center;
  }

  .fake-lines {
    position: absolute;
    left: 22px;
    right: 22px;
    top: 16px;
    z-index: 1;
    opacity: 0.23;
  }

  .fake-lines span {
    display: block;
    height: 12px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .fake-lines span:nth-child(1) { width: 46%; }
  .fake-lines span:nth-child(2) { width: 92%; }
  .fake-lines span:nth-child(3) { width: 84%; }
  .fake-lines span:nth-child(4) { width: 58%; margin-bottom: 0; }

  .column.left .fake-lines span { background: rgba(138,224,255,0.45); }
  .column.right .fake-lines span { background: rgba(238,177,255,0.42); }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 6px;
  }

  .column.left .bottom-bar { background: #53cfff; }
  .column.right .bottom-bar { background: #d170ff; }

  .card-text span {
    position: relative;
    z-index: 3;
    background: rgba(8, 14, 28, 0.34);
    padding: 4px 8px;
    border-radius: 10px;
  }
</style>

<div class="slide">
  <div class="dot-layer"></div>

  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="glow-center"></div>

  <div class="circuit-left"></div>
  <div class="circuit-right"></div>
  <div class="center-line"></div>

  <div class="title-bar">
    <div class="title-text">온프레미스 vs 클라우드 네이티브</div>
  </div>

  <div class="side-label left">
    온프레미스
    <div class="line"></div>
  </div>

  <div class="side-label right">
    클라우드 네이티브
    <div class="line"></div>
  </div>

  <div class="vs-badge">
    <div class="vs-text">VS</div>
  </div>

  <div class="column left">
    <div class="item">
      <div class="icon-badge left">
        <div class="icon-glyph">⚙</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>초기 투자비용 높음</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge left">
        <div class="icon-glyph">☁</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>확장에 수주~수개월 소요</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge left">
        <div class="icon-glyph">🛡</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>보안 직접 관리 필요</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge left">
        <div class="icon-glyph">⌕</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>유지보수 인력 상시 필요</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>
  </div>

  <div class="column right">
    <div class="item">
      <div class="icon-badge right">
        <div class="icon-glyph">⚡</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>사용량 기반 과금</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge right">
        <div class="icon-glyph">🖧</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>분 단위 자동 스케일링</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge right">
        <div class="icon-glyph">🔒</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>관리형 보안 서비스</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>

    <div class="item">
      <div class="icon-badge right">
        <div class="icon-glyph">◎</div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="fake-lines">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="card-text"><span>인프라 자동화로 인력 절감</span></div>
        <div class="bottom-bar"></div>
      </div>
    </div>
  </div>
</div></div></body></html>

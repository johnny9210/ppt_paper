<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  *{box-sizing:border-box}
  body{margin:0;background:#050816;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
  .slide{
    width:1280px;height:720px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(67,120,255,.16) 0, rgba(67,120,255,.08) 12%, rgba(0,0,0,0) 30%),
      linear-gradient(90deg,#031a43 0%, #06112d 48%, #1c0633 52%, #25003f 100%);
    color:#eaf6ff;
  }

  /* subtle circuit lines */
  .slide:before,
  .slide:after{
    content:"";position:absolute;inset:0;pointer-events:none;
  }
  .slide:before{
    background:
      linear-gradient(90deg, rgba(74,170,255,.12) 0 2px, transparent 2px) 120px 210px/180px 2px no-repeat,
      linear-gradient(90deg, rgba(74,170,255,.12) 0 2px, transparent 2px) 40px 390px/160px 2px no-repeat,
      linear-gradient(90deg, rgba(74,170,255,.12) 0 2px, transparent 2px) 60px 560px/180px 2px no-repeat,
      linear-gradient(90deg, rgba(225,110,255,.14) 0 2px, transparent 2px) 1040px 220px/180px 2px no-repeat,
      linear-gradient(90deg, rgba(225,110,255,.14) 0 2px, transparent 2px) 1080px 390px/150px 2px no-repeat,
      linear-gradient(90deg, rgba(225,110,255,.14) 0 2px, transparent 2px) 1050px 565px/170px 2px no-repeat;
    opacity:.9;
  }
  .slide:after{
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.85) 0 1px, transparent 2px) 630px 150px/14px 14px repeat-y,
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.35) 0 1px, transparent 2px) 645px 160px/20px 20px repeat-y;
    opacity:.45;
  }

  .center-line{
    position:absolute;left:50%;top:70px;transform:translateX(-50%);
    width:4px;height:580px;border-radius:8px;
    background:linear-gradient(180deg, rgba(98,186,255,.15), rgba(116,205,255,.95) 15%, rgba(210,120,255,.95) 50%, rgba(116,205,255,.95) 85%, rgba(98,186,255,.15));
    box-shadow:
      0 0 18px rgba(81,185,255,.95),
      0 0 40px rgba(184,90,255,.55),
      0 0 80px rgba(81,185,255,.4);
  }

  .top-title{
    position:absolute;left:50%;top:34px;transform:translateX(-50%);
    width:850px;height:74px;border-radius:16px;
    background:linear-gradient(90deg, rgba(85,155,255,.16), rgba(187,89,255,.16));
    border:3px solid transparent;
    box-shadow:
      inset 0 0 20px rgba(255,255,255,.06),
      0 0 18px rgba(89,178,255,.65),
      0 0 24px rgba(200,92,255,.45);
  }
  .top-title:before{
    content:"";position:absolute;inset:0;border-radius:16px;padding:2px;
    background:linear-gradient(90deg, #4bc0ff, #d86cff);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  .top-title .text{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;letter-spacing:.3px;
    color:#f3f8ff;text-shadow:0 0 10px rgba(121,201,255,.9), 0 0 18px rgba(208,108,255,.55);
  }

  .vs{
    position:absolute;left:50%;top:360px;transform:translate(-50%,-50%);
    width:110px;height:110px;border-radius:50%;
    background:
      radial-gradient(circle at 35% 35%, rgba(121,213,255,.45), rgba(0,0,0,0) 35%),
      radial-gradient(circle at 65% 65%, rgba(219,106,255,.4), rgba(0,0,0,0) 38%),
      linear-gradient(90deg, rgba(78,193,255,.2) 0 48%, rgba(216,111,255,.2) 52% 100%),
      rgba(15,22,54,.78);
    border:3px solid rgba(255,255,255,.28);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,.08),
      0 0 18px rgba(89,178,255,.8),
      0 0 30px rgba(210,108,255,.5);
  }
  .vs:before{
    content:"";position:absolute;inset:10px;border-radius:50%;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:inset 0 0 18px rgba(255,255,255,.06);
  }
  .vs:after{
    content:"";position:absolute;left:50%;top:10px;bottom:10px;width:3px;transform:translateX(-50%) rotate(15deg);
    background:linear-gradient(180deg, rgba(86,196,255,.9), rgba(212,107,255,.9));
    box-shadow:0 0 12px rgba(180,115,255,.8);
    border-radius:6px;
  }
  .vs .txt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:900;letter-spacing:-1px;z-index:1;
    background:linear-gradient(90deg,#6ed8ff,#ec7cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px rgba(255,255,255,.15);
  }

  .side-label{
    position:absolute;top:126px;font-size:28px;font-weight:800;
    text-shadow:0 0 10px currentColor, 0 0 22px currentColor;
  }
  .side-label.left{left:118px;color:#7fd8ff}
  .side-label.right{right:96px;color:#ec8eff}

  .column{
    position:absolute;top:150px;width:560px;height:500px;
  }
  .column.left{left:40px}
  .column.right{right:40px}

  .row{
    position:absolute;left:0;width:100%;height:112px;
  }
  .row.r1{top:0}
  .row.r2{top:122px}
  .row.r3{top:244px}
  .row.r4{top:366px}

  .left .icon{
    position:absolute;left:18px;top:9px;width:92px;height:92px;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.24), rgba(255,255,255,.06) 30%, rgba(0,0,0,.06) 58%, rgba(0,0,0,0) 62%),
      rgba(123,197,255,.15);
    border:2px solid rgba(152,226,255,.55);
    box-shadow:
      inset 0 0 16px rgba(255,255,255,.15),
      0 0 12px rgba(94,192,255,.95),
      0 0 28px rgba(94,192,255,.45);
  }
  .right .icon{
    position:absolute;left:18px;top:9px;width:92px;height:92px;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(255,255,255,.05) 30%, rgba(0,0,0,.06) 58%, rgba(0,0,0,0) 62%),
      rgba(220,116,255,.12);
    border:2px solid rgba(242,160,255,.55);
    box-shadow:
      inset 0 0 16px rgba(255,255,255,.12),
      0 0 12px rgba(217,104,255,.95),
      0 0 28px rgba(217,104,255,.42);
  }

  .left .card{
    position:absolute;left:140px;top:15px;width:335px;height:82px;border-radius:16px;
    background:linear-gradient(180deg, rgba(95,175,255,.24), rgba(95,175,255,.14));
    border:2px solid rgba(113,207,255,.72);
    box-shadow:inset 0 0 18px rgba(255,255,255,.06), 0 0 14px rgba(84,187,255,.52);
  }
  .right .card{
    position:absolute;left:160px;top:15px;width:335px;height:82px;border-radius:16px;
    background:linear-gradient(180deg, rgba(211,112,255,.22), rgba(211,112,255,.12));
    border:2px solid rgba(235,132,255,.72);
    box-shadow:inset 0 0 18px rgba(255,255,255,.05), 0 0 14px rgba(220,108,255,.5);
  }

  .left .connector{
    position:absolute;left:108px;top:50px;width:34px;height:4px;border-radius:4px;
    background:#59c7ff;box-shadow:0 0 12px rgba(89,199,255,.95);
  }
  .right .connector{
    position:absolute;left:112px;top:50px;width:48px;height:4px;border-radius:4px;
    background:#df79ff;box-shadow:0 0 12px rgba(223,121,255,.95);
  }

  .card .lines{
    position:absolute;left:20px;right:20px;top:18px;height:46px;
  }
  .line{
    height:10px;border-radius:8px;margin-bottom:9px;opacity:.9;
    background:rgba(192,225,255,.28);
  }
  .left .line{background:rgba(177,220,255,.25)}
  .right .line{background:rgba(239,203,255,.24)}
  .line.w1{width:52%}
  .line.w2{width:92%}
  .line.w3{width:73%}

  .item-text{
    position:absolute;left:22px;right:22px;top:50%;transform:translateY(-50%);
    font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.2px;
    color:#ecf7ff;
    text-shadow:0 0 10px rgba(255,255,255,.08);
  }

  /* icon drawings */
  .glyph{position:absolute;inset:0}
  .stroke-blue,.stroke-pink{position:absolute;border-color:currentColor}
  .left .glyph{color:#bceeff;filter:drop-shadow(0 0 5px rgba(112,208,255,.55))}
  .right .glyph{color:#ffd3ff;filter:drop-shadow(0 0 5px rgba(228,123,255,.55))}

  /* gear */
  .gear-ring{
    position:absolute;left:28px;top:28px;width:36px;height:36px;border:3px solid currentColor;border-radius:50%;
  }
  .gear-core{
    position:absolute;left:40px;top:40px;width:12px;height:12px;border:3px solid currentColor;border-radius:50%;
  }
  .gear-tooth{
    position:absolute;left:44px;top:20px;width:4px;height:12px;background:currentColor;border-radius:2px;
    transform-origin:2px 26px;
  }
  .t2{transform:rotate(45deg)}
  .t3{transform:rotate(90deg)}
  .t4{transform:rotate(135deg)}
  .t5{transform:rotate(180deg)}
  .t6{transform:rotate(225deg)}
  .t7{transform:rotate(270deg)}
  .t8{transform:rotate(315deg)}

  /* cloud upload */
  .cloud{
    position:absolute;left:22px;top:34px;width:48px;height:28px;border:3px solid currentColor;border-top-left-radius:24px;border-top-right-radius:24px;border-bottom-left-radius:16px;border-bottom-right-radius:16px;border-top-color:currentColor;
    border-bottom-color:currentColor;
  }
  .cloud:before,.cloud:after{
    content:"";position:absolute;border:3px solid currentColor;border-radius:50%;
    background:transparent;
  }
  .cloud:before{left:6px;top:-14px;width:18px;height:18px}
  .cloud:after{left:22px;top:-18px;width:22px;height:22px}
  .arrow-up{
    position:absolute;left:43px;top:34px;width:6px;height:24px;background:currentColor;border-radius:3px;
  }
  .arrow-up:before{
    content:"";position:absolute;left:-7px;top:-8px;width:20px;height:20px;
    border-left:3px solid currentColor;border-top:3px solid currentColor;transform:rotate(45deg);
  }

  /* shield */
  .shield{
    position:absolute;left:31px;top:24px;width:30px;height:40px;border:3px solid currentColor;border-radius:16px 16px 20px 20px/12px 12px 24px 24px;
  }
  .shield:before{
    content:"";position:absolute;left:8px;top:10px;width:9px;height:16px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(40deg);
  }

  /* search chart */
  .glass{
    position:absolute;left:28px;top:26px;width:34px;height:34px;border:3px solid currentColor;border-radius:50%;
  }
  .glass:after{
    content:"";position:absolute;right:-10px;bottom:-8px;width:16px;height:4px;background:currentColor;border-radius:3px;transform:rotate(45deg);
  }
  .bar1,.bar2,.bar3{
    position:absolute;bottom:33px;width:4px;background:currentColor;border-radius:2px;
  }
  .bar1{left:37px;height:8px}
  .bar2{left:44px;height:13px}
  .bar3{left:51px;height:18px}

  /* lightning */
  .bolt{
    position:absolute;left:38px;top:24px;width:20px;height:42px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:skewX(-20deg) rotate(18deg);
  }
  .bolt:before{
    content:"";position:absolute;left:-10px;top:14px;width:20px;height:24px;border-right:3px solid currentColor;border-top:3px solid currentColor;transform:skewX(18deg) rotate(-20deg);
  }

  /* server */
  .server{
    position:absolute;left:29px;top:28px;width:34px;height:34px;
  }
  .server .rack{
    position:absolute;left:0;width:34px;height:10px;border:2px solid currentColor;border-radius:4px;
  }
  .server .r1{top:0}.server .r2{top:12px}.server .r3{top:24px}
  .server .dot{
    position:absolute;right:4px;top:3px;width:3px;height:3px;background:currentColor;border-radius:50%;
  }

  /* lock */
  .lock-body{
    position:absolute;left:31px;top:40px;width:30px;height:24px;border:3px solid currentColor;border-radius:6px;
  }
  .lock-body:before{
    content:"";position:absolute;left:6px;top:-18px;width:14px;height:18px;border:3px solid currentColor;border-bottom:none;border-radius:12px 12px 0 0;
  }

  /* target */
  .target1,.target2,.target3{
    position:absolute;border:3px solid currentColor;border-radius:50%;
  }
  .target1{left:27px;top:27px;width:38px;height:38px}
  .target2{left:36px;top:36px;width:20px;height:20px}
  .target3{left:43px;top:43px;width:6px;height:6px;background:currentColor;border:none}
  .arrow{
    position:absolute;left:50px;top:30px;width:18px;height:3px;background:currentColor;border-radius:3px;transform:rotate(-35deg);
  }
  .arrow:before{
    content:"";position:absolute;right:-1px;top:-4px;width:9px;height:9px;border-top:3px solid currentColor;border-right:3px solid currentColor;transform:rotate(45deg);
  }
</style>

<div class="slide">
  <div class="top-title">
    <div class="text">온프레미스 vs 클라우드 네이티브</div>
  </div>

  <div class="center-line"></div>

  <div class="side-label left">온프레미스</div>
  <div class="side-label right">클라우드 네이티브</div>

  <div class="vs"><div class="txt">VS</div></div>

  <div class="column left">
    <div class="row r1">
      <div class="icon">
        <div class="glyph">
          <div class="gear-ring"></div>
          <div class="gear-core"></div>
          <div class="gear-tooth"></div>
          <div class="gear-tooth t2"></div>
          <div class="gear-tooth t3"></div>
          <div class="gear-tooth t4"></div>
          <div class="gear-tooth t5"></div>
          <div class="gear-tooth t6"></div>
          <div class="gear-tooth t7"></div>
          <div class="gear-tooth t8"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">초기 투자비용 높음</div>
      </div>
    </div>

    <div class="row r2">
      <div class="icon">
        <div class="glyph">
          <div class="cloud"></div>
          <div class="arrow-up"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">확장에 수주~수개월 소요</div>
      </div>
    </div>

    <div class="row r3">
      <div class="icon">
        <div class="glyph">
          <div class="shield"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">보안 직접 관리 필요</div>
      </div>
    </div>

    <div class="row r4">
      <div class="icon">
        <div class="glyph">
          <div class="glass"></div>
          <div class="bar1"></div>
          <div class="bar2"></div>
          <div class="bar3"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">유지보수 인력 상시 필요</div>
      </div>
    </div>
  </div>

  <div class="column right">
    <div class="row r1">
      <div class="icon">
        <div class="glyph">
          <div class="bolt"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">사용량 기반 과금</div>
      </div>
    </div>

    <div class="row r2">
      <div class="icon">
        <div class="glyph server">
          <div class="rack r1"><div class="dot"></div></div>
          <div class="rack r2"><div class="dot"></div></div>
          <div class="rack r3"><div class="dot"></div></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">분 단위 자동 스케일링</div>
      </div>
    </div>

    <div class="row r3">
      <div class="icon">
        <div class="glyph">
          <div class="lock-body"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">관리형 보안 서비스</div>
      </div>
    </div>

    <div class="row r4">
      <div class="icon">
        <div class="glyph">
          <div class="target1"></div>
          <div class="target2"></div>
          <div class="target3"></div>
          <div class="arrow"></div>
        </div>
      </div>
      <div class="connector"></div>
      <div class="card">
        <div class="lines">
          <div class="line w1"></div>
          <div class="line w2"></div>
          <div class="line w3"></div>
        </div>
        <div class="item-text">인프라 자동화로 인력 절감</div>
      </div>
    </div>
  </div>
</div></div></body></html>

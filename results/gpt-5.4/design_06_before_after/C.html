<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0f1f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Inter", "Pretendard", "Noto Sans KR", sans-serif;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    color: #f5f7fb;
    background:
      radial-gradient(circle at 50% 50%, #EAFBFF 0%, #00CFFF 10%, rgba(255,106,43,0.55) 22%, #0A0F1F 60%),
      linear-gradient(90deg, #2A0F0A, #5B1F0A, #082A32, #09131F);
  }

  .dot-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.22;
    mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85), transparent 78%);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85), transparent 78%);
  }

  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
  }
  .glow.left {
    left: 70px;
    top: 180px;
    background: radial-gradient(circle, rgba(255,106,61,0.15), transparent 70%);
    transform: scale(1.6);
  }
  .glow.right {
    right: 70px;
    top: 180px;
    background: radial-gradient(circle, rgba(86,255,216,0.15), transparent 70%);
    transform: scale(1.6);
  }
  .glow.center {
    left: 490px;
    top: 180px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(217,255,255,0.15), transparent 70%);
    transform: scale(1.4);
  }

  .title {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-align: center;
    text-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }

  .panel {
    position: absolute;
    top: 38px;
    width: 360px;
    height: 644px;
    padding: 22px;
    z-index: 2;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); border-radius: 16px;
  }
  .panel.before { left: 36px; }
  .panel.after { right: 36px; }

  .panel-label {
    position: relative;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-weight: 800;
    font-size: 20px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); border-radius: 16px;
  }
  .before .panel-label {
    color: #ffd5c4;
    box-shadow: 0 0 20px rgba(255,122,69, 0.3), 0 0 60px rgba(255,122,69, 0.1);
  }
  .after .panel-label {
    color: #d7fff6;
    box-shadow: 0 0 20px rgba(99,255,217, 0.3), 0 0 60px rgba(99,255,217, 0.1);
  }

  .cards {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .card {
    position: relative;
    min-height: 172px;
    padding: 22px 22px 24px 22px;
    overflow: hidden;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); border-radius: 16px;
  }

  .before .card {
    box-shadow: 0 0 20px rgba(255,122,69, 0.3), 0 0 60px rgba(255,122,69, 0.1);
    border-color: rgba(255,160,130,0.32);
    background: rgba(255,255,255,0.07);
  }
  .after .card {
    box-shadow: 0 0 20px rgba(99,255,217, 0.3), 0 0 60px rgba(99,255,217, 0.1);
    border-color: rgba(148,255,234,0.32);
    background: rgba(255,255,255,0.07);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.24;
  }
  .before .card::before {
    background:
      linear-gradient(135deg, rgba(255,180,140,0.18), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(255,120,70,0.25), transparent 35%);
  }
  .after .card::before {
    background:
      linear-gradient(135deg, rgba(180,255,240,0.18), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(99,255,217,0.25), transparent 35%);
  }

  .card-inner {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .icon-row {
    position: relative;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-badge {
    width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.14);
    font-size: 24px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
  }

  .metric {
    font-size: 14px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 999px;
    letter-spacing: -0.01em;
  }
  .before .metric {
    color: #ffd8ca;
    background: rgba(255,122,69,0.14);
    border: 1px solid rgba(255,160,130,0.28);
  }
  .after .metric {
    color: #d9fff7;
    background: rgba(99,255,217,0.14);
    border: 1px solid rgba(148,255,234,0.28);
  }

  .accent {
    margin-top: 16px;
    width: 48px; height: 4px; border-radius: 2px;
  }
  .before .accent { background: #ff8a65; }
  .after .accent { background: #63ffd9; }

  .card-title {
    position: relative;
    z-index: 3;
    margin-top: 14px;
    font-size: 27px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.03em;
  }

  .card-desc {
    position: relative;
    z-index: 3;
    margin-top: 10px;
    font-size: 20px;
    line-height: 1.45;
    color: rgba(245,247,251,0.86);
    font-weight: 600;
  }

  .bottom-bar {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
    z-index: 2;
  }
  .before .bottom-bar { background: #ff8a65; }
  .after .bottom-bar { background: #63ffd9; }

  .center-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .portal {
    position: absolute;
    left: 50%;
    top: 355px;
    width: 250px;
    height: 250px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid rgba(220,255,255,0.9);
    box-shadow:
      0 0 30px rgba(217,255,255,0.65),
      inset 0 0 35px rgba(217,255,255,0.18);
    opacity: 0.95;
  }

  .trail {
    position: absolute;
    height: 3px;
    transform-origin: right center;
    border-radius: 999px;
    z-index: 1;
  }
  .trail.t1 { left: 420px; top: 306px; width: 210px; background: #ff8a65; transform: rotate(-20deg); box-shadow: 0 0 14px rgba(255,138,101,.8); }
  .trail.t2 { left: 424px; top: 330px; width: 230px; background: #ffd5c4; transform: rotate(-10deg); box-shadow: 0 0 14px rgba(255,213,196,.8); }
  .trail.t3 { left: 430px; top: 352px; width: 235px; background: #ff9e7a; transform: rotate(0deg); box-shadow: 0 0 14px rgba(255,158,122,.8); }
  .trail.t4 { left: 424px; top: 374px; width: 230px; background: #ffd5c4; transform: rotate(10deg); box-shadow: 0 0 14px rgba(255,213,196,.8); }
  .trail.t5 { left: 420px; top: 398px; width: 210px; background: #ff8a65; transform: rotate(20deg); box-shadow: 0 0 14px rgba(255,138,101,.8); }

  .arrow {
    position: absolute;
    left: 50%;
    top: 355px;
    transform: translate(-50%, -50%);
    width: 190px;
    height: 120px;
    z-index: 2;
    filter: drop-shadow(0 0 14px rgba(184,246,255,0.55));
  }

  .arrow .line {
    position: absolute;
    right: 42px;
    top: 58px;
    width: 86px;
    height: 2px;
    background: rgba(184,246,255,0.95);
    transform-origin: right center;
  }
  .arrow .line.l1 { transform: rotate(-32deg); }
  .arrow .line.l2 { transform: rotate(-16deg); }
  .arrow .line.l3 { transform: rotate(0deg); }
  .arrow .line.l4 { transform: rotate(16deg); }
  .arrow .line.l5 { transform: rotate(32deg); }

  .arrow .head {
    position: absolute;
    right: 0;
    top: 18px;
    width: 0;
    height: 0;
    border-top: 42px solid transparent;
    border-bottom: 42px solid transparent;
    border-left: 64px solid rgba(184,246,255,0.98);
    filter: drop-shadow(0 0 12px rgba(184,246,255,0.55));
  }

  .arrow .outline {
    position: absolute;
    right: 7px;
    top: 26px;
    width: 0;
    height: 0;
    border-top: 34px solid transparent;
    border-bottom: 34px solid transparent;
    border-left: 52px solid rgba(10,15,31,0.85);
  }

  .side-caption {
    position: absolute;
    top: 92px;
    z-index: 3;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.78;
  }
  .side-caption.left { left: 54px; color: #ffb59a; }
  .side-caption.right { right: 56px; color: #9bffeb; }

</style>

<div class="slide">
  <div class="dot-layer"></div>

  <div class="glow left"></div>
  <div class="glow center"></div>
  <div class="glow right"></div>

  <div class="title">AI 도입 전후 업무 효율성 비교</div>
  <div class="side-caption left">Before</div>
  <div class="side-caption right">After</div>

  <div class="center-wrap">
    <div class="trail t1"></div>
    <div class="trail t2"></div>
    <div class="trail t3"></div>
    <div class="trail t4"></div>
    <div class="trail t5"></div>
    <div class="portal"></div>
    <div class="arrow">
      <div class="line l1"></div>
      <div class="line l2"></div>
      <div class="line l3"></div>
      <div class="line l4"></div>
      <div class="line l5"></div>
      <div class="head"></div>
      <div class="outline"></div>
    </div>
  </div>

  <div class="panel before">
    <div class="panel-label">도입 전</div>
    <div class="cards">
      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">📝</div>
            <div class="metric">비효율</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">수작업 보고서 작성</div>
          <div class="card-desc">주 8시간 소요</div>
        </div>
        <div class="bottom-bar"></div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">🔍</div>
            <div class="metric">지연</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">수동 데이터 검색</div>
          <div class="card-desc">건당 30분</div>
        </div>
        <div class="bottom-bar"></div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">📞</div>
            <div class="metric">대기</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">전화/이메일 응대</div>
          <div class="card-desc">평균 응답 4시간</div>
        </div>
        <div class="bottom-bar"></div>
      </div>
    </div>
  </div>

  <div class="panel after">
    <div class="panel-label">도입 후</div>
    <div class="cards">
      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">🤖</div>
            <div class="metric">자동화</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">자동 보고서 생성</div>
          <div class="card-desc">주 30분으로 단축</div>
        </div>
        <div class="bottom-bar"></div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">⚡</div>
            <div class="metric">즉시성</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">RAG 기반 즉시 검색</div>
          <div class="card-desc">건당 5초</div>
        </div>
        <div class="bottom-bar"></div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="icon-row">
            <div class="icon-badge">💬</div>
            <div class="metric">실시간</div>
          </div>
          <div class="accent"></div>
          <div class="card-title">AI 챗봇 자동 응대</div>
          <div class="card-desc">평균 응답 10초</div>
        </div>
        <div class="bottom-bar"></div>
      </div>
    </div>
  </div>
</div></div></body></html>

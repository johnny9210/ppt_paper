<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  :root{
    --bg-left:#13070c;
    --bg-mid:#1b0f14;
    --bg-right:#06131c;

    --warm:#ff6d3a;
    --warm-2:#ff8b5c;
    --warm-soft:rgba(255,120,70,.35);
    --cool:#6fffe3;
    --cool-2:#7bd2ff;
    --cool-soft:rgba(111,255,227,.30);

    --panel:rgba(255,255,255,.06);
    --panel-2:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.05);
    --text:#f7f8fb;
    --muted:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.16);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:#0b0f14;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .slide{
    width:1280px;
    height:720px;
    position:relative;
    overflow:hidden;
    color:var(--text);
    background:
      radial-gradient(700px 520px at 22% 50%, rgba(255,90,20,.18), transparent 60%),
      radial-gradient(700px 520px at 78% 50%, rgba(0,170,255,.16), transparent 60%),
      linear-gradient(90deg, #09040a 0%, #14090d 24%, #101015 50%, #07141d 76%, #041019 100%);
    border-radius:8px;
  }

  /* z=0 background haze */
  .slide:before{
    content:"";
    position:absolute; inset:-8%;
    z-index:0;
    background:
      radial-gradient(circle at 30% 50%, rgba(255,101,41,.18), transparent 32%),
      radial-gradient(circle at 70% 48%, rgba(77,255,223,.14), transparent 34%),
      linear-gradient(90deg, rgba(255,110,58,.08), transparent 32%, transparent 68%, rgba(75,225,255,.07));
    filter:blur(22px);
    opacity:.95;
  }

  /* center arc halo */
  .arc{
    position:absolute;
    left:50%;
    top:50%;
    width:330px;
    height:330px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:2;
    border:2px solid transparent;
    box-shadow:
      0 0 16px rgba(255,255,255,.26),
      0 0 55px rgba(95,227,255,.28),
      0 0 60px rgba(255,105,60,.24) inset;
  }
  .arc:before,
  .arc:after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    -webkit-mask: radial-gradient(circle at center, transparent 61%, #000 62%);
            mask: radial-gradient(circle at center, transparent 61%, #000 62%);
  }
  .arc:before{
    background:conic-gradient(from 130deg, transparent 0 20%, rgba(255,110,58,.95) 24% 52%, transparent 56% 100%);
    filter:blur(2px);
  }
  .arc:after{
    background:conic-gradient(from -45deg, transparent 0 26%, rgba(123,210,255,.96) 30% 60%, transparent 64% 100%);
    filter:blur(2px);
  }

  /* energy beam */
  .beam{
    position:absolute;
    left:50%;
    top:50%;
    width:500px;
    height:180px;
    transform:translate(-50%,-50%);
    z-index:3;
    pointer-events:none;
  }
  .beam .warm,
  .beam .cool{
    position:absolute; top:50%; height:2px; transform:translateY(-50%);
    filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 18px currentColor);
    opacity:.9;
  }
  .beam .warm{
    left:18px; width:238px; color:var(--warm);
    background:linear-gradient(90deg, rgba(255,105,58,0), rgba(255,137,96,.95) 20%, rgba(255,170,140,.95) 75%, rgba(255,255,255,.35));
    transform-origin:right center;
    clip-path:polygon(0 48%, 72% 48%, 100% 50%, 72% 52%, 0 52%);
  }
  .beam .cool{
    right:18px; width:238px; color:var(--cool-2);
    background:linear-gradient(90deg, rgba(255,255,255,.35), rgba(160,238,255,.95) 28%, rgba(111,255,227,.95) 75%, rgba(111,255,227,0));
    transform-origin:left center;
    clip-path:polygon(0 50%, 28% 48%, 100% 48%, 100% 52%, 28% 52%);
  }
  .beam .line{
    position:absolute;
    left:50%; top:50%;
    width:250px; height:2px;
    transform-origin:center center;
    background:linear-gradient(90deg, rgba(255,120,70,0), rgba(255,210,180,.9), rgba(130,235,255,.9), rgba(111,255,227,0));
    filter:blur(.2px) drop-shadow(0 0 5px rgba(255,255,255,.45));
  }
  .beam .l1{ transform:translate(-50%,-50%) rotate(-28deg); }
  .beam .l2{ transform:translate(-50%,-50%) rotate(-18deg); }
  .beam .l3{ transform:translate(-50%,-50%) rotate(-9deg); }
  .beam .l4{ transform:translate(-50%,-50%) rotate(0deg); }
  .beam .l5{ transform:translate(-50%,-50%) rotate(9deg); }
  .beam .l6{ transform:translate(-50%,-50%) rotate(18deg); }
  .beam .l7{ transform:translate(-50%,-50%) rotate(28deg); }

  .arrow{
    position:absolute;
    left:50%;
    top:50%;
    width:170px;
    height:120px;
    transform:translate(-50%,-50%);
    z-index:4;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.36))
           drop-shadow(0 0 24px rgba(90,220,255,.28));
  }
  .arrow:before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(255,120,70,.1), rgba(255,255,255,.96) 45%, rgba(123,210,255,.9) 70%, rgba(111,255,227,.35));
    clip-path:polygon(0 50%, 42% 0, 38% 32%, 100% 50%, 38% 68%, 42% 100%);
    opacity:.9;
  }
  .arrow:after{
    content:"";
    position:absolute; inset:8px 12px;
    border:2px solid rgba(255,255,255,.42);
    clip-path:polygon(0 50%, 42% 0, 38% 32%, 100% 50%, 38% 68%, 42% 100%);
    opacity:.7;
  }

  .title{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:7;
    padding:10px 22px;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.10);
    font-size:28px;
    font-weight:800;
    letter-spacing:.2px;
    color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,.18);
  }

  .side{
    position:absolute;
    top:38px;
    width:392px;
    height:644px;
    border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 18px 40px rgba(0,0,0,.26);
    z-index:5;
  }
  .side.left{
    left:38px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03)),
      rgba(255,122,74,.045);
  }
  .side.right{
    right:38px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03)),
      rgba(98,255,227,.04);
  }

  .side-label{
    position:absolute;
    top:16px; left:18px;
    z-index:7;
    padding:8px 14px;
    border-radius:999px;
    font-size:18px;
    font-weight:800;
    backdrop-filter:blur(8px);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .left .side-label{
    color:#ffd4c6;
    text-shadow:0 0 14px rgba(255,140,90,.35);
  }
  .right .side-label{
    color:#d8fff7;
    text-shadow:0 0 14px rgba(111,255,227,.35);
  }

  .cards{
    position:absolute;
    left:28px; right:28px; top:36px; bottom:28px;
    display:flex;
    flex-direction:column;
    gap:22px;
    z-index:6;
  }

  .card{
    position:relative;
    flex:1;
    min-height:0;
    border-radius:18px;
    padding:22px 22px 18px;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
      rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.17);
    backdrop-filter:blur(12px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      0 14px 28px rgba(0,0,0,.25),
      0 0 0 1px rgba(255,255,255,.03);
  }

  .left .card{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 0 0 1px rgba(255,120,70,.18),
      0 0 18px rgba(255,109,58,.26),
      0 18px 34px rgba(0,0,0,.24);
  }
  .left .card:before{
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    padding:2px;
    background:linear-gradient(135deg, rgba(255,180,145,.55), rgba(255,109,58,.95), rgba(255,170,120,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    opacity:.85;
    filter:drop-shadow(0 0 10px rgba(255,109,58,.55));
  }
  .right .card{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 0 0 1px rgba(111,255,227,.16),
      0 0 18px rgba(111,255,227,.24),
      0 18px 34px rgba(0,0,0,.24);
  }
  .right .card:before{
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    padding:2px;
    background:linear-gradient(135deg, rgba(180,255,240,.55), rgba(111,255,227,.96), rgba(123,210,255,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    opacity:.84;
    filter:drop-shadow(0 0 10px rgba(111,255,227,.48));
  }

  /* decorative corner glows / edge streaks */
  .card .edge-glow{
    position:absolute;
    inset:auto 0 0 0;
    height:10px;
    z-index:1;
    opacity:.8;
    filter:blur(4px);
  }
  .left .card .edge-glow{ background:linear-gradient(90deg, transparent, rgba(255,109,58,.85), transparent); }
  .right .card .edge-glow{ background:linear-gradient(90deg, transparent, rgba(111,255,227,.85), transparent); }

  .pattern{
    position:absolute;
    inset:0;
    z-index:0;
    opacity:.26;
    pointer-events:none;
  }
  .pattern.scribble{
    background:
      radial-gradient(circle at 12% 16%, rgba(255,255,255,.42) 0 8px, transparent 9px),
      radial-gradient(circle at 22% 11%, transparent 0 26px, rgba(255,255,255,.35) 27px 28px, transparent 29px),
      radial-gradient(circle at 30% 20%, transparent 0 20px, rgba(255,255,255,.28) 21px 22px, transparent 23px),
      linear-gradient(125deg, transparent 0 22%, rgba(255,255,255,.2) 22.5% 23.2%, transparent 24%),
      linear-gradient(35deg, transparent 0 29%, rgba(255,255,255,.18) 29.5% 30.2%, transparent 31%);
    filter:blur(.2px);
  }
  .pattern.pipes{
    background:
      linear-gradient(90deg, transparent 65%, rgba(255,255,255,.18) 65.8% 66.8%, transparent 67.8%),
      linear-gradient(180deg, transparent 22%, rgba(255,255,255,.18) 22.8% 23.8%, transparent 24.8%),
      radial-gradient(circle at 76% 34%, rgba(255,255,255,.26) 0 4px, transparent 5px),
      radial-gradient(circle at 86% 58%, rgba(255,255,255,.22) 0 4px, transparent 5px),
      radial-gradient(circle at 72% 72%, rgba(255,255,255,.18) 0 4px, transparent 5px);
    background-size:56px 56px, 56px 56px, auto, auto, auto;
    background-position:0 0, 0 0, 76% 34%, 86% 58%, 72% 72%;
  }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .emoji{
    font-size:48px;
    line-height:1;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));
  }
  .badge{
    min-width:44px;
    height:44px;
    padding:0 12px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 8px 18px rgba(0,0,0,.16);
  }
  .left .badge{ color:#ffd4c6; }
  .right .badge{ color:#dcfff6; }

  .card h3{
    margin:12px 0 8px;
    font-size:28px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.2px;
    text-shadow:0 0 12px rgba(255,255,255,.08);
  }
  .card p{
    margin:0;
    font-size:19px;
    color:var(--muted);
    line-height:1.35;
    font-weight:600;
  }

  .meta{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .progress{
    flex:1;
    height:14px;
    border-radius:999px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.18);
  }
  .fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:999px;
  }
  .left .fill{
    background:linear-gradient(90deg, rgba(255,120,70,.85), rgba(255,170,120,.95));
    box-shadow:0 0 12px rgba(255,109,58,.45);
  }
  .right .fill{
    background:linear-gradient(90deg, rgba(111,255,227,.88), rgba(123,210,255,.96));
    box-shadow:0 0 12px rgba(111,255,227,.42);
  }

  .mini{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.75);
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
  }

  .iconline{
    position:absolute;
    z-index:1;
    opacity:.18;
    font-size:34px;
    filter:blur(.1px);
  }

  .left .ic1{ top:68px; left:18px; }
  .left .ic2{ top:92px; right:22px; }
  .left .ic3{ bottom:28px; right:18px; }
  .right .ic1{ top:62px; right:22px; }
  .right .ic2{ top:96px; left:18px; }
  .right .ic3{ bottom:24px; left:20px; }

  .connector-left,
  .connector-right{
    position:absolute;
    top:176px;
    width:250px;
    height:370px;
    z-index:1;
    pointer-events:none;
    opacity:.28;
    filter:blur(1px);
  }
  .connector-left{
    left:362px;
    background:
      radial-gradient(circle at 0 50%, rgba(255,109,58,.75), transparent 56%),
      linear-gradient(90deg, rgba(255,109,58,.35), transparent 76%);
    clip-path:polygon(0 42%, 100% 0, 100% 100%, 0 58%);
  }
  .connector-right{
    right:362px;
    background:
      radial-gradient(circle at 100% 50%, rgba(111,255,227,.72), transparent 56%),
      linear-gradient(270deg, rgba(111,255,227,.35), transparent 76%);
    clip-path:polygon(100% 42%, 0 0, 0 100%, 100% 58%);
  }

  .spark{
    position:absolute;
    width:4px; height:4px; border-radius:50%;
    z-index:2; opacity:.8;
    box-shadow:0 0 8px currentColor, 0 0 18px currentColor;
  }
  .s1{ left:604px; top:280px; color:rgba(255,140,90,.9);}
  .s2{ left:628px; top:246px; color:rgba(255,180,140,.85);}
  .s3{ left:675px; top:358px; color:rgba(255,255,255,.85);}
  .s4{ left:764px; top:286px; color:rgba(123,210,255,.9);}
  .s5{ left:788px; top:330px; color:rgba(111,255,227,.92);}

  /* explicit z-order notes */
  .z0{z-index:0}.z1{z-index:1}.z2{z-index:2}.z3{z-index:3}.z4{z-index:4}.z5{z-index:5}.z6{z-index:6}.z7{z-index:7}
</style>

<div class="slide">
  <div class="connector-left z1"></div>
  <div class="connector-right z1"></div>

  <div class="arc z2"></div>

  <div class="beam z3">
    <div class="warm"></div>
    <div class="cool"></div>
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>
    <div class="line l5"></div>
    <div class="line l6"></div>
    <div class="line l7"></div>
  </div>

  <div class="arrow z4"></div>

  <div class="spark s1"></div>
  <div class="spark s2"></div>
  <div class="spark s3"></div>
  <div class="spark s4"></div>
  <div class="spark s5"></div>

  <div class="title">AI 도입 전후 업무 효율성 비교</div>

  <div class="side left z5">
    <div class="side-label">도입 전</div>
    <div class="iconline ic1">⚙️</div>
    <div class="iconline ic2">⏳</div>
    <div class="iconline ic3">🔗</div>

    <div class="cards">
      <div class="card">
        <div class="pattern scribble"></div>
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">📝</div>
              <div class="badge">?</div>
            </div>

            <p>주 8시간 소요</p>
          </div>
          <div class="meta">

          </div>
        </div>
        <div class="edge-glow"></div>
      </div>

      <div class="card">
        <div class="pattern pipes"></div>
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">🔍</div>
              <div class="badge">⌛</div>
            </div>
            <h3>수동 데이터 검색</h3>
            <p>건당 30분</p>
          </div>
          <div class="meta">
            <div class="mini">지연</div>
            <div class="progress"><div class="fill" style="width:76%"></div></div>
          </div>
        </div>
        <div class="edge-glow"></div>
      </div>

      <div class="card">
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">📞</div>
              <div class="badge">⏰</div>
            </div>
            <h3>전화/이메일 응대</h3>
            <p>평균 응답 4시간</p>
          </div>
          <div class="meta">
            <div class="mini">낮은 속도</div>
            <div class="progress"><div class="fill" style="width:88%"></div></div>
          </div>
        </div>
        <div class="edge-glow"></div>
      </div>
    </div>
  </div>

  <div class="side right z5">
    <div class="side-label">도입 후</div>
    <div class="iconline ic1">☁️</div>
    <div class="iconline ic2">⚙️</div>
    <div class="iconline ic3">📁</div>

    <div class="cards">
      <div class="card">
        <div class="pattern pipes"></div>
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">🤖</div>
              <div class="badge">✓</div>
            </div>
            <h3>자동 보고서 생성</h3>
            <p>주 30분으로 단축</p>
          </div>
          <div class="meta">
            <div class="mini">자동화</div>
            <div class="progress"><div class="fill" style="width:92%"></div></div>
          </div>
        </div>
        <div class="edge-glow"></div>
      </div>

      <div class="card">
        <div class="pattern pipes"></div>
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">⚡</div>
              <div class="badge">🔓</div>
            </div>
            <h3>RAG 기반 즉시 검색</h3>
            <p>건당 5초</p>
          </div>
          <div class="meta">
            <div class="mini">고속 검색</div>
            <div class="progress"><div class="fill" style="width:96%"></div></div>
          </div>
        </div>
        <div class="edge-glow"></div>
      </div>

      <div class="card">
        <div class="content">
          <div>
            <div class="row-top">
              <div class="emoji">💬</div>
              <div class="badge">⛓</div>
            </div>
            <h3>AI 챗봇 자동 응대</h3>
            <p>평균 응답 10초</p>
          </div>
          <div class="meta">
            <div class="mini">실시간</div>
            <div class="progress"><div class="fill" style="width:94%"></div></div>
          </div>
        </div>
        <div class="edge-glow"></div>
      </div>
    </div>
  </div>
</div></div></body></html>

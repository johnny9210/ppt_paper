<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #020b22; font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .slide {
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    color: #eaffff;
    background:
      radial-gradient(circle at 50% 48%, rgba(51,255,240,.18) 0, rgba(51,255,240,.08) 14%, rgba(0,0,0,0) 32%),
      radial-gradient(circle at 50% 50%, rgba(0,210,255,.10) 0, rgba(0,0,0,0) 58%),
      linear-gradient(180deg, #021235 0%, #04173f 45%, #03112f 100%);
  }

  .title {
    position: absolute;
    top: 28px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #d8ffff;
    text-shadow: 0 0 10px rgba(79,255,233,.35), 0 0 28px rgba(79,255,233,.18);
    z-index: 5;
  }

  .circuit {
    position: absolute;
    inset: 0;
    opacity: .26;
    z-index: 0;
  }
  .circuit .v, .circuit .h, .circuit .dot {
    position: absolute;
    background: linear-gradient(180deg, rgba(79,255,233,0), rgba(79,255,233,.75), rgba(79,255,233,0));
    box-shadow: 0 0 8px rgba(79,255,233,.45);
  }
  .circuit .h {
    background: linear-gradient(90deg, rgba(79,255,233,0), rgba(79,255,233,.75), rgba(79,255,233,0));
  }
  .circuit .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(79,255,233,.75);
    box-shadow: 0 0 8px rgba(79,255,233,.65);
  }

  .center-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 420px;
    height: 420px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(85,255,239,.14) 0 20%, rgba(85,255,239,.08) 36%, rgba(85,255,239,0) 70%);
    filter: blur(4px);
    z-index: 1;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 228px;
    height: 228px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 4;
    background:
      radial-gradient(circle at 50% 50%, rgba(125,255,245,.28) 0 8%, rgba(83,246,235,.11) 18%, rgba(4,25,64,.95) 62%, rgba(5,18,48,1) 100%);
    border: 4px solid rgba(104,255,238,.85);
    box-shadow:
      0 0 22px rgba(76,255,233,.75),
      0 0 48px rgba(76,255,233,.28),
      inset 0 0 24px rgba(76,255,233,.14);
  }
  .hub:before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 3px solid rgba(104,255,238,.65);
    box-shadow: inset 0 0 18px rgba(76,255,233,.10);
  }
  .hub .icon {
    position: absolute;
    top: 46px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 56px;
    line-height: 1;
    text-shadow: 0 0 14px rgba(110,255,244,.75);
  }
  .hub .hub-title {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 48px;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: #d6ffff;
    text-shadow: 0 0 10px rgba(79,255,233,.35);
  }

  .link {
    position: absolute;
    height: 18px;
    border-radius: 999px;
    z-index: 2;
    background:
      linear-gradient(90deg, rgba(63,222,255,.95), rgba(92,255,222,.88));
    box-shadow:
      0 0 14px rgba(74,255,232,.7),
      0 0 28px rgba(74,255,232,.28);
  }
  .link:after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 999px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.24), rgba(255,255,255,.06), rgba(255,255,255,.18));
    opacity: .65;
  }
  .link.lt { width: 180px; left: 403px; top: 190px; transform: rotate(26deg); transform-origin: right center; }
  .link.lm { width: 188px; left: 385px; top: 353px; }
  .link.lb { width: 180px; left: 403px; top: 516px; transform: rotate(-26deg); transform-origin: right center; }
  .link.rt { width: 180px; left: 697px; top: 190px; transform: rotate(-26deg); transform-origin: left center; }
  .link.rm { width: 188px; left: 707px; top: 353px; }
  .link.rb { width: 180px; left: 697px; top: 516px; transform: rotate(26deg); transform-origin: left center; }

  .card {
    position: absolute;
    width: 322px;
    height: 146px;
    border-radius: 18px;
    z-index: 3;
    background:
      linear-gradient(180deg, rgba(255,255,255,.16), rgba(160,180,220,.08)),
      linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 48%, rgba(255,255,255,.08) 100%);
    border: 2px solid rgba(174,221,255,.38);
    box-shadow:
      0 0 16px rgba(82,255,238,.24),
      inset 0 0 18px rgba(255,255,255,.08);
    backdrop-filter: blur(2px);
  }
  .card:before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background:
      linear-gradient(115deg, rgba(255,255,255,.12) 0 24%, rgba(255,255,255,0) 28% 72%, rgba(255,255,255,.10) 84% 100%);
    pointer-events: none;
  }
  .card:after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    box-shadow:
      0 0 12px rgba(101,255,238,.34),
      inset 0 0 8px rgba(101,255,238,.12);
    pointer-events: none;
  }

  .card .circle {
    position: absolute;
    left: 165px;
    top: 22px;
    width: 108px;
    height: 108px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 4px solid rgba(110,255,244,.78);
    background:
      radial-gradient(circle at 50% 50%, rgba(110,255,244,.18) 0 35%, rgba(4,25,64,.55) 60%, rgba(4,25,64,.72) 100%);
    box-shadow:
      0 0 18px rgba(76,255,233,.55),
      inset 0 0 20px rgba(76,255,233,.10);
  }
  .card .circle:before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 2px solid rgba(110,255,244,.42);
  }

  .emoji {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    line-height: 1;
    text-shadow: 0 0 14px rgba(110,255,244,.8);
  }

  .text {
    position: absolute;
    left: 22px;
    right: 18px;
    bottom: 14px;
    text-align: left;
  }
  .text .name {
    font-size: 22px;
    font-weight: 800;
    color: #dfffff;
    margin-bottom: 4px;
    text-shadow: 0 0 8px rgba(79,255,233,.25);
  }
  .text .desc {
    font-size: 14px;
    line-height: 1.3;
    color: #b7d7eb;
    opacity: .95;
  }

  .left .circle { left: 236px; }
  .left .text { left: 22px; right: 118px; text-align: left; }

  .right .circle { left: 86px; }
  .right .text { left: 126px; right: 20px; text-align: left; }

  .lt-card { left: 60px; top: 70px; }
  .lm-card { left: 4px; top: 295px; }
  .lb-card { left: 60px; top: 520px; }

  .rt-card { right: 60px; top: 70px; }
  .rm-card { right: 4px; top: 295px; }
  .rb-card { right: 60px; top: 520px; }
</style>

<div class="slide">
  <div class="title">마이크로서비스 아키텍처</div>

  <div class="circuit">
    <div class="v" style="left:614px; top:86px; width:2px; height:138px;"></div>
    <div class="v" style="left:638px; top:72px; width:2px; height:156px;"></div>
    <div class="v" style="left:662px; top:86px; width:2px; height:138px;"></div>

    <div class="v" style="left:614px; top:492px; width:2px; height:142px;"></div>
    <div class="v" style="left:638px; top:478px; width:2px; height:164px;"></div>
    <div class="v" style="left:662px; top:492px; width:2px; height:142px;"></div>

    <div class="h" style="left:366px; top:160px; width:190px; height:2px;"></div>
    <div class="h" style="left:332px; top:322px; width:222px; height:2px;"></div>
    <div class="h" style="left:366px; top:566px; width:190px; height:2px;"></div>

    <div class="h" style="left:724px; top:160px; width:190px; height:2px;"></div>
    <div class="h" style="left:724px; top:322px; width:222px; height:2px;"></div>
    <div class="h" style="left:724px; top:566px; width:190px; height:2px;"></div>

    <div class="dot" style="left:639px; top:140px;"></div>
    <div class="dot" style="left:639px; top:586px;"></div>
    <div class="dot" style="left:410px; top:321px;"></div>
    <div class="dot" style="left:868px; top:321px;"></div>
  </div>

  <div class="center-glow"></div>

  <div class="link lt"></div>
  <div class="link lm"></div>
  <div class="link lb"></div>
  <div class="link rt"></div>
  <div class="link rm"></div>
  <div class="link rb"></div>

  <div class="hub">
    <div class="icon">🌐</div>
    <div class="hub-title">API Gateway</div>
  </div>

  <div class="card left lt-card">
    <div class="circle"><div class="emoji">☁️</div></div>
    <div class="text">
      <div class="name">클라우드 스토리지</div>
      <div class="desc">S3, MinIO 기반 객체 저장소</div>
    </div>
  </div>

  <div class="card left lm-card">
    <div class="circle"><div class="emoji">🗄️</div></div>
    <div class="text">
      <div class="name">데이터베이스</div>
      <div class="desc">PostgreSQL + MongoDB</div>
    </div>
  </div>

  <div class="card left lb-card">
    <div class="circle"><div class="emoji">🤖</div></div>
    <div class="text">
      <div class="name">AI 서비스</div>
      <div class="desc">LLM 추론 엔진</div>
    </div>
  </div>

  <div class="card right rt-card">
    <div class="circle"><div class="emoji">📡</div></div>
    <div class="text">
      <div class="name">실시간 스트리밍</div>
      <div class="desc">Kafka 이벤트 브로커</div>
    </div>
  </div>

  <div class="card right rm-card">
    <div class="circle"><div class="emoji">🔒</div></div>
    <div class="text">
      <div class="name">인증/보안</div>
      <div class="desc">OAuth2 + JWT 토큰</div>
    </div>
  </div>

  <div class="card right rb-card">
    <div class="circle"><div class="emoji">🌍</div></div>
    <div class="text">
      <div class="name">CDN/Edge</div>
      <div class="desc">글로벌 콘텐츠 배포</div>
    </div>
  </div>
</div></div></body></html>

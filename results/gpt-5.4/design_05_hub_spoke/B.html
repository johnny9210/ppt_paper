<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #06173a; font-family: "Inter", "Segoe UI", Arial, sans-serif; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(35,255,227,0.08) 0%, rgba(18,95,170,0.05) 22%, rgba(4,18,58,0.2) 45%, rgba(2,8,34,0.72) 75%, #020a2c 100%),
      linear-gradient(180deg, #041a52 0%, #03133f 45%, #020a2c 100%);
    color: #eaffff;
  }

  /* z=0 background vignette */
  .bg-vignette {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,255,225,0.04) 0, rgba(0,255,225,0.02) 20%, transparent 46%),
      radial-gradient(circle at 50% 0%, rgba(0,60,160,0.08), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(0,20,80,0.12), transparent 40%);
    opacity: 1;
  }

  /* z=1 PCB circuit pattern */
  .circuits {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.45;
  }
  .circuits .vline,
  .circuits .hline {
    position: absolute;
    background: linear-gradient(180deg, rgba(68,255,224,0.0), rgba(68,255,224,0.4), rgba(68,255,224,0.0));
    filter: drop-shadow(0 0 4px rgba(68,255,224,0.18));
  }
  .circuits .vline {
    width: 2px;
    border-radius: 2px;
  }
  .circuits .hline {
    height: 2px;
    background: linear-gradient(90deg, rgba(68,255,224,0.0), rgba(68,255,224,0.32), rgba(68,255,224,0.0));
  }
  .circuits .node {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(100,255,235,0.38);
    box-shadow: 0 0 10px rgba(60,255,230,0.25);
  }

  /* z=2 title */
  .title {
    position: absolute;
    top: 28px;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #eaffff;
    text-shadow: 0 0 12px rgba(54,255,224,0.18);
  }

  /* z=3 glowing spoke rails */
  .spoke {
    position: absolute;
    height: 16px;
    border-radius: 999px;
    z-index: 3;
    background:
      linear-gradient(90deg, rgba(58,235,255,0.96), rgba(98,255,212,0.88));
    box-shadow:
      0 0 18px rgba(61,255,226,0.45),
      0 0 34px rgba(61,255,226,0.22),
      inset 0 0 10px rgba(255,255,255,0.18);
    overflow: hidden;
  }
  .spoke::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 50%, rgba(255,255,255,0.22) 0 1px, transparent 1.5px) 0 0 / 16px 16px,
      linear-gradient(90deg, rgba(255,255,255,0.14), transparent 35%, rgba(255,255,255,0.12) 70%, transparent);
    opacity: 0.55;
    mix-blend-mode: screen;
  }

  .spoke.lt { width: 230px; left: 378px; top: 166px; transform: rotate(-27deg); transform-origin: right center; }
  .spoke.lm { width: 242px; left: 342px; top: 352px; }
  .spoke.lb { width: 232px; left: 378px; top: 539px; transform: rotate(27deg); transform-origin: right center; }

  .spoke.rt { width: 230px; right: 378px; top: 166px; transform: rotate(27deg); transform-origin: left center; }
  .spoke.rm { width: 242px; right: 342px; top: 352px; }
  .spoke.rb { width: 232px; right: 378px; top: 539px; transform: rotate(-27deg); transform-origin: left center; }

  /* z=4 diffuse center glow */
  .center-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 290px;
    height: 290px;
    transform: translate(-50%, -50%);
    z-index: 4;
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(74,255,226,0.34) 0%, rgba(74,255,226,0.18) 24%, rgba(74,255,226,0.06) 48%, transparent 72%);
    filter: blur(4px);
  }

  /* z=5 side cards */
  .card {
    position: absolute;
    width: 322px;
    height: 178px;
    z-index: 5;
    border-radius: 18px;
    border: 2px solid rgba(201, 232, 255, 0.42);
    background:
      linear-gradient(135deg, rgba(255,255,255,0.17) 0%, rgba(172,194,255,0.08) 26%, rgba(60,72,124,0.13) 65%, rgba(255,255,255,0.07) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      0 14px 28px rgba(0, 0, 0, 0.22),
      0 0 22px rgba(74,255,226,0.16),
      inset 0 0 0 1px rgba(255,255,255,0.05),
      inset 0 -10px 24px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(115deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.05) 28%, transparent 42%),
      radial-gradient(circle at 82% 18%, rgba(255,255,255,0.12), transparent 28%);
    opacity: 0.7;
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px; bottom: 8px; height: 10px;
    border-radius: 12px;
    background: linear-gradient(90deg, rgba(61,255,226,0.08), rgba(150,255,225,0.32), rgba(61,255,226,0.08));
    filter: blur(2px);
    opacity: 0.75;
  }

  .card.lt { left: 62px;  top: 70px; }
  .card.lm { left: 6px;   top: 294px; }
  .card.lb { left: 62px;  top: 520px; }
  .card.rt { right: 62px; top: 70px; }
  .card.rm { right: 6px;  top: 294px; }
  .card.rb { right: 62px; top: 520px; }

  /* z=6 circular icon badges on cards */
  .badge {
    position: absolute;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8efeff;
    text-align: center;
    line-height: 1;
    background:
      radial-gradient(circle at 50% 50%, rgba(5,30,75,0.82) 0%, rgba(8,27,74,0.72) 58%, rgba(3,17,55,0.45) 100%);
    border: 5px solid rgba(105,255,238,0.78);
    box-shadow:
      0 0 10px rgba(90,255,230,0.45),
      0 0 26px rgba(90,255,230,0.28),
      inset 0 0 16px rgba(255,255,255,0.06);
  }
  .badge::before {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 2px solid rgba(120,255,239,0.36);
    box-shadow: inset 0 0 10px rgba(120,255,239,0.12);
  }
  .badge .emoji {
    position: relative;
    z-index: 1;
    font-size: 42px;
    filter: drop-shadow(0 0 8px rgba(74,255,226,0.35));
  }

  .card .badge { left: 178px; top: 24px; }
  .card.rt .badge, .card.rm .badge, .card.rb .badge { left: 28px; top: 24px; }

  /* z=7 card text */
  .card-content {
    position: absolute;
    z-index: 7;
    top: 24px;
    left: 28px;
    right: 142px;
  }
  .card.rt .card-content,
  .card.rm .card-content,
  .card.rb .card-content {
    left: 156px;
    right: 24px;
  }
  .card-title {
    font-size: 22px;
    font-weight: 800;
    color: #f4ffff;
    line-height: 1.18;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(74,255,226,0.12);
  }
  .card-desc {
    font-size: 14px;
    line-height: 1.45;
    color: rgba(222,244,255,0.86);
    font-weight: 500;
  }

  /* z=8 center hub */
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 230px;
    height: 230px;
    transform: translate(-50%, -50%);
    z-index: 8;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 46%, rgba(18,54,119,0.92) 0%, rgba(7,26,77,0.94) 58%, rgba(3,16,52,0.98) 100%);
    border: 6px solid rgba(101,255,236,0.85);
    box-shadow:
      0 0 18px rgba(74,255,226,0.48),
      0 0 42px rgba(74,255,226,0.24),
      inset 0 0 24px rgba(255,255,255,0.06);
  }
  .hub::before {
    content: "";
    position: absolute;
    inset: 11px;
    border-radius: 50%;
    border: 3px solid rgba(101,255,236,0.36);
  }
  .hub::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #8cfef0 38%, rgba(140,254,240,0.2) 75%, transparent 100%);
    box-shadow: 0 0 18px rgba(255,255,255,0.8), 0 0 34px rgba(74,255,226,0.65);
  }

  /* z=9 hub network icon */
  .network {
    position: absolute;
    inset: 0;
    z-index: 9;
  }
  .network .line {
    position: absolute;
    height: 4px;
    border-radius: 4px;
    background: rgba(106,255,238,0.88);
    box-shadow: 0 0 10px rgba(74,255,226,0.32);
    transform-origin: left center;
  }
  .network .dot {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    background: #093a74;
    border: 5px solid rgba(106,255,238,0.94);
    box-shadow: 0 0 12px rgba(74,255,226,0.36);
  }
  .hub-emoji {
    position: absolute;
    left: 50%;
    top: 25px;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 26px;
    opacity: 0.9;
    filter: drop-shadow(0 0 8px rgba(74,255,226,0.3));
  }
  .hub-title {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    z-index: 10;
    width: 170px;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: #f1ffff;
    text-shadow: 0 0 10px rgba(74,255,226,0.16);
    letter-spacing: -0.02em;
  }

  /* z=10 foreground highlight */
  .foreground-glow {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 50%, rgba(120,255,235,0.08) 0%, transparent 20%),
      linear-gradient(90deg, transparent 0%, rgba(120,255,235,0.02) 50%, transparent 100%);
  }
</style>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f19; font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .slide {
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    color: #f7f4ee;
    background:
      radial-gradient(circle at 6% 18%, rgba(233,179,61,.38), transparent 16%),
      radial-gradient(circle at 50% 52%, rgba(246,195,96,.45), transparent 22%),
      radial-gradient(circle at 96% 50%, rgba(244,186,83,.28), transparent 15%),
      radial-gradient(circle at 78% 80%, rgba(0,68,255,.22), transparent 18%),
      radial-gradient(circle at 25% 10%, rgba(10,45,120,.28), transparent 25%),
      linear-gradient(90deg, #0b0f17 0%, #141d31 28%, #1d2130 51%, #0e1734 74%, #101217 100%);
  }

  .frame,
  .frame::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(224,180,88,.72);
    pointer-events: none;
  }
  .frame::before {
    inset: 10px;
    opacity: .55;
  }

  .mesh {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(60deg, transparent 0 74%, rgba(228,183,86,.18) 74.2%, transparent 74.6%) 760px 20px/150px 130px repeat,
      linear-gradient(-60deg, transparent 0 74%, rgba(228,183,86,.16) 74.2%, transparent 74.6%) 760px 20px/150px 130px repeat,
      linear-gradient(0deg, transparent 0 98%, rgba(228,183,86,.14) 98.3%, transparent 98.6%) 760px 20px/150px 130px repeat,
      linear-gradient(60deg, transparent 0 74%, rgba(228,183,86,.10) 74.2%, transparent 74.6%) -40px 430px/150px 130px repeat,
      linear-gradient(-60deg, transparent 0 74%, rgba(228,183,86,.08) 74.2%, transparent 74.6%) -40px 430px/150px 130px repeat;
    opacity: .9;
  }

  .title {
    position: absolute;
    top: 38px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .08em;
    color: #f4e6c1;
    text-shadow: 0 0 18px rgba(243,196,95,.28);
  }

  .connectors {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .line {
    position: absolute;
    background: linear-gradient(90deg, rgba(250,213,125,.15), rgba(255,227,159,.85), rgba(250,213,125,.15));
    box-shadow: 0 0 10px rgba(251,209,108,.35);
    border-radius: 2px;
  }
  .line.v { width: 2px; }
  .line.h { height: 2px; }

  .node {
    position: absolute;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.35);
    background:
      linear-gradient(135deg, rgba(255,255,255,.22) 0 18%, rgba(255,255,255,.08) 18% 40%, rgba(255,255,255,.02) 40% 100%),
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -14px 24px rgba(255,255,255,.05),
      0 0 26px rgba(242,197,95,.12);
    overflow: hidden;
  }
  .node::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.18));
    opacity: .28;
  }
  .node::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -8px;
    height: 24px;
    background: radial-gradient(ellipse at center, rgba(255,219,141,.8), rgba(255,219,141,0) 70%);
    filter: blur(5px);
    opacity: .8;
  }

  .node.gold .cap,
  .node.copper .cap,
  .node.silver .cap {
    position: absolute;
    left: -1px; right: -1px; top: -1px;
    height: 28px;
    border-radius: 14px 14px 0 0;
    border-bottom: 1px solid rgba(255,255,255,.16);
  }
  .node.gold .cap {
    background: linear-gradient(180deg, #d9bf77 0%, #b99243 48%, #f0d48d 100%);
  }
  .node.silver .cap {
    background: linear-gradient(180deg, #d7dce2 0%, #9ca5af 48%, #eef2f6 100%);
  }
  .node.copper .cap {
    background: linear-gradient(180deg, #cf9a6d 0%, #986342 48%, #efc394 100%);
  }

  .strategic {
    width: 270px; height: 166px;
    left: 505px; top: 84px;
  }
  .tac-left {
    width: 285px; height: 165px;
    left: 330px; top: 294px;
  }
  .tac-right {
    width: 285px; height: 165px;
    left: 670px; top: 294px;
  }
  .op-left {
    width: 312px; height: 162px;
    left: 118px; top: 500px;
  }
  .op-mid {
    width: 312px; height: 162px;
    left: 486px; top: 500px;
  }
  .op-right {
    width: 312px; height: 162px;
    left: 854px; top: 500px;
  }

  .content {
    position: absolute;
    inset: 34px 20px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 2;
  }
  .strategic .content { inset-top: 40px; }

  .emoji {
    font-size: 34px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 8px rgba(246,209,115,.28));
  }
  .level {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #e8c97e;
    opacity: .9;
    margin-bottom: 6px;
  }
  .node.silver .level { color: #d7dce6; }
  .node.copper .level { color: #f0c79d; }

  .node-title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #fff8ea;
    text-shadow: 0 1px 10px rgba(255,215,130,.18);
  }
  .node.small .node-title {
    font-size: 23px;
    margin-bottom: 8px;
  }
  .desc {
    font-size: 15px;
    line-height: 1.45;
    color: rgba(250,247,242,.9);
    width: 100%;
  }

  .circuit {
    position: absolute;
    inset: 28px 14px 12px 14px;
    pointer-events: none;
    opacity: .32;
    background:
      linear-gradient(90deg, transparent 0 8%, rgba(236,201,125,.6) 8% 8.6%, transparent 8.6% 24%, rgba(236,201,125,.45) 24% 24.6%, transparent 24.6% 100%),
      linear-gradient(0deg, transparent 0 46%, rgba(236,201,125,.45) 46% 46.8%, transparent 46.8% 100%);
    mask:
      linear-gradient(90deg, transparent 0 6%, #000 6% 94%, transparent 94%),
      linear-gradient(0deg, transparent 0 12%, #000 12% 88%, transparent 88%);
  }

  .corner-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 4% 9%, rgba(255,205,98,.22), transparent 10%),
      radial-gradient(circle at 96% 14%, rgba(255,205,98,.14), transparent 10%),
      radial-gradient(circle at 50% 58%, rgba(255,205,98,.14), transparent 18%);
  }
</style>

<div class="slide">
  <div class="frame"></div>
  <div class="mesh"></div>
  <div class="corner-glow"></div>

  <div class="title">데이터 거버넌스 프레임워크</div>

  <div class="connectors">
    <div class="line v" style="left:640px; top:250px; height:22px;"></div>
    <div class="line h" style="left:470px; top:271px; width:340px;"></div>
    <div class="line v" style="left:470px; top:271px; height:23px;"></div>
    <div class="line v" style="left:810px; top:271px; height:23px;"></div>

    <div class="line v" style="left:470px; top:459px; height:18px;"></div>
    <div class="line v" style="left:810px; top:459px; height:18px;"></div>
    <div class="line h" style="left:274px; top:477px; width:536px;"></div>
    <div class="line v" style="left:274px; top:477px; height:23px;"></div>
    <div class="line v" style="left:642px; top:477px; height:23px;"></div>
    <div class="line v" style="left:1010px; top:477px; height:23px;"></div>
  </div>

  <div class="node gold strategic">
    <div class="cap"></div>
    <div class="content">
      <div class="emoji">👑</div>
      <div class="level">Strategic</div>
      <div class="node-title">데이터 전략</div>
      <div class="desc">경영진 주도 데이터 비전 및 정책 수립</div>
    </div>
  </div>

  <div class="node silver tac-left small">
    <div class="cap"></div>
    <div class="content">
      <div class="emoji">📋</div>
      <div class="level">Tactical</div>
      <div class="node-title">품질 관리</div>
      <div class="desc">데이터 표준화 및 품질 모니터링</div>
    </div>
  </div>

  <div class="node silver tac-right small">
    <div class="cap"></div>
    <div class="content">
      <div class="emoji">🔐</div>
      <div class="level">Tactical</div>
      <div class="node-title">보안 통제</div>
      <div class="desc">접근 권한 및 개인정보 보호</div>
    </div>
  </div>

  <div class="node copper op-left small">
    <div class="cap"></div>
    <div class="circuit"></div>
    <div class="content">
      <div class="emoji">🗄️</div>
      <div class="level">Operational</div>
      <div class="node-title">수집</div>
      <div class="desc">원천 데이터 통합</div>
    </div>
  </div>

  <div class="node copper op-mid small">
    <div class="cap"></div>
    <div class="circuit"></div>
    <div class="content">
      <div class="emoji">⚙️</div>
      <div class="level">Operational</div>
      <div class="node-title">처리</div>
      <div class="desc">ETL 파이프라인</div>
    </div>
  </div>

  <div class="node copper op-right small">
    <div class="cap"></div>
    <div class="circuit"></div>
    <div class="content">
      <div class="emoji">📈</div>
      <div class="level">Operational</div>
      <div class="node-title">분석</div>
      <div class="desc">BI 대시보드 운영</div>
    </div>
  </div>
</div></div></body></html>

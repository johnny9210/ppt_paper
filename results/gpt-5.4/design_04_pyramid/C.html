<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0d14; font-family: "Inter", "Pretendard", "Noto Sans KR", sans-serif; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
    color: #f8fafc;
    background:
      radial-gradient(circle at 50% 38%, rgba(228,179,90,0.22), transparent 32%),
      radial-gradient(circle at 8% 86%, rgba(200,146,62,0.18), transparent 30%),
      radial-gradient(circle at 92% 84%, rgba(200,146,62,0.18), transparent 30%),
      linear-gradient(180deg, #15254A, #0A0D14);
  }

  .bg-mesh {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.45;
    background:
      linear-gradient(60deg, transparent 0 48%, rgba(200,155,82,0.35) 49%, transparent 50%) 860px 40px / 140px 120px repeat,
      linear-gradient(-60deg, transparent 0 48%, rgba(200,155,82,0.28) 49%, transparent 50%) 860px 40px / 140px 120px repeat;
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.15) 22%, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0.95) 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.15) 22%, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0.95) 100%);
  }

  .frame-outer,
  .frame-inner {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    border: 1px solid rgba(200,155,82,0.85);
  }

  .frame-outer { inset: 22px; }
  .frame-inner { inset: 34px; opacity: 0.75; }

  .ambient-top {
    position: absolute;
    z-index: 1;
    width: 300px;
    height: 300px;
    left: 490px;
    top: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(228,179,90,0.15), transparent 70%);
    filter: blur(60px);
  }

  .ambient-bottom-left {
    position: absolute;
    z-index: 1;
    width: 300px;
    height: 300px;
    left: -40px;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,146,62,0.15), transparent 70%);
    filter: blur(60px);
  }

  .ambient-bottom-right {
    position: absolute;
    z-index: 1;
    width: 300px;
    height: 300px;
    right: -40px;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,146,62,0.15), transparent 70%);
    filter: blur(60px);
  }

  .title-wrap {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    text-align: center;
  }

  .title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #f8fafc;
    text-shadow: 0 2px 24px rgba(228,179,90,0.15);
  }

  .title-accent {
    width: 48px;
    height: 4px;
    border-radius: 2px;
    background: #D6A85A;
    margin: 12px auto 0;
  }

  .tree {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .connector {
    position: absolute;
    background: rgba(201,161,90,0.72);
    box-shadow: 0 0 12px rgba(244,211,138,0.22);
    border-radius: 2px;
  }

  .card {
    position: absolute;
    z-index: 2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.18), transparent 32%),
      linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -1px;
    height: 2px;
    border-radius: 999px;
    background: rgba(244,211,138,0.88);
    box-shadow: 0 0 20px rgba(244,211,138, 0.3), 0 0 60px rgba(244,211,138, 0.1);
    pointer-events: none;
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 26px;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
  }

  .bar-gold {
    background: linear-gradient(90deg, #b98b3b, #f0d07a, #b98b3b);
  }

  .bar-silver {
    background: linear-gradient(90deg, #b8c1cb, #eef2f7, #b8c1cb);
  }

  .bar-copper {
    background: linear-gradient(90deg, #9d6a47, #d8a67b, #9d6a47);
  }

  .content {
    position: relative;
    z-index: 3;
    height: 100%;
    padding: 44px 24px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .badge {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(214,168,90,0.18);
    margin: 0 auto 12px;
    font-size: 28px;
    box-shadow: 0 0 20px rgba(214,168,90, 0.3), 0 0 60px rgba(214,168,90, 0.1);
  }

  .level {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #d5dde8;
    opacity: 0.8;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .card-desc {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(241,245,249,0.88);
  }

  .small .content { padding: 40px 22px 18px; }
  .small .card-title { font-size: 22px; }
  .small .card-desc { font-size: 14px; }

  .tiny .content { padding: 40px 20px 18px; }
  .tiny .badge { width: 42px; height: 42px; font-size: 24px; margin-bottom: 10px; }
  .tiny .card-title { font-size: 21px; }
  .tiny .card-desc { font-size: 13px; }

  .circuit {
    position: absolute;
    inset: auto 0 0 0;
    height: 56%;
    z-index: 1;
    opacity: 0.18;
    background:
      linear-gradient(90deg, transparent 0 18%, rgba(214,168,90,0.65) 18% 18.4%, transparent 18.4% 100%),
      linear-gradient(90deg, transparent 0 52%, rgba(214,168,90,0.7) 52% 52.4%, transparent 52.4% 100%),
      linear-gradient(90deg, transparent 0 80%, rgba(214,168,90,0.65) 80% 80.4%, transparent 80.4% 100%);
    pointer-events: none;
  }

  .circuit::before,
  .circuit::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(0deg, transparent 0 70%, rgba(214,168,90,0.4) 70% 70.4%, transparent 70.4%),
      linear-gradient(0deg, transparent 0 78%, rgba(214,168,90,0.35) 78% 78.4%, transparent 78.4%),
      linear-gradient(0deg, transparent 0 86%, rgba(214,168,90,0.35) 86% 86.4%, transparent 86.4%);
  }

  .t1 { left: 510px; top: 84px; width: 270px; height: 166px; }
  .t2l { left: 334px; top: 294px; width: 286px; height: 165px; }
  .t2r { left: 670px; top: 294px; width: 286px; height: 165px; }
  .b1 { left: 120px; top: 500px; width: 312px; height: 162px; }
  .b2 { left: 488px; top: 500px; width: 312px; height: 162px; }
  .b3 { left: 856px; top: 500px; width: 312px; height: 162px; }

  .conn-v-top { left: 644px; top: 250px; width: 2px; height: 20px; }
  .conn-h-mid { left: 470px; top: 268px; width: 350px; height: 2px; }
  .conn-v-left-up { left: 470px; top: 268px; width: 2px; height: 26px; }
  .conn-v-right-up { left: 818px; top: 268px; width: 2px; height: 26px; }

  .conn-v-mid-down-left { left: 470px; top: 459px; width: 2px; height: 20px; }
  .conn-v-mid-down-right { left: 818px; top: 459px; width: 2px; height: 20px; }
  .conn-h-bottom { left: 276px; top: 478px; width: 736px; height: 2px; }
  .conn-v-b1 { left: 276px; top: 478px; width: 2px; height: 22px; }
  .conn-v-b2 { left: 644px; top: 478px; width: 2px; height: 22px; }
  .conn-v-b3 { left: 1012px; top: 478px; width: 2px; height: 22px; }
</style>

<div class="slide">
  <div class="bg-mesh"></div>
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="ambient-top"></div>
  <div class="ambient-bottom-left"></div>
  <div class="ambient-bottom-right"></div>

  <div class="title-wrap">
    <div class="title">데이터 거버넌스 프레임워크</div>
    <div class="title-accent"></div>
  </div>

  <div class="tree">
    <div class="connector conn-v-top"></div>
    <div class="connector conn-h-mid"></div>
    <div class="connector conn-v-left-up"></div>
    <div class="connector conn-v-right-up"></div>

    <div class="connector conn-v-mid-down-left"></div>
    <div class="connector conn-v-mid-down-right"></div>
    <div class="connector conn-h-bottom"></div>
    <div class="connector conn-v-b1"></div>
    <div class="connector conn-v-b2"></div>
    <div class="connector conn-v-b3"></div>

    <div class="card t1">
      <div class="top-bar bar-gold"></div>
      <div class="content">
        <div class="badge">👑</div>
        <div class="level">Strategic</div>
        <div class="card-title">데이터 전략</div>
        <div class="card-desc">경영진 주도 데이터 비전 및 정책 수립</div>
      </div>
    </div>

    <div class="card small t2l">
      <div class="top-bar bar-silver"></div>
      <div class="content">
        <div class="badge">📋</div>
        <div class="level">Tactical</div>
        <div class="card-title">품질 관리</div>
        <div class="card-desc">데이터 표준화 및 품질 모니터링</div>
      </div>
    </div>

    <div class="card small t2r">
      <div class="top-bar bar-silver"></div>
      <div class="content">
        <div class="badge">🔐</div>
        <div class="level">Tactical</div>
        <div class="card-title">보안 통제</div>
        <div class="card-desc">접근 권한 및 개인정보 보호</div>
      </div>
    </div>

    <div class="card tiny b1">
      <div class="top-bar bar-copper"></div>
      <div class="circuit"></div>
      <div class="content">
        <div class="badge">🗄️</div>
        <div class="level">Operational</div>
        <div class="card-title">수집</div>
        <div class="card-desc">원천 데이터 통합</div>
      </div>
    </div>

    <div class="card tiny b2">
      <div class="top-bar bar-copper"></div>
      <div class="circuit"></div>
      <div class="content">
        <div class="badge">⚙️</div>
        <div class="level">Operational</div>
        <div class="card-title">처리</div>
        <div class="card-desc">ETL 파이프라인</div>
      </div>
    </div>

    <div class="card tiny b3">
      <div class="top-bar bar-copper"></div>
      <div class="circuit"></div>
      <div class="content">
        <div class="badge">📈</div>
        <div class="level">Operational</div>
        <div class="card-title">분석</div>
        <div class="card-desc">BI 대시보드 운영</div>
      </div>
    </div>
  </div>
</div></div></body></html>

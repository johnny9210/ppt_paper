<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050826;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(31,92,182,0.22) 0%, rgba(10,20,75,0.12) 35%, rgba(3,8,38,0.96) 75%, #02041a 100%),
      linear-gradient(180deg, #08124b 0%, #050a2d 48%, #03061f 100%);
    color: #eaf8ff;
  }

  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(120,190,255,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,190,255,0.16) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.42;
  }

  .floor-grid {
    position: absolute;
    left: -8%;
    right: -8%;
    bottom: -18px;
    height: 235px;
    transform: perspective(900px) rotateX(78deg);
    transform-origin: bottom center;
    background:
      linear-gradient(rgba(110,190,255,0.28) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,190,255,0.28) 1px, transparent 1px);
    background-size: 58px 58px;
    opacity: 0.75;
    box-shadow: 0 0 60px rgba(0,240,255,0.18);
  }

  .title-wrap {
    position: absolute;
    top: 42px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
  }

  .title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #f8fbff;
    text-shadow:
      0 0 8px rgba(162,239,255,0.65),
      0 0 18px rgba(88,220,255,0.5),
      0 0 36px rgba(174,95,255,0.28);
  }

  .description {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 500;
    color: rgba(225,243,255,0.9);
    letter-spacing: 0.02em;
    text-shadow: 0 0 14px rgba(85,220,255,0.22);
  }

  .beam {
    position: absolute;
    left: -20px;
    right: -20px;
    top: 236px;
    height: 18px;
    border-radius: 999px;
    background:
      linear-gradient(90deg,
        rgba(64,247,255,1) 0%,
        rgba(132,244,255,0.95) 24%,
        rgba(202,113,255,0.92) 48%,
        rgba(104,243,255,0.95) 66%,
        rgba(202,113,255,0.92) 86%,
        rgba(170,92,255,1) 100%);
    box-shadow:
      0 0 12px rgba(76,248,255,0.95),
      0 0 28px rgba(168,100,255,0.75),
      0 0 64px rgba(66,232,255,0.35);
    z-index: 2;
  }

  .beam::before,
  .beam::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 160px;
    height: 4px;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.6);
    filter: blur(1px);
  }

  .beam::before { left: 210px; }
  .beam::after { right: 180px; }

  .orb {
    position: absolute;
    top: 210px;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    z-index: 4;
  }

  .orb::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, currentColor 36%, rgba(255,255,255,0.1) 78%, transparent 100%);
    filter: blur(0.4px);
    box-shadow:
      0 0 12px currentColor,
      0 0 28px currentColor,
      0 0 50px color-mix(in srgb, currentColor 60%, transparent);
  }

  .orb::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(172,245,255,0.32);
    box-shadow:
      0 0 12px rgba(122,245,255,0.35),
      inset 0 0 14px rgba(255,255,255,0.18);
  }

  .orb .ring,
  .orb .ring2 {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .orb .ring {
    inset: -14px;
    border: 2px solid rgba(174,109,255,0.18);
    border-top-color: rgba(174,109,255,0.5);
    border-left-color: rgba(90,243,255,0.38);
    transform: rotate(18deg);
  }

  .orb .ring2 {
    inset: -20px;
    border: 1px dashed rgba(116,227,255,0.22);
    transform: rotate(-24deg);
  }

  .orb.cyan { color: #56f4ff; }
  .orb.magenta { color: #ca7bff; }

  .orb1 { left: 190px; }
  .orb2 { left: 488px; }
  .orb3 { left: 786px; }
  .orb4 { left: 1084px; }

  .spark {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, currentColor 36%, rgba(255,255,255,0.05) 72%, transparent 100%);
    box-shadow: 0 0 16px currentColor, 0 0 38px currentColor;
    opacity: 0.95;
  }

  .s1 { width: 10px; height: 10px; color: #5fdcff; left: 640px; top: 92px; }
  .s2 { width: 8px; height: 8px; color: #7bc9ff; left: 780px; top: 156px; }
  .s3 { width: 9px; height: 9px; color: #aa84ff; left: 920px; top: 120px; }
  .s4 { width: 7px; height: 7px; color: #6be9ff; left: 500px; top: 156px; }
  .s5 { width: 8px; height: 8px; color: #5fe7ff; left: 109px; top: 224px; }
  .s6 { width: 9px; height: 9px; color: #74f1ff; left: 1180px; top: 224px; }
  .s7 { width: 12px; height: 12px; color: #6ff1ff; left: 102px; top: 410px; opacity: 0.7; }
  .s8 { width: 10px; height: 10px; color: #cb84ff; left: 1036px; top: 580px; opacity: 0.8; }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.9;
  }

  .g1 { width: 120px; height: 120px; left: 320px; top: 80px; background: rgba(78,244,255,0.6); }
  .g2 { width: 108px; height: 108px; left: 905px; top: 78px; background: rgba(213,105,255,0.48); }
  .g3 { width: 130px; height: 130px; left: 235px; top: 500px; background: rgba(70,245,255,0.35); }
  .g4 { width: 150px; height: 150px; left: 712px; top: 494px; background: rgba(73,238,255,0.38); }

  .cards {
    position: absolute;
    left: 85px;
    right: 85px;
    top: 338px;
    display: flex;
    justify-content: space-between;
    z-index: 3;
  }

  .card {
    position: relative;
    width: 208px;
    height: 278px;
    border-radius: 22px;
    padding: 22px 18px 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.06) 100%);
    border: 2px solid rgba(171,234,255,0.38);
    box-shadow:
      inset 0 0 22px rgba(255,255,255,0.08),
      0 0 18px rgba(90,235,255,0.26),
      0 0 44px rgba(182,93,255,0.18);
    backdrop-filter: blur(3px);
  }

  .card.magenta-tone {
    border-color: rgba(208,138,255,0.42);
    box-shadow:
      inset 0 0 22px rgba(255,255,255,0.08),
      0 0 18px rgba(208,138,255,0.22),
      0 0 44px rgba(90,235,255,0.14);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 42px;
    width: 58px;
    height: 100%;
    background: linear-gradient(115deg, rgba(255,255,255,0.3), rgba(255,255,255,0.03) 55%, transparent 56%);
    border-radius: 0 22px 22px 0;
    opacity: 0.55;
  }

  .slot {
    position: relative;
    border: 2px solid rgba(100,240,255,0.72);
    border-radius: 10px;
    box-shadow: inset 0 0 14px rgba(98,235,255,0.14), 0 0 10px rgba(98,235,255,0.2);
  }

  .card.magenta-tone .slot {
    border-color: rgba(204,126,255,0.72);
    box-shadow: inset 0 0 14px rgba(204,126,255,0.12), 0 0 10px rgba(204,126,255,0.18);
  }

  .slot.top {
    height: 34px;
    margin-bottom: 14px;
  }

  .slot.mid {
    height: 64px;
    margin-bottom: 16px;
    padding: 12px 14px;
  }

  .bottom-row {
    display: flex;
    gap: 12px;
  }

  .slot.small {
    flex: 1;
    height: 78px;
    padding: 10px 8px;
  }

  .step {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: rgba(221,244,255,0.85);
    text-shadow: 0 0 10px rgba(98,235,255,0.5);
  }

  .card.magenta-tone .step {
    text-shadow: 0 0 10px rgba(204,126,255,0.45);
  }

  .emoji {
    font-size: 28px;
    line-height: 1;
    text-align: center;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
  }

  .card-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.15;
    text-align: center;
    color: #f4fbff;
    text-shadow: 0 0 10px rgba(82,231,255,0.28);
  }

  .card.magenta-tone .card-title {
    text-shadow: 0 0 10px rgba(204,126,255,0.25);
  }

  .card-desc {
    font-size: 11px;
    line-height: 1.35;
    text-align: center;
    color: rgba(224,243,255,0.88);
    word-break: keep-all;
  }

  .mid-title {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.15;
    color: #f7fcff;
    text-align: center;
    text-shadow: 0 0 12px rgba(89,239,255,0.26);
  }

  .card.magenta-tone .mid-title {
    text-shadow: 0 0 12px rgba(204,126,255,0.25);
  }

  .connector-bottom {
    position: absolute;
    left: 570px;
    top: 542px;
    width: 140px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(89,243,255,0.9), rgba(118,234,255,0.8));
    box-shadow: 0 0 12px rgba(89,243,255,0.8), 0 0 34px rgba(89,243,255,0.36);
    z-index: 2;
  }

  .tiny-particles {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .tiny-particles div {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(130,240,255,0.85);
    box-shadow: 0 0 6px rgba(130,240,255,0.8);
  }

  .tiny-particles div:nth-child(odd) {
    background: rgba(208,125,255,0.75);
    box-shadow: 0 0 6px rgba(208,125,255,0.72);
  }
</style>

  <div class="title-wrap">

        </div>
        <div class="slot small">

        </div>
      </div>
    </div>
  </div>

  <div class="connector-bottom"></div>

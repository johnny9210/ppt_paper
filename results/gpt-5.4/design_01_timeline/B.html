<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #05071a; font-family: "Inter", "Pretendard", "Segoe UI", sans-serif; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
    color: #eaf7ff;
    background:
      radial-gradient(circle at 28% 14%, rgba(62,236,255,.32) 0, rgba(62,236,255,.12) 6%, rgba(62,236,255,0) 14%),
      radial-gradient(circle at 72% 14%, rgba(220,93,255,.30) 0, rgba(220,93,255,.10) 6%, rgba(220,93,255,0) 14%),
      radial-gradient(circle at 12% 57%, rgba(61,240,255,.25) 0, rgba(61,240,255,.08) 7%, rgba(61,240,255,0) 14%),
      radial-gradient(circle at 56% 57%, rgba(215,74,255,.18) 0, rgba(215,74,255,.06) 7%, rgba(215,74,255,0) 15%),
      radial-gradient(circle at 67% 74%, rgba(73,241,255,.24) 0, rgba(73,241,255,.08) 9%, rgba(73,241,255,0) 18%),
      radial-gradient(circle at center, #0d2a66 0%, #07174a 42%, #04092a 72%, #020516 100%);
  }

  /* z=0 background vignette */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0) 48%, rgba(0,0,0,.16) 75%, rgba(0,0,0,.38) 100%);
    pointer-events: none;
  }

  /* z=1 grid background */
  .grid-back,
  .grid-floor {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .grid-back {
    z-index: 1;
    background-image:
      linear-gradient(rgba(120, 214, 255, .18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 214, 255, .18) 1px, transparent 1px);
    background-size: 74px 74px, 74px 74px;
    opacity: .85;
  }

  .grid-floor {
    z-index: 2;
    top: 405px;
    height: 315px;
    background-image:
      linear-gradient(rgba(120, 214, 255, .16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 214, 255, .16) 1px, transparent 1px);
    background-size: 86px 42px, 86px 42px;
    transform-origin: top center;
    transform: perspective(700px) rotateX(76deg) scaleY(1.45);
    opacity: .8;
    box-shadow: inset 0 60px 120px rgba(55, 218, 255, .08);
  }

  /* z=3 particles and stars */
  .spark, .glow-dot {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .spark {
    z-index: 3;
    width: 4px;
    height: 4px;
    background: #8eeaff;
    box-shadow: 0 0 10px #8eeaff, 0 0 20px #8eeaff;
  }

  .glow-dot {
    z-index: 3;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 0 12px rgba(120,220,255,.9), 0 0 28px rgba(120,220,255,.55);
  }

  .orb {
    position: absolute;
    z-index: 3;
    border-radius: 50%;
    filter: blur(1px);
    pointer-events: none;
  }

  /* z=4 top timeline beam */
  .timeline-beam {
    position: absolute;
    left: -20px;
    right: -20px;
    top: 242px;
    height: 20px;
    z-index: 4;
    background:
      linear-gradient(90deg,
        rgba(57,242,255,.95) 0%,
        rgba(159,248,255,.9) 24%,
        rgba(209,116,255,.9) 46%,
        rgba(106,242,255,.92) 66%,
        rgba(222,111,255,.94) 88%,
        rgba(120,52,255,.85) 100%);
    box-shadow:
      0 0 14px rgba(67,235,255,.95),
      0 0 32px rgba(148,122,255,.75),
      0 0 62px rgba(171,96,255,.45);
  }

  .timeline-core {
    position: absolute;
    left: 0;
    right: 0;
    top: 248px;
    height: 7px;
    z-index: 5;
    background: linear-gradient(90deg, rgba(255,255,255,.9), rgba(255,255,255,.45), rgba(255,255,255,.85));
    filter: blur(.2px);
    box-shadow: 0 0 12px rgba(255,255,255,.75);
  }

  /* z=6 node glow rings */
  .node {
    position: absolute;
    top: 214px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, rgba(255,255,255,.95) 0 8%, rgba(134,245,255,.85) 18%, rgba(158,103,255,.75) 44%, rgba(255,255,255,.12) 56%, rgba(255,255,255,0) 70%);
    border: 2px solid rgba(170, 246, 255, .6);
    box-shadow:
      0 0 10px rgba(98,245,255,.9),
      0 0 28px rgba(98,245,255,.7),
      0 0 56px rgba(213,111,255,.45),
      inset 0 0 18px rgba(255,255,255,.38);
  }

  .node::before,
  .node::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(150, 234, 255, .22);
  }

  .node::before {
    border-left-color: rgba(211,113,255,.55);
    border-top-color: rgba(110,240,255,.45);
    transform: rotate(18deg);
  }

  .node::after {
    inset: -16px;
    border-right-color: rgba(211,113,255,.35);
    border-bottom-color: rgba(110,240,255,.30);
    transform: rotate(-14deg);
  }

  .node .step-badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    background:
      radial-gradient(circle at 35% 35%, rgba(255,255,255,.9), rgba(255,255,255,.15) 26%, rgba(255,255,255,0) 27%),
      linear-gradient(135deg, rgba(92,242,255,.72), rgba(211,114,255,.78));
    box-shadow:
      inset 0 0 10px rgba(255,255,255,.45),
      0 0 16px rgba(255,255,255,.18);
  }

  .node.n1 { left: 198px; }
  .node.n2 { left: 497px; }
  .node.n3 { left: 796px; }
  .node.n4 { left: 1095px; }

  .trail {
    position: absolute;
    height: 8px;
    z-index: 5;
    border-radius: 999px;
    filter: blur(2px);
    opacity: .9;
    pointer-events: none;
  }

  /* z=7 title copy */
  .header {
    position: absolute;
    top: 54px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 7;
  }

  .header .title {
    font-size: 38px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: .04em;
    color: #f4fbff;
    text-shadow:
      0 0 8px rgba(134,243,255,.55),
      0 0 22px rgba(211,113,255,.35);
  }

  .header .desc {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .02em;
    color: rgba(225,242,255,.88);
    text-shadow: 0 0 10px rgba(120,220,255,.28);
  }

  /* z=8 lower connector */
  .bottom-link {
    position: absolute;
    left: 330px;
    top: 566px;
    width: 620px;
    height: 12px;
    z-index: 8;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(58,245,255,.15), rgba(98,245,255,.9), rgba(217,112,255,.35), rgba(80,244,255,.9), rgba(58,245,255,.12));
    box-shadow: 0 0 14px rgba(77,240,255,.85), 0 0 32px rgba(77,240,255,.35);
    filter: blur(.2px);
  }

  /* z=9 cards */
  .cards {
    position: absolute;
    left: 135px;
    top: 340px;
    width: 1010px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    column-gap: 95px;
    z-index: 9;
  }

  .card {
    position: relative;
    width: 205px;
    height: 245px;
    padding: 18px 18px 16px;
    border-radius: 22px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 2px solid rgba(179, 237, 255, .45);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 0 26px rgba(83,242,255,.30),
      0 0 56px rgba(201,111,255,.16),
      inset 0 12px 18px rgba(255,255,255,.08),
      inset 0 -20px 28px rgba(98,108,255,.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .card:nth-child(1),
  .card:nth-child(3) {
    border-color: rgba(123, 242, 255, .52);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 0 28px rgba(83,242,255,.38),
      0 0 62px rgba(83,242,255,.18),
      inset 0 12px 18px rgba(255,255,255,.08),
      inset 0 -20px 28px rgba(98,108,255,.08);
  }

  .card:nth-child(2),
  .card:nth-child(4) {
    border-color: rgba(213,113,255,.48);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 0 28px rgba(213,113,255,.28),
      0 0 62px rgba(213,113,255,.16),
      inset 0 12px 18px rgba(255,255,255,.08),
      inset 0 -20px 28px rgba(98,108,255,.08);
  }

  .card::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 38px;
    width: 52px;
    height: 280px;
    transform: rotate(22deg);
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.08), rgba(255,255,255,0));
    opacity: .55;
    filter: blur(.4px);
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background:
      radial-gradient(circle at 24% 82%, rgba(73,242,255,.14), rgba(73,242,255,0) 28%),
      radial-gradient(circle at 78% 88%, rgba(213,113,255,.12), rgba(213,113,255,0) 26%);
    pointer-events: none;
  }

  .slot {
    position: relative;
    width: 100%;
    border-radius: 10px;
    border: 2px solid;
    background: rgba(255,255,255,.02);
    box-shadow: inset 0 0 12px rgba(255,255,255,.03);
  }

  .slot.top {
    height: 34px;
    border-color: rgba(115,243,255,.7);
    box-shadow: 0 0 10px rgba(115,243,255,.22), inset 0 0 10px rgba(115,243,255,.12);
  }

  .slot.mid {
    margin-top: 12px;
    height: 64px;
    border-color: rgba(137,236,255,.58);
    box-shadow: 0 0 12px rgba(137,236,255,.16), inset 0 0 10px rgba(137,236,255,.10);
  }

  .card.purple .slot.top,
  .card.purple .slot.mid,
  .card.purple .mini {
    border-color: rgba(213,113,255,.62);
    box-shadow: 0 0 12px rgba(213,113,255,.16), inset 0 0 10px rgba(213,113,255,.08);
  }

  .card.cyan .slot.top,
  .card.cyan .slot.mid,
  .card.cyan .mini {
    border-color: rgba(115,243,255,.66);
  }

  .mini-row {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 18px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .mini {
    height: 46px;
    border-radius: 10px;
    border: 2px solid rgba(115,243,255,.55);
    background: rgba(255,255,255,.02);
    box-shadow: 0 0 12px rgba(115,243,255,.12), inset 0 0 10px rgba(115,243,255,.08);
  }

  /* z=10 content inside cards */
  .content {
    position: absolute;
    inset: 0;
    padding: 18px 18px 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
  }

  .chip {
    width: fit-content;
    min-width: 44px;
    height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    background: linear-gradient(135deg, rgba(77,243,255,.22), rgba(213,113,255,.28));
    border: 1px solid rgba(255,255,255,.22);
    box-shadow:
      0 0 14px rgba(85,238,255,.20),
      inset 0 0 10px rgba(255,255,255,.10);
  }

  .card-title {
    margin-top: 16px;
    font-size: 23px;
    line-height: 1.18;
    font-weight: 800;
    color: #f5fbff;
    text-shadow: 0 0 10px rgba(120,235,255,.22);
  }

  .card-desc {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.45;
    font-weight: 500;
    color: rgba(225,241,255,.88);
    text-shadow: 0 0 8px rgba(120,220,255,.10);
  }

  .emoji {
    font-size: 18px;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.22));
  }

  /* precise sparkle positions */
  .s1 { left: 148px; top: 169px; }
  .s2 { left: 538px; top: 100px; }
  .s3 { left: 688px; top: 32px; }
  .s4 { left: 837px; top: 100px; }
  .s5 { left: 1227px; top: 168px; }
  .s6 { left: 690px; top: 269px; }
  .s7 { left: 986px; top: 269px; }
  .s8 { left: 259px; top: 629px; }
  .s9 { left: 686px; top: 628px; }
  .s10 { left: 1115px; top: 629px; }

  .g1 { left: 118px; top: 410px; width: 6px; height: 6px; }
  .g2 { left: 497px; top: 182px; width: 5px; height: 5px; }
  .g3 { left: 772px; top: 181px; width: 5px; height: 5px; }
  .g4 { left: 1093px; top: 182px; width: 5px; height: 5px; }

  .o1 { left: 330px; top: 78px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(77,242,255,.48), rgba(77,242,255,.12) 28%, rgba(77,242,255,0) 60%); }
  .o2 { left: 906px; top: 77px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(218,111,255,.42), rgba(218,111,255,.12) 28%, rgba(218,111,255,0) 60%); }
  .o3 { left: 84px; top: 362px; width: 112px; height: 112px; background: radial-gradient(circle, rgba(77,242,255,.38), rgba(77,242,255,.10) 30%, rgba(77,242,255,0) 64%); }
  .o4 { left: 675px; top: 373px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(222,111,255,.24), rgba(222,111,255,.08) 26%, rgba(222,111,255,0) 62%); }

  .t1 { left: 278px; top: 247px; width: 238px; background: linear-gradient(90deg, rgba(77,242,255,.28), rgba(208,112,255,.7)); }
  .t2 { left: 577px; top: 247px; width: 236px; background: linear-gradient(90deg, rgba(208,112,255,.6), rgba(77,242,255,.72)); }
  .t3 { left: 876px; top: 247px; width: 233px; background: linear-gradient(90deg, rgba(77,242,255,.58), rgba(208,112,255,.8)); }
</style>

<div class="slide">
  <div class="vignette"></div>

  <div class="grid-back"></div>

    <div class="card purple">

    <div class="card cyan">

</div></div></body></html>

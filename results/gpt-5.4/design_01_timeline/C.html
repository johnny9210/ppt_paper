<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050A2A; font-family: "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
    color: #EAFBFF;
    background:
      radial-gradient(circle at 50% 45%, #102A6B, #050A2A);
  }

  /* z-index: 0 background */
  .grid {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(110,200,255,0.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,200,255,0.14) 1px, transparent 1px),
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 76px 76px, 76px 76px, 20px 20px;
    background-position: 0 0, 0 0, 0 0;
  }

  .floor-grid {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -20px;
    height: 240px;
    z-index: 0;
    background-image:
      linear-gradient(rgba(110,200,255,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,200,255,0.16) 1px, transparent 1px);
    background-size: 72px 36px, 72px 36px;
    transform: perspective(700px) rotateX(68deg);
    transform-origin: bottom center;
    opacity: 0.55;
  }

  /* z-index: 1 decoration */
  .ambient {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
  }
  .ambient.a1 {
    width: 300px; height: 300px;
    left: 150px; top: 30px;
    background: radial-gradient(circle, rgba(55,231,255,0.15), transparent 70%);
  }
  .ambient.a2 {
    width: 300px; height: 300px;
    right: 120px; top: 20px;
    background: radial-gradient(circle, rgba(255,102,255,0.15), transparent 70%);
  }
  .ambient.a3 {
    width: 300px; height: 300px;
    left: 10px; bottom: 120px;
    background: radial-gradient(circle, rgba(55,231,255,0.16), transparent 70%);
  }
  .ambient.a4 {
    width: 300px; height: 300px;
    left: 480px; bottom: 80px;
    background: radial-gradient(circle, rgba(168,85,247,0.15), transparent 70%);
  }
  .ambient.a5 {
    width: 300px; height: 300px;
    right: 260px; bottom: 90px;
    background: radial-gradient(circle, rgba(55,231,255,0.16), transparent 70%);
  }

  .top-line {
    position: absolute;
    left: 0;
    top: 242px;
    width: 1280px;
    height: 18px;
    z-index: 1;
    background: linear-gradient(90deg, #38FDF8 0%, #B9F9FF 22%, #C084FC 52%, #9AFDFF 70%, #7C3AED 100%);
    box-shadow: 0 0 20px rgba(56,253,248,0.3), 0 0 60px rgba(124,58,237,0.18);
  }

  .particle {
    position: absolute;
    z-index: 1;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(140, 240, 255, 0.9);
    box-shadow: 0 0 12px rgba(140,240,255,0.9);
  }

  .node {
    position: absolute;
    top: 214px;
    width: 60px;
    height: 60px;
    z-index: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 40% 40%, #BFFCFF, #7BDAFF 45%, #C084FC 72%, rgba(255,255,255,0.12) 100%);
    box-shadow: 0 0 20px rgba(103,232,249,0.3), 0 0 60px rgba(232,121,249,0.1);
    border: 2px solid rgba(180, 240, 255, 0.7);
  }
  .node::before,
  .node::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    inset: -12px;
    border: 1px solid rgba(120, 230, 255, 0.25);
  }
  .node::after {
    inset: -20px;
    border-color: rgba(232,121,249,0.2);
  }

  .node.n1 { left: 210px; }
  .node.n2 { left: 510px; }
  .node.n3 { left: 810px; }
  .node.n4 { left: 1110px; }

  .node-label {
    position: absolute;
    top: 290px;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 15px;
    font-weight: 700;
    color: #CFFBFF;
    text-shadow: 0 0 10px rgba(103,232,249,0.35);
    letter-spacing: 0.04em;
  }

  .node-label.l1 { left: 240px; }
  .node-label.l2 { left: 540px; }
  .node-label.l3 { left: 840px; }
  .node-label.l4 { left: 1140px; }

  .title-wrap {
    position: absolute;
    top: 58px;
    left: 86px;
    z-index: 3;
    width: 760px;
  }
  .eyebrow {
    width: 48px;
    height: 4px;
    border-radius: 2px;
    background: #6EE7FF;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(110,231,255,0.3), 0 0 60px rgba(110,231,255,0.1);
  }
  .title {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 12px 0;
    color: #F2FCFF;
    letter-spacing: -0.02em;
    text-shadow: 0 0 18px rgba(103,232,249,0.18);
  }
  .desc {
    font-size: 18px;
    line-height: 1.5;
    margin: 0;
    color: rgba(219, 246, 255, 0.88);
  }

  .bottom-connector {
    position: absolute;
    left: 300px;
    right: 300px;
    bottom: 138px;
    height: 6px;
    z-index: 1;
    background: #38FDF8;
    box-shadow: 0 0 20px rgba(56,253,248,0.3), 0 0 60px rgba(56,253,248,0.1);
    opacity: 0.6;
    border-radius: 999px;
  }

  /* z-index: 2 cards */
  .cards {
    position: absolute;
    left: 70px;
    right: 70px;
    bottom: 72px;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 26px;
  }

  .card {
    position: relative;
    width: 270px;
    height: 310px;
    padding: 20px 18px 18px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(103,232,249,0.3),
      0 0 60px rgba(103,232,249,0.1);
    overflow: hidden;
  }
  .card.purple {
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.12),
      0 0 20px rgba(232,121,249,0.3),
      0 0 60px rgba(232,121,249,0.1);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 18%, transparent 19%, transparent 100%);
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, #4DEFFF, #C084FC);
    box-shadow: 0 0 20px rgba(77,239,255,0.3), 0 0 60px rgba(192,132,252,0.1);
  }

  .step-badge {
    position: relative;
    z-index: 4;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #4DEFFF, #C084FC);
    color: #fff;
    font-size: 22px;
    margin-bottom: 16px;
    box-shadow: 0 0 20px rgba(77,239,255,0.3), 0 0 60px rgba(77,239,255,0.1);
  }

  .mini-panel {
    position: absolute;
    border-radius: 12px;
    border: 1px solid rgba(148, 241, 255, 0.65);
    box-shadow: 0 0 20px rgba(103,232,249,0.18), 0 0 60px rgba(103,232,249,0.08);
    background: rgba(255,255,255,0.03);
  }
  .card.purple .mini-panel {
    border-color: rgba(232,121,249,0.55);
    box-shadow: 0 0 20px rgba(232,121,249,0.18), 0 0 60px rgba(232,121,249,0.08);
  }

  .mp-top { left: 18px; top: 18px; width: 168px; height: 34px; }
  .mp-mid { left: 18px; top: 68px; width: 168px; height: 62px; }
  .mp-b1  { left: 18px; bottom: 22px; width: 78px; height: 78px; }
  .mp-b2  { left: 108px; bottom: 22px; width: 78px; height: 78px; }

  .card-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding: 144px 18px 20px;
    display: flex;
    flex-direction: column;
  }

  .step {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #9FEFFF;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 10px 0;
    color: #F3FDFF;
    text-shadow: 0 0 10px rgba(103,232,249,0.18);
  }

  .card-desc {
    font-size: 14px;
    line-height: 1.5;
    color: rgba(230, 249, 255, 0.88);
    margin: 0;
    max-width: 220px;
  }

  .card-icon-rounded {
    position: absolute;
    right: 18px;
    top: 18px;
    z-index: 4;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 20px rgba(103,232,249,0.3), 0 0 60px rgba(103,232,249,0.1);
  }
  .card.purple .card-icon-rounded {
    box-shadow: 0 0 20px rgba(232,121,249,0.3), 0 0 60px rgba(232,121,249,0.1);
  }
</style>

<div class="slide">
  <div class="grid"></div>
  <div class="floor-grid"></div>

  <div class="ambient a1"></div>
  <div class="ambient a2"></div>
  <div class="ambient a3"></div>
  <div class="ambient a4"></div>
  <div class="ambient a5"></div>

  <div class="title-wrap">
    <div class="eyebrow"></div>
    <div class="title">디지털 전환 로드맵 2025</div>
    <div class="desc">4단계 전환 마일스톤과 핵심 목표</div>
  </div>

  <div class="top-line"></div>

  <div class="particle" style="left:120px; top:268px;"></div>
  <div class="particle" style="left:196px; top:178px;"></div>
  <div class="particle" style="left:470px; top:183px;"></div>
  <div class="particle" style="left:745px; top:184px;"></div>
  <div class="particle" style="left:1018px; top:186px;"></div>
  <div class="particle" style="left:1168px; top:278px;"></div>
  <div class="particle" style="left:670px; top:98px;"></div>
  <div class="particle" style="left:836px; top:102px;"></div>
  <div class="particle" style="left:1226px; top:170px;"></div>

  <div class="node n1"></div>
  <div class="node n2"></div>
  <div class="node n3"></div>
  <div class="node n4"></div>

  <div class="node-label l1">STEP 1</div>
  <div class="node-label l2">STEP 2</div>
  <div class="node-label l3">STEP 3</div>
  <div class="node-label l4">STEP 4</div>

  <div class="bottom-connector"></div>

  <div class="cards">
    <div class="card">
      <div class="mini-panel mp-top"></div>
      <div class="mini-panel mp-mid"></div>
      <div class="mini-panel mp-b1"></div>
      <div class="mini-panel mp-b2"></div>

      <div class="card-icon-rounded">📊</div>

      <div class="card-content">
        <div class="step">STEP 1</div>
        <div class="card-title">현황 진단</div>
        <div class="card-desc">레거시 시스템 분석 및 디지털 성숙도 평가</div>
      </div>
    </div>

    <div class="card purple">
      <div class="mini-panel mp-top"></div>
      <div class="mini-panel mp-mid"></div>
      <div class="mini-panel mp-b1"></div>
      <div class="mini-panel mp-b2"></div>

      <div class="card-icon-rounded">🏗️</div>

      <div class="card-content">
        <div class="step">STEP 2</div>
        <div class="card-title">기반 구축</div>
        <div class="card-desc">클라우드 마이그레이션 및 API 플랫폼 설계</div>
      </div>
    </div>

    <div class="card">
      <div class="mini-panel mp-top"></div>
      <div class="mini-panel mp-mid"></div>
      <div class="mini-panel mp-b1"></div>
      <div class="mini-panel mp-b2"></div>

      <div class="card-icon-rounded">🔄</div>

      <div class="card-content">
        <div class="step">STEP 3</div>
        <div class="card-title">프로세스 혁신</div>
        <div class="card-desc">업무 자동화 및 데이터 기반 의사결정 체계 도입</div>
      </div>
    </div>

    <div class="card purple">
      <div class="mini-panel mp-top"></div>
      <div class="mini-panel mp-mid"></div>
      <div class="mini-panel mp-b1"></div>
      <div class="mini-panel mp-b2"></div>

      <div class="card-icon-rounded">🚀</div>

      <div class="card-content">
        <div class="step">STEP 4</div>
        <div class="card-title">스케일업</div>
        <div class="card-desc">AI/ML 적용 확대 및 전사 디지털 문화 정착</div>
      </div>
    </div>
  </div>
</div></div></body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #061226;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
  }

  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    color: #eef7ff;
    background:
      radial-gradient(70% 80% at 50% 0%, rgba(27,128,214,.28) 0%, rgba(7,22,47,.18) 35%, rgba(2,8,22,0) 62%),
      radial-gradient(40% 55% at 20% 18%, rgba(72,170,255,.18) 0%, rgba(72,170,255,0) 60%),
      radial-gradient(38% 52% at 78% 18%, rgba(19,219,237,.15) 0%, rgba(19,219,237,0) 58%),
      linear-gradient(180deg, #071529 0%, #020b1c 100%);
  }

  .slide:before,
  .slide:after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .slide:before {
    background:
      radial-gradient(circle at 12% 88%, rgba(57, 203, 255, .16) 0%, rgba(57, 203, 255, 0) 20%),
      radial-gradient(circle at 92% 90%, rgba(57, 203, 255, .18) 0%, rgba(57, 203, 255, 0) 18%);
    opacity: .9;
  }

  .slide:after {
    background:
      linear-gradient(90deg, rgba(0,0,0,0) 0 96%, rgba(76,244,255,.12) 100%),
      linear-gradient(180deg, rgba(0,0,0,0) 0 92%, rgba(76,244,255,.08) 100%);
    mix-blend-mode: screen;
  }

  .top-line {
    position: absolute;
    top: 110px;
    left: 0;
    width: 100%;
    height: 24px;
  }

  .top-line .seg {
    position: absolute;
    top: 9px;
    height: 6px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(112,210,255,.95), rgba(90,238,235,.95));
    box-shadow:
      0 0 6px rgba(92,228,255,.7),
      0 0 18px rgba(33,165,255,.45),
      inset 0 0 8px rgba(255,255,255,.25);
  }

  .top-line .left {
    left: 0;
    width: 395px;
    border-top-right-radius: 24px;
    border-bottom-right-radius: 24px;
  }

  .top-line .left:after {
    content: "";
    position: absolute;
    right: -35px;
    top: -1px;
    width: 60px;
    height: 22px;
    border-top: 3px solid rgba(105,222,255,.95);
    border-right: 3px solid rgba(105,222,255,.95);
    border-radius: 0 24px 24px 0;
    transform: skewX(38deg);
    box-shadow: 0 0 10px rgba(92,228,255,.55);
  }

  .top-line .mid {
    left: 445px;
    width: 425px;
  }

  .top-line .mid:after {
    content: "";
    position: absolute;
    right: -26px;
    top: -1px;
    width: 50px;
    height: 22px;
    border-bottom: 3px solid rgba(105,222,255,.95);
    border-right: 3px solid rgba(105,222,255,.95);
    border-radius: 0 0 24px 0;
    transform: skewX(-38deg);
    box-shadow: 0 0 10px rgba(92,228,255,.45);
  }

  .top-line .right {
    right: 0;
    width: 350px;
    border-top-left-radius: 24px;
    border-bottom-left-radius: 24px;
  }

  .title {
    position: absolute;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #f3f7fb;
    text-shadow:
      0 2px 0 rgba(255,255,255,.08),
      0 0 20px rgba(150,215,255,.2);
    white-space: nowrap;
  }

  .dots-left {
    position: absolute;
    left: 0;
    top: 125px;
    width: 330px;
    height: 595px;
    opacity: .28;
    background-image: radial-gradient(rgba(126, 189, 230, .55) 1.2px, transparent 1.2px);
    background-size: 12px 12px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.55) 70%, transparent 100%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.55) 70%, transparent 100%);
  }

  .metrics {
    position: absolute;
    top: 238px;
    left: 110px;
    width: 1060px;
    display: flex;
    justify-content: space-between;
  }

  .card {
    width: 348px;
    height: 190px;
    position: relative;
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(203,231,255,.18), rgba(107,155,206,.10)),
      linear-gradient(135deg, rgba(92,177,255,.16), rgba(58,238,225,.10));
    border: 2px solid rgba(95,227,234,.72);
    box-shadow:
      0 0 0 1px rgba(118,182,255,.18) inset,
      0 0 18px rgba(73,189,255,.28),
      0 0 40px rgba(34,127,255,.16),
      inset 0 0 24px rgba(255,255,255,.06);
    backdrop-filter: blur(2px);
  }

  .card:nth-child(2) {
    border-color: rgba(104,227,235,.82);
  }

  .card .icon {
    position: absolute;
    top: -56px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 42px;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.26), rgba(255,255,255,.05) 38%, rgba(0,0,0,0) 39%),
      linear-gradient(180deg, rgba(188,219,255,.26), rgba(67,103,158,.18)),
      radial-gradient(circle at 50% 50%, rgba(31,64,120,.75), rgba(10,29,62,.96));
    border: 2px solid rgba(96,226,239,.92);
    box-shadow:
      0 0 18px rgba(101,227,241,.6),
      0 0 34px rgba(62,149,255,.35),
      inset 0 0 18px rgba(255,255,255,.18);
  }

  .card .metric-title {
    position: absolute;
    top: 42px;
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .5px;
    color: rgba(226,245,255,.92);
    text-shadow: 0 0 10px rgba(86,223,255,.25);
  }

  .card .value {
    position: absolute;
    top: 72px;
    width: 100%;
    text-align: center;
    font-size: 58px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: 1px;
    color: #f5f4ec;
    text-shadow:
      0 0 2px rgba(255,255,255,.7),
      0 0 18px rgba(104,234,246,.24);
  }

  .card .pill {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    min-width: 152px;
    height: 24px;
    padding: 0 22px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #c2fbf0;
    background:
      linear-gradient(180deg, rgba(131,170,255,.18), rgba(72,112,180,.14)),
      linear-gradient(90deg, rgba(89,159,255,.14), rgba(76,241,229,.14));
    border: 1px solid rgba(146,220,255,.24);
    box-shadow:
      inset 0 0 12px rgba(255,255,255,.06),
      0 0 16px rgba(87,232,237,.12);
  }

  .card .pill:before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 82px;
    height: 8px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(100,172,255,.25), rgba(89,245,231,.8), rgba(100,172,255,.25));
    filter: blur(2px);
  }

  .chart-wrap {
    position: absolute;
    left: 110px;
    top: 495px;
    width: 1155px;
    height: 250px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(198,224,255,.14), rgba(113,147,197,.08)),
      linear-gradient(135deg, rgba(89,162,255,.10), rgba(67,239,228,.08));
    border: 2px solid rgba(96,227,234,.72);
    box-shadow:
      0 0 18px rgba(73,189,255,.25),
      inset 0 0 24px rgba(255,255,255,.06);
  }

  .chart-title {
    position: absolute;
    top: 18px;
    left: 28px;
    font-size: 22px;
    font-weight: 700;
    color: #e8f7ff;
    text-shadow: 0 0 14px rgba(86,223,255,.2);
  }

  .plot {
    position: absolute;
    left: 22px;
    right: 22px;
    top: 28px;
    bottom: 18px;
    border-radius: 14px;
    overflow: hidden;
  }

  .grid-h,
  .grid-v {
    position: absolute;
    inset: 0;
  }

  .grid-h {
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(176,220,255,.16) 0,
        rgba(176,220,255,.16) 1px,
        transparent 1px,
        transparent 24px
      );
    opacity: .55;
  }

  .grid-v {
    background:
      repeating-linear-gradient(
        to right,
        rgba(176,220,255,.08) 0,
        rgba(176,220,255,.08) 1px,
        transparent 1px,
        transparent 85px
      );
    opacity: .2;
  }

  .y-axis {
    position: absolute;
    left: 28px;
    top: 26px;
    bottom: 34px;
    width: 2px;
    background: rgba(195,225,255,.42);
    box-shadow: 0 0 8px rgba(141,212,255,.18);
  }

  .y-tick {
    position: absolute;
    left: 0;
    width: 18px;
    height: 5px;
    border-radius: 6px;
    background: rgba(184,228,255,.92);
    box-shadow: 0 0 8px rgba(145,216,255,.45);
  }

  .x-tick {
    position: absolute;
    bottom: 0;
    width: 22px;
    height: 5px;
    border-radius: 6px;
    background: rgba(184,228,255,.92);
    box-shadow: 0 0 8px rgba(145,216,255,.45);
  }

  .line {
    position: absolute;
    height: 3px;
    border-radius: 4px;
    transform-origin: left center;
    box-shadow: 0 0 10px currentColor;
  }

  .point {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px currentColor;
  }

  .cyan { color: #4ef2e7; background: #4ef2e7; }
  .blue { color: #49a6ff; background: #49a6ff; }
  .sky { color: #53d2ff; background: #53d2ff; }

  .fill {
    position: absolute;
    bottom: 34px;
    opacity: .18;
    filter: blur(.2px);
  }

  .fill.blue-fill {
    left: 207px;
    width: 890px;
    height: 145px;
    background: linear-gradient(180deg, rgba(73,166,255,.45), rgba(73,166,255,0));
    clip-path: polygon(0% 84%, 19% 56%, 36% 61%, 53% 37%, 70% 57%, 84% 30%, 100% 5%, 100% 100%, 0 100%);
  }

  .fill.cyan-fill {
    left: 205px;
    width: 890px;
    height: 122px;
    background: linear-gradient(180deg, rgba(78,242,231,.4), rgba(78,242,231,0));
    clip-path: polygon(0% 89%, 18% 52%, 35% 67%, 53% 20%, 70% 59%, 84% 26%, 100% 22%, 100% 100%, 0 100%);
  }
</style>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body><div style="width:1280px;height:720px;overflow:hidden;position:relative;"><style>
  :root{
    --bg-0:#02081b;
    --bg-1:#031a3b;
    --bg-2:#062b52;
    --cyan:#54f3f0;
    --cyan-2:#35cfff;
    --blue:#4ca0ff;
    --white:#f4f7fb;
    --glass:rgba(170,210,255,.10);
    --glass-2:rgba(130,180,255,.14);
    --line:rgba(126,224,255,.72);
    --soft:rgba(120,200,255,.22);
    --shadow:0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    --glow:0 0 18px rgba(82,235,255,.38), 0 0 34px rgba(55,163,255,.18);
  }

  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:Inter,Arial,sans-serif}
  .slide{
    position:relative;
    width:1280px;
    height:720px;
    margin:0 auto;
    overflow:hidden;
    color:var(--white);
    background:
      radial-gradient(55% 85% at 50% 0%, rgba(24,95,165,.42) 0%, rgba(7,28,63,.18) 40%, rgba(1,5,18,0) 72%),
      linear-gradient(90deg, rgba(10,84,130,.12) 0%, rgba(0,0,0,0) 18%, rgba(0,126,255,.06) 50%, rgba(0,0,0,0) 82%, rgba(22,130,160,.12) 100%),
      linear-gradient(180deg, #041d44 0%, #010817 52%, #020716 100%);
  }

  /* z=0 background */
  .bg-vignette{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(40% 90% at 0% 50%, rgba(18,151,210,.20), transparent 60%),
      radial-gradient(40% 90% at 100% 75%, rgba(18,151,210,.16), transparent 60%),
      radial-gradient(70% 70% at 50% 20%, rgba(0,122,255,.10), transparent 72%);
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .bg-streaks{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(90deg, transparent 0 12%, rgba(67,174,255,.05) 19%, transparent 27%, transparent 46%, rgba(80,240,255,.04) 53%, transparent 61%, transparent 81%, rgba(67,174,255,.05) 88%, transparent 96%);
    filter:blur(1px);
    opacity:.7;
  }
  .bg-dots-left,
  .bg-dots-right{
    position:absolute; z-index:1; pointer-events:none; opacity:.22;
    width:260px; height:430px;
    background-image:radial-gradient(circle, rgba(123,219,255,.55) 1.4px, transparent 1.6px);
    background-size:12px 12px;
    filter:blur(.1px);
  }
  .bg-dots-left{left:-8px; top:130px;}
  .bg-dots-right{right:-10px; bottom:-6px; height:250px;}

  /* z=2 top chrome line */
  .top-frame{
    position:absolute; left:0; right:0; top:110px; height:28px; z-index:2;
  }
  .top-frame .seg{
    position:absolute; top:8px; height:16px;
    border-top:3px solid rgba(93,232,255,.86);
    box-shadow:0 0 10px rgba(83,235,255,.35);
  }
  .top-frame .left{
    left:0; width:420px;
    border-radius:0 26px 26px 0;
  }
  .top-frame .mid{
    left:425px; width:520px;
    border-top-width:4px;
    border-radius:0 0 16px 16px;
    box-shadow:0 0 10px rgba(83,235,255,.35), inset 0 -2px 0 rgba(111,190,255,.25);
  }
  .top-frame .mid:before,
  .top-frame .mid:after{
    content:""; position:absolute; top:-4px; width:34px; height:18px;
    border-top:4px solid rgba(93,232,255,.86);
  }
  .top-frame .mid:before{
    left:-20px; border-left:0; border-right:0; border-radius:0 0 0 18px; transform:skewX(-34deg);
  }
  .top-frame .mid:after{
    right:-20px; border-left:0; border-right:0; border-radius:0 0 18px 0; transform:skewX(34deg);
  }
  .top-frame .right{
    right:0; width:320px;
    border-radius:26px 0 0 26px;
  }

  /* z=3 title */
  .title{
    position:absolute; top:40px; left:0; right:0; z-index:3;
    text-align:center;
    font-size:46px; font-weight:800; letter-spacing:2px;
    color:#f6f6f7;
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 14px rgba(118,241,255,.12);
  }

  /* z=4 cards */
  .metrics{
    position:absolute; left:110px; top:238px; width:1060px; z-index:4;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:54px;
  }
  .card{
    position:relative;
    height:188px;
    border-radius:16px;
    background:
      linear-gradient(180deg, rgba(176,209,255,.18), rgba(120,160,220,.08) 60%, rgba(66,111,170,.10) 100%);
    border:2px solid rgba(93,232,255,.70);
    box-shadow:
      0 0 0 1px rgba(83,170,255,.16),
      0 12px 24px rgba(0,0,0,.32),
      0 0 18px rgba(84,243,240,.18),
      inset 0 0 22px rgba(255,255,255,.05),
      inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow:visible;
  }
  .card:before{
    content:"";
    position:absolute; inset:0;
    border-radius:16px;
    background:radial-gradient(50% 65% at 50% 50%, rgba(160,220,255,.10), rgba(0,0,0,0) 75%);
    pointer-events:none;
  }
  .badge{
    position:absolute; left:50%; top:-58px; transform:translateX(-50%);
    width:110px; height:110px; border-radius:50%;
    background:
      linear-gradient(180deg, rgba(190,215,255,.18), rgba(62,89,150,.16)),
      radial-gradient(circle at 50% 30%, rgba(255,255,255,.15), rgba(255,255,255,0) 55%);
    border:2px solid rgba(93,232,255,.68);
    box-shadow:
      0 0 0 10px rgba(145,196,255,.16),
      0 0 24px rgba(84,243,240,.26),
      inset 0 1px 0 rgba(255,255,255,.22);
    backdrop-filter:blur(6px);
    z-index:6;
  }
  .badge .emoji{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:42px;
    filter:drop-shadow(0 0 12px rgba(84,243,240,.35));
  }
  .metric-title{
    position:absolute; top:56px; left:0; right:0;
    text-align:center; font-size:20px; font-weight:700;
    color:rgba(230,245,255,.92);
    text-shadow:0 0 10px rgba(84,243,240,.12);
    z-index:5;
  }
  .metric-value{
    position:absolute; top:78px; left:0; right:0;
    text-align:center; font-size:52px; font-weight:800; letter-spacing:1px;
    color:#f4f5f3;
    text-shadow:0 0 10px rgba(255,255,255,.10), 0 0 20px rgba(84,243,240,.12);
    z-index:5;
  }
  .metric-change{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    width:152px; height:24px; border-radius:999px;
    background:linear-gradient(180deg, rgba(134,175,235,.18), rgba(72,106,157,.20));
    border:1px solid rgba(139,199,255,.24);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 10px rgba(84,243,240,.08);
    display:flex; align-items:center; justify-content:center;
    color:rgba(231,246,255,.95); font-size:12px; font-weight:700; letter-spacing:.3px;
    z-index:5;
  }
  .metric-change:before{
    content:"";
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:78px; height:10px; border-radius:999px;
    background:radial-gradient(circle at 50% 50%, rgba(84,243,240,.90), rgba(84,243,240,.18) 55%, rgba(84,243,240,0) 75%);
    filter:blur(1px);
    opacity:.95;
  }
  .metric-change span{position:relative; z-index:1}

  /* z=4 chart panel */
  .chart-wrap{
    position:absolute; left:110px; right:110px; bottom:40px; height:250px; z-index:4;
  }
  .chart-panel{
    position:absolute; inset:0;
    border-radius:18px;
    background:
      linear-gradient(180deg, rgba(171,209,255,.16), rgba(95,128,182,.08) 100%);
    border:2px solid rgba(93,232,255,.72);
    box-shadow:
      0 0 0 1px rgba(83,170,255,.14),
      0 14px 32px rgba(0,0,0,.34),
      0 0 22px rgba(84,243,240,.15),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 0 26px rgba(255,255,255,.04);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .chart-title{
    position:absolute; left:36px; top:18px; z-index:5;
    font-size:18px; font-weight:700; color:rgba(236,247,255,.9);
    text-shadow:0 0 10px rgba(84,243,240,.12);
  }
  .plot{
    position:absolute; left:22px; right:22px; top:28px; bottom:16px; z-index:5;
  }

  /* chart grid */
  .grid-h{
    position:absolute; left:32px; right:12px; height:1px;
    background:rgba(140,190,255,.16);
    box-shadow:0 0 8px rgba(84,243,240,.04);
  }
  .g1{top:34px}.g2{top:58px}.g3{top:82px}.g4{top:106px}.g5{top:130px}.g6{top:154px}.g7{top:178px}
  .y-axis{
    position:absolute; left:32px; top:8px; bottom:12px; width:2px;
    background:rgba(183,217,255,.30);
    box-shadow:0 0 8px rgba(84,243,240,.10);
  }
  .tick-y{
    position:absolute; left:2px; width:18px; height:5px; border-radius:999px;
    background:rgba(194,226,255,.9);
    box-shadow:0 0 8px rgba(119,219,255,.40);
  }
  .ty1{top:18px}.ty2{top:46px}.ty3{top:74px}.ty4{top:102px}.ty5{top:130px}.ty6{top:158px}.ty7{top:186px}
  .tick-x{
    position:absolute; width:22px; height:5px; border-radius:999px;
    bottom:4px; background:rgba(194,226,255,.85);
    box-shadow:0 0 8px rgba(119,219,255,.36);
  }
  .tx1{left:18%}.tx2{left:34%}.tx3{left:50%}.tx4{left:66%}.tx5{left:82%}.tx6{left:98%; transform:translateX(-100%)}

  /* chart lines */
  svg{display:block; width:100%; height:100%}
  .lineA{stroke:#47e7e0; stroke-width:3; fill:none; filter:drop-shadow(0 0 6px rgba(71,231,224,.28)); opacity:.92}
  .lineB{stroke:#49a4ff; stroke-width:3; fill:none; filter:drop-shadow(0 0 6px rgba(73,164,255,.24)); opacity:.92}
  .lineC{stroke:#39c7ff; stroke-width:3; fill:none; filter:drop-shadow(0 0 6px rgba(57,199,255,.24)); opacity:.78}
  .areaA{fill:rgba(71,231,224,.12)}
  .areaB{fill:rgba(73,164,255,.14)}
  .pointA{fill:#47e7e0}
  .pointB{fill:#49a4ff}
  .pointC{fill:#39c7ff}
  .glow-point{filter:drop-shadow(0 0 8px rgba(84,243,240,.34))}
</style>

<div class="slide">
  <div class="bg-vignette"></div>
  <div class="bg-streaks"></div>
  <div class="bg-dots-left"></div>
  <div class="bg-dots-right"></div>

  <div class="title">Q4 2025 비즈니스 성과 대시보드</div>

  <div class="top-frame">
    <div class="seg left"></div>
    <div class="seg mid"></div>
    <div class="seg right"></div>
  </div>

  <div class="metrics">
    <div class="card" style="z-index:4;">
      <div class="badge" style="z-index:6;"><div class="emoji">💰</div></div>
      <div class="metric-title">매출</div>
      <div class="metric-value">₩128억</div>
      <div class="metric-change"><span>+23% YoY</span></div>
    </div>

    <div class="card" style="z-index:4;">
      <div class="badge" style="z-index:6;"><div class="emoji">👥</div></div>
      <div class="metric-title">활성 사용자</div>
      <div class="metric-value">2.4M</div>
      <div class="metric-change"><span>+15% MoM</span></div>
    </div>

    <div class="card" style="z-index:4;">
      <div class="badge" style="z-index:6;"><div class="emoji">⭐</div></div>
      <div class="metric-title">고객 만족도</div>
      <div class="metric-value">4.7/5.0</div>
      <div class="metric-change"><span>+0.3</span></div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-panel"></div>
    <div class="chart-title">월별 매출 추이</div>

    <div class="plot">
      <div class="y-axis"></div>
      <div class="grid-h g1"></div>
      <div class="grid-h g2"></div>
      <div class="grid-h g3"></div>
      <div class="grid-h g4"></div>
      <div class="grid-h g5"></div>
      <div class="grid-h g6"></div>
      <div class="grid-h g7"></div>

      <div class="tick-y ty1"></div>
      <div class="tick-y ty2"></div>
      <div class="tick-y ty3"></div>
      <div class="tick-y ty4"></div>
      <div class="tick-y ty5"></div>
      <div class="tick-y ty6"></div>
      <div class="tick-y ty7"></div>

      <div class="tick-x tx1"></div>
      <div class="tick-x tx2"></div>
      <div class="tick-x tx3"></div>
      <div class="tick-x tx4"></div>
      <div class="tick-x tx5"></div>
      <div class="tick-x tx6"></div>

      <svg viewBox="0 0 1120 190" preserveAspectRatio="none" style="position:absolute; inset:0; z-index:5;">
        <defs>
          <linearGradient id="fadeA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(71,231,224,.22)"/>
            <stop offset="100%" stop-color="rgba(71,231,224,0)"/>
          </linearGradient>
          <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(73,164,255,.25)"/>
            <stop offset="100%" stop-color="rgba(73,164,255,0)"/>
          </linearGradient>
        </defs>

        <path class="areaA" d="M32 170 L215 94 L398 112 L581 56 L764 102 L947 34 L1120 30 L1120 170 Z"></path>
        <path class="areaB" d="M32 170 L215 134 L398 82 L581 94 L764 42 L947 86 L1120 18 L1120 170 Z"></path>

        <path class="lineA" d="M32 170 L215 94 L398 112 L581 56 L764 102 L947 34 L1120 30"></path>
        <path class="lineB" d="M32 170 L215 134 L398 82 L581 94 L764 42 L947 86 L1120 18"></path>
        <path class="lineC" d="M32 170 L215 116 L398 132 L581 94 L764 70 L947 112 L1120 56"></path>

        <circle class="pointA glow-point" cx="215" cy="94" r="5"></circle>
        <circle class="pointA glow-point" cx="398" cy="112" r="5"></circle>
        <circle class="pointA glow-point" cx="581" cy="56" r="5"></circle>
        <circle class="pointA glow-point" cx="764" cy="102" r="5"></circle>
        <circle class="pointA glow-point" cx="947" cy="34" r="5"></circle>
        <circle class="pointA glow-point" cx="1120" cy="30" r="5"></circle>

        <circle class="pointB glow-point" cx="215" cy="134" r="5"></circle>
        <circle class="pointB glow-point" cx="398" cy="82" r="5"></circle>
        <circle class="pointB glow-point" cx="581" cy="94" r="5"></circle>
        <circle class="pointB glow-point" cx="764" cy="42" r="5"></circle>
        <circle class="pointB glow-point" cx="947" cy="86" r="5"></circle>
        <circle class="pointB glow-point" cx="1120" cy="18" r="5"></circle>

        <circle class="pointC glow-point" cx="215" cy="116" r="5"></circle>
        <circle class="pointC glow-point" cx="398" cy="132" r="5"></circle>
        <circle class="pointC glow-point" cx="581" cy="94" r="5"></circle>
        <circle class="pointC glow-point" cx="764" cy="70" r="5"></circle>
        <circle class="pointC glow-point" cx="947" cy="112" r="5"></circle>
        <circle class="pointC glow-point" cx="1120" cy="56" r="5"></circle>
      </svg>
    </div>
  </div>
</div></div></body></html>
